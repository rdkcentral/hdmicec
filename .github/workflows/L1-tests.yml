name: L1-tests

# WHAT A GREEN TICK ON THIS JOB MEANS - AND WHAT IT DOES NOT.
#
# This job BUILDS EVERYTHING and RUNS INVOCATION A ONLY.
#
# It builds the whole AIDL/Binder migration: the Binder SDK, both AIDL client stub
# snapshots, libRCEC with both HDMI CEC HAL back-ends compiled in, and all three test
# binaries. Then it runs exactly one of the five invocations - A, with no AIDL service
# reachable, which selects the LEGACY back-end.
#
# IT IS NOT DUAL-PATH EVIDENCE, and must not be read as any. The other four invocations are
# absent from this job for TWO DIFFERENT REASONS, and conflating them overstates what a
# hosted runner is incapable of:
#
#   B, C AND E ARE UNSUPPORTED HERE. They are the ones that select the AIDL back-end, that
#   exercise present-but-incompatible, and that cross a real Binder transport, and a hosted
#   GitHub runner has no Binder kernel driver and no servicemanager, so none of the three
#   can run here at all. Both harnesses refuse those three modes BY NAME rather than
#   downgrading them to legacy, and a refusal is the only safe disposition there is:
#   reaching the service manager unguarded ABORTS THE PROCESS on the pinned Binder stack
#   instead of returning an error, which is exactly what the preflight prevents.
#
#   D IS UNSCHEDULED HERE, NOT INCAPABLE. It is the LEGACY L2 invocation - fake service host
#   not launched, legacy back-end selected - so it needs no Binder driver whatsoever.
#   MEASURED on a driverless host it passes: 17 cases, 11 passed and 6 skipped by design,
#   exit 0, the six skips being the invocation-E fixtures naming the mode they need. This
#   job builds the L2 runner and its out-of-process fake service host and stops there; not
#   running D is a scheduling choice, not a platform limit.
#
# B, C and E therefore belong to the binder-capable job in aidl-path-tests.yml, which is the
# only place the full matrix and the branch gate live, and which runs D alongside them.
#
# What this job DOES prove, and both halves are worth having:
#
#   (a) REGRESSION EVIDENCE FOR THE LEGACY PATH. The pre-existing suite still passes with
#       both back-ends compiled into libRCEC and the Binder libraries linked in - so the
#       migration did not disturb the path every SOC uses today.
#
#   (b) THAT A DRIVERLESS HOST REACHES THE LEGACY BACK-END WITHOUT ABORTING. This is not a
#       side effect; it is the one requirement a hosted runner is uniquely placed to
#       demonstrate, because it NATURALLY exhibits the condition the preflight exists for.
#       The pinned Binder stack patches its failed-driver check to be fatal on Linux, so
#       code that reaches the service manager without a preflight would abort the process
#       outright, and a missing context manager would otherwise block initialization
#       indefinitely. "Falls back cleanly instead of aborting or hanging" is therefore
#       measured here on real hardware that has no Binder driver, rather than argued. The
#       "Verify the selected HAL back-end" step below is what turns that into a gate - and
#       because "hanging" is half of what it rules out, every run of a test binary in this
#       job is BOUNDED and its outcome classified, so a hang is reported as a hang within
#       minutes instead of consuming the whole job timeout in silence.
#
#   (c) THAT THE LIBRARY THE RDK BUILD ACTUALLY SHIPS CARRIES BOTH BACK-ENDS. There are two
#       active build systems - Autotools, and the hand-written ccec/src/Makefile that
#       rdk_build.sh drives with a bare `make` - and only the second one produces what a
#       SOC vendor ships. Both are built here, the hand-written one FIRST, before
#       ./configure can overwrite it, and both are inspected with readelf and ldd. A
#       divergence between them is the failure this closes: an Autotools-only check would
#       pass on a tree whose shipping build linked no AIDL back-end at all.
#
# A NOTE FOR THE REVIEWER ON FILE COUNT. The close-out check counts TWENTY-SIX in-submodule
# paths - 13 modified and 13 added, measured with `git diff --name-status` inside hdmicec, the
# 26th being AIDL_HAL_MIGRATION_NOTES.md, which holds the design detail review moved out of
# the code comments - plus blitzy/documentation/Project Guide.md in the superproject, so
# TWENTY-SEVEN logical files in all (counting the guide as the fourteenth update: 14 UPDATE,
# 13 CREATE, 0 DELETE).
# aidl-path-tests-rootfs.sh is ONE OF THOSE TWENTY-SIX, not an extra beyond them: the QEMU
# runner's root image is required to be built by a checked-in script, the file-by-file table
# never enumerated one, and the path is authorised by that provisioning requirement rather
# than by the table. The only paths this migration changes under .github/ are this file,
# aidl-path-tests.yml and that script.
#
# Two other files mirror parts of this workflow and are kept in step with it deliberately:
# the BUILD RECIPE comment in tests/L1Tests/run_coverage.sh, and the embedded Actions
# example in UNIT_TEST_SETUP.md. This file is the source of truth for both, so a change to
# the build commands here belongs in those two as well.

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Debug

  # THE ACCEPTANCE TOOLCHAIN, PINNED IN ONE PLACE: THE MAJOR BOTH JOBS SHARE, AND THE EXACT
  # RELEASE THIS JOB BUILDS.
  #
  # WHY IT IS PINNED AT ALL. The acceptance evidence this migration rests on is
  # compiler-sensitive in two directions. The line and branch figures are gcov's reading of
  # notes files a specific GCC wrote, and the per-arm branch gate in tests/L1Tests/run_coverage.sh
  # compares (file,line,block,branch) coordinates against a checked-in manifest - coordinates
  # that are a property of the COMPILED source, so a different compiler major renumbers them and
  # the gate reports arms absent that the code still has. gcov itself is stricter still: it
  # refuses to read notes files a different major produced. So "whatever the runner image
  # happens to default to" is not a toolchain choice this job is entitled to make.
  #
  # WHY THIS JOB BUILDS 13.4.0 RATHER THAN INSTALLING A PACKAGE. The documented acceptance
  # patch level is GCC/G++/gcov 13.4.0 - that is what the reference container provides and what
  # blitzy/documentation/Project Guide.md §9.1 records as verified. This job runs on
  # ubuntu-22.04, whose archive carries no gcc-13 family at all, and no distribution archive
  # this job is allowed to use carries 13.4.0: reaching it through a third-party PPA would
  # contradict this file's own supply-chain posture (every action a full-length SHA, every
  # fetched artefact held to a publisher-issued digest). So "Build the pinned GCC toolchain from
  # source" builds exactly CEC_TOOLCHAIN_GCC_VERSION from the GNU release tarball, and "Select
  # and prove the acceptance toolchain" gates the exact version as well as the major and
  # records it with the results.
  #
  # THE DIGEST IS THE PUBLISHER'S. CEC_TOOLCHAIN_GCC_SHA512 is GCC's own value for
  # gcc-13.4.0.tar.xz, taken from the release manifest
  # https://gcc.gnu.org/pub/gcc/releases/gcc-13.4.0/sha512.sum, committed here and reviewed with
  # this file. It is valid for exactly one release, hence the _FOR_VERSION partner and the guard
  # that refuses to check one release's tarball against another release's digest.
  #
  # ONE PLACE FOR THE MAJOR, so the two jobs cannot drift: CEC_TOOLCHAIN_GCC_MAJOR is read by
  # every step in this file that names a compiler, and .github/workflows/aidl-path-tests.yml
  # carries the same value under the same name. Move them together. That job installs noble's
  # archive gcc-13 (13.3.0), so the major is the pin the two share and the exact release is
  # this job's alone.
  CEC_TOOLCHAIN_GCC_MAJOR: '13'
  CEC_TOOLCHAIN_GCC_VERSION: '13.4.0'
  CEC_TOOLCHAIN_GCC_SHA512: '9b4b83ecf51ef355b868608b8d257b2fa435c06d2719cb86657a7c2c2a0828ff4ce04e9bac1055bbcad8ed5b4da524cafaef654785e23a50233d95d89201e35f'
  CEC_TOOLCHAIN_GCC_SHA512_FOR_VERSION: '13.4.0'

jobs:
  L1-tests:
    name: Build and run unit tests
    # ubuntu-22.04, THE HOSTED JOB THE MIGRATION PLAN NAMES, WITH THE GCC 13 FAMILY BUILT
    # RATHER THAN INSTALLED.
    #
    # This job used to install an unversioned `g++`, so the compiler that produced every
    # artefact and every coverage counter was whichever one the image defaulted to. jammy's
    # archive carries NO gcc-13 family at all, and a PPA would introduce an unpinned third-party
    # archive into a job that pins every other input to a digest. So "Build the pinned GCC
    # toolchain from source" builds exactly CEC_TOOLCHAIN_GCC_VERSION from the digest-verified
    # GNU release and installs it as /usr/bin/gcc-13, g++-13 and gcov-13 - the names and prefix
    # a distribution package uses - so every later step, the gate included, is the same whichever
    # way the compiler arrived.
    #
    # The selection must not depend on which default an image happens to carry (jammy's is the
    # gcc-11 family), and the gate step proves what was selected either way.
    runs-on: ubuntu-22.04

    # LEAST PRIVILEGE, DECLARED AT THE JOB RATHER THAN LEFT TO INHERITANCE.
    #
    # This file already declares `permissions: contents: read` at the workflow level, and that
    # is inherited - but only for as long as nothing above overrides it. Declaring it HERE fixes
    # the scope of the token THIS job's steps receive. It matters because of what runs with that
    # token: seven actions/checkout invocations and two actions/upload-artifact invocations, each
    # executing a pre-bundled dependency tree that the PIN AUDIT RECORD below records a residual
    # against, and then a tree handed to autoreconf, ./configure, three makes, a coverage run
    # and two build scripts from another repository.
    #
    # `contents: read` IS SUFFICIENT AND NOTHING MORE IS. This job checks out, builds, tests and
    # uploads artifacts. It opens no issue, writes no check, publishes no package, requests no
    # id-token and pushes nothing, and artifact upload is served by the Actions artifact service
    # rather than by a `permissions:` scope. That matters especially here because this workflow
    # runs on `pull_request`, so its steps see contributor-authored source.
    permissions:
      contents: read

    strategy:
      matrix:
        # THE `compiler` DIMENSION IS GONE, AND ITS REMOVAL IS A CORRECTION RATHER THAN A
        # SIMPLIFICATION.
        #
        # It read `compiler: [ gcc, clang ]` and the exclusions then removed both clang
        # combinations and gcc/without-coverage, so ONE combination ever ran - gcc with
        # coverage - and the surviving value reached nothing but two artifact names. Nothing in
        # any step consulted it, no step selected a compiler from it, and clang was never
        # compiled with. A matrix axis that cannot change what is built is worse than absent: a
        # reader takes the file at its word and believes two compilers are covered.
        #
        # What replaces it is a REAL selection, in "Select and prove the acceptance toolchain"
        # below, which is the honest form of what this axis pretended to do. The `coverage` axis
        # stays because it IS consulted - `matrix.coverage` gates the "Generate coverage" step -
        # and it is spelled with the single value the exclusions already left it with, so the set
        # of jobs this workflow runs is byte-for-byte what it ran before. The two artifact names
        # lose their `-gcc-` segment for the same reason: naming a dimension that no longer
        # exists would leave the same false impression in the artifact list.
        coverage: [ with-coverage ]

    # THE WHOLE OF THE STAGING CONTRACT FOR THE AIDL/BINDER BACK-END, IN ONE PLACE.
    #
    # libRCEC carries both HDMI CEC HAL back-ends in every build - the legacy in-process C
    # ABI and the out-of-process com.rdk.hal.hdmicec AIDL HAL - and picks between them at
    # run time. So these four are unconditional build inputs, not a variant: there is no
    # matrix dimension over them and no --enable switch to turn either back-end off.
    #
    # They are the four names configure.ac declares with AC_ARG_VAR, spelled identically
    # here, in the ./configure line below, and in tests/L1Tests/run_coverage.sh. configure
    # DERIVES from them the four include roots, the two library directories, the four -l
    # edges and the C++17 flag, and substitutes those into ccec/src/Makefile.am,
    # tests/L1Tests/Makefile.am and tests/L2Tests/Makefile.am. One definition point is the
    # point: a root reaching one consumer and not another is the failure this prevents.
    #
    # HALIF_LIB_DIR and BINDER_SDK_INCLUDE_DIR are configure.ac's split-staging overrides
    # and both are genuinely needed for the layout the build scripts produce, rather than
    # being belt-and-braces. build_modules.sh installs the stub libraries under
    # out/target/lib/halif, which is NOT HALIF_PREFIX/lib/halif, so the derivation from
    # HALIF_PREFIX alone would miss them; and the Binder headers land under out/build while
    # the runtime lands under out/target, so the header root only resolves through
    # BINDER_SDK_INCLUDE_DIR. The two values below are also exactly build_binder.sh's own
    # defaults, so naming them here steers the SDK staging and the middleware build from
    # the same pair rather than leaving the two to agree by luck.
    #
    # LD_LIBRARY_PATH is set here for one reason: the set of libraries that must be
    # LOADABLE is larger than the set libRCEC names. libbinder drags liblog, libbase and
    # libcutils along behind it, and none of the three is a middleware link edge, so
    # nothing in the build would ever mention them. Setting it at job level also means the
    # three existing run steps below keep their own inline
    # "LD_LIBRARY_PATH=<gtest>/lib:${LD_LIBRARY_PATH}" prefixes UNCHANGED - those prepend
    # to this value rather than replacing it, so GoogleTest still resolves first and the
    # AIDL and Binder directories are simply reachable behind it.
    env:
      HALIF_PREFIX: ${{ github.workspace }}/rdk-halif-aidl
      HALIF_LIB_DIR: ${{ github.workspace }}/rdk-halif-aidl/out/target/lib/halif
      BINDER_SDK_DIR: ${{ github.workspace }}/rdk-halif-aidl/out/target
      BINDER_SDK_INCLUDE_DIR: ${{ github.workspace }}/rdk-halif-aidl/out/build
      LD_LIBRARY_PATH: ${{ github.workspace }}/install/usr/lib:${{ github.workspace }}/rdk-halif-aidl/out/target/lib/halif:${{ github.workspace }}/rdk-halif-aidl/out/target/lib/binder
      # THE INVOCATION-A FILTER. NEGATIVE, AND NOT OPTIONAL.
      #
      # The L1 binary registers the pre-existing cases plus the AIDL contract suite, and
      # two of that suite's fixtures - DriverAidlSessionTest and DriverAidlTransmitTest -
      # require the AIDL back-end to be the RESOLVED one, which means invocation B on a
      # host that has a Binder driver and a running service manager. The selection resolves
      # once per process inside LibCCEC::init, so a fixture cannot opt into a different
      # back-end from its own SetUp; under invocation A those two fail loudly instead,
      # naming the mode they need. That is their design, chosen over GTEST_SKIP precisely
      # so a skipped arm cannot be mistaken for a passing one in an aggregate count. This
      # filter is therefore what makes invocation A green, and MEASURED, not assumed:
      # without it the run on this exact tree reports 44 FAILED and exits 1. Those 44 are every
      # case those two fixtures register and nothing besides them - DriverAidlSessionTest 32 plus
      # DriverAidlTransmitTest 12, derived from `--gtest_list_tests` on the built binary (643 cases
      # in 25 suites registered, 599 in 23 selected once this filter applies) - so the filter
      # removes the failures and nothing else. Earlier revisions of this comment said 31, 35 and
      # then 38, each true of an earlier tree; that is precisely why the number is no longer only
      # written down. The `List available tests and prove the invocation-A filter arithmetic` step below
      # RE-DERIVES the census on every run and fails the job if the filter's arithmetic does not
      # close, if it selects or excludes nothing, or if it excludes anything outside those two
      # fixtures.
      #
      # The filter is taken verbatim from the "Fixture manifest" pointer comment in
      # tests/L1Tests/ccec/test_DriverAidl.cpp, which is where it is maintained (the per-fixture
      # table it points to is under "### Fixture manifest" in AIDL_HAL_MIGRATION_NOTES.md); do not
      # re-derive it here. It is spelled as GTEST_FILTER rather than as a --gtest_filter
      # argument for one reason: an environment variable reaches EVERY way this job starts
      # the binary, including the make-driven valgrind run and the subshell in its
      # fallback arm, which an inline assignment in front of `make` does not.
      #
      # NO EXPECTED CASE COUNT IS RECORDED ANYWHERE IN THIS JOB, and the distinction between
      # that and asserting nothing at all is worth stating. A recorded total moves whenever a
      # test is added, so it would either rot into a false comment or fail honest runs -
      # which is what happened to the 31 above. What the listing step DOES assert is the
      # filter's internal arithmetic against the inventory it just read out of the binary:
      # selected + excluded == registered, neither side empty, and nothing excluded beyond
      # the two AIDL fixtures. None of that has to be edited when a case is added. Comparing
      # an EXECUTED count against an expected one remains run_coverage.sh's job, not this
      # workflow's.
      GTEST_FILTER: "-DriverAidlSessionTest.*:DriverAidlTransmitTest.*"

      # THE SINK CALLER SOURCE THE DRIFT GUARD READS.
      #
      # An ABSOLUTE path, and it has to be: the guard's fallback search is relative to the test
      # binary and to `../../..` from the runner's working directory, and neither resolves to the
      # workspace root from every place a test is started in this job. Setting it here rather
      # than per-step is what makes it reach every route that starts the binary - the direct run,
      # `make check`, and valgrind - which a per-step assignment would not.
      #
      # The file is produced by the "Checkout the Sink caller source for the L1 drift guard" step and its existence is
      # asserted by "Verify the pinned dependency checkouts" BEFORE any test runs, so a
      # set-but-unreadable value is caught by that step rather than by the guard. The guard
      # nevertheless diagnoses set-but-unreadable separately from not-set-at-all, because the two
      # call for different fixes; see its two FAIL arms.
      CEC_SINK_CALLER_SOURCE: >-
        ${{ github.workspace }}/entservices-hdmicecsink/plugin/HdmiCecSinkImplementation.cpp

      # EVERY RUN OF A TEST BINARY IN THIS JOB IS BOUNDED, AND THE BOUNDS LIVE HERE.
      #
      # Not housekeeping: a HANG is the specific regression proof (b) is about. On a host
      # with a Binder driver but no running service manager, reaching an IServiceManager
      # retries binder handle 0 in one-second intervals indefinitely - which is why
      # DriverAidlImpl runs a bounded preflight before anything touches libbinder. Unbounded,
      # that regression would present as a job consuming its whole workflow timeout at one
      # step, with no exit status to classify and no annotation to read; bounded, it presents
      # as GNU timeout's 124 (or 137 after the grace period), which the steps below classify
      # by name. GNU semantics are what a hosted ubuntu-22.04 runner has - coreutils, as on any
      # GitHub-hosted Ubuntu image - so 124 and 137 are the right contract here.
      #
      # The values are generous on purpose - they cannot fire on a slow runner, only on a
      # hang. Measured on this tree, the L1 suite runs in single-digit seconds even
      # instrumented, so 600s is roughly two orders of magnitude of headroom; listing cases
      # does no work at all beyond registration; and memcheck is one to two orders of
      # magnitude slower than a native run, which is what 3600s allows for. The grace period
      # is what separates "hung but still unwinds on SIGTERM" from "hung and had to be
      # SIGKILLed", a distinction the classification arms report.
      #
      # They are job-level env rather than repeated per step so that there is one place to
      # change them, exactly as the four staging prefixes above have one place.
      L1_RUN_TIMEOUT_SECONDS: 600
      L1_LIST_TIMEOUT_SECONDS: 120
      L1_VALGRIND_TIMEOUT_SECONDS: 3600
      L1_KILL_GRACE_SECONDS: 30

      # THE FIVE ARTEFACTS THIS JOB FETCHES FROM OUTSIDE THE DISTRIBUTION ARCHIVE, AND THE
      # PUBLISHER-ISSUED DIGESTS THEY ARE HELD TO.
      #
      # "Set up CMake" below fetches the JOB-WIDE CMake at exactly the version pinned by this
      # project, and "Resolve the CMake installations" fetches the Binder SDK's CMake at exactly
      # CMAKE_SDK_VERSION on every run - never an installed one. Both archives are executable
      # code, so both are verified before they are unpacked. The third is the GCC source "Build
      # the pinned GCC toolchain from source" compiles, held to GCC's own SHA-512 in the
      # CEC_TOOLCHAIN_GCC_* entries at the top of this file and likewise verified before it is
      # unpacked. The fourth and fifth are the pkgconf source "Build and assert pkgconf" compiles
      # and the lcov release asset "Install and assert lcov" installs, held to the PKGCONF_* and
      # LCOV_* entries below and likewise verified before they are unpacked.
      # Everything else this job installs comes from apt, which authenticates its own packages.
      #
      # A DIGEST THIS JOB MEASURES PROVES NOTHING; A DIGEST THE PUBLISHER ISSUED PROVES WHICH
      # BYTES ARE THE RIGHT BYTES. sha256sum of a file that was just downloaded says only that
      # the download did not corrupt itself. The value below is Kitware's own, taken from the
      # release manifest cmake-3.22.1-SHA-256.txt that ships as an asset of the v3.22.1 release
      # alongside the tarball it describes, committed here and reviewed with this file.
      #
      # A COMMITTED DIGEST IS VALID FOR EXACTLY ONE VERSION, so it is paired with the release
      # it was published for. The step compares that against CMAKE_SDK_VERSION and fails by
      # name when the two diverge - a version bumped without its digest stops at that guard
      # instead of checking one version's tarball against another version's digest, which
      # would fail as a mismatch and read as tampering rather than as a stale pin.
      #
      # 3.22.1 EXACTLY, NOT AS A FLOOR. It is the version linux_binder_idl's BUILD.md names for
      # the 2.6.0 tag, and the SDK is built with that release and no other, whatever cmake the
      # runner image or apt carries.
      #
      # aidl-path-tests.yml carries these three values under the same three names and resolves
      # the SDK's CMake the same way; move them together.
      CMAKE_SDK_VERSION: '3.22.1'
      CMAKE_SDK_SHA256: '73565c72355c6652e9db149249af36bcab44d9d478c5546fd926e69ad6b43640'
      CMAKE_SDK_SHA256_FOR_VERSION: '3.22.1'

      # THE JOB-WIDE CMAKE IS PINNED TO ONE EXACT RELEASE, AND THE BYTES ARE THE PUBLISHER'S.
      #
      # WHAT WAS WRONG. This job used to obtain its job-wide CMake by handing '3.16.x' to a
      # third-party setup action. Two separate defects sat in that one line. First, '3.16.x' is
      # a RANGE: which patch release it resolves to is decided by the action at run time, so the
      # compiler-facing toolchain could change with no byte changing in this file - the same
      # mutable-reference problem the action SHAs above exist to close, reintroduced through an
      # input. Second, and worse, the archive was downloaded OUT OF BAND by that action, so
      # nothing this job could compute would establish that the CMake it went on to run was
      # bytes Kitware published: a digest can only be checked by whoever holds the file.
      #
      # SO THIS JOB FETCHES IT ITSELF, AT AN EXACT VERSION, AND VERIFIES IT BEFORE USE. The
      # mechanism is deliberately the SAME ONE the SDK's CMake above already proved: version-
      # coupled guard first, non-empty guard second, download to a file, measured-versus-
      # committed sha256sum, and only then extract - each arm with an ::error:: that names the
      # reason and the remedy. The prefix it unpacks into is prepended to GITHUB_PATH, which is
      # what makes it the job-wide `cmake` for every later step, and "Resolve the CMake
      # installations" reads CMAKE_PINNED_VERSION back and asserts the version it actually got.
      #
      # 3.16.9 SPECIFICALLY, AND THE PIN IS NOT COSMETIC: 3.20 and later break the plugin
      # test-library configure, which is the whole reason a floor-era CMake is pinned at all,
      # and 3.16.9 is the last patch release of that series. Only the patch level is new here -
      # the series is the project's existing pin.
      #
      # THE ASSET NAME USES A CAPITAL L, AND THAT IS AN ERA DIFFERENCE RATHER THAN A TYPO.
      # Kitware's release assets were named cmake-<v>-Linux-x86_64.tar.gz through the 3.19
      # series and cmake-<v>-linux-x86_64.tar.gz from 3.20 onwards, so this pin's tarball and
      # the 3.22.1 tarball above genuinely spell the platform differently. Composing the name
      # from the version in the step is what keeps the version to one spelling; the case is
      # written out there with this note beside it.
      #
      # Source of the digest: Kitware's own release manifest cmake-3.16.9-SHA-256.txt, published
      # as an asset of the v3.16.9 release alongside the tarball it describes, committed here and
      # reviewed with this file. A COMMITTED DIGEST IS VALID FOR EXACTLY ONE VERSION, hence the
      # _FOR_VERSION partner and the guard that refuses to check one release's tarball against
      # another release's digest.
      #
      # aidl-path-tests.yml carries these three values under the same three names and resolves
      # its job-wide CMake the same way; move them together or the two jobs stop being
      # comparable.
      CMAKE_PINNED_VERSION: '3.16.9'
      CMAKE_PINNED_SHA256: '96d79367dcafb47d606573a4687021d3cb18dd53d83458fc1d6d9c89bf31b553'
      CMAKE_PINNED_SHA256_FOR_VERSION: '3.16.9'

      # pkg-config IS PINNED TO pkgconf 1.8.1, BUILT FROM ITS RELEASE TARBALL.
      #
      # 1.8.1 is the pkg-config the acceptance runs are recorded with, and jammy's archive does
      # not carry it: main has the freedesktop pkg-config 0.29.2, which libglib2.0-dev pulls in
      # whatever this job asks for, and universe has pkgconf 1.8.0. "Build and assert pkgconf"
      # therefore builds exactly PKGCONF_VERSION and proves it is the pkg-config configure gets.
      #
      # Source of the digest: the upstream release tarball
      # https://distfiles.ariadne.space/pkgconf/pkgconf-1.8.1.tar.xz (302372 bytes) is byte-identical
      # to Ubuntu noble's pkgconf_1.8.1.orig.tar.xz, whose SHA-256 below is the one published in
      # noble's signed main/source/Sources index. A COMMITTED DIGEST IS VALID FOR EXACTLY ONE
      # VERSION, hence the _FOR_VERSION partner and its guard.
      PKGCONF_VERSION: '1.8.1'
      PKGCONF_SHA256: '644361ada2942be05655d4452eb018791647c31bba429b287f1f68deb2dc6840'
      PKGCONF_SHA256_FOR_VERSION: '1.8.1'

      # lcov IS PINNED TO THE v2.0 RELEASE ASSET, WHICH REPORTS ITSELF AS 2.0-1.
      #
      # 2.0-1 is the lcov the acceptance runs are recorded with; jammy's archive ships 1.15. The
      # release asset rather than the auto-generated source archive, because only the asset ships
      # the .version file that stamps the installed tools with that version.
      #
      # Source of the digest: the value published with the linux-test-project/lcov v2.0 release
      # for lcov-2.0.tar.gz (391695 bytes), corroborated by Gentoo's independently maintained
      # dev-build/lcov Manifest for the same bytes. A COMMITTED DIGEST IS VALID FOR EXACTLY ONE
      # VERSION, hence the _FOR_VERSION partner and its guard.
      #
      # aidl-path-tests.yml carries these three values under the same three names and installs
      # the same asset; move them together.
      LCOV_VERSION: '2.0'
      LCOV_SHA256: '1857bb18e27abe8bcec701a907d5c47e01db4d4c512fc098d1a6acd29267bf46'
      LCOV_SHA256_FOR_VERSION: '2.0'

      # GOOGLETEST IS PINNED TO A COMMIT, AND THE TAG SURVIVES ONLY AS THE COMMENT BESIDE IT.
      #
      # This used to be spelled `ref: v1.15.0` on the checkout step below. A tag is a POINTER
      # ITS PUBLISHER CAN MOVE, and this tree is not merely downloaded: it is configured,
      # compiled, linked into every test binary in this job and executed. Repointing the tag
      # would therefore change compiled, executed code with no byte changing in this file -
      # exactly the hazard the action SHAs below exist to close, and the argument applies to a
      # dependency's source tree just as it does to an action's.
      #
      # v1.15.0 is a LIGHTWEIGHT tag, so the value it resolves to IS a commit rather than a tag
      # object, and that value is the one here - read from the publisher with
      # `git ls-remote --tags https://github.com/google/googletest 'v1.15.0'`.
      #
      # IT LIVES IN THE ENV RATHER THAN INLINE so the pin has ONE spelling in this file: this
      # entry, and the assertion in "Verify the pinned dependency checkouts" that reads the same
      # value back. Two copies of a pin are a pin that can disagree with itself.
      #
      # UPDATE POLICY, the same one the action pins use: read the new tag's commit from the
      # publisher, review what changed, then move BOTH the SHA and the tag comment in one edit.
      # aidl-path-tests.yml pins the same commit under the same name; move them together.
      GOOGLETEST_REF: e39786088138f2749d64e9e90e0f9902daa77c40 # v1.15.0

      # THE SINK CALLER SOURCE PIN, held here for the same reason the two above are: one value,
      # read by the checkout step and asserted by "Verify the pinned dependency checkouts".
      #
      # This is the superproject gitlink for entservices-hdmicecsink and it is also the commit
      # DriverAidlLocalInstanceTest.TheModelledSinkCallPathsStillMatchTheRealSinkSource names as
      # REVIEWED. The three must move together, and moving them is a deliberate act: bumping this
      # pin is expected to fail the drift guard if the plugin's call-site shape changed, which is
      # exactly when a human should be deciding whether the modelled call paths must be
      # re-derived. Keeping it on a branch instead would surrender that property.
      # aidl-path-tests.yml pins the same commit under the same name; move them together.
      SINK_CALLER_COMMIT: 2ad7e1a4712908a4d0fb838caebcbfcaabba55d8 # superproject gitlink; reviewed by the drift guard

      # THE BINDER SDK SOURCE IS PINNED TO A COMMIT, AND ITS RESOLUTION IS NOW FAIL-CLOSED.
      #
      # WHAT WAS WRONG. This job ran `./build_binder.sh` with BINDER_VERSION unset, and the
      # comment above that step said so deliberately, on the grounds that the script reads the
      # committed pin out of rdk-halif-aidl/binder_sdk.version. It does read it - and then it
      # fails OPEN in three separate places, each of which builds a DIFFERENT Binder SDK than
      # the pin names, silently, and none of which can be corrected inside the script, which is
      # a read-only input here:
      #
      #   1. BINDER_VERSION="${BINDER_VERSION:-${_PINNED_BINDER_VERSION:-2.0.0}}" - an
      #      unreadable, empty or comment-only binder_sdk.version degrades to 2.0.0.
      #   2. its clone step returns SUCCESS with only a printed warning when the source
      #      directory already exists at a different ref, so a stale or substituted tree is
      #      built as it stands.
      #   3. a failed `git checkout "$BINDER_VERSION"` prints "using default branch" and
      #      carries on, so a ref that does not resolve becomes whatever the default branch is.
      #
      # WHAT THIS JOB DOES INSTEAD. It resolves the source itself, at an immutable commit, and
      # proves it: the tree is checked out by actions/checkout at BINDER_SDK_COMMIT, its HEAD is
      # asserted before the build, the script is pointed at that tree through BINDER_SOURCE_DIR
      # and given the same commit as BINDER_VERSION, and THE HEAD IS ASSERTED AGAIN after the
      # script returns and before anything is built from or staged out of the tree - because
      # arm 2 above means the script's own existing-tree path only warns.
      #
      # binder_sdk.version IS STILL READ, and is now a GATE rather than a fallback: the job fails
      # if the file is missing, unreadable or carries no non-comment value, and fails if its
      # value is not BINDER_SDK_TAG. That is what keeps the pin living in rdk-halif-aidl and the
      # commit committed here from drifting apart - a pin bump surfaces as a named failure in
      # this job instead of as a quietly different SDK.
      #
      # 2.6.0 IS AN ANNOTATED TAG, unlike the lightweight tags the action pins use: refs/tags/2.6.0
      # resolves to a TAG OBJECT (1b3148a1297fd4b8ad1c5e94b9e4a7a1b46a360a) and NOT to a commit.
      # The value below is the commit that tag points at - `git rev-parse refs/tags/2.6.0^{}` -
      # because a commit is what `git rev-parse HEAD` reports in a checkout and therefore the
      # only thing an assertion can compare against.
      #
      # aidl-path-tests.yml carries these three values under the same three names and stages two
      # of these trees, one per architecture; move them together.
      BINDER_SDK_REPOSITORY: rdkcentral/linux_binder_idl
      BINDER_SDK_TAG: '2.6.0'
      BINDER_SDK_COMMIT: e5035dc02d810d3c93e03188ca8e3fb7cb165c95 # tag 2.6.0 (annotated; tag object 1b3148a1297fd4b8ad1c5e94b9e4a7a1b46a360a)

      # THE SINK PLUGIN SOURCE THE L1 SUITE READS, WITHOUT WHICH THIS JOB'S TEST STEPS FAIL.
      #
      # tests/L1Tests/ccec/test_DriverAidl.cpp carries a drift guard --
      # DriverAidlLocalInstanceTest.TheModelledSinkCallPathsStillMatchTheRealSinkSource -- that
      # reads entservices-hdmicecsink/plugin/HdmiCecSinkImplementation.cpp and FAILS HARD when it
      # cannot find it, deliberately: the difference-3 case it protects asserts against a MODEL
      # of the plugin's two addLogicalAddress call paths, and a model nothing checks against its
      # subject is not evidence about a caller. Nothing here compiles or links against this
      # tree; exactly one file in it is read, by that guard.
      #
      # Like rdk-halif-aidl it is a SIBLING SUBMODULE OF THE SUPERPROJECT, so nothing brings it
      # in implicitly, and the ref is the superproject gitlink commit rather than a branch, so
      # what the guard reads is a REVIEWED revision. aidl-path-tests.yml carries these two values
      # under the same two names; move them together.
      SINK_REPOSITORY: Blitzy-Sky/entservices-hdmicecsink
      SINK_REF: 2ad7e1a4712908a4d0fb838caebcbfcaabba55d8

      # THE TWO PRODUCTION HEADER SOURCES THE SHIPPING HAND BUILD COMPILES AGAINST.
      #
      # ccec/src/Makefile takes <telemetry_busmessage_sender.h> from TELEMETRY_PREFIX and
      # "ccec/drivers/hdmi_cec_driver.h" from LEGACY_HAL_PREFIX, and REFUSES mocks/ and stubs/
      # as either root, because the library a SOC vendor ships is not certified against
      # test-scope headers. So both publishers' trees are checked out here at a commit, their
      # HEADs are asserted by "Verify the pinned dependency checkouts", and the hand-build step
      # stages the two roots outside the hdmicec tree from them.
      #
      #   TELEMETRY_COMMIT   rdkcentral/telemetry develop head when pinned, read with
      #                      `git ls-remote`; supplies include/telemetry_busmessage_sender.h
      #                      and the include/telemetry2_0.h it includes.
      #   LEGACY_HAL_COMMIT  rdkcentral/rdk-halif-hdmi_cec tag 1.4.0 - an ANNOTATED tag, so this
      #                      is `git rev-parse refs/tags/1.4.0^{}` - and the superproject
      #                      gitlink; supplies include/hdmi_cec_driver.h.
      #
      # aidl-path-tests.yml carries these four values under the same four names; move them
      # together.
      TELEMETRY_REPOSITORY: rdkcentral/telemetry
      TELEMETRY_COMMIT: 8a88c84d75a0dccdaf0fdfe2bf4132750eca61df # develop head; include/telemetry_busmessage_sender.h, include/telemetry2_0.h
      LEGACY_HAL_REPOSITORY: rdkcentral/rdk-halif-hdmi_cec
      LEGACY_HAL_COMMIT: f05a341fe525fa345decc16996ad30234b645ece # tag 1.4.0 (annotated; tag object 164bbb5c311c04db1493e7338d05ca4f5a70dd71); superproject gitlink

      # WHERE THE VERIFIED SOURCE TREE LIVES, AND WHY EXACTLY THERE.
      #
      # This is build_binder.sh's OWN DEFAULT location for it: the script resolves
      # BINDER_REPO_DIR to ${BINDER_INSTALL_DIR:-<rdk-halif-aidl>/build-tools}/linux_binder_idl,
      # and build_modules.sh independently defaults its toolchain root to
      # <rdk-halif-aidl>/build-tools/linux_binder_idl. Putting the verified checkout at the path
      # both scripts already expect means the pin is enforced without moving anything either
      # script looks for. BINDER_SOURCE_DIR is still passed explicitly at the call site rather
      # than left to that default, so the tree being used is stated where it is used.
      BINDER_SDK_SOURCE_DIR: ${{ github.workspace }}/rdk-halif-aidl/build-tools/linux_binder_idl

    # EVERY ACTION IN THIS JOB IS PINNED TO A FULL-LENGTH COMMIT SHA, AND THE TAG SURVIVES
    # ONLY AS A COMMENT.
    #
    # A tag is a MUTABLE reference. `actions/checkout@v4` resolves through a moving major-
    # version tag that its publisher repoints at each new v4.x, so the code this job runs
    # can change without a single byte changing in this file - and an action runs with
    # access to the job's filesystem and environment. A 40-character commit SHA is the one
    # reference GitHub's own hardening guidance calls immutable, and it is what every `uses:`
    # below carries.
    #
    # THE TWO PINS USED IN THIS FILE, each read from the publisher's own tag with
    # `git ls-remote`. Both are LIGHTWEIGHT tags, so the value the tag resolves to IS a
    # commit SHA rather than a tag object:
    #
    #   actions/checkout            3d3c42e5aac5ba805825da76410c181273ba90b1   = v7 = v7.0.1
    #   actions/upload-artifact     043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   = v7 = v7.0.1
    #
    # ---------------------------------------------------------------------------------------
    # PIN AUDIT RECORD. READ THIS BEFORE TREATING EITHER PIN AS CLEAN.
    #
    # A COMMIT PIN BUYS IMMUTABILITY, NOT SAFETY. It fixes WHICH bytes run; it says nothing
    # about whether those bytes contain known-vulnerable dependencies. Both of these actions
    # ship their dependencies pre-bundled in a committed dist/ directory, so the vulnerable code
    # travels inside the pin rather than being resolved at run time - and it executes with this
    # job's token and repository context, in a workflow that runs on `pull_request`. That is why
    # the residual is RECORDED AND DATED here rather than left implicit: a residual a reviewer
    # can see and re-date is reviewable, and an unrecorded one is indistinguishable from a clean
    # pin.
    #
    # METHOD. For each pinned commit, the action's OWN package.json and package-lock.json were
    # fetched at that commit and audited with `npm audit --omit=dev --package-lock-only`
    # (production dependencies only - dev dependencies are not bundled into dist/).
    #
    #   audit tooling  : npm 11.18.0 on Node v22.23.2
    #   audit date     : 2026-09-01 (UTC)
    #
    #   actions/checkout @ 3d3c42e5aac5ba805825da76410c181273ba90b1  (release v7.0.1)
    #     action runtime : node24   (read from action.yml at that commit)
    #     audit exit     : 1
    #     RESIDUAL       : 1 vulnerable node - 0 critical, 0 high, 1 MODERATE, 0 low
    #                      undici (<=6.27.0): GHSA-8xcm-r25x-g524, GHSA-m8rv-5g2x-5cg5,
    #                      GHSA-v3r7-h72x-cjcm
    #
    #   actions/upload-artifact @ 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  (release v7.0.1)
    #     action runtime : node24   (read from action.yml at that commit)
    #     audit exit     : 1
    #     RESIDUAL       : 5 vulnerable nodes - 0 critical, 5 HIGH, 0 moderate, 0 low
    #                      brace-expansion, fast-xml-builder, fast-xml-parser, lodash, undici
    #
    # WHY THESE PINS ANYWAY, given neither audits clean. v7.0.1 is the NEWEST release either
    # publisher has issued, so no clean release exists to move to - the residual is upstream's
    # to close, not this file's. What the move DID close is measured rather than asserted, by
    # running the same audit against the pins this file used to carry:
    #
    #   checkout        v4.2.2 -> v7.0.1 : 8 vulnerable nodes (1 high + 7 moderate) -> 1 (1 moderate)
    #   upload-artifact v4.6.2 -> v7.0.1 : 17 vulnerable nodes (1 CRITICAL form-data
    #                                      + 6 high + 10 moderate) -> 5 (5 high)
    #
    # and the retired action runtime. Both old pins declared `runs.using: node20`, which GitHub
    # retired on 30 April 2026, so every step using them ran on an end-of-life runtime that
    # receives no security fixes at all. Both new pins declare node24.
    #
    # WHO OWNS THE RESIDUAL AND WHAT CLOSES IT. The bundled-dependency advisories above belong
    # to actions/checkout and actions/upload-artifact upstream; nothing in this repository can
    # patch a committed dist/ bundle without forking the action, which would replace a reviewed
    # publisher pin with an unreviewed local one. The action to take is to RE-RUN THE AUDIT
    # ABOVE at each pin review, move to the first release whose audit is clean or whose residual
    # is smaller, and re-date this block in the same edit. A block whose audit date is old is
    # itself the finding. aidl-path-tests.yml carries this record over the same two pins; the
    # two are moved together, so they are re-audited together.
    # ---------------------------------------------------------------------------------------
    #
    # There used to be a third, jwlawson/actions-setup-cmake, and it is gone rather than
    # re-pinned: a digest can only be checked by whoever holds the file, and that action
    # downloaded the CMake archive out of band, so no pin on the action could establish that
    # the CMake this job then ran was bytes Kitware published. "Set up CMake" below fetches and
    # digest-verifies the exact pinned release itself. Do not re-introduce the action to
    # "simplify" that step - it would give the pin away again.
    #
    # UPDATE POLICY, so a maintainer is not left guessing what the pin corresponds to. The
    # trailing comment on each `uses:` names the release the SHA belongs to. To move one:
    # read the new tag's SHA from the publisher (`git ls-remote --tags
    # https://github.com/<owner>/<repo> '<tag>'`), review what changed between the two, then
    # replace BOTH the SHA and the tag comment in the same edit - a SHA whose comment names a
    # different release is worse than no comment. aidl-path-tests.yml pins the same two
    # actions to the same two SHAs deliberately; move them together or the two jobs stop
    # being comparable.
    #
    # RUNTIME LINEAGE IS PART OF THE PIN, AND IT IS WHY BOTH SHAs ABOVE ARE ON THE v7 LINEAGE.
    # An action's `runs.using` names the Node runtime GitHub executes its bundle under, and a
    # retired runtime receives no security fixes however current the pin's digest looks. This
    # file has now been through that once in each direction: it carried actions/checkout 3.7.0
    # on the Node 16 runtime, moved to v4.2.2 on Node 20, and Node 20 itself reached end of life
    # on 30 April 2026 - so v4.2.2 and v4.6.2 were BOTH on a retired runtime by the time the
    # pins above were reviewed. v7.0.1 declares node24 for both actions, read from each
    # action.yml at the pinned commit rather than inferred from the release number. Every
    # retired release is named here in prose and nowhere as a pin, which is the state a pin audit
    # expects: grepping this file for either old digest, or for either old release as the
    # `# vN (vN.N.N)` comment spelled it, comes back empty.
    #
    # THAT MAKES A RE-PIN THREE CHECKS RATHER THAN ONE, and the third is the one this file used
    # to omit:
    #
    #   1. THE DIGEST. A committed SHA is valid for exactly one release, which is why the SHA
    #      and its trailing version comment always move together - that part is the update
    #      policy above.
    #   2. THE RUNTIME. Read `runs.using` out of the new release's own action.yml. It does not
    #      follow from the digest: a pin can be perfectly current as a digest and stale as a
    #      runtime while reading identically either way. When GitHub retires Node 24, this same
    #      move is needed again and nothing in this file will say so on its own.
    #   3. THE PRODUCTION AUDIT. Run `npm audit --omit=dev --package-lock-only` against the new
    #      release's own package-lock.json at the pinned commit and update the PIN AUDIT RECORD
    #      above with the date and the exact residual counts. This is the check that
    #      distinguishes "immutable" from "safe", and it is the reason that record exists: both
    #      pins above still carry a residual, and a residual that is written down and dated can
    #      be reviewed while an assumed-clean pin cannot.
    steps:
      # THE JOB-WIDE CMAKE, FETCHED HERE AND VERIFIED BEFORE IT IS UNPACKED.
      #
      # This step replaces a `jwlawson/actions-setup-cmake` step that was given the RANGE
      # '3.16.x'. The reasoning is in the CMAKE_PINNED_* block in this job's env above, and the
      # short form is: the version is now exact, and the bytes are now checkable by this job
      # because this job is the one that holds the file.
      #
      # ORDER OF THE GUARDS IS THE SAME AS "Resolve the CMake installations" USES FOR THE SDK'S
      # CMAKE, on purpose - version coupling first, so a version bumped without its digest
      # stops at a guard that says exactly that instead of failing later as a digest mismatch
      # that reads like tampering; then the non-empty check, so a removed value cannot pass as
      # a satisfied comparison; then measured versus committed.
      #
      # PREPENDED TO GITHUB_PATH, WHICH IS WHAT MAKES IT JOB-WIDE. "Install packages" below
      # apt-installs cmake as a build dependency of other things, and the distribution's cmake
      # is NOT the one the rest of this job may use; the prepend puts this prefix ahead of
      # /usr/bin for every later step, exactly as the action it replaces did. GITHUB_PATH takes
      # effect from the NEXT step onwards, so the assertion belongs downstream - "Resolve the
      # CMake installations" reads CMAKE_PINNED_VERSION back and fails if the job-wide cmake is
      # anything else.
      - name: Set up CMake
        run: |
          set -euo pipefail
          prefix="$GITHUB_WORKSPACE/tools/cmake-$CMAKE_PINNED_VERSION"
          mkdir -p "$prefix"

          # Both values are read through ":-" deliberately, even under `set -u`: a removed env
          # entry then fails at the guard that names it and says what to commit, rather than at
          # an "unbound variable" line that says neither.
          if [ "$CMAKE_PINNED_VERSION" != "${CMAKE_PINNED_SHA256_FOR_VERSION:-}" ]; then
            echo "::error::CMAKE_PINNED_VERSION is '$CMAKE_PINNED_VERSION' but the committed CMAKE_PINNED_SHA256 was published by Kitware for '${CMAKE_PINNED_SHA256_FOR_VERSION:-<unset>}'. A committed digest is valid for one version only. Read the new release's own cmake-<version>-SHA-256.txt manifest, update CMAKE_PINNED_SHA256 and CMAKE_PINNED_SHA256_FOR_VERSION together with the version, and do not verify one version's tarball against another's digest."
            exit 1
          fi
          [ -n "${CMAKE_PINNED_SHA256:-}" ] || { echo "::error::CMAKE_PINNED_SHA256 is empty, so this tarball cannot be authenticated. This job does not extract an unverified CMake: commit the digest from Kitware's cmake-$CMAKE_PINNED_VERSION-SHA-256.txt release manifest."; exit 1; }

          # CAPITAL L. Kitware named this asset cmake-<v>-Linux-x86_64.tar.gz through the 3.19
          # series and cmake-<v>-linux-x86_64.tar.gz from 3.20 onwards, so this pin and the
          # 3.22.1 SDK pin below genuinely differ in case. The version appears once, here.
          asset="cmake-$CMAKE_PINNED_VERSION-Linux-x86_64.tar.gz"
          tarball="$GITHUB_WORKSPACE/tools/$asset"
          curl -fsSL --output "$tarball" \
            "https://github.com/Kitware/CMake/releases/download/v$CMAKE_PINNED_VERSION/$asset"

          measured="$(sha256sum "$tarball" | awk '{ print $1 }')"
          echo "cmake tarball  : $tarball"
          echo "measured sha256: $measured"
          echo "committed      : $CMAKE_PINNED_SHA256  (Kitware cmake-$CMAKE_PINNED_SHA256_FOR_VERSION-SHA-256.txt)"
          if [ "$measured" != "$CMAKE_PINNED_SHA256" ]; then
            echo "::error::CMake tarball digest mismatch. measured $measured, committed $CMAKE_PINNED_SHA256 (published by Kitware for $CMAKE_PINNED_SHA256_FOR_VERSION). Either the download was tampered with or the release asset was replaced; this job will not extract an unverified CMake, and it will not be made to by relaxing this check or by editing the committed digest to match the download - confirm the publisher's value first."
            exit 1
          fi
          echo "verified against the committed publisher digest"

          tar -xz --strip-components=1 -C "$prefix" -f "$tarball"
          got="$("$prefix/bin/cmake" --version | head -n 1 | awk '{ print $3 }')"
          if [ "$got" != "$CMAKE_PINNED_VERSION" ]; then
            echo "::error::the extracted cmake reports '$got', not the pinned $CMAKE_PINNED_VERSION. The archive that matched the committed digest does not contain the release it is named for; do not proceed on it."
            exit 1
          fi
          echo "job-wide cmake : $prefix/bin/cmake ($got)"
          echo "$prefix/bin" >> "$GITHUB_PATH"

      # flex and bison are BUILD-SDK prerequisites, not extras. build_binder.sh configures the
      # Binder SDK with -DBUILD_HOST_AIDL=ON, which builds the host AIDL compiler, and that
      # target calls FLEX_TARGET/BISON_TARGET. Without these two packages CMake reports
      # "Could NOT find FLEX (missing: FLEX_EXECUTABLE)" and then fails outright with
      # "Unknown CMake command \"FLEX_TARGET\"", so the "Build the Binder SDK" step below
      # cannot run at all - measured, not anticipated. They belong here rather than in that
      # step because this is the one place this job installs packages.
      #
      # gcc-13 AND g++-13 ARE NOT IN THIS LIST, because jammy's archive does not carry them:
      # the step after this one builds them, and that build also supplies /usr/bin/gcov-13,
      # which the toolchain step puts first on PATH under the name `gcov` because
      # tests/L1Tests/run_coverage.sh resolves gcov from PATH and has no override knob. What
      # the build needs from the archive IS here: libgmp-dev, libmpfr-dev and libmpc-dev, the
      # three libraries GCC's configure requires, and build-essential, whose gcc-11 compiles it -
      # measured to be all it needs. build-essential also provides make, libc6-dev and the rest
      # of the base build environment. The bare `g++` this list once carried stays gone: it
      # installs whichever family the image defaults to and says nothing about which one this
      # job uses.
      #
      # libglib2.0-dev IS NAMED because configure.ac requires glib-2.0 and the ubuntu-22.04
      # image carries it only as another package's dependency; a hard configure dependency is
      # not left to that. Apart from the lcov change below, every other package in this list is
      # unchanged, clang included: nothing in this job compiles with clang, but removing a
      # package is not this correction's business.
      #
      # lcov IS NOT IN THIS LIST: jammy's is 1.15, and "Install and assert lcov" installs the
      # pinned 2.0 release asset instead. perl and the five lib*-perl modules after it are that
      # release's runtime prerequisites, the same set aidl-path-tests.yml installs. pkg-config
      # STAYS although "Build and assert pkgconf" supersedes it for every later step: it is
      # jammy's 0.29.2, which libglib2.0-dev pulls in regardless, and it is the reference that
      # step checks the pinned build's answers against.
      - name: Install packages
        run: >
          sudo apt update
          &&
          sudo apt install -y autoconf automake libtool pkg-config libgtest-dev libgmock-dev libdbus-1-dev libglib2.0-dev build-essential libgmp-dev libmpfr-dev libmpc-dev cmake valgrind clang ninja-build flex bison perl libcapture-tiny-perl libdatetime-perl libjson-xs-perl libperlio-gzip-perl libtimedate-perl

      # THE PINNED GCC, BUILT FROM THE GNU RELEASE.
      #
      # WHAT IT PRODUCES. Exactly CEC_TOOLCHAIN_GCC_VERSION, configured with --prefix=/usr and
      # --program-suffix=-<major>, so it is /usr/bin/gcc-13, g++-13 and gcov-13: the gate, the
      # gcov shim and the hand build's expected compiler are unchanged, and the libstdc++
      # headers land in /usr/include/c++/<version>, which the '/usr/include/*' removal in
      # "Generate coverage" and the exclusion globs tests/L1Tests/run_coverage.sh carries
      # already strip. It is C and C++ only, 64-bit only (--disable-multilib), PIE by default
      # as distribution compilers are, with release checking and no translations, and built in
      # one stage (--disable-bootstrap): jammy's gcc-11 compiles it once, which is enough for a
      # compiler that builds this project rather than one that ships.
      #
      # THE SAME FETCH CONTRACT AS THE TWO CMAKES: version-coupled guard first, non-empty guard
      # second, download to a file, measured-versus-committed SHA-512, and nothing is unpacked
      # from a tarball that fails.
      #
      # THE INSTALL REPLACES NOTHING THE IMAGE OWNS. The build runs as the runner account into
      # a staging directory. Every staged path that already exists on the runner is listed as
      # an ::error:: before anything is written, and the copy into / extracts with
      # --keep-old-files, so an existing file is refused rather than overwritten, and
      # --no-same-owner, so the result is root-owned; directories already on the runner keep
      # their modes and owners. No package's file is touched, so dpkg's record of the image
      # stays true.
      #
      # WHY /usr/lib64 GOES FIRST FOR THE LOADER. GCC installs its libstdc++.so.6 and
      # libgcc_s.so.1 under /usr/lib64, and every C++ binary g++-13 links needs that libstdc++:
      # jammy's own, from gcc-12, lacks the newer symbol versions. An /etc/ld.so.conf.d entry
      # that sorts before the multiarch ones makes the loader prefer it, and libstdc++ is
      # backward compatible, so the image's own C++ programs keep running against it.
      #
      # timeout-minutes IS A BACKSTOP, set far above the measured step: about fifteen minutes
      # on two CPUs and eight on four.
      - name: Build the pinned GCC toolchain from source
        timeout-minutes: 150
        run: |
          set -euo pipefail
          major="${CEC_TOOLCHAIN_GCC_MAJOR:?CEC_TOOLCHAIN_GCC_MAJOR is unset. Restore it in the env block of this workflow.}"
          version="${CEC_TOOLCHAIN_GCC_VERSION:?CEC_TOOLCHAIN_GCC_VERSION is unset. Restore it in the env block of this workflow, beside CEC_TOOLCHAIN_GCC_MAJOR.}"

          # VERSION COUPLING FIRST, as for the two CMakes: a release bumped without its digest
          # stops here by name instead of failing below as a digest mismatch.
          if [ "$version" != "${CEC_TOOLCHAIN_GCC_SHA512_FOR_VERSION:-}" ]; then
            echo "::error::CEC_TOOLCHAIN_GCC_VERSION is '$version' but the committed CEC_TOOLCHAIN_GCC_SHA512 was published by GCC for '${CEC_TOOLCHAIN_GCC_SHA512_FOR_VERSION:-<unset>}'. A committed digest is valid for one release only. Read the new release's own sha512.sum under https://gcc.gnu.org/pub/gcc/releases/, update CEC_TOOLCHAIN_GCC_SHA512 and CEC_TOOLCHAIN_GCC_SHA512_FOR_VERSION together with the version, and do not verify one release's tarball against another's digest."
            exit 1
          fi
          [ -n "${CEC_TOOLCHAIN_GCC_SHA512:-}" ] || { echo "::error::CEC_TOOLCHAIN_GCC_SHA512 is empty, so the GCC source cannot be authenticated. This job does not build an unverified compiler: commit the digest from GCC's sha512.sum for gcc-$version."; exit 1; }
          case "$version" in
            "$major".*) : ;;
            *) echo "::error::CEC_TOOLCHAIN_GCC_VERSION is '$version', which is not a release of the pinned major $major. The two are one pin spelled twice; move them together."; exit 1 ;;
          esac

          work="$RUNNER_TEMP/cec-gcc-$version"
          tarball="$work/gcc-$version.tar.xz"
          src="$work/src"
          obj="$work/obj"
          stage="$work/stage"
          probe="$work/probe"
          rm -rf -- "$work"
          mkdir -p -- "$src" "$obj" "$stage" "$probe"

          curl -fsSL --retry 3 --output "$tarball" \
            "https://ftp.gnu.org/gnu/gcc/gcc-$version/gcc-$version.tar.xz"

          measured="$(sha512sum "$tarball" | awk '{ print $1 }')"
          echo "gcc tarball    : $tarball"
          echo "measured sha512: $measured"
          echo "committed      : $CEC_TOOLCHAIN_GCC_SHA512  (GCC gcc-$CEC_TOOLCHAIN_GCC_SHA512_FOR_VERSION sha512.sum)"
          if [ "$measured" != "$CEC_TOOLCHAIN_GCC_SHA512" ]; then
            echo "::error::GCC tarball digest mismatch. measured $measured, committed $CEC_TOOLCHAIN_GCC_SHA512 (published by GCC for $CEC_TOOLCHAIN_GCC_SHA512_FOR_VERSION). Either the download was tampered with or the release file was replaced; this job will not build an unverified compiler, and it will not be made to by relaxing this check or by editing the committed digest to match the download - confirm the publisher's value first."
            exit 1
          fi
          echo "verified against the committed publisher digest"
          tar -xJ --strip-components=1 -C "$src" -f "$tarball"
          rm -f -- "$tarball"

          # Each phase writes to its own log, and a failure prints that log's tail: GCC's
          # build output is far too long to read in a step log, its last lines are not.
          run_logged() {
            local what="$1" logfile="$2"
            shift 2
            if ! "$@" > "$logfile" 2>&1; then
              echo "::error::$what failed for GCC $version. The last 80 lines of $logfile follow."
              tail -n 80 -- "$logfile"
              exit 1
            fi
            echo "$what: done"
          }
          echo "build compiler : $(gcc --version | head -n 1)"
          cd "$obj"
          run_logged configure "$work/configure.log" "$src/configure" \
            --build=x86_64-linux-gnu --host=x86_64-linux-gnu --target=x86_64-linux-gnu \
            --prefix=/usr --program-suffix="-$major" --enable-languages=c,c++ \
            --disable-multilib --disable-bootstrap --disable-nls \
            --enable-checking=release --enable-default-pie
          run_logged make "$work/make.log" make -j"$(nproc)"
          run_logged "make install-strip" "$work/install.log" make install-strip DESTDIR="$stage"
          cd "$GITHUB_WORKSPACE"

          # Documentation is no part of a build toolchain. The write bits a build umask may
          # leave for group and other are dropped, so nothing installed is writable but by root.
          rm -rf -- "$stage/usr/share/info" "$stage/usr/share/man"
          chmod -R go-w -- "$stage"

          # EVERY COLLISION IS NAMED BEFORE ANYTHING IS WRITTEN. A staged file may not exist on
          # the runner at all, and a staged directory may only merge into a real directory. Only
          # usr/ is copied, so anything staged beside it is refused rather than left behind.
          outside="$(cd "$stage" && find . -mindepth 1 -maxdepth 1 ! -name usr)"
          if [ -n "$outside" ]; then
            echo "::error::the GCC $version install staged paths outside usr/ ($outside), which a --prefix=/usr build does not do; nothing was installed."
            exit 1
          fi
          collisions=0
          while IFS= read -r -d '' rel; do
            target="/${rel#./}"
            if [ -d "$stage/$rel" ] && [ ! -L "$stage/$rel" ]; then
              if [ -L "$target" ] || { [ -e "$target" ] && [ ! -d "$target" ]; }; then
                echo "::error::the GCC $version install would put a directory at $target, which already exists on this runner as something other than a directory."
                collisions=$((collisions + 1))
              fi
            elif [ -e "$target" ] || [ -L "$target" ]; then
              echo "::error::the GCC $version install would replace $target, which already exists on this runner. Nothing the image owns is overwritten; find which package or earlier step installed it."
              collisions=$((collisions + 1))
            fi
          done < <(cd "$stage" && find . -mindepth 1 -print0)
          if [ "$collisions" -ne 0 ]; then
            echo "::error::$collisions staged path(s) collide with what is already on this runner, so nothing was installed."
            exit 1
          fi
          echo "staged paths   : $(cd "$stage" && find . -mindepth 1 | wc -l), none already on the runner"
          tar -C "$stage" -cf - usr | sudo tar -C / -xf - --keep-old-files --no-same-owner

          conf="/etc/ld.so.conf.d/000-cec-gcc-$version.conf"
          if [ -e "$conf" ]; then
            echo "::error::$conf already exists, so this step cannot tell whether the loader order it sets is its own. Nothing else creates that name."
            exit 1
          fi
          printf '%s\n' /usr/lib64 | sudo tee "$conf" > /dev/null
          sudo ldconfig

          # THE INSTALLED TOOLCHAIN, PROVED: the three versioned names, each reporting exactly
          # the release just built, and a C++17 program that runs against the new libstdc++.
          rc=0
          for tool in gcc g++ gcov; do
            path="/usr/bin/$tool-$major"
            if [ ! -x "$path" ]; then
              echo "::error::$path is not present after the install, so the GCC $version build did not produce the name the toolchain gate selects."
              rc=1
              continue
            fi
            if [ "$tool" = gcov ]; then
              got="$("$path" --version | head -n 1 | awk '{ print $NF }')"
            else
              got="$("$path" -dumpfullversion)"
            fi
            printf '%-15s: %s\n' "$path" "$got"
            if [ "$got" != "$version" ]; then
              echo "::error::$path reports '$got', not the $version this step just built and installed."
              rc=1
            fi
          done
          [ "$rc" -eq 0 ] || exit 1

          cat > "$probe/probe.cpp" <<'PROBE_EOF'
          #include <iostream>
          #include <optional>
          #include <string>
          int main() { std::optional<std::string> v{"ok"}; std::cout << *v << '\n'; return 0; }
          PROBE_EOF
          "/usr/bin/g++-$major" -std=c++17 -o "$probe/probe" "$probe/probe.cpp"
          out="$("$probe/probe")"
          libstdcxx="$(ldd "$probe/probe" | awk '$1 == "libstdc++.so.6" { print $3 }')"
          echo "C++17 probe    : printed '$out', libstdc++.so.6 => $libstdcxx"
          if [ "$out" != 'ok' ] || [ "$libstdcxx" != '/usr/lib64/libstdc++.so.6' ]; then
            echo "::error::a C++17 program built by g++-$major printed '$out' and loads libstdc++.so.6 from '${libstdcxx:-nothing}', not /usr/lib64/libstdc++.so.6. Binaries the pinned compiler links need its own libstdc++; check $conf and that ldconfig ran."
            exit 1
          fi

          rm -rf -- "$src" "$obj" "$stage" "$probe"
          echo "GCC $version installed under /usr; its build logs are kept in $work"

      # THE TOOLCHAIN GATE. IT RUNS BEFORE ANYTHING IS BUILT, AND IT FAILS THE JOB RATHER THAN
      # WARNING.
      #
      # WHAT WAS WRONG, in three parts, none of which a green tick distinguished from a correct
      # run. The apt list installed an unversioned compiler; no step exported CC or CXX, so
      # configure, automake and the hand-written RDK build each picked up whatever the image
      # defaulted to; and the hand build spelled `CXX="${CXX:-g++}"`, whose fallback is exactly
      # the ambient default this job must not depend on. There was no gcov selection at all and
      # no version assertion anywhere, so a compiler-sensitive coverage trace and its BRDA
      # coordinates could not be shown comparable to the recorded ones - the evidence read as
      # though it were, which is the defect.
      #
      # WHAT THIS STEP ESTABLISHES, in the order it establishes it:
      #
      #   1. The three tools EXIST at the versioned names, by absolute path. A missing one is
      #      named, with the step that installs it, rather than surfacing later as a compile
      #      error about something else.
      #   2. Each REPORTS the pinned major. `-dumpversion` is used rather than parsing
      #      `--version`, because it prints the version and nothing else; gcov has no
      #      -dumpversion, so its first line is parsed and the parse is shown in the log.
      #   3. The three AGREE WITH EACH OTHER. This is the check that matters most and the one a
      #      per-tool assertion misses: gcov refuses to read notes files written by a different
      #      GCC major, so a gcov that is individually "13" while the compiler is individually
      #      "13" but from a different family would still be wrong. Comparing them to the pin
      #      AND to each other is what closes that.
      #   4. gcov IS PUT FIRST ON PATH UNDER THE NAME `gcov`, through a one-entry shim directory
      #      containing a symlink to /usr/bin/gcov-13. That indirection is not decoration:
      #      run_coverage.sh resolves `gcov` from PATH with no override knob, so a shim is the
      #      only place the selection can be made. It is the same pattern the reference
      #      container uses (/opt/blitzy-shared/bin/gcov -> /usr/bin/gcov-13).
      #   5. Each EQUALS CEC_TOOLCHAIN_GCC_VERSION exactly - the release "Build the pinned GCC
      #      toolchain from source" built - and the measured versions are RECORDED in this
      #      step's log and in the job summary, so the figures this job publishes carry the
      #      toolchain that produced them.
      #
      # CC and CXX ARE EXPORTED THROUGH GITHUB_ENV, which is what makes them reach every later
      # step - ./configure, the three makes and the hand build - rather than only this one. The
      # shim goes on GITHUB_PATH for the same reason. Both take effect from the NEXT step onwards,
      # which is why the assertions here are made against absolute paths and why the step after
      # this one re-checks the resolution the later steps will actually see.
      - name: Select and prove the acceptance toolchain
        run: |
          set -euo pipefail

          # NO APOSTROPHE IN THIS MESSAGE, AND THAT IS A SHELL CONSTRAINT RATHER THAN A STYLE
          # CHOICE: bash treats a single quote inside ${var:?word} as opening a quoted string
          # even within double quotes, which swallows the rest of the script and surfaces as an
          # unrelated "unbound variable" line further down. Measured while writing this step.
          major="${CEC_TOOLCHAIN_GCC_MAJOR:?CEC_TOOLCHAIN_GCC_MAJOR is unset. It is the single place this workflow pins the acceptance compiler family; restore it in the env block of this workflow rather than spelling a version into a step.}"
          version="${CEC_TOOLCHAIN_GCC_VERSION:?CEC_TOOLCHAIN_GCC_VERSION is unset. It is the exact release this job builds and gates; restore it in the env block of this workflow beside CEC_TOOLCHAIN_GCC_MAJOR.}"
          cc="/usr/bin/gcc-$major"
          cxx="/usr/bin/g++-$major"
          gcov="/usr/bin/gcov-$major"

          for tool in "$cc" "$cxx" "$gcov"; do
            if [ ! -x "$tool" ]; then
              echo "::error::$tool is not present on this runner, so the pinned GCC $major acceptance toolchain cannot be selected and this job would silently build with the image default instead. It is installed by the 'Build the pinned GCC toolchain from source' step, which must run before this one and succeed; ubuntu-22.04's archive carries no gcc-$major family to fall back on."
              exit 1
            fi
          done

          # -dumpfullversion IS THE ONE TO READ, AND -dumpversion IS THE TRAP. Since GCC 7
          # -dumpversion prints the MAJOR ALONE ("13"), while -dumpfullversion prints the whole
          # thing ("13.4.0"); gcov has neither option and reports its full version as the last
          # field of its first line. Reading -dumpversion for the compilers and the full value
          # for gcov, then comparing them, fails on every correct toolchain - measured while
          # writing this step, which is why the fallback below is a fallback and not the primary.
          cc_version="$("$cc" -dumpfullversion 2>/dev/null || "$cc" -dumpversion)"
          cxx_version="$("$cxx" -dumpfullversion 2>/dev/null || "$cxx" -dumpversion)"
          gcov_line="$("$gcov" --version | head -n 1)"
          gcov_version="$(printf '%s\n' "$gcov_line" | awk '{ print $NF }')"

          printf 'CC        : %s  -dumpfullversion -> %s\n' "$cc" "$cc_version"
          printf 'CXX       : %s  -dumpfullversion -> %s\n' "$cxx" "$cxx_version"
          printf 'gcov      : %s  first line       -> %s\n' "$gcov" "$gcov_line"
          printf 'gcov      : parsed version       -> %s\n' "$gcov_version"
          printf 'pinned    : GCC %s exactly, major %s (see CEC_TOOLCHAIN_GCC_VERSION and CEC_TOOLCHAIN_GCC_MAJOR in the env block)\n' "$version" "$major"

          rc=0
          for pair in "CC:$cc_version" "CXX:$cxx_version" "gcov:$gcov_version"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            case "$value" in
              "$major"|"$major".*) : ;;
              *)
                echo "::error::$name reports version '$value', which is not the pinned GCC major $major. The coverage trace, the per-file line gate and the (file,line,block,branch) manifest the branch gate compares against are all properties of the compiler that produced them, so a different major invalidates the comparison rather than merely changing a number."
                rc=1
                ;;
            esac
          done

          # AGREEMENT ON THE WHOLE VERSION, not just on the major, and not just conformance to
          # the pin. Three tools that each satisfy the pin independently can still be three
          # different installations, and gcov's compatibility check is tighter than the major:
          # the notes-file version stamp it demands is derived from GCC major AND minor, so it
          # refuses a trace written by 13.2 when it is itself 13.3, one file at a time, reporting
          # "version 'B32*' prefer 'B33*'" and reading nothing. All three come out of the one GCC
          # build above, so equality here is achievable as well as necessary; if it ever fails,
          # one of the three came from somewhere else.
          if [ "$cc_version" != "$cxx_version" ] || [ "$cc_version" != "$gcov_version" ]; then
            echo "::error::the three tools do not agree: gcc $cc_version, g++ $cxx_version, gcov $gcov_version. gcov demands a notes-file version stamp derived from the GCC major and minor that wrote it, so a mismatch here yields either no counters or counters attributed to the wrong lines. All three must come from the one build of 'Build the pinned GCC toolchain from source'; find what else installed a $major-suffixed tool."
            rc=1
          fi

          # THE EXACT RELEASE, which a source build makes enforceable: the documented acceptance
          # patch level is gated, not only recorded.
          for pair in "CC:$cc_version" "CXX:$cxx_version" "gcov:$gcov_version"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if [ "$value" != "$version" ]; then
              echo "::error::$name reports version '$value', not the pinned CEC_TOOLCHAIN_GCC_VERSION $version. That is the release 'Build the pinned GCC toolchain from source' builds and the documented acceptance patch level; a different release is a different toolchain from the one the recorded figures came from."
              rc=1
            fi
          done
          [ "$rc" -eq 0 ] || exit "$rc"

          # THE SHIM. One directory, one entry, prepended to PATH - because run_coverage.sh and
          # lcov both invoke a bare `gcov`. RUNNER_TEMP rather than the checkout, so nothing
          # lands in the tree the close-out diff check inspects.
          shim="${RUNNER_TEMP:-/tmp}/cec-toolchain-shim"
          rm -rf -- "$shim"
          mkdir -p -- "$shim"
          ln -s -- "$gcov" "$shim/gcov"
          printf 'gcov shim : %s -> %s\n' "$shim/gcov" "$("$shim/gcov" --version | head -n 1)"

          {
            echo "CC=$cc"
            echo "CXX=$cxx"
            echo "CEC_TOOLCHAIN_GCOV=$gcov"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$shim" >> "$GITHUB_PATH"

          # RECORDED WITH THE RESULTS, which is the half of this step that outlives the run. A
          # figure without the toolchain that produced it is not evidence.
          {
            echo "### Acceptance toolchain (pinned to GCC $version exactly, major $major; gated)"
            echo
            echo "| Tool | Path | Version |"
            echo "| --- | --- | --- |"
            echo "| CC | \`$cc\` | $cc_version |"
            echo "| CXX | \`$cxx\` | $cxx_version |"
            echo "| gcov | \`$gcov\` (first on PATH as \`gcov\` via \`$shim\`) | $gcov_version |"
            echo
            echo "ubuntu-22.04's archive carries no gcc-$major family, so GCC $version is built on the runner from the GNU release tarball, verified against GCC's published SHA-512 before it is unpacked. The versions above are measured, and each must equal $version."
          } >> "$GITHUB_STEP_SUMMARY"

      # THE SECOND HALF OF THE GATE, AND IT IS NOT REDUNDANT WITH THE FIRST.
      #
      # GITHUB_ENV and GITHUB_PATH take effect from the step AFTER the one that writes them, so
      # the step above could only assert absolute paths. What every later step actually sees is a
      # RESOLVED name: `gcov` off PATH, `$CC`/`$CXX` out of the environment. This step is the one
      # place those resolutions are checked, which is what catches a later PATH prepend shadowing
      # the shim, or an env entry that did not survive.
      - name: Verify the pinned toolchain reaches every later step
        run: |
          set -euo pipefail
          major="${CEC_TOOLCHAIN_GCC_MAJOR:?}"
          rc=0

          if [ "${CC:-}" != "/usr/bin/gcc-$major" ]; then
            echo "::error::CC is '${CC:-<unset>}' in this step's environment, not the pinned /usr/bin/gcc-$major selected by 'Select and prove the acceptance toolchain'. The GITHUB_ENV export did not reach here, so every build below would use the image default."
            rc=1
          fi
          if [ "${CXX:-}" != "/usr/bin/g++-$major" ]; then
            echo "::error::CXX is '${CXX:-<unset>}' in this step's environment, not the pinned /usr/bin/g++-$major selected by 'Select and prove the acceptance toolchain'. The GITHUB_ENV export did not reach here, so every build below would use the image default."
            rc=1
          fi
          if [ "$rc" -eq 0 ]; then
            printf 'CC  : %s -> %s\n' "$CC" "$("$CC" -dumpfullversion)"
            printf 'CXX : %s -> %s\n' "$CXX" "$("$CXX" -dumpfullversion)"
          fi

          resolved_gcov="$(command -v gcov || true)"
          if [ -z "$resolved_gcov" ]; then
            echo "::error::no gcov resolves on PATH at all, so lcov and tests/L1Tests/run_coverage.sh - both of which invoke a bare gcov - have nothing to read counters with."
            rc=1
          else
            resolved_version="$(gcov --version | head -n 1 | awk '{ print $NF }')"
            printf 'gcov on PATH : %s -> %s\n' "$resolved_gcov" "$resolved_version"
            case "$resolved_version" in
              "$major"|"$major".*) : ;;
              *)
                echo "::error::the gcov that resolves on PATH is version $resolved_version, not the pinned major $major. Something prepended to PATH after the toolchain step and shadowed the shim; gcov cannot read a GCC $major build's notes files, so coverage would come back empty or wrong."
                rc=1
                ;;
            esac
          fi

          [ "$rc" -eq 0 ] || exit "$rc"
          echo "the pinned toolchain reaches this step by resolved name as well as by absolute path"

      # pkgconf PKGCONF_VERSION, BUILT FROM ITS DIGEST-VERIFIED RELEASE AND PROVED TO BE THE
      # pkg-config EVERY LATER STEP GETS.
      #
      # THE SAME FETCH CONTRACT AS THE CMAKES AND GCC: version-coupled guard first, non-empty
      # guard second, download to a file, measured-versus-committed SHA-256, and nothing is
      # unpacked from a tarball that fails.
      #
      # THE DISTRIBUTION'S SEARCH DEFAULTS, so configure still finds the archive's .pc files.
      # pkgconf derives its search path and its system directories from its prefix, so a
      # /usr/local build left to its defaults would search and filter only /usr/local. The values
      # passed are Debian's own, from debian/rules of pkgconf 1.8.1-2build1: the six-directory
      # pkg-config search path, the native multiarch entries of the system library directories
      # its debian/system-libdirs.sh derives, and /usr/include, the system include directory its
      # --prefix=/usr build defaults to. It is built static, so the one file installed is the
      # binary.
      #
      # THE INSTALL REPLACES NOTHING THE IMAGE OWNS: /usr/local/bin/pkgconf, and the pkg-config
      # -> pkgconf link Debian also ships, are refused if either already exists. It is reached
      # by PATH, which puts /usr/local/bin ahead of /usr/bin, and deliberately NOT exported as
      # PKG_CONFIG: a preset PKG_CONFIG makes configure skip its "checking for pkg-config" line,
      # and that line in "Build hdmicec" is the record of which pkg-config configure used.
      #
      # PROVED, THEN RECORDED. A bare `pkg-config` resolves to that link and reports exactly
      # PKGCONF_VERSION; its search path, and its --modversion, --cflags and --libs answers for
      # glib-2.0 and gtest - the two modules configure.ac's PKG_CHECK_MODULES calls probe -
      # equal those of jammy's /usr/bin/pkg-config, whitespace aside (pkgconf ends each answer
      # with a space).
      - name: Build and assert pkgconf
        run: |
          set -euo pipefail
          version="${PKGCONF_VERSION:?PKGCONF_VERSION is unset. Restore it in the env block of this job.}"

          if [ "$version" != "${PKGCONF_SHA256_FOR_VERSION:-}" ]; then
            echo "::error::PKGCONF_VERSION is '$version' but the committed PKGCONF_SHA256 was published for '${PKGCONF_SHA256_FOR_VERSION:-<unset>}'. A committed digest is valid for one release only. Take the new release tarball's published digest, update PKGCONF_SHA256 and PKGCONF_SHA256_FOR_VERSION together with the version, and do not verify one release's tarball against another's digest."
            exit 1
          fi
          [ -n "${PKGCONF_SHA256:-}" ] || { echo "::error::PKGCONF_SHA256 is empty, so the pkgconf source cannot be authenticated. This job does not build an unverified pkg-config: commit the digest published for pkgconf-$version.tar.xz."; exit 1; }

          work="$RUNNER_TEMP/cec-pkgconf-$version"
          tarball="$work/pkgconf-$version.tar.xz"
          src="$work/src"
          stage="$work/stage"
          rm -rf -- "$work"
          mkdir -p -- "$src" "$stage"
          curl -fsSL --retry 3 --output "$tarball" \
            "https://distfiles.ariadne.space/pkgconf/pkgconf-$version.tar.xz"

          measured="$(sha256sum "$tarball" | awk '{ print $1 }')"
          echo "pkgconf tarball: $tarball"
          echo "measured sha256: $measured"
          echo "committed      : $PKGCONF_SHA256  (pkgconf-$PKGCONF_SHA256_FOR_VERSION.tar.xz, as published in noble's main/source/Sources)"
          if [ "$measured" != "$PKGCONF_SHA256" ]; then
            echo "::error::pkgconf tarball digest mismatch. measured $measured, committed $PKGCONF_SHA256 (published for $PKGCONF_SHA256_FOR_VERSION). Either the download was tampered with or the release file was replaced; this job will not build an unverified pkg-config, and it will not be made to by relaxing this check or by editing the committed digest to match the download - confirm the publisher's value first."
            exit 1
          fi
          echo "verified against the committed publisher digest"
          tar -xJ --strip-components=1 -C "$src" -f "$tarball"
          rm -f -- "$tarball"

          multiarch="$(dpkg-architecture -qDEB_HOST_MULTIARCH 2>/dev/null || true)"
          if [ -z "$multiarch" ]; then
            echo "::error::dpkg-architecture reported no multiarch triplet, so the distribution's pkg-config search path cannot be spelled. build-essential, which 'Install packages' installs, brings dpkg-dev with it."
            exit 1
          fi
          search_path="/usr/local/lib/$multiarch/pkgconfig:/usr/local/lib/pkgconfig:/usr/local/share/pkgconfig:/usr/lib/$multiarch/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig"

          run_logged() {
            local what="$1" logfile="$2"
            shift 2
            if ! "$@" > "$logfile" 2>&1; then
              echo "::error::$what failed for pkgconf $version. The last 40 lines of $logfile follow."
              tail -n 40 -- "$logfile"
              exit 1
            fi
            echo "$what: done"
          }
          echo "build compiler : ${CC:-cc} ($("${CC:-cc}" -dumpfullversion))"
          cd "$src"
          run_logged configure "$work/configure.log" ./configure --prefix=/usr/local --disable-shared \
            --with-pkg-config-dir="$search_path" \
            --with-system-libdir="/lib/$multiarch:/lib:/usr/lib/$multiarch:/usr/lib" \
            --with-system-includedir=/usr/include
          run_logged make "$work/make.log" make -j"$(nproc)"
          run_logged "make install-strip" "$work/install.log" make install-strip DESTDIR="$stage"
          cd "$GITHUB_WORKSPACE"

          bindir=/usr/local/bin
          built="$stage$bindir/pkgconf"
          if [ ! -x "$built" ]; then
            echo "::error::the pkgconf $version build staged no executable at $built, so there is nothing to install."
            exit 1
          fi
          for target in "$bindir/pkgconf" "$bindir/pkg-config"; do
            if [ -e "$target" ] || [ -L "$target" ]; then
              echo "::error::$target already exists on this runner, so it was not installed. This step does not overwrite what the image or an earlier step put there; find which one did."
              exit 1
            fi
          done
          sudo install -m 0755 -- "$built" "$bindir/pkgconf"
          sudo ln -s pkgconf "$bindir/pkg-config"
          rm -rf -- "$src" "$stage"

          # Each answer is compared with its whitespace runs collapsed and its ends trimmed.
          norm() { printf '%s' "$1" | tr -s '[:space:]' ' ' | sed -e 's/^ //' -e 's/ $//'; }
          rc=0
          resolved="$(command -v pkg-config || true)"
          got="$("$bindir/pkg-config" --version)"
          printf 'pkg-config     : %s -> %s, version %s\n' "${resolved:-<none>}" "$(readlink -- "$bindir/pkg-config")" "$got"
          if [ "$resolved" != "$bindir/pkg-config" ]; then
            echo "::error::a bare pkg-config resolves to '${resolved:-nothing}', not the $bindir/pkg-config just installed. Something earlier on PATH shadows it."
            rc=1
          fi
          if [ "$got" != "$version" ]; then
            echo "::error::$bindir/pkg-config reports version '$got', not the pinned PKGCONF_VERSION $version."
            rc=1
          fi

          reference=/usr/bin/pkg-config
          if [ ! -x "$reference" ]; then
            echo "::error::$reference is absent, so the pinned build has nothing to be checked against. 'Install packages' installs it."
            exit 1
          fi
          reference_version="$("$reference" --version)"
          echo "reference      : $reference, version $reference_version"
          ours="$("$bindir/pkg-config" --variable=pc_path pkg-config)"
          theirs="$("$reference" --variable=pc_path pkg-config)"
          echo "search path    : $ours"
          if [ "$ours" != "$search_path" ] || [ "$ours" != "$theirs" ]; then
            echo "::error::the pinned pkg-config searches '$ours'; this step configured '$search_path' and $reference searches '$theirs'. All three must agree, or configure would resolve modules from different .pc files than the distribution's tool does."
            rc=1
          fi
          for module in glib-2.0 gtest; do
            for query in --modversion --cflags --libs; do
              if ! ours="$("$bindir/pkg-config" "$query" "$module" 2>&1)"; then
                echo "::error::pkg-config $query $module failed under pkgconf $version: $ours"
                rc=1
                continue
              fi
              if ! theirs="$("$reference" "$query" "$module" 2>&1)"; then
                echo "::error::$reference $query $module failed: $theirs"
                rc=1
                continue
              fi
              printf '%-9s %-13s: %s\n' "$module" "$query" "$(norm "$ours")"
              if [ "$(norm "$ours")" != "$(norm "$theirs")" ]; then
                echo "::error::pkg-config $query $module answers '$(norm "$ours")' under pkgconf $version but '$(norm "$theirs")' under $reference. configure would substitute different flags from the ones the distribution's tool gives."
                rc=1
              fi
            done
          done
          [ "$rc" -eq 0 ] || exit 1

          {
            echo "### pkg-config (pinned to pkgconf $version exactly; gated)"
            echo
            echo "| Tool | Path | Version |"
            echo "| --- | --- | --- |"
            echo "| pkg-config | \`$bindir/pkg-config\` -> \`pkgconf\` (first on PATH) | $got |"
            echo "| reference | \`$reference\` | $reference_version |"
            echo
            echo "Built from pkgconf-$version.tar.xz, verified against its published SHA-256 before it was unpacked. Its search path and its --modversion, --cflags and --libs answers for glib-2.0 and gtest equal the reference's."
          } >> "$GITHUB_STEP_SUMMARY"

      # lcov LCOV_VERSION, THE RELEASE ASSET, INSTALLED AND PROVED BEFORE ANYTHING IS CAPTURED.
      #
      # THE SAME FETCH CONTRACT AS THE STEPS ABOVE, over the same asset aidl-path-tests.yml's
      # "Build and assert lcov 2.x" installs. The install is staged with DESTDIR as the runner
      # account and copied under /usr/local only when no staged file already exists on the
      # runner, extracting with --keep-old-files as the GCC install does, so nothing the image
      # owns is replaced.
      #
      # PROVED, THEN RECORDED. lcov, geninfo and genhtml each resolve to the installed copy in
      # /usr/local/bin and report exactly "LCOV version <LCOV_VERSION>-1": the asset's .version
      # file stamps release 1, and 2.0-1 is the version the acceptance runs are recorded with.
      # Starting each tool is also what proves the Perl modules "Install packages" provides are
      # the ones it needs.
      - name: Install and assert lcov
        run: |
          set -euo pipefail
          version="${LCOV_VERSION:?LCOV_VERSION is unset. Restore it in the env block of this job.}"

          if [ "$version" != "${LCOV_SHA256_FOR_VERSION:-}" ]; then
            echo "::error::LCOV_VERSION is '$version' but the committed LCOV_SHA256 belongs to lcov '${LCOV_SHA256_FOR_VERSION:-<unset>}'. A committed digest is valid for one version only. Take the new release asset's published digest, update LCOV_SHA256 and LCOV_SHA256_FOR_VERSION together with the version, and do not verify one version's tarball against another's digest."
            exit 1
          fi
          [ -n "${LCOV_SHA256:-}" ] || { echo "::error::LCOV_SHA256 is empty, so the lcov tarball cannot be authenticated. This job does not install an unverified coverage tool: commit the digest published with the lcov v$version release."; exit 1; }

          work="$RUNNER_TEMP/cec-lcov-$version"
          tarball="$work/lcov-$version.tar.gz"
          src="$work/src"
          stage="$work/stage"
          rm -rf -- "$work"
          mkdir -p -- "$src" "$stage"
          curl -fsSL --retry 3 --output "$tarball" \
            "https://github.com/linux-test-project/lcov/releases/download/v$version/lcov-$version.tar.gz"

          measured="$(sha256sum "$tarball" | awk '{ print $1 }')"
          echo "lcov tarball   : $tarball"
          echo "measured sha256: $measured"
          echo "committed      : $LCOV_SHA256  (lcov v$LCOV_SHA256_FOR_VERSION release asset; corroborated by Gentoo's dev-build/lcov Manifest for the same bytes)"
          if [ "$measured" != "$LCOV_SHA256" ]; then
            echo "::error::lcov tarball digest mismatch. measured $measured, committed $LCOV_SHA256 (published for $LCOV_SHA256_FOR_VERSION). Either the release asset was replaced or the fetch was tampered with; this job will not install an unverified coverage tool, and it will not be made to by relaxing this check or by editing the committed digest to match the download - confirm the publisher's value first."
            exit 1
          fi
          echo "verified against the committed publisher digest"
          tar -xz --strip-components=1 -C "$src" -f "$tarball"
          rm -f -- "$tarball"

          if ! make -C "$src" install PREFIX=/usr/local DESTDIR="$stage" > "$work/install.log" 2>&1; then
            echo "::error::the staged install of lcov $version failed. The last 40 lines of $work/install.log follow."
            tail -n 40 -- "$work/install.log"
            exit 1
          fi
          chmod -R go-w -- "$stage"

          # EVERY COLLISION IS NAMED BEFORE ANYTHING IS WRITTEN, as for the GCC install.
          outside="$(cd "$stage" && find . -mindepth 1 -maxdepth 1 ! -name usr)"
          if [ -n "$outside" ]; then
            echo "::error::the lcov $version install staged paths outside usr/ ($outside), which a PREFIX=/usr/local install does not do; nothing was installed."
            exit 1
          fi
          collisions=0
          while IFS= read -r -d '' rel; do
            target="/${rel#./}"
            if [ -d "$stage/$rel" ] && [ ! -L "$stage/$rel" ]; then
              if [ -L "$target" ] || { [ -e "$target" ] && [ ! -d "$target" ]; }; then
                echo "::error::the lcov $version install would put a directory at $target, which already exists on this runner as something other than a directory."
                collisions=$((collisions + 1))
              fi
            elif [ -e "$target" ] || [ -L "$target" ]; then
              echo "::error::the lcov $version install would replace $target, which already exists on this runner. Nothing the image owns is overwritten; find which package or earlier step installed it."
              collisions=$((collisions + 1))
            fi
          done < <(cd "$stage" && find . -mindepth 1 -print0)
          if [ "$collisions" -ne 0 ]; then
            echo "::error::$collisions staged path(s) collide with what is already on this runner, so nothing was installed."
            exit 1
          fi
          echo "staged paths   : $(cd "$stage" && find . -mindepth 1 | wc -l), none already on the runner"
          tar -C "$stage" -cf - usr | sudo tar -C / -xf - --keep-old-files --no-same-owner
          rm -rf -- "$src" "$stage"

          expected="LCOV version $version-1"
          rc=0
          rows=''
          for tool in lcov geninfo genhtml; do
            resolved="$(command -v "$tool" || true)"
            if [ "$resolved" != "/usr/local/bin/$tool" ]; then
              echo "::error::$tool resolves to '${resolved:-nothing}', not the /usr/local/bin/$tool this step installed."
              rc=1
              continue
            fi
            if ! out="$("$resolved" --version 2>&1)"; then
              echo "::error::$resolved --version failed, so lcov $version cannot run here; its output follows. A missing Perl module is the usual cause."
              printf '%s\n' "$out"
              rc=1
              continue
            fi
            line="${out%%$'\n'*}"
            printf '%-15s: %s -> %s\n' "$tool" "$resolved" "$line"
            if [ "$line" != "$tool: $expected" ]; then
              echo "::error::$resolved reports '$line', not '$tool: $expected'."
              rc=1
            fi
            rows="$rows| $tool | \`$resolved\` | ${line#"$tool": } |"$'\n'
          done
          [ "$rc" -eq 0 ] || exit 1

          {
            echo "### lcov (pinned to the v$version release asset, reporting $version-1; gated)"
            echo
            echo "| Tool | Path | Version |"
            echo "| --- | --- | --- |"
            printf '%s' "$rows"
            echo
            echo "Installed from lcov-$version.tar.gz, verified against its published SHA-256 before it was unpacked."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout hdmicec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
        with:
          path: hdmicec
          # NO ACTIONS CREDENTIAL IS LEFT IN ANY CHECKOUT IN THIS JOB.
          #
          # actions/checkout defaults persist-credentials to TRUE, which writes an
          # http.<host>/.extraheader entry holding a base64 "x-access-token:<GITHUB_TOKEN>"
          # Authorization header into .git/config. That default is meant for a job that pushes;
          # this job only reads. Left in place, the token stays readable for the rest of the
          # job - and this job runs on pull_request, then hands the tree to autoreconf,
          # ./configure, three makes, a coverage run and two build scripts from another
          # repository, every one of which executes with that credential sitting in a file it
          # can read.
          #
          # Turning it off costs this job nothing: every checkout here is read-only and every
          # later step works on the files, never on the remote. The step "Verify no Actions
          # credential is persisted in any checkout" below asserts the RESULT rather than
          # trusting this input, so a future edit that drops this line fails there by name.
          persist-credentials: false

      - name: Checkout googletest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
        with:
          repository: google/googletest
          path: googletest
          # GOOGLETEST_REF rather than the literal, so this pin has one spelling in this file -
          # see the env block above for why it is a commit and not the v1.15.0 tag. The step
          # "Verify the pinned dependency checkouts" asserts the resulting HEAD against it.
          ref: ${{ env.GOOGLETEST_REF }}
          # Read-only, like every checkout in this job - and this one is a THIRD-PARTY tree that
          # is then configured and compiled, so there is no reading of it under which this
          # repository's token needs to be reachable. See the hdmicec checkout above.
          persist-credentials: false

      # rdk-halif-aidl supplies the com.rdk.hal.hdmicec AIDL/Binder HAL that libRCEC now
      # carries a second back-end for. It is a SIBLING SUBMODULE OF THE SUPERPROJECT, not
      # of hdmicec: hdmicec has no .gitmodules of its own, and "Checkout hdmicec" above
      # fetches no submodules, so nothing brings this tree in implicitly. It has to be
      # checked out explicitly, here.
      #
      # The ref is a COMMIT SHA on purpose, not a branch. It is the superproject gitlink
      # for rdk-halif-aidl - exactly the content this migration was developed and
      # validated against - so the generated stubs, the frozen common 0.2.0.0 import and
      # halcompat.h stay on the one combination that was tested together. A branch name
      # would not do that, and there is no single obvious branch to pick: the sources
      # disagree (.gitmodules says blitzy, the workspace README table says develop, a
      # fresh clone reports main), so any of them would make this job's result depend on
      # whichever moved last.
      #
      # No token is named here, and none is left behind either. The fetch uses the same default
      # job credentials the two steps above use, and persist-credentials: false stops that
      # credential from being written into .git/config once the fetch is done - the two are
      # separate things, and only the second was missing. A private-organisation checkout would
      # still need a token supplied by the platform owner, passed as a `token:` input rather
      # than persisted into the tree.
      - name: Checkout rdk-halif-aidl
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
        with:
          repository: Blitzy-Sky/rdk-halif-aidl
          path: rdk-halif-aidl
          ref: 3ff17d171a46805decc7408fa69f545c80226d4b
          # This tree is handed to build_binder.sh and build_modules.sh - scripts from ANOTHER
          # repository, which this job runs as itself. A persisted Authorization header in the
          # tree they execute inside is exactly the exposure this closes. See the hdmicec
          # checkout above.
          persist-credentials: false

      # THE SINK CALLER SOURCE, AND WHY IT IS A REQUIRED ACCEPTANCE INPUT RATHER THAN A NICETY.
      #
      # DriverAidlSessionTest.AddLogicalAddressFailuresReachBothRealSinkCallPathsAsExpected asserts
      # that a refused logical address and a transport failure each land in the arm the REAL Sink
      # plugin would catch them in. That assertion is made against a MODEL of two call sites in
      # HdmiCecSinkImplementation.cpp - the three-catch shape at :2789-2799 and the enable-time
      # call outside that try block - and a model nobody checks against its subject is not
      # evidence about a caller. DriverAidlLocalInstanceTest.TheModelledSinkCallPathsStillMatch
      # TheRealSinkSource is the check: it reads the plugin source and asserts the structural
      # facts the model depends on, so a drift in the plugin fails a test here instead of
      # silently invalidating the model.
      #
      # It needs the file. Absent it, that guard FAILS - deliberately, with "IT IS A REQUIRED
      # ACCEPTANCE INPUT, NOT AN OPTIONAL DIAGNOSTIC" - rather than skipping, because a skip
      # would be indistinguishable from a pass in an aggregate count. See the SINK_* block in
      # this job's env for the pinned repository and ref, and CEC_SINK_CALLER_SOURCE there for
      # the export the guard reads.
      #
      # The ref is a COMMIT - the superproject gitlink for entservices-hdmicecsink, and the same
      # commit the guard names as reviewed. Pinning it is the point: the guard is meant to fail
      # when somebody DELIBERATELY bumps the pin and a human is present to decide whether the
      # modelled call paths must be re-derived, and a branch name would instead make it fail
      # whenever the plugin moved for an unrelated reason - noise that trains people to ignore it.
      #
      # Only one file is read, but a sparse checkout is not used: the guard resolves the path
      # itself and reports every path it tried, so a partial tree buys nothing and costs the
      # ability to widen the guard later without touching this step. The path is the superproject
      # layout, so the guard's own relative candidate resolves even if the exported variable is
      # ever lost.
      - name: Checkout the Sink caller source for the L1 drift guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
        with:
          repository: ${{ env.SINK_REPOSITORY }}
          path: entservices-hdmicecsink
          ref: ${{ env.SINK_REF }}
          # Nothing in this job executes anything out of this tree - one .cpp file is read as
          # text - but the credential rule is the tree's, not the usage's: see the hdmicec
          # checkout above.
          persist-credentials: false

      # THE BINDER SDK SOURCE, OBTAINED BY THIS JOB AT AN IMMUTABLE COMMIT.
      #
      # It used to be cloned by build_binder.sh, which resolves it from mutable ref text and
      # fails open three ways - see the BINDER_SDK_* block in this job's env for the three and
      # for why none of them can be fixed in the script. Checking the tree out here, at a commit,
      # is what makes the resolution immutable; the assertions below and at the call site are
      # what make it provable.
      #
      # IT LANDS INSIDE THE rdk-halif-aidl CHECKOUT, at exactly the path both build scripts
      # already default to, so this step must come AFTER "Checkout rdk-halif-aidl" - a checkout
      # cleans its destination, and the reverse order would delete this tree.
      #
      # persist-credentials: false for the same reason as every other checkout in this job.
      - name: Checkout the Binder SDK source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
        with:
          repository: ${{ env.BINDER_SDK_REPOSITORY }}
          path: rdk-halif-aidl/build-tools/linux_binder_idl
          ref: ${{ env.BINDER_SDK_COMMIT }}
          persist-credentials: false

      # THE TWO PRODUCTION HEADER SOURCES FOR THE SHIPPING HAND BUILD, AT IMMUTABLE COMMITS.
      #
      # ccec/src/Makefile refuses mocks/ and stubs/ as its telemetry and legacy HAL header
      # roots, so "Build and verify the shipping hand-written RDK library" stages both roots
      # from these trees - see the TELEMETRY_* and LEGACY_HAL_* block in this job's env for the
      # pins. Nothing here is executed; three headers are copied out of them as text.
      # persist-credentials: false for the same reason as every other checkout in this job.
      - name: Checkout the telemetry headers for the hand-written build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
        with:
          repository: ${{ env.TELEMETRY_REPOSITORY }}
          path: telemetry
          ref: ${{ env.TELEMETRY_COMMIT }}
          persist-credentials: false

      - name: Checkout the legacy HDMI CEC HAL header for the hand-written build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
        with:
          repository: ${{ env.LEGACY_HAL_REPOSITORY }}
          path: rdk-halif-hdmi_cec
          ref: ${{ env.LEGACY_HAL_COMMIT }}
          persist-credentials: false

      # CREDENTIAL ABSENCE IS ASSERTED, NOT ASSUMED FROM AN INPUT.
      #
      # persist-credentials: false is set on every checkout above, and this step proves the
      # result rather than trusting the input. It matters in this job because it runs on
      # pull_request and then executes a great deal of code over those trees - autoreconf,
      # ./configure, three makes, valgrind, a coverage run, and two build scripts that come from
      # another repository - all with the job's own filesystem access. A token left in
      # .git/config is readable by every one of them.
      #
      # WHAT IS CHECKED, AND WHY EACH.
      #   http.<host>/.extraheader   the exact mechanism persist-credentials uses: a base64
      #                              "x-access-token:<GITHUB_TOKEN>" Authorization header.
      #   credential.helper          a helper configured in the checkout would fetch a token
      #                              on demand later, which is the same exposure deferred.
      #   url.*.insteadof            a rewrite can carry userinfo (https://user:token@host)
      #                              in the URL itself.
      #   .git-credentials, .netrc   file-based credential stores, wherever they landed.
      #
      # The check reads git's own configuration rather than grepping the file, so an entry
      # written in any of git's spellings is still found; the two credential FILES are checked
      # by existence. NO VALUE IS EVER PRINTED - only the KEY that carries it - because a
      # message that quoted the value would put the token in the log it is reporting.
      #
      # This step is aidl-path-tests.yml's, over this job's tree list. The two jobs must not
      # diverge on credential custody; move them together.
      - name: Verify no Actions credential is persisted in any checkout
        run: |
          set -euo pipefail
          rc=0
          for tree in hdmicec googletest rdk-halif-aidl rdk-halif-aidl/build-tools/linux_binder_idl \
                      entservices-hdmicecsink telemetry rdk-halif-hdmi_cec; do
            dir="$GITHUB_WORKSPACE/$tree"
            [ -d "$dir/.git" ] || { echo "::error::$tree is not a git checkout at $dir, so this job's later steps cannot rely on it."; rc=1; continue; }
            keys="$(git -C "$dir" config --local --name-only --list 2>/dev/null || true)"
            offenders="$(printf '%s\n' "$keys" | grep -Ei 'extraheader|credential\.|insteadof' || true)"
            if [ -n "$offenders" ]; then
              # KEYS ONLY - and even the key is redacted where it can carry a credential
              # ITSELF: a url.<base>.insteadOf entry embeds its base in the key name, and that
              # base may carry userinfo (https://user:token@host). Printing the raw key would
              # then print the token in the very message that reports it, so any //userinfo@ is
              # replaced before anything reaches the log. Which entry it is stays legible.
              echo "::error::$tree retains credential-bearing git configuration. Offending KEYS (values deliberately not printed):"
              printf '%s\n' "$offenders" | sed -E 's#//[^/@[:space:]]*@#//<redacted>@#g' | sed 's/^/  /'
              echo "  Set persist-credentials: false on that checkout. Everything this job builds and runs afterwards can read that file."
              rc=1
            fi
            for store in .git-credentials .netrc; do
              if [ -e "$dir/$store" ]; then
                echo "::error::$tree contains $store, a file-based credential store. It must not exist in a checkout this job builds from."
                rc=1
              fi
            done
          done
          [ "$rc" -eq 0 ] || exit 1
          echo "no persisted Actions credential, credential helper, URL rewrite or credential store in any of the checkouts"

      # THE PINS ARE ASSERTED AGAINST WHAT WAS ACTUALLY CHECKED OUT, NOT TRUSTED FROM AN INPUT.
      #
      # A `ref:` input states an intention. This step establishes the result, and the two are
      # not the same thing: a ref can resolve to something other than what the pin names -
      # through a repointed tag, a cached tree on a self-hosted runner, or an edit that put a
      # mutable ref back - and every one of those changes code this job COMPILES AND EXECUTES.
      # So the commit is read back out of each tree with `git rev-parse HEAD` and compared
      # against the value committed in this file, before anything is built from it.
      #
      # A PIN THAT IS NOT A FULL COMMIT IS REFUSED BEFORE ANY COMPARISON. A tag or a short SHA
      # could never equal rev-parse output, so comparing it would fail with a message about the
      # TREE when the defect is in the PIN; naming it directly is also what stops a future edit
      # from quietly reintroducing a mutable ref.
      #
      # THE RESOLVED COMMITS ARE RECORDED, not just checked. The record file is uploaded with
      # this job's artifacts, so what was built is answerable after the fact from the run itself
      # rather than from an assumption about what the pin said that day.
      #
      # The rdk-halif-aidl checkout above is pinned to a commit as well, and the content it must
      # supply is asserted by "Verify rdk-halif-aidl source include roots" below. What this step
      # exists for is the pins that used to be MUTABLE, which is where the exposure was.
      #
      # aidl-path-tests.yml carries this step in the same shape over its own tree list; move
      # them together.
      - name: Verify the pinned dependency checkouts
        run: |
          set -euo pipefail
          rc=0
          record="$GITHUB_WORKSPACE/tools/supply-chain-pins.txt"
          mkdir -p "$(dirname "$record")"
          {
            echo "# Resolved supply-chain pins for this run of .github/workflows/L1-tests.yml"
            echo "# what                     resolved commit or declared value          where"
          } > "$record"

          is_commit() { printf '%s' "$1" | grep -Eq '^[0-9a-f]{40}$'; }

          assert_pinned_head() {
            local tree="$1" expected="$2" what="$3"
            local dir="$GITHUB_WORKSPACE/$tree" head=''
            if ! is_commit "$expected"; then
              echo "::error::the pin for $what is '$expected', which is not a 40-character commit SHA. $what is compiled and executed by this job, so it is pinned to an immutable commit and never to a tag or a branch: a tag is a pointer its publisher can move. Read the intended tag's commit with 'git ls-remote --tags <url> <tag>' and commit that value, keeping the tag as the comment beside it."
              rc=1
              return 0
            fi
            if [ ! -d "$dir/.git" ]; then
              echo "::error::$tree is not a git checkout at $dir, so the commit $what was taken from cannot be established. Nothing may be built from a tree whose provenance cannot be read."
              rc=1
              return 0
            fi
            head="$(git -C "$dir" rev-parse HEAD 2>/dev/null || true)"
            if [ "$head" != "$expected" ]; then
              echo "::error::$what at $dir is checked out at '${head:-<unreadable>}' but this job pins $expected. Do not adjust the pin to match the tree - establish which commit is intended, from the publisher, and correct whichever of the two is wrong."
              rc=1
              return 0
            fi
            printf '%-24s %s  %s\n' "$what" "$head" "$tree" | tee -a "$record"
          }

          assert_pinned_head googletest "${GOOGLETEST_REF:-}" "GoogleTest"
          assert_pinned_head rdk-halif-aidl/build-tools/linux_binder_idl "${BINDER_SDK_COMMIT:-}" "Binder SDK source"
          assert_pinned_head entservices-hdmicecsink "${SINK_REF:-}" "Sink caller source (read by the L1 drift guard)"
          assert_pinned_head telemetry "${TELEMETRY_COMMIT:-}" "Telemetry header source"
          assert_pinned_head rdk-halif-hdmi_cec "${LEGACY_HAL_COMMIT:-}" "Legacy HAL header source"

          # THE TWO NAMES FOR THE SAME PIN MUST AGREE. SINK_REF is what the checkout resolves and
          # what the assertion above reads; SINK_CALLER_COMMIT is the same commit recorded beside
          # the guard's rationale. Asserting the tree twice would say nothing new, but letting the
          # two names drift would leave a reviewer reading a pin the job does not use.
          if [ "${SINK_CALLER_COMMIT:-}" != "${SINK_REF:-}" ]; then
            echo "::error::SINK_CALLER_COMMIT is '${SINK_CALLER_COMMIT:-<unset>}' and SINK_REF is '${SINK_REF:-<unset>}'. They name the same reviewed commit of entservices-hdmicecsink and must be moved together; aidl-path-tests.yml carries both under the same names."
            rc=1
          fi

          # THE SINK CALLER SOURCE MUST BE READABLE BEFORE ANY TEST RUNS, not discovered missing
          # by the guard that needs it. Both are checks worth having and they are not the same
          # check: this one establishes the ENVIRONMENT is wired, the guard establishes the
          # plugin has not DRIFTED. Failing here names the wiring; failing there names the drift.
          #
          # The guard's own set-but-unreadable arm exists for the case this step cannot cover -
          # something changing the file between here and the test - and says so in terms.
          if [ ! -r "${CEC_SINK_CALLER_SOURCE:-}" ]; then
            echo "::error::CEC_SINK_CALLER_SOURCE is '${CEC_SINK_CALLER_SOURCE:-<unset>}', which is not a readable file. It is a REQUIRED acceptance input, not an optional diagnostic: DriverAidlLocalInstanceTest.TheModelledSinkCallPathsStillMatchTheRealSinkSource reads it to prove the modelled Sink call paths still match the real plugin, and DriverAidlSessionTest.AddLogicalAddressFailuresReachBothRealSinkCallPathsAsExpected asserts against that model. Without the file the model is unchecked and the second case is not evidence about a caller. The 'Checkout the Sink caller source for the L1 drift guard' step produces it; if that step was skipped, removed or repointed, restore it rather than relaxing this check."
            rc=1
          else
            printf '%-24s %s  %s\n' "Sink caller source" "$(git -C "$GITHUB_WORKSPACE/entservices-hdmicecsink" rev-parse HEAD 2>/dev/null || echo '<unreadable>')" "entservices-hdmicecsink/plugin/HdmiCecSinkImplementation.cpp" | tee -a "$record"
          fi

          # binder_sdk.version IS A GATE HERE, NOT A FALLBACK. build_binder.sh reads the same
          # file and degrades to a hardcoded 2.0.0 when it cannot; this job refuses to build at
          # all unless the file exists, is readable, carries a non-comment value, and that value
          # is the tag whose commit is pinned in this job's env. So a pin bumped in
          # rdk-halif-aidl without the commit here moving with it stops as a named failure,
          # instead of building one revision while this file claims another.
          pin_file="$GITHUB_WORKSPACE/rdk-halif-aidl/binder_sdk.version"
          if [ ! -r "$pin_file" ]; then
            echo "::error::$pin_file is missing or unreadable, so the Binder SDK revision this rdk-halif-aidl snapshot declares cannot be read. build_binder.sh would fall back to its hardcoded 2.0.0 default at this point; this job will not build an SDK whose declared revision it cannot establish."
            rc=1
          else
            # The same expression the script uses to read this file - first non-comment,
            # non-blank line, whitespace stripped - so the value compared here is the value the
            # script would have resolved.
            declared="$(grep -vE '^[[:space:]]*(#|$)' "$pin_file" | head -n 1 | tr -d '[:space:]' || true)"
            if [ -z "$declared" ]; then
              echo "::error::$pin_file carries no non-comment value, so it declares no Binder SDK revision at all. This is precisely the case build_binder.sh turns into a silent 2.0.0; commit the intended tag on its own line."
              rc=1
            elif [ "$declared" != "${BINDER_SDK_TAG:-}" ]; then
              echo "::error::$pin_file declares '$declared' but this job pins the Binder SDK at tag '${BINDER_SDK_TAG:-<unset>}', whose commit ${BINDER_SDK_COMMIT:-<unset>} is committed in this file. The two must agree or the job would build one revision while claiming another. To move the pin: read the new tag's commit with 'git rev-parse refs/tags/<tag>^{}' against the publisher (2.6.0 is an ANNOTATED tag, so the ^{} matters), then move BINDER_SDK_TAG and BINDER_SDK_COMMIT together in one edit."
              rc=1
            else
              printf '%-24s %s  %s\n' "Binder SDK tag" "$declared" "rdk-halif-aidl/binder_sdk.version" | tee -a "$record"
            fi
          fi

          [ "$rc" -eq 0 ] || exit 1
          echo "every pinned dependency checkout is at its committed commit and the declared Binder SDK tag agrees with it; the record above is at $record and is uploaded with this job's artifacts"

      # THE SPARSE-CHECKOUT HAZARD, caught here instead of 150 lines further down.
      #
      # rdk-halif-aidl is documented as sparse-checked-out to hdmicec/ only. Two of the
      # four include roots the AIDL back-end compiles against live OUTSIDE that path,
      # under common/: the frozen common 0.2.0.0 import, and common/current - which is
      # the only place halcompat.h exists anywhere in the tree. actions/checkout is full
      # by default and the step above deliberately does not use its sparse-checkout:
      # input, so all four roots should be present. This step proves that rather than
      # assuming it.
      #
      # Without it the failure surfaces much later as "halcompat.h: No such file or
      # directory" from inside a configure probe or a DriverAidlImpl.cpp compilation - a
      # symptom that reads like a broken build rather than an incomplete checkout. Three
      # cheap tests turn it into one named line. Every missing root is reported before
      # the step exits, so one run names them all.
      # THE SINK CALLER SOURCE IS RESOLVED, PROVEN READABLE AND EXPORTED HERE, BEFORE ANY TEST
      # STEP RUNS.
      #
      # The drift guard distinguishes "the variable is set and the file is not there" -- which it
      # reports as a WIRING FAULT -- from "nothing pointed at the source at all". Exporting a path
      # this job has not opened would manufacture the first out of a checkout that quietly
      # produced a different layout, and point a human at a fault that does not exist. So the
      # file is opened here and CEC_SINK_CALLER_SOURCE is exported only afterwards. Every step
      # that runs the L1 binary inherits it from the job environment.
      - name: Verify the Sink caller source and export it
        run: |
          set -euo pipefail
          sink_source="$GITHUB_WORKSPACE/entservices-hdmicecsink/plugin/HdmiCecSinkImplementation.cpp"
          if [ -L "$sink_source" ]; then
            echo "::error::$sink_source is a symbolic link rather than the checked-out source. Refused rather than followed."
            exit 1
          fi
          if [ ! -f "$sink_source" ] || [ ! -r "$sink_source" ]; then
            echo "::error::the Sink plugin source is not readable at $sink_source, so tests/L1Tests' drift guard for the modelled Sink call paths cannot run and the L1 steps below cannot pass. The 'Checkout the Sink caller source for the L1 drift guard' step above is what puts it there; check that it ran and that SINK_REPOSITORY and SINK_REF name a reachable revision."
            exit 1
          fi
          bytes="$(wc -c < "$sink_source")"
          if [ "$bytes" -le 0 ]; then
            echo "::error::$sink_source is empty, so the drift guard would read nothing out of it."
            exit 1
          fi
          echo "Sink caller source : $sink_source ($bytes bytes)"
          echo "  read by tests/L1Tests/ccec/test_DriverAidl.cpp's drift guard, at SINK_REF=$SINK_REF"
          echo "CEC_SINK_CALLER_SOURCE=$sink_source" >> "$GITHUB_ENV"


      - name: Verify rdk-halif-aidl source include roots
        run: |
          set -euo pipefail
          aidl="$GITHUB_WORKSPACE/rdk-halif-aidl"
          rc=0
          if [ ! -f "$aidl/common/current/halcompat.h" ]; then
            echo "::error::halcompat.h not found at $aidl/common/current/halcompat.h - it is the only source of the AIDL service-lookup and version-compatibility helpers, and it sits outside the hdmicec/-only sparse checkout. Materialise common/ (git sparse-checkout add common) or take a full checkout."
            rc=1
          fi
          if [ ! -d "$aidl/common/0.2.0.0/include" ]; then
            echo "::error::the frozen common 0.2.0.0 include root not found at $aidl/common/0.2.0.0/include - this is the ABI the hdmicec 0.1.0.0 snapshot was generated against, and it also sits outside the hdmicec/-only sparse checkout."
            rc=1
          fi
          if [ ! -d "$aidl/hdmicec/0.1.0.0/include" ]; then
            echo "::error::the generated AIDL stub include root not found at $aidl/hdmicec/0.1.0.0/include - the com/rdk/hal/hdmicec client stubs and Bn* server bases are compiled from it."
            rc=1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "rdk-halif-aidl checkout is incomplete; see the errors above." >&2
            exit 1
          fi
          echo "rdk-halif-aidl source include roots present at $aidl"

      - name: Build googletest
        run: >
          cmake -G Ninja
          -S "$GITHUB_WORKSPACE/googletest"
          -B build/googletest
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DBUILD_TYPE=Debug
          -DBUILD_GMOCK=ON
          -DBUILD_SHARED_LIBS=OFF
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          &&
          cmake --build build/googletest -j8
          &&
          cmake --install build/googletest

      # TWO CMAKE INSTALLATIONS, AND WHY BOTH HAVE TO STAY.
      #
      # The exact release "Set up CMake" above fetched and digest-verified - CMAKE_PINNED_VERSION
      # - must remain what a bare `cmake` resolves to for the rest of this job: 3.20 and later
      # break the plugin test-library configure, which is the whole reason it is pinned. The
      # Binder SDK needs a newer one: linux_binder_idl 2.6.0's BUILD.md names CMake 3.22.1, and
      # CMAKE_SDK_VERSION pins exactly that release.
      #
      # Reaching the newer one by absolute path is NOT possible here. build_binder.sh
      # invokes a bare `cmake` at four sites and build_modules.sh at five, and neither
      # script offers an override - no CMAKE_BIN, no CMAKE_COMMAND, no `command -v cmake`
      # indirection. The newer one is therefore reached by a PATH PREPEND SCOPED TO THE TWO
      # STEPS THAT NEED IT, and the job-wide PATH is never touched. Where this workflow
      # calls cmake itself, as the googletest build above does, the pinned one is used and
      # no prepend appears. Please do not "simplify" this into a single CMake.
      #
      # THE SDK'S CMAKE IS ALWAYS THE PINNED RELEASE, FETCHED HERE, AND NEVER AN INSTALLED ONE.
      # This step used to take the first of /usr/bin/cmake and /usr/local/bin/cmake that was at
      # least 3.22.1 and fetch 3.22.1 only when neither qualified, so the SDK was built by
      # whatever the runner image and its archive carried, and that changed with them. Both
      # exist on this runner - apt's cmake, which "Install packages" installs, and the image's
      # own /usr/local/bin/cmake - and neither is consulted. CMAKE_SDK_VERSION is fetched into
      # a private prefix under the workspace on every run, downloaded to a file, held to the
      # publisher digest committed in this job's env block and unpacked only after it matches,
      # exactly as "Set up CMake" does for the job-wide one. Then the extracted binary must
      # report exactly that version, and a bare `cmake` under the very prepend the two SDK
      # steps apply must resolve to it.
      - name: Resolve the CMake installations
        run: |
          set -euo pipefail

          cmake_version_of() {
            "$1" --version 2>/dev/null | head -n 1 | awk '{ print $3 }'
          }

          pinned_cmake="$(command -v cmake)"
          pinned_version="$(cmake_version_of "$pinned_cmake")"
          echo "job-wide cmake : $pinned_cmake ($pinned_version)"
          # EXACT EQUALITY, against the one place the pin is spelled. It used to be a '3.16.*'
          # glob written out here a second time, which accepted any patch release in the series
          # and let this assertion disagree with the pin it was meant to enforce. The value is
          # read from CMAKE_PINNED_VERSION - the same value "Set up CMake" downloaded and
          # digest-verified - so there is one spelling of the pin in this file and this step
          # measures the toolchain against it rather than against a copy of it.
          if [ "$pinned_version" != "$CMAKE_PINNED_VERSION" ]; then
            echo "::error::the job-wide cmake is $pinned_version, but this project pins CMAKE_PINNED_VERSION=$CMAKE_PINNED_VERSION and the rest of this job depends on exactly that release - 3.20 and later break the plugin test-library configure. Either 'Set up CMake' did not put its verified prefix on PATH, or something later prepended a different cmake."
            exit 1
          fi

          # THE VERSION GUARD COMES FIRST, BEFORE ANYTHING IS DOWNLOADED. CMAKE_SDK_SHA256 was
          # published for exactly one release, and checking it against a different tarball is
          # worse than not checking at all: it would fail as a digest mismatch and read as
          # tampering rather than as a version that moved without its digest.
          #
          # Both values are read through ":-" deliberately, even under `set -u`: a removed env
          # entry then fails at the guard that names it and says what to commit, rather than at
          # an "unbound variable" line that says neither.
          if [ "${CMAKE_SDK_VERSION:-}" != "${CMAKE_SDK_SHA256_FOR_VERSION:-}" ]; then
            echo "::error::CMAKE_SDK_VERSION is '${CMAKE_SDK_VERSION:-<unset>}' but the committed CMAKE_SDK_SHA256 was published by Kitware for '${CMAKE_SDK_SHA256_FOR_VERSION:-<unset>}'. A committed digest is valid for one version only. Read the new release's own cmake-<version>-SHA-256.txt manifest, update CMAKE_SDK_SHA256 and CMAKE_SDK_SHA256_FOR_VERSION together with the version, and do not verify one version's tarball against another's digest."
            exit 1
          fi
          [ -n "${CMAKE_SDK_SHA256:-}" ] || { echo "::error::CMAKE_SDK_SHA256 is empty, so this tarball cannot be authenticated. This job does not extract an unverified CMake: commit the digest from Kitware's cmake-$CMAKE_SDK_VERSION-SHA-256.txt release manifest."; exit 1; }

          private_prefix="$GITHUB_WORKSPACE/tools/cmake-$CMAKE_SDK_VERSION"
          mkdir -p "$private_prefix"

          # DOWNLOADED TO A FILE AND VERIFIED BEFORE IT IS EXTRACTED. A download piped straight
          # into tar cannot be verified at all: by the time the last byte has been hashed the
          # archive has already been unpacked, so there is nothing left to refuse. The file
          # lands beside the private prefix, is compared against the committed publisher
          # digest, and only then is unpacked into it.
          tarball="$GITHUB_WORKSPACE/tools/cmake-$CMAKE_SDK_VERSION-linux-x86_64.tar.gz"
          curl -fsSL --output "$tarball" \
            "https://github.com/Kitware/CMake/releases/download/v$CMAKE_SDK_VERSION/cmake-$CMAKE_SDK_VERSION-linux-x86_64.tar.gz"

          measured="$(sha256sum "$tarball" | awk '{ print $1 }')"
          echo "cmake tarball  : $tarball"
          echo "measured sha256: $measured"
          echo "committed      : $CMAKE_SDK_SHA256  (Kitware cmake-$CMAKE_SDK_SHA256_FOR_VERSION-SHA-256.txt)"
          if [ "$measured" != "$CMAKE_SDK_SHA256" ]; then
            echo "::error::CMake tarball digest mismatch. measured $measured, committed $CMAKE_SDK_SHA256 (published by Kitware for $CMAKE_SDK_SHA256_FOR_VERSION). Either the download was tampered with or the release asset was replaced; this job will not extract an unverified CMake, and it will not be made to by relaxing this check or by editing the committed digest to match the download - confirm the publisher's value first."
            exit 1
          fi
          echo "verified against the committed publisher digest"

          tar -xz --strip-components=1 -C "$private_prefix" -f "$tarball"
          sdk_cmake="$private_prefix/bin/cmake"
          sdk_version="$(cmake_version_of "$sdk_cmake" || true)"
          if [ "$sdk_version" != "$CMAKE_SDK_VERSION" ]; then
            echo "::error::the extracted cmake reports '$sdk_version', not the pinned $CMAKE_SDK_VERSION. The archive that matched the committed digest does not contain the release it is named for; do not proceed on it."
            exit 1
          fi

          # WHAT THE SDK STEPS WILL ACTUALLY RUN, resolved the way they resolve it: a bare
          # `cmake` under PATH="$AIDL_CMAKE_BIN_DIR:$PATH". Asserting the binary alone would not
          # catch a prefix that fails to shadow the installed cmakes.
          resolved="$(PATH="$private_prefix/bin:$PATH"; command -v cmake || true)"
          resolved_version="$(cmake_version_of "$resolved" || true)"
          if [ "$resolved" != "$sdk_cmake" ] || [ "$resolved_version" != "$CMAKE_SDK_VERSION" ]; then
            echo "::error::with $private_prefix/bin prepended, a bare cmake resolves to '$resolved' ($resolved_version), not the verified $sdk_cmake ($CMAKE_SDK_VERSION). build_binder.sh and build_modules.sh would then build the SDK with an unpinned CMake."
            exit 1
          fi

          echo "Binder SDK cmake: $sdk_cmake ($sdk_version, digest-verified), used only through a step-scoped PATH prepend"
          echo "AIDL_CMAKE_BIN_DIR=$private_prefix/bin" >> "$GITHUB_ENV"

      # THE BINDER SDK, BUILT FROM THE TREE THIS JOB VERIFIED RATHER THAN ONE THE SCRIPT
      # RESOLVES.
      #
      # BINDER_VERSION AND BINDER_SOURCE_DIR ARE BOTH SET, DELIBERATELY. An earlier revision of
      # this step left BINDER_VERSION unset and said that was deliberate, because build_binder.sh
      # reads the committed pin out of binder_sdk.version. That reasoning was wrong in the
      # direction that matters: the script reads the pin and then fails OPEN three ways - a
      # hardcoded 2.0.0 when the pin file cannot be read, success-with-a-warning when the source
      # directory already exists at another ref, and "using default branch" when the checkout of
      # the requested ref fails. The BINDER_SDK_* block in this job's env sets all three out.
      #
      # So the tree is the one "Checkout the Binder SDK source" produced and "Verify the pinned
      # dependency checkouts" asserted, named here through the script's own BINDER_SOURCE_DIR
      # hook, and BINDER_VERSION is the immutable COMMIT rather than a tag - which also makes
      # the script's clone path correct if the tree were ever absent, instead of leaving it on a
      # branch. The script prints an advisory line comparing BINDER_VERSION against the tree's
      # ABBREVIATED sha and will say they differ; that comparison is its own, it is not a
      # failure, and the assertions in this step are what actually govern.
      #
      # THE HEAD IS ASSERTED TWICE, AND THE SECOND TIME IS THE POINT. Before the build, so
      # nothing is compiled from an unexpected tree; and AGAIN after the script returns and
      # BEFORE the marker check and everything staged out of it, because the script's
      # existing-tree arm only warns and its clone arm can silently land on a default branch -
      # so "what was there when the step started" does not by itself establish "what was built".
      #
      # Staging goes to the script's own defaults, which the job-level environment above
      # names explicitly: the runtime under out/target and the headers under out/build.
      # .sdk_ready is the script's completion marker, so asserting it catches a
      # half-finished SDK; because the script short-circuits on the marker, the step is
      # idempotent and safe to re-run. IT IS NECESSARY AND NOT SUFFICIENT: the marker says a
      # build finished, and says nothing at all about WHICH SOURCE it was built from. That is
      # what the two HEAD assertions are for, and neither replaces the other.
      - name: Build the Binder SDK
        run: |
          set -euo pipefail
          src="$BINDER_SDK_SOURCE_DIR"

          assert_source_head() {
            local when="$1" head=''
            head="$(git -C "$src" rev-parse HEAD 2>/dev/null || true)"
            if [ "$head" != "$BINDER_SDK_COMMIT" ]; then
              echo "::error::the Binder SDK source at $src is at '${head:-<not a readable git checkout>}' $when, but this job pins $BINDER_SDK_COMMIT (tag $BINDER_SDK_TAG). Nothing may be built from or staged out of a Binder source tree that is not the pinned commit."
              exit 1
            fi
            echo "  ok  Binder SDK source at $src is $head $when"
          }

          assert_source_head "before the build"

          cd "$GITHUB_WORKSPACE/rdk-halif-aidl"
          BINDER_SOURCE_DIR="$src" BINDER_VERSION="$BINDER_SDK_COMMIT" \
            PATH="$AIDL_CMAKE_BIN_DIR:$PATH" ./build_binder.sh

          assert_source_head "after build_binder.sh returned"

          if [ ! -f "$BINDER_SDK_DIR/.sdk_ready" ]; then
            echo "::error::build_binder.sh returned success but left no $BINDER_SDK_DIR/.sdk_ready marker, so the Binder SDK is incomplete."
            exit 1
          fi
          echo "Binder SDK staged at $BINDER_SDK_DIR (.sdk_ready present) from $src at $BINDER_SDK_COMMIT"

      # THE TWO AIDL CLIENT STUB SNAPSHOTS.
      #
      # common is built FIRST because build_modules.sh pre-checks that each dependency's
      # shared object already exists before it configures a snapshot, and hdmicec 0.1.0.0
      # depends on common. Reversing these two fails on a missing dependency, not on a
      # link error.
      #
      # common is pinned at 0.2.0.0 AND MUST STAY THERE. It is deliberately not the newest
      # common release: 0.2.0.0 is the ABI the released hdmicec 0.1.0.0 snapshot was
      # generated and pinned against - that snapshot's own CMakeLists links
      # common-v0.2.0.0-cpp and includes common/0.2.0.0/include - so building or linking a
      # newer common would put a different ABI underneath pre-generated code compiled
      # against the older headers. This is precisely the line a later reader will want to
      # bump; bumping it alone is what breaks.
      #
      # No AIDL compiler is involved. Both snapshots ship committed pre-generated C++ and
      # these are compile-only builds.
      - name: Build the AIDL client stub snapshots
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/rdk-halif-aidl"
          PATH="$AIDL_CMAKE_BIN_DIR:$PATH" ./build_modules.sh common --version 0.2.0.0
          PATH="$AIDL_CMAKE_BIN_DIR:$PATH" ./build_modules.sh hdmicec --version 0.1.0.0
          ls -l "$HALIF_LIB_DIR"

      # EVERY -I AND -L THE NEXT STEP DEPENDS ON, ASSERTED BEFORE IT IS USED.
      #
      # configure.ac derives all six from the two staging prefixes and, for four of them,
      # falls back to "relying on the ambient CPPFLAGS/LDFLAGS" when a path does not
      # resolve. That fallback is right for a sysroot build and wrong to depend on here: a
      # staging layout that has moved would otherwise produce a configure that quietly
      # omits a root, and the first visible symptom would be a compile error deep inside
      # DriverAidlImpl.cpp or a library that silently carries only one back-end.
      #
      # The two stub libraries are checked BY NAME rather than by directory, because the
      # name is the only thing that distinguishes the pinned common 0.2.0.0 ABI from a
      # newer one that would configure and link just as happily.
      #
      # These are the SOURCE-TREE include roots, matching what configure.ac and the three
      # Makefile.am files use. build_modules.sh also stages copies of the generated
      # headers under out/build/include/<comp>/<ver>/include; those are not what the
      # middleware compiles against and are deliberately not named here.
      - name: Verify the staged AIDL and Binder roots
        run: |
          set -euo pipefail
          rc=0
          require() {
            if [ -e "$2" ]; then
              printf '  %-2s %s\n' "$1" "$2"
            else
              echo "::error::$1 target missing: $2 ($3)"
              rc=1
            fi
          }
          require -I "$HALIF_PREFIX/hdmicec/0.1.0.0/include" "the generated com/rdk/hal/hdmicec client stubs and Bn* server bases"
          require -I "$HALIF_PREFIX/common/0.2.0.0/include"  "com/rdk/hal/PropertyValue.h, the frozen import the hdmicec snapshot was generated against"
          require -I "$HALIF_PREFIX/common/current"          "halcompat.h, the only source of the service-lookup and compatibility helpers"
          require -I "$BINDER_SDK_INCLUDE_DIR/include/binder_sdk" "the Binder SDK headers the generated stubs include - binder/, utils/, android-base/"
          require -L "$HALIF_LIB_DIR"                        "libhdmicec-v0.1.0.0-cpp and libcommon-v0.2.0.0-cpp"
          require -L "$BINDER_SDK_DIR/lib/binder"            "libbinder and libutils, plus the transitive closure that must be loadable"
          require -l "$HALIF_LIB_DIR/libcommon-v0.2.0.0-cpp.so"  "the pinned common ABI; a newer common release is not a substitute"
          require -l "$HALIF_LIB_DIR/libhdmicec-v0.1.0.0-cpp.so" "the generated hdmicec client stub library"
          if [ "$rc" -ne 0 ]; then
            echo "the AIDL/Binder staging layout is not what the build expects; see the errors above." >&2
            exit 1
          fi
          echo "all AIDL/Binder include and library roots present"

      - name: Generate stub headers
        # Empty headers to mute errors
        run: >
          cd "$GITHUB_WORKSPACE/hdmicec"
          &&
          mkdir -p
          stubs/rdk/iarmbus
          stubs/ccec/drivers/iarmbus
          &&
          cd stubs
          &&
          touch
          rdk/iarmbus/libIARM.h
          rdk/iarmbus/libIBus.h
          rdk/iarmbus/libIBusDaemon.h
          ccec/drivers/iarmbus/CecIARMBusMgr.h
          &&
          ln -s ../../../mocks/hdmicec/hdmi_cec_driver.h ccec/drivers/hdmi_cec_driver.h

      # THE SHIPPING BUILD, BUILT FIRST - BECAUSE ./configure DESTROYS ITS SOURCE.
      #
      # Two build systems are active in this submodule and only one of them ships.
      # ccec/src/Makefile is a HAND-WRITTEN RDK build file - its own Apache header, its own
      # explicit OBJS list, its own compile and link rules - and it is what rdk_build.sh
      # drives with a bare `make` for every SOC vendor. configure.ac lists that path in
      # AC_CONFIG_FILES, so the ./configure in the next step OVERWRITES it with Automake
      # output. Which is precisely why this step sits HERE, ahead of autoreconf: the only
      # window in which the shipping build source exists in this job is before configure
      # runs, so that is when it is built and measured. Afterwards is not harder, it is
      # impossible - and a comment recording that ordering is not a substitute for this
      # step, because without it the shipping path is never built in CI at all.
      #
      # An Autotools-only check cannot stand in for this. The two systems carry the AIDL
      # back-end by completely different mechanisms - libRCEC_la_SOURCES plus
      # libRCEC_la_LIBADD, substituted by configure, versus a literal DriverAidlImpl.o entry
      # in OBJS and a link command written out inside the file - so a shipping build that
      # linked no AIDL back-end at all, or one whose link command never expanded the library
      # list, would still leave the Autotools closure check below perfectly green. That
      # divergence is the failure this step closes.
      #
      # FOUR PROPERTIES OF THE HAND-WRITTEN FILE THAT THE COMMANDS BELOW ARE SHAPED BY.
      # None is a choice made here:
      #
      #   * IT HAS NO CPPFLAGS HOOK. Its recipe is `$(CXX) -c $< $(CFLAGS) -o $@`, and
      #     CFLAGS is where both its -std=c++17 and its entire INCLUDE list live, so a
      #     command-line CFLAGS= would silently drop the dialect and every -I root. Extra
      #     roots therefore arrive as the file's own make variables or through CPATH, which
      #     gcc treats as extra -I directories searched after every -I, leaving every
      #     variable the file sets exactly as written.
      #   * IT REFUSES TEST-SCOPE HEADERS. The telemetry_busmessage_sender.h that
      #     MessageDecoder.cpp, Bus.cpp and LibCCEC.cpp include, and the
      #     ccec/drivers/hdmi_cec_driver.h that DriverImpl.cpp includes, must come from
      #     TELEMETRY_PREFIX and LEGACY_HAL_PREFIX; the file stops with a named error when
      #     either is unset or resolves into mocks/ or stubs/. So this step stages both roots
      #     under $RUNNER_TEMP from the pinned telemetry and rdk-halif-hdmi_cec checkouts and
      #     passes them as make variables. CPATH still names mocks/ and stubs/, but the
      #     staged -I roots win: g++ -H on these flags resolves all four includes to the
      #     staged copies, and the build's own root report is asserted below.
      #   * ITS DEFAULT GOAL IS `all: clean library`, so it is invoked WITHOUT -j. Under -j
      #     the clean and the library goal are free to run concurrently, and the clean would
      #     be deleting the very objects the library goal had just compiled.
      #   * IT RESOLVES TELEMETRY AND OSAL IN ITS CONSUMERS, not here: its link command
      #     names neither -ltelemetry_msgsender nor -lRCECOSHal, where the Autotools build
      #     names both. The .so it produces therefore carries undefined symbols for them by
      #     design. That is long-standing RDK behaviour, it is not this job's to change, and
      #     it does not weaken the assertions below - readelf and ldd are being asked about
      #     LIBRARY resolution, which is what the AIDL/Binder edges are.
      #
      # The prefixes handed to make are the ones the file itself expands, spelled as it
      # spells them: HALIF_PREFIX and BINDER_SDK_DIR, plus the two split-staging overrides
      # HALIF_LIB_DIR and BINDER_SDK_INCLUDE_DIR that the job-level env already defines for
      # configure. The file declares the last two with ?=, so an exported value wins and the
      # derived default is not used - one source of truth, shared with the Autotools path.
      #
      # No coverage flags are passed, deliberately: coverage is measured from the Autotools
      # build, and an instrumented hand build would scatter .gcno files through ccec/src for
      # objects the suite never runs. The step ends by running the file's own clean target,
      # so the Autotools build that follows starts from the tree it expects.
      #
      # The snapshot is not ceremony. configure is about to overwrite a TRACKED, HAND-EDITED
      # source file; on a self-hosted runner that reuses its workspace, leaving Automake
      # output in its place is real damage that outlives the job. So the content is copied
      # out with cp -p before autoreconf and put back by the paired step at the end of the
      # job - the same discipline tests/L1Tests/run_coverage.sh applies, and for the same
      # reason. `git checkout` is never used for this: it would restore what the index
      # holds, not the working-tree content that was there, which is a different file
      # whenever anything is staged or uncommitted.
      - name: Build and verify the shipping hand-written RDK library
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/hdmicec"

          hand_makefile="ccec/src/Makefile"
          snap_dir="${RUNNER_TEMP:-/tmp}/hdmicec-hand-build-snapshot"
          snap="$snap_dir/ccec-src-Makefile"

          # The two test-only roots CPATH names below, asserted rather than assumed: the
          # symlink in particular is created by the "Generate stub headers" step above, which
          # the Autotools build after this step needs, so a reordering of these steps is
          # caught here by name. The production headers are staged and asserted further down.
          for prereq in \
            "mocks/telemetry_busmessage_sender.h" \
            "stubs/ccec/drivers/hdmi_cec_driver.h"; do
            if [ ! -e "$prereq" ]; then
              echo "::error::$GITHUB_WORKSPACE/hdmicec/$prereq is missing, so the hand-written build cannot compile. It is staged by the 'Generate stub headers' step, which must run before this one."
              exit 1
            fi
          done
          if [ ! -f "$hand_makefile" ]; then
            echo "::error::$hand_makefile is absent. This job builds the shipping RDK build system from that file and cannot proceed without it."
            exit 1
          fi
          # A tell-tale that ./configure has already run and this step is in the wrong
          # place, using two markers that were measured against both versions of this path
          # rather than guessed: config.status writes an Automake header line carrying
          # "generated by automake", and only the hand-written source defines LIBNAMEFULL,
          # which is what names the libRCEC.so it links. (An am--refresh target, the obvious
          # candidate, is NOT usable here: Automake emits that in the top-level Makefile
          # only, so a subdirectory Makefile does not carry it - checked.)
          if grep -q 'generated by automake' "$hand_makefile" || ! grep -q '^LIBNAMEFULL' "$hand_makefile"; then
            echo "::error::$hand_makefile is not the hand-written RDK build source - it looks like Automake output - so ./configure has already overwritten it and the shipping build can no longer be built in this job. This step must run BEFORE the 'Build hdmicec' step, and its snapshot is what the end-of-job step restores from."
            exit 1
          fi

          # Snapshot before anything can overwrite it. Outside the checkout, so it survives
          # whatever happens in the tree; 0700 and not-a-symlink, so a pre-existing path
          # cannot redirect the copy.
          if ! mkdir -p "$snap_dir"; then
            echo "::error::could not create the snapshot directory $snap_dir, so the pre-configure snapshot of $hand_makefile cannot be taken. Something already occupies that path."
            exit 1
          fi
          if [ -L "$snap_dir" ] || [ ! -d "$snap_dir" ]; then
            echo "::error::$snap_dir is not a plain directory, so the pre-configure snapshot of $hand_makefile cannot be taken safely."
            exit 1
          fi
          chmod 700 "$snap_dir"
          # Removed first so the copy cannot be redirected through a pre-existing symlink
          # left in that directory, and so cp writes a fresh file rather than through one.
          rm -f -- "$snap"
          cp -p "$hand_makefile" "$snap"
          if ! cmp -s "$hand_makefile" "$snap"; then
            echo "::error::the snapshot at $snap is not byte-identical to $hand_makefile, so it could not be relied on to restore it later."
            exit 1
          fi
          echo "snapshotted $hand_makefile -> $snap"

          # THE BUILD. CPATH carries the two test-only roots; the six prefixes are passed
          # as make variables so they win over anything ambient; no -j, for the reason in
          # the comment above. The output is captured as well as shown, because the link
          # command make echoes is itself evidence and is asserted on below.
          # THE COMPILER IS THE PINNED ONE, NAMED, AND ASSERTED HERE RATHER THAN DEFAULTED.
          #
          # This line used to read CXX="${CXX:-g++}", whose fallback silently handed the
          # shipping-library build to whatever the runner image defaulted to - the one thing the
          # toolchain gate exists to prevent. There is no fallback now: CXX is the value
          # "Select and prove the acceptance toolchain" exported, and if it is unset or is not
          # the pinned family the step stops here and says so, because the alternative is a
          # shipping library and a set of coverage notes produced by an unrecorded compiler.
          expected_cxx="/usr/bin/g++-${CEC_TOOLCHAIN_GCC_MAJOR:?}"
          if [ "${CXX:-}" != "$expected_cxx" ]; then
            echo "::error::CXX is '${CXX:-<unset>}', not the pinned $expected_cxx. The hand-written RDK build compiles the library a SOC vendor ships, so it is not built with an unrecorded compiler; check that 'Select and prove the acceptance toolchain' ran before this step."
            exit 1
          fi
          printf 'hand build CXX: %s (%s)\n' "$CXX" "$("$CXX" -dumpversion)"

          # THE TWO PRODUCTION HEADER ROOTS, STAGED OUTSIDE THE hdmicec TREE from the pinned
          # checkouts. Each source must be a non-empty regular file - a symlink could carry a
          # mock's bytes past the makefile's refusal as a plain copy - and each copy is compared
          # back against it. The legacy HAL publishes its header flat, at
          # include/hdmi_cec_driver.h, so it is staged into the ccec/drivers/ subpath
          # DriverImpl.cpp includes it by.
          prod_root="${RUNNER_TEMP:?}/hdmicec-production-headers"
          telemetry_prefix="$prod_root/telemetry"
          legacy_hal_prefix="$prod_root/legacy-hal"
          rm -rf -- "$prod_root"
          mkdir -p -- "$telemetry_prefix/include" "$legacy_hal_prefix/include/ccec/drivers"
          for pair in \
            "telemetry/include/telemetry_busmessage_sender.h=$telemetry_prefix/include/telemetry_busmessage_sender.h" \
            "telemetry/include/telemetry2_0.h=$telemetry_prefix/include/telemetry2_0.h" \
            "rdk-halif-hdmi_cec/include/hdmi_cec_driver.h=$legacy_hal_prefix/include/ccec/drivers/hdmi_cec_driver.h"; do
            src="$GITHUB_WORKSPACE/${pair%%=*}"
            dst="${pair#*=}"
            if [ -L "$src" ] || [ ! -f "$src" ] || [ ! -s "$src" ]; then
              echo "::error::$src is not a non-empty regular file, so the production header the shipping hand build compiles against cannot be staged from it. It comes from the pinned 'Checkout the telemetry headers for the hand-written build' or 'Checkout the legacy HDMI CEC HAL header for the hand-written build' step; restore that step rather than pointing the build at mocks/ or stubs/."
              exit 1
            fi
            install -m 0644 -- "$src" "$dst"
            if [ -L "$dst" ] || [ ! -f "$dst" ] || [ ! -s "$dst" ] || ! cmp -s -- "$src" "$dst"; then
              echo "::error::the staged copy $dst is not a non-empty regular file identical to $src, so the hand build would not compile against the pinned header."
              exit 1
            fi
            printf '  ok       %s (%s bytes, from %s)\n' "$dst" "$(stat -c '%s' -- "$dst")" "${pair%%=*}"
          done

          build_log="$(mktemp)"
          CPATH="$GITHUB_WORKSPACE/hdmicec/mocks:$GITHUB_WORKSPACE/hdmicec/stubs${CPATH:+:$CPATH}" \
            make -C ccec/src \
              CXX="$CXX" \
              HALIF_PREFIX="$HALIF_PREFIX" \
              HALIF_LIB_DIR="$HALIF_LIB_DIR" \
              BINDER_SDK_DIR="$BINDER_SDK_DIR" \
              BINDER_SDK_INCLUDE_DIR="$BINDER_SDK_INCLUDE_DIR" \
              TELEMETRY_PREFIX="$telemetry_prefix" \
              LEGACY_HAL_PREFIX="$legacy_hal_prefix" \
              all 2>&1 | tee "$build_log"

          # The roots the makefile resolved, read back from its own report, so a build that
          # compiled against anything but the staged headers fails here by name.
          for root in "telemetry header root: [$telemetry_prefix/include]" \
                      "legacy HDMI CEC HAL header root: [$legacy_hal_prefix/include]"; do
            if ! grep -q -F -x -- "libRCEC $root" "$build_log"; then
              echo "::error::the hand-written build did not report 'libRCEC $root', so it did not resolve the production header root this step staged."
              exit 1
            fi
            printf '  ok       libRCEC %s\n' "$root"
          done

          lib="ccec/src/install/lib/libRCEC.so"
          if [ ! -f "$lib" ]; then
            echo "::error::the hand-written build reported success but produced no $lib, so the shipping library cannot be inspected."
            exit 1
          fi

          echo "--- readelf -d: the direct edges the shipping libRCEC.so declares"
          readelf -d "$lib" | grep NEEDED || echo "(no DT_NEEDED entries at all - every assertion below will fail, and that is the correct outcome)"
          echo "--- ldd: the whole closure the loader has to resolve for it"
          ldd "$lib"

          rc=0
          needed="$(readelf -d "$lib" | awk -F'[][]' '/NEEDED/ { print $2 }')"

          # THE DIRECT EDGES. FOUR, because AAP 0.4.2 specifies four unconditional direct
          # edges and AAP 0.9.4 verifies the produced ELF against the expected NEEDED set.
          #
          # The fourth is the one that needs explaining. --as-needed - the default of
          # Ubuntu's gcc-13, though not of the upstream GCC this job builds - drops
          # libcommon-v0.2.0.0-cpp, whose PropertyValue is reached only through the hdmicec
          # stub library's own interface and which therefore no middleware symbol
          # references. Requiring only the three that survive that default would make
          # deleting -lcommon-v0.2.0.0-cpp from AIDL_LIBS a change no assertion could see
          # there. The makefile scopes -Wl,--no-as-needed to exactly these four libraries
          # and restores --as-needed after them, so the fourth edge is genuinely in the ELF
          # and is required here like the other three.
          for soname in libhdmicec-v0.1.0.0-cpp.so libcommon-v0.2.0.0-cpp.so libbinder.so libutils.so; do
            if printf '%s\n' "$needed" | grep -q -F -x -- "$soname"; then
              printf '  ok       %-28s direct DT_NEEDED\n' "$soname"
            else
              echo "::error::$soname is not a direct DT_NEEDED entry of the shipping $lib. Either DriverAidlImpl.o is missing from the hand-written OBJS list, or the link command no longer expands AIDL_LIBS, or AIDL_LIBS no longer wraps its four libraries in -Wl,--no-as-needed ... -Wl,--as-needed - and for libcommon-v0.2.0.0-cpp, which no middleware symbol references, that wrapping is the only thing keeping the edge in the ELF under an --as-needed toolchain."
              rc=1
            fi
          done

          # THE LINK COMMAND THAT WAS ACTUALLY EXECUTED. Belt and braces over the check
          # above: under a toolchain whose default is --no-as-needed - the upstream GCC this
          # job builds is one - the four edges reach DT_NEEDED whether or not AIDL_LIBS still
          # wraps them, so the loop above stays green if the wrapping goes. This asserts on
          # the text of the command make echoed, so a token removed from the makefile fails
          # whatever the linker's disposition happens to be.
          link_line="$(grep -F -- '-shared -o install/lib/libRCEC.so' "$build_log" | tail -n 1)"
          if [ -z "$link_line" ]; then
            echo "::error::no link command for install/lib/libRCEC.so appears in the captured build output, so the four -l edges cannot be checked against what was executed. The recipe in ccec/src/Makefile must not be silenced with a leading @."
            rc=1
          else
            echo "--- the executed link command"
            printf '%s\n' "$link_line"
            for token in -lhdmicec-v0.1.0.0-cpp -lcommon-v0.2.0.0-cpp -lbinder -lutils -Wl,--no-as-needed -Wl,--as-needed; do
              case "$link_line" in
                *"$token"*)
                  printf '  ok       %-28s present and expanded in the executed link command\n' "$token"
                  ;;
                *)
                  echo "::error::the executed link command for the shipping libRCEC.so does not contain '$token'. AAP 0.4.2 requires all four AIDL/Binder edges unconditionally, and the -Wl wrapping is what makes the unreferenced one survive --as-needed."
                  rc=1
                  ;;
              esac
            done
          fi
          rm -f "$build_log"

          # THE CLOSURE, and every entry has to resolve INSIDE the staged tree so that an
          # unrelated system copy cannot quietly satisfy it and leave the job green.
          closure="$(mktemp)"
          ldd "$lib" | awk '$2 == "=>" { print $1, $3 }' > "$closure"
          if ldd "$lib" | grep -q 'not found'; then
            echo "::error::the shipping libRCEC.so has unresolved dependencies - see the ldd output above."
            rc=1
          fi
          for entry in \
            "libhdmicec-v0.1.0.0-cpp.so=$HALIF_LIB_DIR" \
            "libcommon-v0.2.0.0-cpp.so=$HALIF_LIB_DIR" \
            "libbinder.so=$BINDER_SDK_DIR/lib/binder" \
            "libutils.so=$BINDER_SDK_DIR/lib/binder" \
            "libcutils.so=$BINDER_SDK_DIR/lib/binder" \
            "libbase.so=$BINDER_SDK_DIR/lib/binder" \
            "liblog.so=$BINDER_SDK_DIR/lib/binder"; do
            soname="${entry%%=*}"
            expected="${entry#*=}"
            resolved="$(awk -v n="$soname" '$1 == n { print $2 }' "$closure")"
            case "$resolved" in
              "$expected"/*)
                printf '  ok       %-28s -> %s\n' "$soname" "$resolved"
                ;;
              "")
                echo "::error::$soname is absent from the shipping libRCEC.so's loader closure. Either the AIDL back-end was not linked into the hand-written build or the Binder SDK staging has moved."
                rc=1
                ;;
              *)
                echo "::error::$soname resolved to '$resolved', which is outside the staged $expected. An unrelated copy must not satisfy this dependency."
                rc=1
                ;;
            esac
          done
          rm -f "$closure"

          # libcutils_sockets is staged beside the rest and is NOT reachable from libRCEC at
          # all - not directly, and not through libcutils, whose own DT_NEEDED names only
          # libbase and liblog. Asserting it in the closure would assert something untrue,
          # so what is checked is what is actually required of it: staged, and loadable in
          # its own right.
          sockets="$BINDER_SDK_DIR/lib/binder/libcutils_sockets.so"
          if [ ! -f "$sockets" ]; then
            echo "::error::libcutils_sockets.so is not staged at $sockets. It is part of the Binder SDK runtime closure and must be present even though nothing in libRCEC reaches it."
            rc=1
          elif ldd "$sockets" | grep -q 'not found'; then
            echo "::error::libcutils_sockets.so is staged but its own dependencies do not resolve:"
            ldd "$sockets"
            rc=1
          else
            printf '  ok       %-28s -> %s (staged and loadable in its own right)\n' "libcutils_sockets.so" "$sockets"
          fi

          if [ "$rc" -ne 0 ]; then
            echo "the shipping hand-written build of libRCEC does not carry the AIDL/Binder back-end as required; see the errors above." >&2
            exit 1
          fi
          echo "the shipping hand-written build links both HDMI CEC HAL back-ends and resolves its whole AIDL/Binder closure against the staged tree"

          # Leave ccec/src as the Autotools build expects to find it. The file's own clean
          # target is used, so this removes exactly what it created - its OBJS and its
          # install/ prefix - and nothing else.
          make -C ccec/src \
            HALIF_PREFIX="$HALIF_PREFIX" \
            HALIF_LIB_DIR="$HALIF_LIB_DIR" \
            BINDER_SDK_DIR="$BINDER_SDK_DIR" \
            BINDER_SDK_INCLUDE_DIR="$BINDER_SDK_INCLUDE_DIR" \
            clean
          echo "hand-written build products removed; the Autotools build starts from a clean ccec/src"

      # THREE ADDITIONS TO THIS STEP, ALL STRICTLY ADDITIVE.
      #
      # 1. The four AIDL/Binder include roots join CPPFLAGS and the two library
      #    directories join LDFLAGS, each derived from the job-level staging prefixes so
      #    there is one place that decides. configure.ac derives the same set itself from
      #    the four prefix arguments below, and for several of them falls back to "relying
      #    on the ambient CPPFLAGS/LDFLAGS" - so passing them here is what that fallback
      #    is for, not duplication. Nothing that was already in these three variables is
      #    removed: the mocks, stubs and GoogleTest roots stay, and so do
      #    -fprofile-arcs -ftest-coverage in both LDFLAGS and CXXFLAGS, without which the
      #    coverage step further down has no counters to read.
      #
      # 2. The four staging prefixes are passed to ./configure by the same names
      #    configure.ac declares with AC_ARG_VAR and that tests/L1Tests/run_coverage.sh
      #    passes. --enable-l1tests is untouched, and nothing here is conditional: there
      #    is no --enable-aidl to match, because both HAL back-ends are compiled into
      #    libRCEC for every SOC vendor and the choice between them is made at run time.
      #
      # 3. A THIRD MAKE PASS for the L2 tier. The root `make all` recurses into osal and
      #    ccec only - Makefile.am sets SUBDIRS = osal ccec - so it builds no test binary
      #    at all, which is why the L1 pass already exists as its own command. Without the
      #    L2 pass the L2 runner and the out-of-process fake service host are never built.
      #    It is spelled `make -C tests/L2Tests all`, matching the recipe in
      #    run_coverage.sh so this workflow and that script do not drift; the pre-existing
      #    L1 line is left exactly as it was and the cd back to the top of the submodule is
      #    what makes the relative -C path resolve.
      #
      # The dialect is NOT set here. -std=c++17 belongs to ccec/src/Makefile.am and to both
      # test Makefile.am files, and configure.ac probes for it so that a toolchain with an
      # older default fails at configure time rather than part-way through a compile. The
      # requirement is not a preference: halcompat.h opens its namespace as
      # `namespace com::rdk::hal::halcompat {`, a nested-namespace definition that does not
      # compile as C++14 at all, and the generated headers declare std::optional
      # parameters.
      - name: Build hdmicec
        run: >
          cd $GITHUB_WORKSPACE/hdmicec
          &&
          autoreconf -if
          &&
          CPPFLAGS="-I$GITHUB_WORKSPACE/hdmicec/mocks
          -I$GITHUB_WORKSPACE/hdmicec/stubs
          -I$GITHUB_WORKSPACE/install/usr/include
          -I$HALIF_PREFIX/hdmicec/0.1.0.0/include
          -I$HALIF_PREFIX/common/0.2.0.0/include
          -I$HALIF_PREFIX/common/current
          -I$BINDER_SDK_INCLUDE_DIR/include/binder_sdk"
          LDFLAGS="-L$GITHUB_WORKSPACE/install/usr/lib
          -L$HALIF_LIB_DIR
          -L$BINDER_SDK_DIR/lib/binder
          -fprofile-arcs -ftest-coverage"
          CXXFLAGS="-fprofile-arcs -ftest-coverage"
          ./configure --enable-l1tests
          HALIF_PREFIX="$HALIF_PREFIX"
          HALIF_LIB_DIR="$HALIF_LIB_DIR"
          BINDER_SDK_DIR="$BINDER_SDK_DIR"
          BINDER_SDK_INCLUDE_DIR="$BINDER_SDK_INCLUDE_DIR"
          &&
          make -j$(nproc) all
          &&
          cd tests/L1Tests && make all
          &&
          cd "$GITHUB_WORKSPACE/hdmicec" && make -C tests/L2Tests all

      # THE LOADER CLOSURE, MEASURED RATHER THAN INFERRED.
      #
      # libRCEC declares four AIDL/Binder link edges, but the set that has to be LOADABLE
      # is both larger and differently shaped, and `readelf -d` alone would report a
      # healthy-looking library whose closure does not resolve. Two measured facts about
      # this build are why the checks below are written the way they are:
      #
      #   * libcommon-v0.2.0.0-cpp is a direct DT_NEEDED entry of libRCEC, and under a
      #     toolchain that links --as-needed by default - Ubuntu's gcc-13 does, the upstream
      #     GCC this job builds does not - that is true only because ccec/src/Makefile.am
      #     scopes -Wl,--no-as-needed to the four AIDL and Binder libraries. No middleware
      #     symbol references it - PropertyValue is reached through the hdmicec stub
      #     library's own interface - so with --as-needed in force the linker drops the edge
      #     from the ELF entirely. Treating that absence as the expected state would make
      #     deleting the token from AIDL_LIBS invisible to every assertion, so the library
      #     is required BOTH as a direct edge and in the closure, and both are checked
      #     below.
      #   * libcutils_sockets is staged beside the rest and is NOT reachable from libRCEC
      #     at all - not directly, and not through libcutils, whose own DT_NEEDED names
      #     only libbase and liblog. Asserting it appears in this closure would assert
      #     something untrue, so what is checked is what is actually required of it: that
      #     it is staged and loadable in its own right.
      #
      # Each expected library must also resolve INSIDE the staged tree, so that an
      # unrelated system copy cannot quietly satisfy the link and leave the job green.
      #
      # SCOPE, stated so no more is read into a pass than it earns: this is the
      # AUTOTOOLS-BUILT library. The hand-written RDK build of the same library - the one
      # rdk_build.sh drives and the one SOC vendors ship - is checked by its own step,
      # "Build and verify the shipping hand-written RDK library", which necessarily runs
      # BEFORE autoreconf: ccec/src/Makefile is listed in configure.ac's AC_CONFIG_FILES,
      # so the ./configure above has by now overwritten that hand-written source with
      # Automake output, and its content is restored from the pre-configure snapshot by the
      # paired step at the end of this job. So BOTH active build systems are built and
      # inspected in this job, each in the only window where it can be, and neither check
      # stands in for the other: the assertions are the same shape, but they are made
      # against two libraries produced by two different sets of rules.
      - name: Verify the AIDL and Binder loader closure
        run: |
          set -euo pipefail
          lib="$GITHUB_WORKSPACE/hdmicec/ccec/src/.libs/libRCEC.so"
          if [ ! -f "$lib" ]; then
            echo "::error::$lib was not built, so the AIDL/Binder link edges cannot be verified."
            exit 1
          fi

          echo "--- readelf -d: the direct edges libRCEC declares"
          readelf -d "$lib" | grep NEEDED
          echo "--- ldd: the whole closure the loader has to resolve"
          ldd "$lib"

          rc=0

          # THE FOUR DIRECT EDGES, ASSERTED ON THE LIBTOOL-BUILT LIBRARY TOO. AAP 0.4.2
          # specifies four unconditional direct edges and AAP 0.9.4 verifies the produced
          # ELF against the expected NEEDED set; the hand-written build is checked the same
          # way in the step above, and checking only one of the two build systems is how the
          # two drift apart. libcommon-v0.2.0.0-cpp is here because Makefile.am wraps the
          # four in a comma-joined -Wl,--no-as-needed group - libtool moves a bare
          # -Wl,--no-as-needed to after the whole deplibs list, where it would have no
          # effect, so the group is the spelling that works.
          needed="$(readelf -d "$lib" | awk -F'[][]' '/NEEDED/ { print $2 }')"
          for soname in libhdmicec-v0.1.0.0-cpp.so libcommon-v0.2.0.0-cpp.so libbinder.so libutils.so; do
            if printf '%s\n' "$needed" | grep -q -F -x -- "$soname"; then
              printf '  ok       %-28s direct DT_NEEDED\n' "$soname"
            else
              echo "::error::$soname is not a direct DT_NEEDED entry of $lib. Check ccec/src/Makefile.am: libRCEC_la_LDFLAGS must still carry the comma-joined -Wl,--no-as-needed,<the four>,--as-needed group (it lives in LDFLAGS and not in LIBADD because Automake rejects linker flags in LIBADD outright), and libRCEC_la_LIBADD must still carry @AIDL_LIBS@ and @AIDL_LDFLAGS@. For libcommon-v0.2.0.0-cpp, which no middleware symbol references, that group is the only thing keeping the edge in the ELF under an --as-needed toolchain."
              rc=1
            fi
          done

          closure="$(mktemp)"
          ldd "$lib" | awk '$2 == "=>" { print $1, $3 }' > "$closure"
          if ldd "$lib" | grep -q 'not found'; then
            echo "::error::libRCEC.so has unresolved dependencies - see the ldd output above. Every AIDL and Binder library, and the whole of libbinder's own closure, has to be staged and on the loader path."
            rc=1
          fi

          for entry in \
            "libhdmicec-v0.1.0.0-cpp.so=$HALIF_LIB_DIR" \
            "libcommon-v0.2.0.0-cpp.so=$HALIF_LIB_DIR" \
            "libbinder.so=$BINDER_SDK_DIR/lib/binder" \
            "libutils.so=$BINDER_SDK_DIR/lib/binder" \
            "libcutils.so=$BINDER_SDK_DIR/lib/binder" \
            "libbase.so=$BINDER_SDK_DIR/lib/binder" \
            "liblog.so=$BINDER_SDK_DIR/lib/binder"; do
            soname="${entry%%=*}"
            expected="${entry#*=}"
            resolved="$(awk -v n="$soname" '$1 == n { print $2 }' "$closure")"
            case "$resolved" in
              "$expected"/*)
                printf '  ok       %-28s -> %s\n' "$soname" "$resolved"
                ;;
              "")
                echo "::error::$soname is absent from libRCEC.so's loader closure. Either the AIDL back-end was not linked in or the Binder SDK staging has moved."
                rc=1
                ;;
              *)
                echo "::error::$soname resolved to '$resolved', which is outside the staged $expected. An unrelated copy must not satisfy this dependency."
                rc=1
                ;;
            esac
          done
          rm -f "$closure"

          sockets="$BINDER_SDK_DIR/lib/binder/libcutils_sockets.so"
          if [ ! -f "$sockets" ]; then
            echo "::error::libcutils_sockets.so is not staged at $sockets. It is part of the Binder SDK runtime closure and must be present even though nothing in libRCEC reaches it."
            rc=1
          elif ldd "$sockets" | grep -q 'not found'; then
            echo "::error::libcutils_sockets.so is staged but its own dependencies do not resolve:"
            ldd "$sockets"
            rc=1
          else
            printf '  ok       %-28s -> %s (staged and loadable in its own right)\n' "libcutils_sockets.so" "$sockets"
          fi

          if [ "$rc" -ne 0 ]; then
            echo "the AIDL/Binder loader closure is incomplete; see the errors above." >&2
            exit 1
          fi
          echo "libRCEC.so resolves its whole AIDL/Binder closure against the staged tree"

      # INVOCATION A, AND THE PROOF THAT IT IS INVOCATION A.
      #
      # This is the step that discharges proof (b) at the top of this file. It runs the
      # suite with its output captured, UNDER AN EXPLICIT BOUND, and then gates on all of:
      # the run finished inside that bound; it succeeded; it was not killed by a signal;
      # the selected-path line names the LEGACY back-end EXACTLY ONCE; it never names the
      # AIDL one; no third back-end name appears; and the Binder stack's fatal
      # failed-driver message never appeared. Everything after "it succeeded" is what makes
      # this a statement about the SELECTION rather than just another green test run.
      #
      # It exists as its own step rather than as a pipe bolted onto the runs below,
      # because those two carry a `|| ( ... )` fallback whose exit-status semantics a pipe
      # would silently change - and because a captured log is the artifact this evidence
      # has to leave behind.
      #
      # WHY THE BOUND IS EVIDENCE AND NOT HOUSEKEEPING. The failure mode proof (b) is
      # about is, precisely, A HANG. A host that has a Binder driver but no running service
      # manager does not fail an AIDL lookup: obtaining an IServiceManager at all retries
      # binder handle 0 in one-second intervals INDEFINITELY, which is one of the two
      # hazards the preflight in DriverAidlImpl exists to prevent - the other being the
      # pinned stack's fatal failed-driver abort, caught by the signal arm below. An
      # unbounded run turns that regression into a job that sits at this step until the
      # workflow-level timeout kills it: no exit status, no classification, no annotation,
      # and a build log whose last line is whatever the suite happened to print. So the run
      # is wrapped in coreutils `timeout` - GNU semantics, which is what any hosted
      # Ubuntu runner has, ubuntu-22.04 included - and the outcome is CLASSIFIED rather than merely tested
      # for zero: 124 is the bound firing, 137 is SIGKILL (timeout's own escalation after
      # the grace period, or an external killer such as the OOM killer - the elapsed time
      # printed with the message is what distinguishes them), 125/126/127 are timeout
      # itself failing or being unable to invoke the binary, any other status at or above
      # 128 is death on a signal, and anything else non-zero is an ordinary test failure.
      # Each arm names the failing operation and, where the process ended abnormally,
      # prints the tail of the log, because on a hang the end of the log is the only thing
      # that says where it wedged.
      #
      # The bound itself is generous by design: the L1 suite measures in single-digit
      # seconds on this tree even instrumented, so L1_RUN_TIMEOUT_SECONDS is roughly two
      # orders of magnitude of headroom. It cannot fire on a slow runner; it fires on a
      # hang. The step-level timeout-minutes is a backstop for the one case the inner bound
      # cannot cover - `timeout` itself wedging - and is deliberately set well above it so
      # that the classification below, not the backstop, is what normally reports.
      #
      # The back-end is observed through the log line the factory emits, not through any
      # introspection API: none was added, deliberately. It is emitted at LOG_INFO, which
      # is the default level, and Driver.cpp builds every arm from one format string whose
      # only variable part is the back-end name.
      #
      # WHY THE CHECKS COUNT RATHER THAN ASK "IS IT THERE". The selection RESOLVES ONCE per
      # process and is held for the process lifetime; the log line is how that is observed.
      # `grep -q` would accept a log carrying the legacy line twice, which is the exact
      # shape of the selection having resolved twice - a real defect that a presence test
      # reads as a pass. So the assertion is on CARDINALITY: exactly one legacy line,
      # exactly zero AIDL lines, and exactly one selected-path line in total, so that a
      # third back-end name nobody expected is a failure rather than an invisible extra.
      # The measured counts are printed in every failure message: "expected 1, found 2"
      # tells a reader what happened, "the check failed" does not. This matches
      # assert_selected_back_end() in tests/L1Tests/run_coverage.sh, which gates the full
      # five-invocation matrix the same way, so the two agree on what one line means.
      #
      # The job-level GTEST_FILTER applies here too, so this runs the same set of cases the
      # two steps below do - the invocation-A selection, not the whole binary.
      - name: Verify the selected HAL back-end (invocation A, legacy)
        id: verify_back_end
        timeout-minutes: 20
        run: |
          set -uo pipefail
          cd "$GITHUB_WORKSPACE/hdmicec/tests/L1Tests"
          log="$GITHUB_WORKSPACE/selected_back_end_invocation_A.log"

          # `timeout` is coreutils and is therefore present on ubuntu-22.04 - but an
          # unbounded run is exactly what this step must not perform, so its absence is a
          # hard failure here rather than a quiet downgrade. tests/L1Tests/run_coverage.sh
          # refuses to run the suite without it for the same reason.
          if ! command -v timeout >/dev/null 2>&1; then
            echo "::error::timeout was not found on PATH, so this run cannot be bounded and the driverless-fallback evidence this step exists to produce cannot be produced. timeout ships with coreutils: sudo apt-get install -y coreutils."
            exit 1
          fi
          # Which timeout, and whose semantics, printed rather than assumed: the status
          # codes classified below are GNU's, and a runner image that swapped coreutils for
          # a reimplementation would change them (measured: uutils coreutils 0.2.2 reports
          # 125, not 124, for an expiry when --kill-after is given). The 125 arm handles
          # that case on elapsed time, but a reader still wants to see which one ran.
          echo "bound: ${L1_RUN_TIMEOUT_SECONDS}s, then SIGKILL after a further ${L1_KILL_GRACE_SECONDS}s, using $(command -v timeout) [$(timeout --version 2>/dev/null | head -n 1)]"

          # Printed directly under an ::error:: annotation by the abnormal-termination arms
          # only. The full log is cat'd below for the record, but on a hang or a signal the
          # last few lines are the diagnosis and a reader should not have to scroll a
          # thousand lines of passing cases to find them.
          tail_log() {
            echo "--- last 40 lines of $log ---"
            tail -n 40 "$log" 2>/dev/null || echo "(the log could not be read)"
            echo "--- end of tail ---"
          }

          # absent registers no AIDL service, so the preflight finds no usable Binder
          # transport and the factory must fall back to the legacy back-end. An
          # unrecognised value is a hard failure in the harness rather than a quiet
          # downgrade to this mode, which is what makes the assertions below meaningful.
          set +e
          started="$SECONDS"
          CEC_TEST_AIDL_MODE=absent \
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/install/usr/lib:${LD_LIBRARY_PATH:-}" \
            timeout --kill-after="${L1_KILL_GRACE_SECONDS}s" "${L1_RUN_TIMEOUT_SECONDS}s" \
            ./run_L1Tests --gtest_print_time=1 > "$log" 2>&1
          status=$?
          elapsed=$((SECONDS - started))
          set -e
          cat "$log"

          rc=0
          case "$status" in
            0)
              echo "  ok  run_L1Tests completed in ${elapsed}s, inside the ${L1_RUN_TIMEOUT_SECONDS}s bound"
              ;;
            124)
              echo "::error::run_L1Tests did not finish within the ${L1_RUN_TIMEOUT_SECONDS}s bound under CEC_TEST_AIDL_MODE=absent; timeout sent SIGTERM and the process ended after ${elapsed}s. A hang here is the specific regression this step exists to catch: initialization must reach the legacy back-end on a driverless host, and it must do so BOUNDED - reaching the Binder service manager without the preflight retries handle 0 for ever."
              tail_log
              rc=1
              ;;
            137)
              echo "::error::run_L1Tests was killed with SIGKILL after ${elapsed}s. At or beyond $((L1_RUN_TIMEOUT_SECONDS + L1_KILL_GRACE_SECONDS))s this is timeout escalating because the process ignored the SIGTERM at ${L1_RUN_TIMEOUT_SECONDS}s - a hang that does not even unwind; well short of that it is an external killer, the OOM killer being the usual candidate on a hosted runner."
              tail_log
              rc=1
              ;;
            125)
              # GNU timeout reserves 125 for "timeout itself failed", so on this runner a
              # 125 normally means the bound never governed anything. It is disambiguated on
              # elapsed time rather than trusted, because a coreutils reimplementation can
              # spend it differently: uutils coreutils 0.2.2, measured, returns 125 for an
              # ordinary expiry whenever --kill-after is given. Either way the step fails;
              # what changes is which investigation the message sends a reader on.
              if [ "$elapsed" -ge "$L1_RUN_TIMEOUT_SECONDS" ]; then
                echo "::error::run_L1Tests did not finish within the ${L1_RUN_TIMEOUT_SECONDS}s bound; timeout returned 125 after ${elapsed}s, which with the bound fully elapsed is an expiry reported by a non-GNU timeout rather than a failure of timeout itself. Treat it as the hang this step exists to catch: initialization must reach the legacy back-end on a driverless host, and it must do so bounded."
              else
                echo "::error::timeout itself failed (exit 125) after ${elapsed}s, well inside the ${L1_RUN_TIMEOUT_SECONDS}s bound, so run_L1Tests may not have been started at all and this run is not evidence about anything. Check the bound arguments in this step."
              fi
              tail_log
              rc=1
              ;;
            126)
              echo "::error::./run_L1Tests was found but could not be invoked (exit 126). The L1 runner is built by the 'Build hdmicec' step; a non-executable or wrongly linked binary is the usual cause."
              tail_log
              rc=1
              ;;
            127)
              echo "::error::./run_L1Tests was not found (exit 127) in $(pwd). The L1 runner is built by the 'Build hdmicec' step, whose third make pass must have produced it."
              tail_log
              rc=1
              ;;
            *)
              if [ "$status" -ge 128 ]; then
                echo "::error::run_L1Tests terminated on signal $((status - 128)) after ${elapsed}s. An abort here is the specific failure the preflight exists to prevent: reaching the Binder service manager on a host with no driver is fatal in the pinned stack, so this must never happen."
                tail_log
              else
                echo "::error::run_L1Tests exited $status after ${elapsed}s under CEC_TEST_AIDL_MODE=absent. On a host with no Binder driver the legacy back-end must be selected and the whole suite must pass."
              fi
              rc=1
              ;;
          esac

          # The literal is the shared contract Driver.cpp emits, tests/L1Tests/run_coverage.sh
          # greps and the functional suites assert on; only the trailing back-end name
          # varies. -F because it is a fixed string, not a pattern, and `|| true` because
          # grep -c exits non-zero when it counts zero - which is a measurement here, not an
          # error, and must not decide the step's fate.
          selected='HDMI CEC HAL back-end selected : '
          legacy_hits="$(grep -c -F -- "${selected}legacy" "$log" 2>/dev/null || true)"
          aidl_hits="$(grep -c -F -- "${selected}AIDL" "$log" 2>/dev/null || true)"
          total_hits="$(grep -c -F -- "$selected" "$log" 2>/dev/null || true)"
          legacy_hits="${legacy_hits:-0}"
          aidl_hits="${aidl_hits:-0}"
          total_hits="${total_hits:-0}"
          # "expected AIDL, got legacy" is a far more useful diagnostic than "the check
          # failed", so every selected-path line the log does carry is collected once, with
          # its own count, and quoted back in the failure messages. Newlines are folded to
          # semicolons because a GitHub annotation is one line.
          variants="$(grep -o -- "${selected}[A-Za-z]*" "$log" 2>/dev/null | sort | uniq -c | tr -s ' \n' ' ;' || true)"

          if [ "$legacy_hits" -eq 1 ]; then
            echo "  ok  the factory selected the legacy back-end and said so exactly once"
          elif [ "$legacy_hits" -eq 0 ]; then
            echo "::error::the log carries no '${selected}legacy' line, so this run did not demonstrably fall back to the legacy back-end. Selected-path lines actually present: ${variants:-none at all}"
            rc=1
          else
            echo "::error::the log carries the '${selected}legacy' line $legacy_hits times and it must appear exactly once: the selection resolves once per process and is held for the process lifetime, so a second line means it resolved twice. Selected-path lines present: ${variants:-none at all}"
            rc=1
          fi
          if [ "$aidl_hits" -ne 0 ]; then
            echo "::error::the AIDL back-end was selected ($aidl_hits '${selected}AIDL' line(s), expected 0), which is impossible on a runner with no Binder driver and means the selection is not reading the platform it is on. Selected-path lines present: ${variants:-none at all}"
            rc=1
          fi
          if [ "$total_hits" -ne 1 ]; then
            echo "::error::the log carries $total_hits selected-path lines in total, expected exactly 1. Either the selection resolved more than once or it named a back-end this job does not know about. Selected-path lines present: ${variants:-none at all}"
            rc=1
          fi
          # Matched on the driver message alone, deliberately narrowly: a bare
          # "Terminating" would also match ordinary log text. An abort that produced no
          # message at all is caught by the signal classification above instead.
          #
          # The pattern is measured against the pinned stack rather than guessed. The
          # staged libbinder.so carries the format string
          #     Binder driver '%s' could not be opened. Terminating: %s
          # which this expression matches, and it must stay CASE-SENSITIVE: DriverAidlImpl's
          # own preflight emits a benign lower-case "binder driver [/dev/binder] could not
          # be opened, errno 2; treating the AIDL HAL as absent" on exactly the healthy
          # driverless run this job is proving. Making the match case-insensitive, or
          # loosening it to "could not be opened", would fail every good run.
          if grep -qE 'Binder driver .* could not be opened' "$log"; then
            echo "::error::the Binder stack's fatal failed-driver path was reached. The preflight must decide that the transport is unavailable BEFORE anything opens the driver."
            rc=1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "invocation A did not behave as a driverless host must; see the errors above." >&2
            exit 1
          fi

      # Evidence for proof (b) gets its own upload, so that a missing log is an error
      # rather than a shrug. It is deliberately NOT appended to the mixed-path upload at
      # the end of this job, whose if-no-files-found MUST stay 'warn' - see the comment
      # there.
      - name: Upload selected back-end log
        if: ${{ always() && !env.ACT && steps.verify_back_end.conclusion != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 (v7.0.1)
        with:
          name: selected-back-end-L1-hdmicec-${{ matrix.coverage }}
          path: selected_back_end_invocation_A.log
          if-no-files-found: error

      # BOUNDED like every other run of this binary in the job. Listing cases does no work
      # beyond registering them, so L1_LIST_TIMEOUT_SECONDS is short - but it is not zero
      # risk: registration constructs every fixture's static state, and the selection
      # resolves in LibCCEC::init before main's first case, so this invocation reaches the
      # same preflight that a hang would wedge in. `timeout` sits after the environment
      # assignments so that they still reach the binary through it.
      # LIST THE INVENTORY, AND THEN PROVE THE FILTER'S OWN ARITHMETIC AGAINST IT.
      #
      # The listing half is unchanged and is for a human reading the log. The second half
      # exists because a NUMBER WRITTEN IN A COMMENT GOES STALE SILENTLY, and one in this
      # file did: the job-level env block used to claim the unfiltered run reports 31
      # failures, which was true of an earlier tree and is not true of this one. Rather
      # than correct the number and wait for it to rot again, the counts are DERIVED here,
      # on every run, from the binary that was just built.
      #
      # Three things are asserted, and each is an INVARIANT rather than a recorded total,
      # which is the whole point - none of them has to be edited when a case is added:
      #
      #   1. selected + excluded == registered. The filter cannot quietly drop or duplicate
      #      a case. This is arithmetic on three independently listed inventories, not a
      #      restatement of one of them.
      #   2. selected > 0 AND excluded > 0. EMPTY-FILTER DETECTION, in both directions. A
      #      filter that matches nothing produces a green run of zero cases, which is the
      #      single most dangerous failure a filtered suite can have; a filter that excludes
      #      nothing means the two AIDL fixtures have silently stopped being registered, so
      #      invocation A is no longer proving that the filter is what makes it green.
      #   3. Every excluded case belongs to DriverAidlSessionTest or DriverAidlTransmitTest.
      #      This is what makes the filter's INTENT checkable: the two fixtures require the
      #      AIDL back-end to be the resolved one, and nothing else may be swept out with
      #      them. A third fixture added to the filter without being added here fails this.
      #
      # Fail-closed throughout: `set -euo pipefail`, and the derivation ends in an explicit
      # comparison rather than in a printed number nobody reads. The measured census is
      # written to the step summary so the run's own evidence carries it, which is what
      # replaces the comment that went stale.
      #
      # MEASURED AT THE TIME OF WRITING, on this tree: 643 cases in 25 suites registered,
      # 599 in 23 selected, 44 excluded - DriverAidlSessionTest 32 plus
      # DriverAidlTransmitTest 12. Those figures are stated as a reader's orientation only;
      # NOTHING BELOW COMPARES AGAINST THEM, so they cannot fail the job when a case is
      # added, and the assertions above are what actually holds.
      - name: List available tests and prove the invocation-A filter arithmetic
        timeout-minutes: 10
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/hdmicec/tests/L1Tests"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/install/usr/lib:${LD_LIBRARY_PATH}"
          export CEC_TEST_AIDL_MODE=absent

          # The human-readable listing, unchanged in behaviour and still bounded.
          timeout --kill-after="${L1_KILL_GRACE_SECONDS}s" "${L1_LIST_TIMEOUT_SECONDS}s" \
            ./run_L1Tests --gtest_list_tests

          # Qualified case names, one per line, out of --gtest_list_tests. A suite line is a
          # single token ending in '.', a case line is indented; joining the two gives
          # 'Suite.Case', which is the same spelling a --gtest_filter uses. Any other output
          # the binary emits is ignored by construction rather than by blacklist.
          list_names() {
            GTEST_FILTER="$1" timeout --kill-after="${L1_KILL_GRACE_SECONDS}s" \
              "${L1_LIST_TIMEOUT_SECONDS}s" ./run_L1Tests --gtest_list_tests \
              | awk '
                  NF == 1 && /^[^[:space:]]+\.$/ { suite = $1; next }
                  /^[[:space:]]+[A-Za-z_]/       { if (suite != "") print suite $1 }
                '
          }

          # '*' rather than an unset variable: the job-level GTEST_FILTER is exported into
          # this step, so asking for the full inventory means overriding it explicitly.
          # The three inventories go under RUNNER_TEMP rather than a fixed /tmp path so a
          # runner hosting more than one job cannot have two of them write the same file,
          # and `comm` is given sorted input on purpose - it FAILS on unsorted input, which
          # makes a corrupted inventory an error here rather than a wrong count later.
          work="${RUNNER_TEMP:-/tmp}"
          list_names '*'               | sort -u > "$work/l1_registered.txt"
          list_names "${GTEST_FILTER}" | sort -u > "$work/l1_selected.txt"
          comm -23 "$work/l1_registered.txt" "$work/l1_selected.txt" > "$work/l1_excluded.txt"

          registered=$(wc -l < "$work/l1_registered.txt")
          selected=$(wc -l < "$work/l1_selected.txt")
          excluded=$(wc -l < "$work/l1_excluded.txt")
          suites=$(sed 's/\.[^.]*$//' "$work/l1_registered.txt" | sort -u | wc -l)
          suites_selected=$(sed 's/\.[^.]*$//' "$work/l1_selected.txt" | sort -u | wc -l)

          printf 'registered : %s cases in %s suites\n' "$registered" "$suites"
          printf 'selected   : %s cases in %s suites (GTEST_FILTER=%s)\n' \
                 "$selected" "$suites_selected" "$GTEST_FILTER"
          printf 'excluded   : %s cases, which is what an unfiltered run would fail on\n' "$excluded"

          if [ "$registered" -eq 0 ]; then
            echo "::error::--gtest_list_tests reported no cases at all, so the binary either did not start or printed nothing this step could parse. Nothing below can be trusted; investigate the listing output above before reading any count."
            exit 1
          fi
          if [ "$(( selected + excluded ))" -ne "$registered" ]; then
            echo "::error::filter arithmetic does not close: selected $selected + excluded $excluded != registered $registered. The filter is dropping or duplicating cases, which means the executed count of invocation A is not the count anyone believes it is."
            exit 1
          fi
          if [ "$selected" -eq 0 ]; then
            echo "::error::GTEST_FILTER='$GTEST_FILTER' selects ZERO of $registered registered cases. An empty selection runs green while proving nothing, which is exactly what this check exists to catch."
            exit 1
          fi
          if [ "$excluded" -eq 0 ]; then
            echo "::error::GTEST_FILTER='$GTEST_FILTER' excludes NOTHING, so DriverAidlSessionTest and DriverAidlTransmitTest are no longer registered under the names the filter spells. Invocation A is then green for a reason other than the filter, and the fixture manifest in tests/L1Tests/ccec/test_DriverAidl.cpp has moved without this workflow following it."
            exit 1
          fi
          stray=$(grep -vE '^(DriverAidlSessionTest|DriverAidlTransmitTest)\.' "$work/l1_excluded.txt" || true)
          if [ -n "$stray" ]; then
            echo "::error::the invocation-A filter excludes cases outside the two AIDL-back-end fixtures it is documented to exclude. Every case below is being skipped without a stated reason:"
            printf '::error::  %s\n' $stray
            exit 1
          fi

          {
            printf '### Invocation-A filter, measured on the built binary\n\n'
            printf '| Inventory | Cases | Suites |\n| --- | --- | --- |\n'
            printf '| registered | %s | %s |\n' "$registered" "$suites"
            printf '| selected (invocation A) | %s | %s |\n' "$selected" "$suites_selected"
            printf '| excluded (need the AIDL back-end) | %s | - |\n\n' "$excluded"
            printf 'Derived from `--gtest_list_tests`, not recorded in this workflow: '
            printf 'selected + excluded == registered, the selection is non-empty, and every '
            printf 'excluded case belongs to `DriverAidlSessionTest` or `DriverAidlTransmitTest`.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      # CEC_TEST_AIDL_MODE=absent is invocation A: the harness registers no AIDL service,
      # the preflight finds no usable Binder transport, and the legacy back-end is
      # selected - so all of the pre-existing cases run exactly as they did before this
      # migration. Unset means absent too, which is why the valgrind fallback arm below
      # still runs on the legacy back-end even though a `VAR=x cmd || ( ... )` assignment
      # does not reach the subshell. The invocation-A case filter is not repeated here: it
      # arrives from the job-level GTEST_FILTER, which does reach that subshell.
      #
      # BOUNDED, for the reason given in the job-level env block: an unbounded suite run
      # turns a hang into a job that consumes its whole workflow timeout at this step. The
      # `|| ( ... exit 1 )` contract is unchanged - a non-zero status still fails the step -
      # but the message now names what the status means, because 124 (the bound fired) and
      # 137 (SIGKILL after the grace period) are a hang, and 1 is ordinary test failure, and
      # the two want completely different investigations. $? inside the subshell is the
      # status of the run that just failed.
      - name: Run L1 Tests without valgrind
        timeout-minutes: 20
        run: >
          cd $GITHUB_WORKSPACE/hdmicec/tests/L1Tests
          &&
          CEC_TEST_AIDL_MODE=absent
          LD_LIBRARY_PATH=$GITHUB_WORKSPACE/install/usr/lib:${LD_LIBRARY_PATH}
          GTEST_OUTPUT="json:$GITHUB_WORKSPACE/rdkL1TestResults.json"
          timeout --kill-after="${L1_KILL_GRACE_SECONDS}s" "${L1_RUN_TIMEOUT_SECONDS}s"
          ./run_L1Tests --gtest_print_time=1 --gtest_output=json:$GITHUB_WORKSPACE/rdkL1TestResults.json || 
          (echo "::error::run_L1Tests exited $? - 124 means it did not finish inside the ${L1_RUN_TIMEOUT_SECONDS}s bound, 137 means it was SIGKILLed after the ${L1_KILL_GRACE_SECONDS}s grace period, any other value at or above 128 means death on a signal, and anything else is an ordinary test failure." && exit 1)
          &&
          cp -rf $GITHUB_WORKSPACE/rdkL1TestResults.json $GITHUB_WORKSPACE/rdkL1TestResultsWithoutValgrind.json

      # BOTH ARMS ARE BOUNDED, and they need different bounds. `make check-valgrind` is the
      # primary arm; the fallback runs the binary under memcheck directly, which is one to
      # two orders of magnitude slower than a native run, so it gets
      # L1_VALGRIND_TIMEOUT_SECONDS rather than the plain run bound. Bounding the make arm
      # as well costs nothing and closes the same hole. Neither insertion changes this
      # step's exit-status contract: the `||` still fires on any non-zero status from the
      # first arm, and the step still fails if the fallback fails.
      - name: Run L1 Tests with valgrind
        if: ${{ !env.ACT }}
        timeout-minutes: 75
        run: >
          cd $GITHUB_WORKSPACE/hdmicec/tests/L1Tests
          &&
          CEC_TEST_AIDL_MODE=absent
          LD_LIBRARY_PATH=$GITHUB_WORKSPACE/install/usr/lib:${LD_LIBRARY_PATH}
          GTEST_OUTPUT="json:$GITHUB_WORKSPACE/rdkL1TestResults.json"
          timeout --kill-after="${L1_KILL_GRACE_SECONDS}s" "${L1_VALGRIND_TIMEOUT_SECONDS}s"
          make check-valgrind || (
          timeout --kill-after="${L1_KILL_GRACE_SECONDS}s" "${L1_VALGRIND_TIMEOUT_SECONDS}s"
          valgrind
          --tool=memcheck
          --log-file=$GITHUB_WORKSPACE/valgrind_log
          --leak-check=yes
          --show-reachable=yes
          --track-fds=yes
          --fair-sched=try
          ./run_L1Tests )
          &&
          cp -rf $GITHUB_WORKSPACE/rdkL1TestResults.json $GITHUB_WORKSPACE/rdkL1TestResultsWithValgrind.json

      # The removal list below carries two globs for the AIDL include roots. Those roots
      # mean gcov can attribute records to header-only code it finds there -
      # halcompat.h's templates, the generated Bp*/Bn* inline
      # definitions, the Binder SDK headers - which would surface third-party entries in
      # this job's HTML report. Removing them is the same category as the '*/googletest/*'
      # entry that is already here.
      #
      # '*/ccec/src/*' is NEVER removed: that is where both back-ends and the selection
      # live, and it is the whole subject of the report.
      #
      # This step keeps its own lcov -c / lcov -r / genhtml shape and does not become a
      # call to run_coverage.sh. That script owns a different and larger job - the
      # five-invocation matrix, one capture read as two traces, and a per-branch gate -
      # and none of it belongs in a workflow that runs a single invocation. It runs the
      # lcov 2.0-1 "Install and assert lcov" installed, and lcov 2.x turns into fatal errors
      # conditions 1.x let pass: measured on this job's tree with gcov 13.4.0, a bare capture
      # stops at "mismatched end line" in the first test unit, and the removal and report then
      # have no trace to read. So each command carries the --ignore-errors list
      # tests/L1Tests/run_coverage.sh passes to the same command - LCOV_CAPTURE_IGNORE on the
      # capture, LCOV_FILTER_IGNORE on the removal, GENHTML_IGNORE on the report - spelled
      # identically; move them together. A class named once still prints as a warning; the
      # doubled deprecated is lcov's spelling for counting it in the message summary instead.
      - name: Generate coverage
        if: ${{ matrix.coverage == 'with-coverage' && !env.ACT }}
        run: >
          cd $GITHUB_WORKSPACE
          &&
          lcov -c
          --ignore-errors mismatch,gcov,unused,empty,negative,source,graph,inconsistent,corrupt,deprecated,deprecated
          -o coverage.info
          -d hdmicec
          &&
          lcov
          --ignore-errors unused,empty,inconsistent,deprecated,deprecated
          -r coverage.info
          '/usr/include/*'
          '*/install/usr/include/*'
          '*/stubs/*'
          '*/mocks/*'
          '*/googletest/*'
          '*/tests/*'
          '*/test_*.cpp'
          '*/rdk-halif-aidl/*'
          '*/binder_sdk/*'
          -o filtered_coverage.info
          &&
          genhtml
          --ignore-errors unused,empty,inconsistent,source,deprecated,deprecated
          -o coverage
          -t "hdmicec coverage"
          filtered_coverage.info

      # DO NOT CHANGE if-no-files-found BELOW FROM 'warn' TO 'error'.
      #
      # valgrind_log is written only inside the `|| ( ... )` fallback arm of the valgrind
      # step above. On a healthy run `make check-valgrind` succeeds, the fallback never
      # executes, and no valgrind_log exists - so 'error' would fail this job on every
      # SUCCESSFUL run. The 'warn' here is load-bearing, not laziness, and it is why the
      # new selected-back-end log gets its own upload step further up with
      # if-no-files-found: error instead of being appended to the path list below.
      - name: Upload artifacts
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 (v7.0.1)
        with:
          name: artifacts-L1-hdmicec-${{ matrix.coverage }}
          path: |
            coverage/
            tools/supply-chain-pins.txt
            valgrind_log
            rdkL1TestResultsWithoutValgrind.json
            rdkL1TestResultsWithValgrind.json
          if-no-files-found: warn

      # THE OTHER HALF OF THE SNAPSHOT, and the last step in the job on purpose.
      #
      # ./configure overwrote a TRACKED, HAND-EDITED source file - ccec/src/Makefile, which
      # configure.ac lists in AC_CONFIG_FILES - with Automake output. On a hosted runner the
      # workspace evaporates and nothing is lost; on a self-hosted runner it is reused, and
      # leaving generated output where the shipping RDK build source belongs is real damage
      # that outlives the job and silently changes the next run's shipping build. So the
      # content is put back from the snapshot the pre-configure step took.
      #
      # It runs LAST because until it does, the Automake version of that file is what any
      # make in this job would read. Nothing later than the test runs needs it, and putting
      # the swap-back before them would be a change nobody asked for.
      #
      # always(), so a failed build or a failed test run does not leave the tree swapped -
      # a cleanup that only runs on success is not a cleanup. It cannot mask an earlier
      # failure: the job is already failed by then, and this step reports only on its own
      # outcome.
      #
      # THREE THINGS IT REFUSES TO DO. It never runs `git checkout`, `git restore` or any
      # other index-based recovery: those restore what the index holds, which is a different
      # file from the working-tree content that was actually there whenever anything is
      # staged or locally modified - the exact trap tests/L1Tests/run_coverage.sh documents.
      # It never guesses: with no snapshot it says so and stops rather than inventing a
      # source of truth. And it never claims success it has not measured - the restore is
      # verified with cmp, and a restore that cannot be verified fails the job.
      - name: Verify and restore the hand-written ccec/src/Makefile
        if: ${{ always() }}
        run: |
          set -uo pipefail
          target="$GITHUB_WORKSPACE/hdmicec/ccec/src/Makefile"
          snap_dir="${RUNNER_TEMP:-/tmp}/hdmicec-hand-build-snapshot"
          snap="$snap_dir/ccec-src-Makefile"

          if [ ! -f "$snap" ]; then
            echo "::warning::no pre-configure snapshot exists at $snap, so ccec/src/Makefile is left exactly as this job left it. The snapshot is taken by the 'Build and verify the shipping hand-written RDK library' step; if that step did not reach its snapshot, there is nothing to restore from and this step will not guess - and it will not reach for git checkout, which would restore the index rather than the working-tree content that was there."
            exit 0
          fi

          anomaly=0
          if [ ! -f "$target" ]; then
            # The snapshot exists, so the file was there when the build started: something
            # in this job deleted a tracked source file. It is put back, and then this step
            # fails, because that is a defect and not a tidy-up.
            echo "::error::$target does not exist at all, although the snapshot proves it did when the shipping build ran, so a step in this job removed a tracked source file. Restoring it from the snapshot; this step will still fail."
            anomaly=1
            cp -p "$snap" "$target" || { echo "::error::the restore of $target from $snap failed."; exit 1; }
          elif cmp -s "$snap" "$target"; then
            echo "  ok  $target is byte-identical to the pre-configure snapshot; configure left it alone and there is nothing to restore"
            exit 0
          else
            # The expected case: configure regenerated it, which is exactly why the
            # snapshot was taken.
            echo "$target differs from the pre-configure snapshot, as expected after ./configure regenerated it; restoring the hand-written content"
            if ! cp -p "$snap" "$target"; then
              echo "::error::could not restore $target from $snap. The snapshot is still there: copy it back by hand. Do NOT use git checkout for this - it restores the index, not the working-tree content that was snapshotted."
              exit 1
            fi
          fi

          if ! cmp -s "$snap" "$target"; then
            echo "::error::$target still differs from $snap after the restore, so the hand-written RDK build source has NOT been recovered. The snapshot is intact; recover it by hand from $snap."
            exit 1
          fi
          echo "  ok  $target restored from the snapshot and verified byte-identical"
          # Read-only confirmation, and only that: if this workspace is a git checkout the
          # path should be reported clean. git is never used to perform the restore.
          if command -v git >/dev/null 2>&1; then
            git -C "$GITHUB_WORKSPACE/hdmicec" status --porcelain -- ccec/src/Makefile 2>/dev/null \
              | sed 's/^/  git status: /' || true
          fi
          if [ "$anomaly" -ne 0 ]; then
            echo "the hand-written ccec/src/Makefile had been deleted rather than merely regenerated; its content is back, but the deletion itself is a defect in this job and is reported as one." >&2
            exit 1
          fi
