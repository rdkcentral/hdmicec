  # THE BINDER SDK SOURCE IS PINNED TO A COMMIT, AND ITS RESOLUTION IS NOW FAIL-CLOSED.
  #
  # WHAT WAS WRONG. Both Binder SDK steps ran `./build_binder.sh` with BINDER_VERSION unset, and
  # their comments said that was deliberate because the script reads the committed pin out of
  # rdk-halif-aidl/binder_sdk.version. The script does read it - and then fails OPEN in three
  # separate places, each of which builds a DIFFERENT Binder SDK than the pin names, silently,
  # and none of which can be corrected inside the script, which is a read-only input here:
  #
  #   1. BINDER_VERSION="${BINDER_VERSION:-${_PINNED_BINDER_VERSION:-2.0.0}}" - an unreadable,
  #      empty or comment-only binder_sdk.version degrades to 2.0.0.
  #   2. its clone step returns SUCCESS with only a printed warning when the source directory
  #      already exists at a different ref, so a stale or substituted tree is built as it stands.
  #   3. a failed `git checkout "$BINDER_VERSION"` prints "using default branch" and carries on,
  #      so a ref that does not resolve becomes whatever the default branch is.
  #
  # THAT MATTERS MORE IN THIS JOB THAN IN THE HOSTED ONE. The i386 SDK built from this source is
  # STAGED INTO THE GUEST ROOT IMAGE THIS JOB UPLOADS, and libbinder is the component every
  # AIDL-path invocation runs against - so an unpinned source tree would put unaccounted code
  # into a published artefact and into the evidence the matrix produces.
  #
  # WHAT THIS JOB DOES INSTEAD. It resolves the source itself, at an immutable commit, once per
  # staging tree: each is checked out by actions/checkout at BINDER_SDK_COMMIT, its HEAD is
  # asserted before the build, the script is pointed at it through BINDER_SOURCE_DIR and given
  # the same commit as BINDER_VERSION, and THE HEAD IS ASSERTED AGAIN after the script returns
  # and before anything is built from or staged out of the tree - because arm 2 above means the
  # script's own existing-tree path only warns.
  #
  # binder_sdk.version IS STILL READ, and is now a GATE rather than a fallback: the job fails if
  # the file is missing, unreadable or carries no non-comment value, and fails if its value is
  # not BINDER_SDK_TAG. That is what keeps the pin living in rdk-halif-aidl and the commit
  # committed here from drifting apart.
  #
  # 2.6.0 IS AN ANNOTATED TAG, unlike the lightweight tags the action pins use: refs/tags/2.6.0
  # resolves to a TAG OBJECT (1b3148a1297fd4b8ad1c5e94b9e4a7a1b46a360a) and NOT to a commit. The
  # value below is the commit that tag points at - `git rev-parse refs/tags/2.6.0^{}` - because a
  # commit is what `git rev-parse HEAD` reports in a checkout and therefore the only thing an
  # assertion can compare against.
  #
  # L1-tests.yml carries these three values under the same three names; move them together.
  BINDER_SDK_REPOSITORY: rdkcentral/linux_binder_idl
  BINDER_SDK_TAG: '2.6.0'
  BINDER_SDK_COMMIT: e5035dc02d810d3c93e03188ca8e3fb7cb165c95 # tag 2.6.0 (annotated; tag object 1b3148a1297fd4b8ad1c5e94b9e4a7a1b46a360a)

