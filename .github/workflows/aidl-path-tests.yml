name: aidl-path-tests

# WHAT A GREEN TICK ON THIS JOB MEANS - AND WHAT IT DOES NOT.
#
# This job is the ONLY place the AIDL/Binder HAL back-end EXECUTES, so it is the sole
# producer of the dual-path evidence the migration rests on.
#
# It runs the COMPLETE five-invocation matrix - A through E - on ONE instrumented build on
# ONE machine, then a single coverage capture and the branch-arm gate:
#
#   A  run_L1Tests  no service reachable          -> LEGACY back-end   (the regression arm)
#   B  run_L1Tests  in-process compatible fake    -> AIDL back-end     (adapter translation)
#   C  run_L1Tests  in-process fake, hash "-1"    -> LEGACY back-end   (present-but-unusable
#                                                                       falls back)
#   D  run_L2Tests  fake host not launched        -> LEGACY back-end   (end-to-end round trip)
#   E  run_L2Tests  fake host launched and ready  -> AIDL back-end     (end-to-end round trip
#                                                                       over real binder IPC)
#
# B AND E ARE BOTH NEEDED AND NEITHER SUBSTITUTES FOR THE OTHER. An in-process fake is not
# IPC: libbinder resolves a locally registered name to the local BBinder, so interface_cast
# hands back that very object - no Bp* proxy, no transaction across the driver, no client
# threadpool involvement. That is why the L2 tier hosts the fake OUT OF PROCESS. Conversely,
# incompatible-service behaviour is reachable ONLY in-process, because local dispatch honours
# a virtual override of getInterfaceHash()/getInterfaceVersion() whereas a remote Bn* service's
# generated onTransact writes the compiled-in constants. Hence C has no L2 counterpart.
#
# .github/workflows/L1-tests.yml RUNS INVOCATION A ONLY. Its green tick is build-plus-legacy
# evidence and IS NOT DUAL-PATH EVIDENCE. Two different reasons keep the other four out of it,
# and they must not be merged into one sentence - an earlier revision of this comment said it
# "cannot run B, C, D or E", which is wrong about D and understates the case about the rest:
#
#   B, C AND E ARE UNSUPPORTED THERE. All three select the AIDL back-end, which needs a binder
#   kernel driver and a running servicemanager. A hosted GitHub runner has neither - measured on
#   an equivalent host as kernel 6.12.85+, "binder" absent from /proc/filesystems, no
#   /dev/binder*, "# CONFIG_ANDROID_BINDER_IPC is not set", no /lib/modules to load one from, no
#   /dev/kvm and no vmx/svm to virtualise one, and `mount -t binder` refused even with full
#   effective capabilities. Those three harnesses refuse BY NAME rather than downgrading to
#   legacy, so on that runner they would fail, not skip.
#
#   D IS UNSCHEDULED THERE, NOT INCAPABLE. D is the LEGACY L2 invocation: CEC_TEST_AIDL_MODE
#   =absent, no fake host launched, no binder anything. It runs on a driverless host perfectly
#   well - measured on such a host as 17 cases from 4 suites, 11 passed and 6 permitted
#   DualPathAidlFlowTest skips, exit 0. The hosted job simply does not schedule it, which is a
#   scope decision rather than a capability one: that job is specified to run invocation A only,
#   so adding D would change what its green tick means. D is therefore run HERE, in the matrix,
#   beside the arms it is meant to be compared against. Reading D as blocked by the kernel would
#   send somebody looking for a driver to fix a job that needs a step added.
#
# The kernel is still why this job boots a guest of its own instead of borrowing the hosted one;
# that reason applies to B, C and E, which is the grouping used at the matrix table below.
#
# INVOCATION A IS REPEATED HERE RATHER THAN IMPORTED FROM THE HOSTED JOB, BECAUSE GCOV
# COUNTERS CANNOT ACCUMULATE ACROSS MACHINES. The back-end selection resolves ONCE PER
# PROCESS - tests/L1Tests/test_main.cpp calls LibCCEC::getInstance().init("CEC_TEST") inside a
# global ::testing::Environment::SetUp, which is the first thing that forces
# Driver::getInstance() - so one binary run yields exactly one selection outcome and every
# outcome needs its own process. gcov counters DO accumulate across repeated runs of the same
# instrumented binary, so running all five invocations against one build on one machine before
# a single capture is the only way both arms of the selection branch land in one trace. That
# is precisely what the branch-arm gate needs. Do not "optimise" this by importing A's
# counters from elsewhere or by capturing between invocations.
#
# THERE IS NO strategy/matrix BLOCK, and its absence is deliberate rather than an omission on
# the way across from L1-tests.yml. That job matrixes over compiler and coverage; matrixing
# anything here would put the five invocations on more than one runner and fragment the single
# accumulated trace the branch-arm gate depends on. The only matrix in this job is the five
# RUNTIME INVOCATIONS of one build, which run_coverage.sh drives inside the guest.
#
# THE ORCHESTRATION IS NOT HERE. tests/L1Tests/run_coverage.sh owns, per invocation: the
# CEC_TEST_AIDL_MODE value, the select/exclude gtest filters, the zero-exit check, the
# executed-versus-registered case-count check, the assertion on the selected-back-end log
# line, and the deterministically named non-overwriting per-invocation artifacts. It also owns
# the zero-once / accumulate-across-all-five / capture-once counter policy and the two trace
# consumers (the branch-arm gate reads the UNFILTERED coverage.info because some of the arms
# live in halcompat.h; the 80% line gate reads its own filtered derivative). THIS WORKFLOW
# GREPS NO LOG, COUNTS NO TESTS, NAMES NO PER-INVOCATION ARTIFACT, FILTERS NOTHING AND
# CAPTURES NOTHING. It provisions a guest that can actually run binder, hands the guest the
# payload, and preserves what the guest produces.
#
# NOT MEASURED HERE AND NOT CLAIMED ANYWHERE. Performance parity and device-level L3
# validation are deferred human steps against target hardware. This job asserts no timing
# figure, no percentage, no aggregate coverage number and no pass claim for either. There is
# deliberately no performance-gate step.
#
# ----------------------------------------------------------------------------------------
# THIS FOLDER'S THREE PATHS, AND WHERE THEY SIT IN THE FINAL SCOPE.
#
# The diff gate for this migration is "exactly the TWENTY-SIX in-submodule paths" - 13
# modified and 13 added, measured with `git diff --name-status` inside hdmicec, the 26th being
# AIDL_HAL_MIGRATION_NOTES.md, which holds the design detail review moved out of the code
# comments - plus blitzy/documentation/Project Guide.md in the superproject, which makes
# TWENTY-SEVEN logical files (14 UPDATE counting the guide, 13 CREATE, 0 DELETE).
#
# Three of the twenty-six are here: L1-tests.yml, this file, and
# .github/workflows/aidl-path-tests-rootfs.sh. The rootfs builder is ONE OF THE TWENTY-SIX
# rather than an extra beyond them, and it is worth saying why it is in the set at all: it is
# authorised by the provisioning requirement - the guest root image must be built by a
# CHECKED-IN SCRIPT - which the file-by-file table never enumerated. It is not out of scope
# and it is not scope creep; it is the script this workflow is required to invoke rather than
# generate inline. Those three are the only paths this migration changes under .github/.
#
# ----------------------------------------------------------------------------------------
# BITNESS AND WIRE PROTOCOL: WHAT WAS SPECIFIED, WHAT IS REACHABLE, AND WHY.
#
# The guest userspace is ALL-32-BIT. That is not a preference: aidl-path-tests-rootfs.sh
# accepts only i386 or armhf, and both verify_sdk_tree and verify_payload_tree REFUSE any
# staged artefact whose ELF class or machine does not match. So the Binder SDK, both AIDL stub
# snapshots, servicemanager and GoogleTest are all built for i386 here.
#
# The binder WIRE PROTOCOL is a SEPARATE AXIS from the compile bitness, and this job runs
# PROTOCOL 7. That is the plan's requirement, not a preference: AAP 0.6.6.4 and 0.9.5.1 both
# specify a deliberately protocol-7 all-32-bit job with CONFIG_ANDROID_BINDER_IPC_32BIT=y. The
# mechanics, read from linux_binder_idl at the pinned tag 2.6.0 rather than assumed:
#
#   * BUILD.md:415-425 and CMakeLists.txt:733-739 both state the protocol is selected at build
#     time by BINDER_IPC_32BIT and is independent of the process bitness. ON compiles
#     -DBINDER_IPC_32BIT=1 into libbinder, which is protocol 7.
#   * CMakeLists.txt:724-727 shows TARGET_LIB32_VERSION emits a message and NOTHING ELSE; it
#     adds no -m32, which is why the generated toolchain file below supplies -m32 itself.
#     CMakeLists.txt:201-202 and :218-224 show TARGET_LIB32_VERSION defaults ON and drags
#     BINDER_IPC_32BIT ON with it, so protocol 7 is this SDK's own default for a 32-bit build;
#     the toolchain file states it as a CACHE entry anyway, because the plain set() path leaves
#     no cache entry and the value would then be unreadable by every check downstream.
#   * CMakeLists.txt:225-228 rejects only BINDER_IPC_32BIT=ON together with a NON-32-bit build.
#     ON with -m32 is the arm that passes, and BUILD.md:432-435 describes exactly it: "the
#     all-32-bit (protocol 7) build".
#   * BUILD.md:409-413 documents a strict protocol-version EQUALITY check when libbinder opens
#     the driver node. Kernel, SDK build and vendor must agree or EVERY open fails.
#
# WHY THE KERNEL NEEDS A PATCH, AND WHY THAT IS NOT A REASON TO ABANDON PROTOCOL 7.
# Protocol 7 also requires CONFIG_ANDROID_BINDER_IPC_32BIT in the kernel (BUILD.md:429-430, and
# upstream's own tests/qemu/kconfig/binder-ipc32.fragment). MAINLINE HAS NO SUCH OPTION AFTER
# 4.17: "ANDROID: binder: remove 32-bit binder interface" deleted the Kconfig entry and the
# matching "#define BINDER_IPC_32BIT 1" from drivers/android/binder.c. CONFIG_ANDROID_BINDERFS,
# which the in-guest init REQUIRES, exists only from 5.0. On a STOCK kernel the two are
# therefore mutually exclusive, and asking olddefconfig for a Kconfig symbol that does not
# exist silently produces nothing at all - so a job that leaves the option to the stock tree
# gets protocol 8 and no diagnostic, not protocol 7.
#
# WHAT MAKES PROTOCOL 7 CONSTRUCTIBLE ANYWAY is the SIZE of the removal. It was 13 lines of
# Kconfig plus 4 lines of binder.c and nothing else: include/uapi/linux/android/binder.h still
# carries both branches in 5.15 - "#ifdef BINDER_IPC_32BIT" still selects __u32 binder_size_t and
# BINDER_CURRENT_PROTOCOL_VERSION 7 - and so does the copy vendored inside the Binder SDK
# itself. So the "Restore CONFIG_ANDROID_BINDER_IPC_32BIT" step below re-adds the option to the
# pinned 5.15 tree with a minimal patch carried inline, fails hard if the patch does not apply
# cleanly, enables it, and ASSERTS CONFIG_ANDROID_BINDER_IPC_32BIT=y in the BUILT .config. The
# kernel pin stays on a binderfs-capable 5.15, so both requirements hold at once.
#
# TWO THINGS A FUTURE MAINTAINER SHOULD READ BEFORE "FIXING" THIS BACK:
#   1. Mainline has no CONFIG_ANDROID_BINDER_IPC_32BIT after 4.17. That is precisely why the
#      patch exists. Deleting the patch does not give you protocol 7 on a newer kernel; it
#      gives you protocol 8 and a plan violation.
#   2. The restored option against a 5.15 driver is UNPROVEN until this job first runs. Nobody
#      upstream exercises that pairing. That is why every layer ASSERTS the protocol instead of
#      assuming it: the built .config here, the SDK cache entry above, the derivation in
#      aidl-path-tests-rootfs.sh, and the in-guest four-source agreement check that ends at the
#      driver's own BINDER_VERSION ioctl. If the restoration does not work, one of those fails
#      by name and says which artefact to correct. None of them may be relaxed to make the job
#      green.
#
# The image manifest that aidl-path-tests-rootfs.sh writes carries a BINDER_PROTOCOL line. It
# is DERIVED there from the guest kernel configuration and the staged SDK's cache, and the
# script refuses to build an image when those two disagree - it declares nothing. The
# authoritative value at run time is the one the guest READS from /dev/binder and prints in the
# BINDER PLATFORM RECORD block on the console, alongside the kernel configuration it read from
# the running kernel and the SDK build flags it read from the staging tree. Those are only
# meaningful together, which is why the guest prints them as one block and why the console log
# is uploaded as evidence.
#
# ----------------------------------------------------------------------------------------
# WHAT AN ADVISORY VERDICT MEANS HERE, AND WHY IT IS STILL NOT A PASS.
#
# run_coverage.sh exits 0 only when the suite was run by that invocation, was green, and line
# coverage met the bar. Exit 1 is a failure. EXIT 3 IS ADVISORY AND IS NOT A PASS - the script
# says so in terms, and the image manifest's STATUS_FILE_FORMAT repeats it.
#
# ITS BRANCH_MANIFEST IS POPULATED, AND AN EMPTY ENTRY IS A REGRESSION. All 171 records - 168
# required arms plus 3 recorded unreachable by construction, selection.reason-unrecorded,
# compat.client-era-frozen and halcall.clock-unreadable - carry
# measured line, block and branch coordinates, read out of a real unfiltered trace and
# cross-checked against `gcov -b -c -t`.
# TWO OF THEM CARRY PER-ARC-LAYOUT ALTERNATIVES rather than a bare arc index, because gcc emits a
# different arc count for halcompat.h:168 on x86-64 (three block arcs) than on i386 (two), and a
# manifest holding one set reports a false ABSENT on the other architecture. The gate resolves
# them against the arc count in the trace it is judging; see resolve_branch_alternates(). apply_branch_gate treats an
# unpopulated record as an arm that was added without being measured and says so, so there are
# no empty fields to go hunting for: populating coordinates is not a step this job's first run
# leaves behind.
#
# WHAT ACTUALLY PRODUCES A NON-ZERO VERDICT NOW, in the order a reader will meet it:
#
#   * EXIT 1, THE PER-FILE LINE GATE, on any host where the binder transport turns out not to
#     be usable. run_coverage.sh defers invocations B, C and E in that case, and
#     ccec/src/DriverAidlImpl.cpp - 246 of whose 821 lines go unexecuted without them, against 78
#     on the full matrix (90.5%, 743/821) - falls below the 80% bar, measured at 70.0% (575/821)
#     on a driverless host. Its sibling
#     ccec/src/Driver.cpp clears the bar there at 80.0% (12/15), because the legacy-selection
#     arm of the factory is reached by invocations A and D; the aggregate clears it too, at
#     87.6% (2601/2969) over 32 source files. So the per-file half is the one that fails, and
#     it fails on one file. Per-file gating is on for an acceptance run, so that is a `die` and a
#     1, not an advisory. It is the outcome a driverless host measures today, and it is exactly
#     what this job's guest provisioning exists to change: binderfs, the device nodes and
#     servicemanager are all in place before run_coverage.sh starts, so a deferral here means
#     one of those did not come up and the console log's BINDER PLATFORM RECORD says which.
#
#   * EXIT 3, THE DEFERRED ARMS, when those same deferrals happen while the line figures still
#     clear the bar. 13 of the 168 required arms carry a prerequisite - 11 need invocation B, one
#     needs invocation C, and one needs a usable binder driver with no service registered on it,
#     which is a condition rather than an invocation letter - so a matrix that did not run them
#     leaves those 13 unmeasured. The remaining 155 required arms carry no prerequisite at all:
#     they are enforced and measured on every run, including one on a host with no binder driver,
#     so a zero on one of those is a failure here and now rather than a deferral. The gate
#     reports each deferred arm by name with the prerequisite it needed, never as a pass and
#     never as a failure of the test set: the cases exist, are compiled into the binaries, and
#     were not run. Those figures are BRANCH_MANIFEST's as it stands and are quoted here so this
#     block says something checkable; the gate counts and prints its own census per run, and its
#     numbers are the ones to trust if the two ever disagree.
#
#   * EXIT 3, A WEAKENED GATE. COVERAGE_MIN other than 80, --no-per-file-gate,
#     COVERAGE_GATE_EXEMPT_FILES, GTEST_EXTRA_ARGS, or a capture without --run each record an
#     advisory of their own. This job sets none of them - the in-guest init runs
#     `run_coverage.sh --build --run --output-dir <artifact dir>` and nothing else - so one
#     appearing here means something changed the invocation, and the reason is printed in the
#     COVERAGE ADVISORY block rather than left to be inferred.
#
#   * EXIT 3, AN UNCLASSIFIED DEPENDENCY HEADER in the line gate's trace: a record from outside
#     this submodule that the filter policy has not decided about, which moves the aggregate
#     denominator away from the recorded baseline. The remedy is to classify it deliberately in
#     run_coverage.sh's DEPENDENCY_EXCLUDES, not here.
#
# This workflow therefore FAILS on any status other than 0 - no "|| true", no
# continue-on-error, no special case for 3 - and its failure message names the causes above and
# the uploaded coverage.info and console log as the artefacts they are diagnosed from. Anything
# the diagnosis points at inside run_coverage.sh is a change to that script, which is a
# dependency of this file and is not modified here.
#
# The invariant that statement rests on, stated once so it can be checked: NO COMMAND WHOSE
# RESULT DETERMINES AN OUTCOME TOLERATES A FAILURE ANYWHERE IN THIS FILE. "continue-on-error"
# appears on no step. The handful of "|| true" occurrences sit on diagnostic prints and on
# captures that are ALLOWED to come back empty - a grep of a config file, say - and in every one
# of those cases the emptiness is then tested explicitly and turned into a named failure a few
# lines later. The verdict itself, and every assertion leading to it, is bare.
#
# "set +e" APPEARS ON EXACTLY ONE LINE, AND IT CAPTURES A STATUS RATHER THAN IGNORING ONE. The
# distinction is the whole of it: ignoring a status means carrying on as though the command had
# succeeded, while capturing one means reading it into a variable and then acting on it. The
# single occurrence wraps the `qemu ... | tee` pipeline in the "Boot the guest" step and nothing
# else - errexit off, the pipeline run, BOTH elements of PIPESTATUS copied by the very next
# command, errexit back on, and qemu and tee classified separately into a non-zero exit of their
# own. Without it errexit aborted the step AT the pipeline and every one of those classifications
# was unreachable in exactly the case it exists for. The full reasoning sits above that step.
# The verdict step is not in that region: it runs under `set -euo pipefail` and compares the
# status bare.

on:
  # A full TCG-emulated guest boot plus a five-invocation matrix and a coverage capture is
  # measured in hours, not minutes, so this is deliberately NOT wired to push or
  # pull_request. Per-commit regression evidence is L1-tests.yml's job (invocation A on a
  # hosted runner); this one runs on demand and on a schedule.
  workflow_dispatch:
    inputs:
      # THE TWO DIGEST INPUTS BELOW ARE NOT OVERRIDES, AND THAT IS THE WHOLE POINT OF THEM.
      #
      # Both lcov and the guest kernel are verified against a digest COMMITTED IN THIS FILE'S
      # env block, unconditionally, before the artefact is used. These inputs add a third
      # party to that comparison: when one is supplied it must AGREE with the committed value
      # and with the measurement, and any disagreement fails the job. Neither input can relax
      # a check, replace the committed digest or make an unverified artefact acceptable - an
      # input that could silently win over a committed pin would be a supply-chain hole with a
      # form field in front of it.
      lcov_expected_sha256:
        description: >-
          Optional third-party cross-check of the lcov release tarball's SHA256. Not an
          override: the job always verifies the tarball against LCOV_SHA256, which is
          committed in this workflow. Supplying a value adds the requirement that it equal
          both the committed digest and the measured one; any disagreement is a hard failure.
          Leave empty for the committed check alone.
        required: false
        default: ''
      kernel_expected_sha256:
        description: >-
          Optional third-party cross-check of the guest kernel tarball's SHA256. Not an
          override: the job always verifies the tarball against GUEST_KERNEL_SHA256 (committed
          here, published by kernel.org in its signed sha256sums.asc) and against the
          sha256sums.asc it fetches. Supplying a value adds the requirement that it equal all
          of those; any disagreement is a hard failure. Leave empty for the committed checks
          alone.
        required: false
        default: ''
      # THE BASE ROOT FILESYSTEM IS THE ONE INPUT THAT CANNOT HAVE A COMMITTED DIGEST, AND
      # THIS IS A REASONED EXCEPTION RATHER THAN THE SAME GAP THE THREE ABOVE HAD.
      #
      # THE NAMED CAUSE: debootstrap output is not reproducible. The tarball this job builds is
      # not published by anybody - the job creates it - and two runs of debootstrap over the
      # same immutable snapshot still differ, because the tarball captures mtimes, generated
      # files (ldconfig caches, dpkg state, /etc/machine-id and friends) and directory order
      # that debootstrap does not normalise, and it is assembled by whatever debootstrap
      # version the runner image happens to carry. So there is no digest that can be committed
      # in advance and no publisher to take one from, and inventing one would be a fabricated
      # measurement - the very thing that argument correctly rules out.
      #
      # WHAT PINS THE CONTENT INSTEAD: the package SOURCE is pinned, immutably, by
      # GUEST_DEBIAN_SNAPSHOT below - snapshot.debian.org serves the archive as it was at a
      # timestamp and never changes - and the resolved package set is recorded inside the image
      # and fingerprinted in its manifest. This input is therefore a RUN-TO-RUN CROSS-CHECK,
      # not a supply-chain pin: it turns "the base I built today differs from the base I built
      # last week" into a named failure.
      base_expected_sha256:
        description: >-
          Optional run-to-run cross-check of the base root filesystem tarball this job builds
          from the pinned Debian snapshot archive. Deliberately NOT a committed supply-chain
          pin: debootstrap output is not reproducible and no publisher issues a digest for it,
          so none can be committed in advance - the immutable snapshot pins the package source
          instead. When given, the measured digest must equal it and a difference is a hard
          failure. Leave empty on the first run, read the measured digest out of the log, and
          pass it thereafter.
        required: false
        default: ''
      debian_snapshot:
        description: >-
          Optional override for the pinned snapshot.debian.org timestamp the base and the
          in-image package set are taken from (default GUEST_DEBIAN_SNAPSHOT below). It must
          be a real snapshot timestamp in the archive's own YYYYMMDDTHHMMSSZ form; the job
          verifies it exists before using it and records it in the image and the manifest.
        required: false
        default: ''
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

env:
  # THE ACCEPTANCE TOOLCHAIN, PINNED IN ONE PLACE, AND PINNED TO THE MAJOR RATHER THAN THE
  # PATCH - WHICH IS A STATEMENT ABOUT WHAT IS ENFORCEABLE, NOT A RELAXATION.
  #
  # WHY IT IS PINNED AT ALL, AND WHY THIS JOB CARES MORE THAN THE OTHER ONE. This is the job
  # that produces the accumulated trace, the line gate and the per-arm branch gate. That gate
  # compares (file,line,block,branch) coordinates against a manifest checked into
  # tests/L1Tests/run_coverage.sh, and those coordinates are a property of the COMPILED source:
  # a different compiler major renumbers blocks and the gate then reports arms ABSENT that the
  # code still has - the loudest possible failure for the least interesting reason. gcov is
  # stricter still, refusing notes files whose version stamp does not match its own. So the
  # compiler is not something this job may inherit from whatever image it lands on.
  #
  # WHY THE MAJOR AND NOT 13.4.0. The documented acceptance patch level is GCC/G++/gcov 13.4.0,
  # which is what the reference container provides and what blitzy/documentation/Project Guide.md
  # §9.1 records. Ubuntu noble's archive supplies the gcc-13 family at
  # 13.3.0-6ubuntu2~24.04.1, and no distribution archive this job may use carries 13.4.0;
  # reaching it would mean adding an unpinned third-party PPA to a job that holds every other
  # fetched artefact to a publisher-issued digest. A gate demanding 13.4.0 would therefore fail
  # every run on a difference nobody can close from an archive, and a gate CLAIMING 13.4.0 while
  # accepting 13.3.0 would be a false statement in the place a reader trusts most. So the pin is
  # the MAJOR, enforced hard, and THE EXACT PATCH LEVEL IS RECORDED WITH THE RESULTS by "Select
  # and prove the acceptance toolchain" below - into the step log, the job summary, and (for the
  # guest) the image's own toolchain record.
  #
  # THE GUEST IS A SEPARATE ARCHIVE AND IS HANDLED SEPARATELY, not silently assumed to match:
  # this value is passed to the image builder as --toolchain-gcc-major, which selects the
  # versioned compiler when the guest's pinned Debian archive provides it and RECORDS A NAMED
  # LIMITATION when it does not. The guest's own gcc and gcov must agree with each other - that
  # is what its trace depends on - and whether they agree with THIS value is reported rather
  # than presumed.
  #
  # ONE PLACE, so the two jobs cannot drift: .github/workflows/L1-tests.yml carries the same
  # value under the same name for the same reason. Move them together.
  CEC_TOOLCHAIN_GCC_MAJOR: '13'

  # rdk-halif-aidl is a SIBLING SUBMODULE OF THE SUPERPROJECT, not of hdmicec: hdmicec has no
  # .gitmodules of its own and actions/checkout fetches no submodules, so nothing brings this
  # tree in implicitly. The ref is a COMMIT SHA on purpose - it is the superproject gitlink,
  # i.e. exactly the content this migration was developed against. A branch name would be
  # ambiguous: .gitmodules says "blitzy", the workspace README says "develop", and a worktree
  # reports "main". No token or secret is named anywhere in this file.
  AIDL_REPOSITORY: Blitzy-Sky/rdk-halif-aidl

  # THE SINK PLUGIN SOURCE, WHICH THE L1 SUITE READS AND WITHOUT WHICH INVOCATION A CANNOT
  # PASS. tests/L1Tests/ccec/test_DriverAidl.cpp carries a drift guard --
  # DriverAidlLocalInstanceTest.TheModelledSinkCallPathsStillMatchTheRealSinkSource -- that
  # reads entservices-hdmicecsink/plugin/HdmiCecSinkImplementation.cpp and FAILS HARD when it
  # cannot find it. That is deliberate on the test's part: the difference-3 case it protects
  # asserts against a MODEL of the plugin's two addLogicalAddress call paths, and a model
  # nothing checks against its subject is not evidence about a caller. Measured: without this
  # checkout the guest built the whole instrumented tree under emulation and then failed
  # invocation A on that one case, 566 of the 567 cases invocation A selected when that was
  # measured. The contract suite has grown since, so re-measure the pair rather than adjusting it.
  #
  # Like rdk-halif-aidl this is a SIBLING SUBMODULE OF THE SUPERPROJECT, so nothing brings it
  # in implicitly, and the ref is the superproject gitlink commit rather than a branch: the
  # guard's value comes from reading a REVIEWED revision, so a drift is noticed when somebody
  # deliberately bumps this pin and a human is present to decide whether the model must be
  # re-derived. Bumping it without re-deriving the model is what the guard exists to catch.
  SINK_REPOSITORY: Blitzy-Sky/entservices-hdmicecsink
  SINK_REF: 2ad7e1a4712908a4d0fb838caebcbfcaabba55d8
