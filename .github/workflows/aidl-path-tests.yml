  # Two CMake installations coexist, and BOTH ARE EXACT RELEASES. The job-wide one stays on the
  # project's pin because the rest of the chain depends on it; the Binder SDK's one is reached
  # ONLY by a step-scoped PATH prepend, because build_binder.sh and build_modules.sh call bare
  # "cmake" and neither offers any override hook (no CMAKE_BIN, no CMAKE_COMMAND, no
  # "command -v cmake", no CMAKE=), so an absolute path is not implementable for them. The SDK
  # pin belongs to the BINDER SDK specifically: 3.22.1 is the version linux_binder_idl's BUILD.md
  # names for the 2.6.0 tag, while the AIDL snapshot's own CMakeLists declares
  # cmake_minimum_required 3.8. It is pinned EXACTLY, not used as a floor: "Resolve the CMake
  # installations" always fetches and digest-verifies CMAKE_SDK_VERSION itself, so whichever
  # cmake the runner image or apt happens to carry never builds the SDK.
  #
  # THE JOB-WIDE PIN IS AN EXACT RELEASE, NOT A SERIES. It used to read '3.16.x' and was handed
  # to a third-party setup action, which made it two problems in one line: the patch level was
  # chosen by the action at run time, so the toolchain could move with no byte changing here;
  # and the archive was downloaded OUT OF BAND, so nothing this job could compute would show
  # that the CMake it then ran was bytes Kitware published. "Set up CMake" below now fetches the
  # exact release itself and holds it to the committed publisher digest below before it is
  # unpacked. 3.16.9 is the last patch release of the series the project pins, so only the patch
  # level is new; the series is unchanged and still load-bearing, because 3.20 and later break
  # the plugin test-library configure.
  CMAKE_PINNED_VERSION: '3.16.9'
  CMAKE_SDK_VERSION: '3.22.1'

  # THIS JOB FETCHES FOUR EXECUTABLE ARTEFACTS AND VERIFIES ALL FOUR AGAINST A DIGEST
  # COMMITTED HERE, BEFORE USE, WITH NO OPTIONAL PATH THROUGH THE CHECK.
  #
  # WHY A COMMITTED CONSTANT RATHER THAN A MEASUREMENT. Measuring an artefact's digest and
  # comparing it only when a workflow_dispatch input happens to carry an expected value checks
  # nothing on an ordinary run: sha256sum of a file this job just downloaded proves only that
  # the download did not corrupt itself. A hard-coded constant is a fabricated measurement when
  # the job is the one that measured it, and is NOT one when the PUBLISHER issued it - that
  # distinction is the whole of the policy. A digest the publisher issued, committed in this
  # file and reviewed with it, is an independent statement about which bytes are the right
  # bytes.
  #
  # SO EACH VALUE BELOW IS PUBLISHER-ISSUED, NOT MEASURED HERE, and its provenance is named
  # beside it. A mismatch is a hard failure; a MISSING expected value is a hard failure too,
  # which is what "fail closed" means - there is no arm that records a digest instead of
  # checking it.
  #
  # A COMMITTED DIGEST IS VALID FOR EXACTLY ONE VERSION. Each digest is therefore paired with a
  # *_SHA256_FOR_VERSION value naming the release it was published for, and every verifying
  # step compares that against the version actually in use and fails by name when they diverge.
  # Bumping CMAKE_PINNED_VERSION, CMAKE_SDK_VERSION, LCOV_VERSION or GUEST_KERNEL_VERSION without
  # its digest stops the job at the version guard rather than checking a digest against the
  # wrong artefact.
  #
  # The fifth fetched input, the debootstrapped base root filesystem, is deliberately NOT in
  # this set: nobody publishes a digest for a tarball this job creates, and debootstrap output
  # is not reproducible. See the base_expected_sha256 input above for the full reasoning and
  # for what pins that input instead.
  #
  # CMake 3.22.1 for x86_64 Linux - the Binder SDK's, fetched and verified on every run by
  # "Resolve the CMake installations". Source of the digest: Kitware's own release manifest
  # cmake-3.22.1-SHA-256.txt, published as an asset of the v3.22.1 release alongside the
  # tarball it describes. L1-tests.yml carries CMAKE_SDK_VERSION and these two values under the
  # same three names and resolves the SDK's CMake the same way; move them together.
  CMAKE_SDK_SHA256: '73565c72355c6652e9db149249af36bcab44d9d478c5546fd926e69ad6b43640'
  CMAKE_SDK_SHA256_FOR_VERSION: '3.22.1'

  # CMake 3.16.9 for x86_64 Linux - the JOB-WIDE one, fetched and verified by "Set up CMake".
  # Source of the digest: Kitware's own release manifest cmake-3.16.9-SHA-256.txt, published as
  # an asset of the v3.16.9 release alongside the tarball it describes.
  #
  # ITS ASSET NAME USES A CAPITAL L, AND THAT IS AN ERA DIFFERENCE RATHER THAN A TYPO: Kitware
  # named these assets cmake-<v>-Linux-x86_64.tar.gz through the 3.19 series and
  # cmake-<v>-linux-x86_64.tar.gz from 3.20 onwards, so this tarball and the 3.22.1 tarball
  # above genuinely spell the platform differently. Each step composes its own name from its own
  # version, which is what keeps each version to one spelling.
  #
  # L1-tests.yml carries these three values under the same three names and resolves its job-wide
  # CMake the same way; move them together.
  CMAKE_PINNED_SHA256: '96d79367dcafb47d606573a4687021d3cb18dd53d83458fc1d6d9c89bf31b553'
  CMAKE_PINNED_SHA256_FOR_VERSION: '3.16.9'

  # lcov 2.x is a HARD prerequisite of run_coverage.sh, which uses --fail-under-lines and
  # --rc branch_coverage=1 and parses 2.x record spellings; the suite's .lcovrc_l1 is written
  # in 2.x spellings too. Stable distribution archives ship 1.x. 2.0 specifically, because the
  # runner's measured corrections were verified against lcov 2.0-1, and the RELEASE ASSET
  # rather than the auto-generated source archive, because only the asset ships the .version
  # file lcov's own version detection falls back on.
  LCOV_VERSION: '2.0'

  # The digest of that release asset, lcov-2.0.tar.gz (391695 bytes). It is the value published
  # with the linux-test-project/lcov v2.0 release, and it is corroborated INDEPENDENTLY by a
  # second distributor: Gentoo's dev-build/lcov Manifest lists this artefact at the same 391695
  # bytes with SHA512
  #   b19b6debc93c0de0e7e5b2aaffa6c74d20a1313ea4d20d8731c6a5ea7f4cc40933316d28ef791c91fdc12ca77
  #   c9449a388405f3dc0793588e366b72f596ab49b
  # which matches the release asset byte for byte, so the SHA-256 below is the SHA-256 of the
  # artefact Gentoo also distributes. Two publishers, one artefact - which is what makes this a
  # cross-check rather than a restatement of the download.
  #
  # It matters more here than for the other three: this tarball is not merely extracted, it is
  # `sudo make install`ed onto the runner and the same tarball is installed inside the guest
  # image by aidl-path-tests-rootfs.sh, so an unverified one would be root-installed twice.
  #
  # L1-tests.yml carries LCOV_VERSION and these two values under the same three names and
  # installs the same asset; move them together.
  LCOV_SHA256: '1857bb18e27abe8bcec701a907d5c47e01db4d4c512fc098d1a6acd29267bf46'
  LCOV_SHA256_FOR_VERSION: '2.0'

  # The guest kernel. THE SERIES IS 5.15 FOR THREE STRUCTURAL REASONS AND THE POINT RELEASE IS
  # THE CURRENT ONE FOR A SECURITY REASON; the two halves of the pin are chosen differently and
  # are kept apart here on purpose.
  #
  # WHY THE 5.15 SERIES. It is the series upstream linux_binder_idl's own default QEMU matrix
  # uses at tag 2.6.0 (tests/qemu/build-kernels.sh:45), it sits inside the documented supported
  # range whose floor is 4.9 (BUILD.md:441), it is at or below 5.17 so CONFIG_ASHMEM still
  # exists - it was removed in 5.18 - and it is at or above 5.0 so CONFIG_ANDROID_BINDERFS
  # exists. The other clean 5.x entry in that matrix, 5.16.20, is explicitly flagged in
  # BUILD.md:487 for SELinux context issues with binder, so it is not used here.
  #
  # WHY THE POINT RELEASE IS THE CURRENT LONGTERM AND NOT THE MATRIX'S OWN. This value used to
  # be 5.15.148, which is the literal entry in that upstream matrix. A point release is not a
  # structural choice, though - it is a security choice, and an old one is a stale one. An OSV
  # query by the commit v5.15.148 resolves to returns 561 advisories (36 CRITICAL, 239 HIGH,
  # 24 MEDIUM, 1 LOW, 261 without CVSS); the same query for v5.15.219 returns none. TWO of the
  # 561 are in the binder driver itself - CVE-2024-26926 and CVE-2024-46740, both 7.8, fixed in
  # 5.15.157 and 5.15.167 respectively - so the stale pin carried known defects in THE EXACT
  # SUBSYSTEM THIS JOB EXISTS TO VALIDATE. A compromised or crashing validation guest falsifies
  # the evidence this job publishes, which is why this is treated as a supply-chain pin and not
  # as a detail of a test fixture.
  #
  # 5.15.219 IS THE CURRENT 5.15 LONGTERM RELEASE, verified against kernel.org's own
  # releases.json ("longterm", 5.15.219, released 2026-08-28) and as the highest linux-5.15.*
  # entry in the signed digest list named below. Moving it again is a two-value edit plus a
  # re-verification of the patch: see the next block and the restoration step.
  #
  # THE PIN DOES NOT MOVE SERIES FOR THE SAKE OF PROTOCOL 7. This job is a protocol-7 job (AAP
  # 0.6.6.4, 0.9.5.1) and mainline carries CONFIG_ANDROID_BINDER_IPC_32BIT only up to 4.17,
  # which is far below the binderfs floor the in-guest init needs. Dropping to a 4.x kernel to
  # get the option would give up binderfs, which the plan requires as an always-required
  # option; so the option is RESTORED on this pin by a minimal patch the workflow carries
  # inline. The restoration hunks are held to THE PINNED VERSION's own
  # drivers/android/{Kconfig,binder.c,Makefile} by a dry run that fails by name; they were
  # RE-VERIFIED against linux-5.15.219 when this pin moved, rather than assumed to survive it -
  # `patch -p1 --dry-run --forward` returned 0 with no fuzz and no offset on all three files,
  # and the three preconditions in that step were re-checked against the same tree. If this pin
  # moves again, do that again; the hunks must be re-derived rather than forced.
  GUEST_KERNEL_VERSION: '5.15.219'

  # The digest of linux-5.15.219.tar.xz. Source: kernel.org's PGP-SIGNED sha256sums.asc under
  # pub/linux/kernel/v5.x/, which is the release directory's own signed digest list. Committing
  # it closes the gap that fetching sha256sums.asc from the same origin as the tarball leaves
  # open on its own - one origin serving both halves can serve a matching pair. The fetch step
  # keeps that comparison as well, so the tarball has to satisfy the value reviewed with this
  # file AND the list published beside it.
  #
  # THIS VALUE WAS RE-DERIVED FROM THE SIGNED LIST WHEN THE PIN MOVED, NOT COPIED FROM A
  # SUGGESTION, and the signature on the list was checked rather than assumed: `gpg --verify`
  # on sha256sums.asc reports a good signature from "Kernel.org checksum autosigner
  # <autosigner@kernel.org>", RSA key B8868C80BA62A1FFFAF5FDA9632D3A06589DA6B1, made
  # 2026-08-28. The 126,879,692-byte tarball was then downloaded and its measured sha256
  # matched the signed entry exactly.
  GUEST_KERNEL_SHA256: 'd04a4f798cc26f81170b5ecb27a3d8c8b4838f3aaf2a431b577043e2ead05ca4'
  GUEST_KERNEL_SHA256_FOR_VERSION: '5.15.219'

  # Debian bookworm i386. bookworm rather than an older suite is a REQUIREMENT, not a
  # preference: the staged i386 libraries are compiled on this runner and then loaded inside
  # the guest, so the guest's runtime has to define every symbol version they reference.
  #
  # AN EARLIER REVISION OF THIS COMMENT JUSTIFIED THAT BY COMPARING SUITE VINTAGES - bookworm's
  # i386 glibc being newer than ubuntu-22.04's, "the safe direction". That test was wrong twice
  # over and is replaced rather than patched. It is wrong in FACT for this job now, because the
  # runner moved to ubuntu-24.04 to reach the pinned GCC 13 family and noble's glibc is newer
  # than bookworm's. And it was wrong in PRINCIPLE even when it held: an ELF does not require
  # the glibc it was built on, it requires the versions its referenced symbols were introduced
  # at, which for ordinary C++17 code sit far below any current release - measured on a
  # gcc-13-built 32-bit C++17 object using std::string, std::vector, std::mutex and exceptions:
  # GLIBC_2.0, GLIBC_2.1.3, GLIBC_2.4, GLIBCXX_3.4, GLIBCXX_3.4.11, GLIBCXX_3.4.21, CXXABI_1.3,
  # GCC_3.0 - every one satisfied by a bookworm i386 userspace with room to spare. So a newer
  # build host is usually harmless and occasionally fatal, and which one it is cannot be read
  # off two suite names.
  #
  # WHAT REPLACES THE ARGUMENT IS A MEASUREMENT. aidl-path-tests-rootfs.sh asks the IMAGE'S OWN
  # LOADER, in assert_image_staged_libraries_loadable: it runs `ldd` inside the image over the
  # six-library Binder closure, both AIDL stub libraries and servicemanager, and fails the image
  # build - naming the artefact, the unmet requirement and the three remedies - on a library the
  # loader cannot find or a symbol version the guest's runtime does not define. That check runs
  # after ldconfig has registered the staged directories, and it is what makes the guest's
  # gate-and-record compiler pin safe rather than merely documented.
  #
  # i386 is a fully supported architecture in this suite.
  GUEST_DEBIAN_SUITE: bookworm
  GUEST_ARCH: i386

  # THE PACKAGE SOURCE IS AN IMMUTABLE, DATE-PINNED SNAPSHOT, NOT A LIVE MIRROR.
  #
  # WHY NOT A LIVE MIRROR. deb.debian.org serves the CURRENT contents of a suite. bookworm is a
  # stable release, so its package set moves slowly - but it does move, on every point release
  # and every security update, and a rebuild after one produces a different base tarball, a
  # different digest and a different toolchain inside the guest. A job whose whole purpose is to
  # produce coverage evidence cannot have "which day was it built on" as an input to that
  # evidence, and the digest mechanism could only ever REPORT such a difference after the fact,
  # never prevent it.
  #
  # snapshot.debian.org serves the archive AS IT WAS at a timestamp, immutably. Pinning it
  # gives a reproducible base AND a reproducible in-image package set from one value, which is
  # why the same URL is handed to the image builder as --apt-mirror: the packages installed
  # inside the image come from the same archive state the base was unpacked from.
  #
  # PACKAGE VERSIONS ARE PINNED BY THE ARCHIVE, NOT BY A LIST. Naming a version for each of
  # the two dozen packages the image needs would be a list that rots on the first rebuild and
  # tells a reader nothing about what actually got installed. The immutable archive pins them
  # all by construction, and the exact resolved set - every package, version and architecture
  # - is recorded INSIDE the image and named in the manifest, so what was installed is
  # verifiable after the fact rather than asserted before it.
  #
  # IMMUTABLE IS NOT THE SAME AS SAFE, AND THE TIMESTAMP IS A SECURITY PIN AS WELL AS A
  # REPRODUCIBILITY ONE. An immutable archive freezes the package set - including every defect
  # that was unfixed on that date. The pin used to be 20240701T000000Z, which serves bookworm
  # 12.6 (Release dated 29 Jun 2024): a dependency scan of the resulting guest package set
  # returned 141 vulnerable records, 33 of which are removed simply by updates that are already
  # in Bookworm and that a later snapshot therefore serves. Holding a two-year-old snapshot for
  # reproducibility bought nothing that a current snapshot does not also buy, because any
  # snapshot timestamp is equally immutable; what it cost was those 33 records.
  #
  # THIS TIMESTAMP IS VERIFIED, AND HERE IS THE VERIFICATION. Fetched directly from
  # snapshot.debian.org while this pin was chosen:
  #   .../archive/debian/20260801T000000Z/dists/bookworm/Release  ->  HTTP 200
  #     Origin: Debian   Suite: oldstable   Version: 12.15   Codename: bookworm
  #     Date: Sat, 11 Jul 2026 10:16:37 UTC   Architectures: ... i386 ...
  #   .../main/binary-i386/Packages.gz  ->  HTTP 200, 11927458 bytes,
  #     Last-Modified: Sat, 11 Jul 2026 10:39:07 GMT
  # The i386 binary index is checked as well as the Release file because GUEST_ARCH is i386 and
  # a snapshot that served the suite but not the architecture would fail inside debootstrap.
  # Comparing the two binary-i386 indices package by package confirms the security effect
  # rather than assuming it: git 1:2.39.2-1.1 -> 1:2.39.5-0+deb12u3, libglib2.0-0
  # 2.74.6-2+deb12u3 -> 2.74.6-2+deb12u9, perl 5.36.0-7+deb12u1 -> 5.36.0-7+deb12u3, gcc-12
  # 12.2.0-14 -> 12.2.0-14+deb12u1.
  #
  # WHAT THE REPIN DOES NOT CHANGE. gcc-13 is absent from the bookworm binary-i386 index at BOTH
  # timestamps, so the guest's compiler is still gate-and-record rather than pinned to the
  # acceptance major, exactly as it was; the repin neither creates nor removes that limitation.
  # And no digest committed in this file is derived from the snapshot: the only digest comparison
  # in the base path is base_expected_sha256, which is a workflow_dispatch input with no
  # committed default because debootstrap output is not reproducible. So there is nothing here
  # to re-derive, and nothing stale left behind.
  #
  # The job STILL verifies at run time that the snapshot exists and serves the suite before it
  # commits an hour of work to it, failing by name if it does not, and it prints the archive's
  # own Release metadata so the recorded evidence comes from the archive rather than from this
  # comment. Move it deliberately - with the workflow_dispatch input above or by editing this
  # value - re-verify the Release file and the i386 index as above, and expect the base digest
  # to change when you do.
  # ONE SOURCE OF TRUTH FOR THE TIMESTAMP. The archive URL is composed from these two values
  # in the step below and exported for the later steps, rather than written out with the
  # timestamp embedded a second time: two copies of a pin are a pin that can disagree with
  # itself, which is the class of defect this whole file is being corrected for.
  GUEST_DEBIAN_SNAPSHOT: '20260801T000000Z'
  GUEST_DEBIAN_SNAPSHOT_ARCHIVE: 'https://snapshot.debian.org/archive/debian'

  # Larger than the image builder's own default because the guest does a full autoreconf,
  # configure and three-pass make of an instrumented tree, runs five invocations, and then
  # writes an lcov HTML report into the same filesystem.
  GUEST_IMAGE_SIZE_MIB: '8192'

  # The guest's bounded wait for servicemanager to answer a real binder transaction. It is a
  # poll on a transaction, never a sleep.
  GUEST_READINESS_TIMEOUT_SECONDS: '300'

  # THE VIRTUALIZATION BOUNDARY IS A DEPENDENCY, NOT A UTILITY, AND IT IS PINNED LIKE ONE.
  #
  # WHAT THE BOUNDARY ACTUALLY IS. This job boots a guest that runs REPOSITORY-CONTROLLED code
  # as root, and the only thing between that guest and the runner's own process memory is the
  # qemu-system-i386 process. So qemu is not "the tool that runs the test", it is the trust
  # boundary the test's evidence depends on - and it was, until these two values existed, the
  # one input in this job installed from apt with no version recorded and no floor enforced.
  #
  # WHY A FLOOR RATHER THAN AN EXACT PIN. Ubuntu serves one qemu per pocket and this job takes
  # it from the runner's archive, so an exact pin would fail the job on every security revision
  # Canonical publishes - the opposite of what is wanted. A FLOOR can only ever be crossed
  # downwards, and downwards is precisely the direction that matters: it refuses a runner image,
  # a stale mirror or a self-hosted host that offers an OLDER qemu than the one this pin was
  # reviewed against, by name, instead of accepting it silently.
  #
  # TWO VALUES BECAUSE THERE ARE TWO VERSIONS AND THEY MOVE INDEPENDENTLY. The upstream release
  # (what `qemu-system-i386 --version` prints) fixes which QEMU codebase is emulating; the
  # Ubuntu package revision fixes which of Canonical's security patches are in it. A run on
  # 8.2.2 built from 1:8.2.2+ds-0ubuntu1 rather than ...1.18 is missing published fixes while
  # reporting an identical program version, so checking only the first would miss exactly the
  # class of staleness this pin exists to catch. Both were read from Launchpad's published
  # binaries for noble/amd64: Release 1:8.2.2+ds-0ubuntu1, noble-updates 1:8.2.2+ds-0ubuntu1.18,
  # noble-security 1:8.2.2+ds-0ubuntu1.16 - so the floor below is the newest AVAILABLE revision
  # and is installable on this runner label.
  #
  # WHAT THE FLOOR DOES NOT FIX, STATED HERE SO IT IS NOT READ AS A CLEAN BILL OF HEALTH.
  # CVE-2026-48914 - a malformed virtio-blk request producing an out-of-bounds write in the
  # QEMU host heap - affects QEMU THROUGH 11.0.1, so NO version satisfies it and no floor can.
  # CVE-2024-8612 - uninitialized bounce-buffer contents disclosed to the guest through
  # virtio-blk/virtio-scsi/virtio-crypto - is likewise unfixed in the affected package list.
  # Both are virtio-specific, which is why this job's answer is not a version bump: the root
  # disk is attached to an emulated AHCI controller and CONFIG_VIRTIO_BLK is asserted ABSENT
  # from the guest kernel, so the vulnerable device model is never instantiated. The boot step
  # additionally confines the qemu process itself with a seccomp sandbox. The floor's job is
  # the residual: everything else in an 8.2.2 that a newer revision has already fixed.
  QEMU_MIN_PROGRAM_VERSION: '8.2.2'
  QEMU_MIN_PACKAGE_VERSION: '1:8.2.2+ds-0ubuntu1.18'

  # THE SECCOMP CONFINEMENT APPLIED TO THE QEMU PROCESS ITSELF, IN ONE PLACE, so the probe that
  # proves the binary supports it and the boot that relies on it cannot disagree about the key
  # set. All four denials are safe for THIS invocation specifically, and each is safe for a
  # reason rather than by default:
  #
  #   obsolete=deny           blocks the obsolete syscall group. Nothing here uses them.
  #   elevateprivileges=deny  blocks the setuid/setgid family. This job does not pass -runas
  #                           and does not run qemu under sudo, so qemu never needs to drop
  #                           privilege - which is the one thing this denial would break.
  #   spawn=deny              blocks fork/exec. This invocation has no -netdev helper, no
  #                           bridge helper, no migration exec target, no smbd and no
  #                           chardev/backend that spawns a process, so qemu spawns nothing.
  #   resourcecontrol=deny    blocks the scheduler/priority calls. No -overcommit, no
  #                           realtime priority request and no CPU affinity request is made.
  #
  # This is what BOUNDS CVE-2026-48914's host-side impact: a heap corruption inside a process
  # that cannot exec, cannot regain privilege and cannot reschedule is a far smaller primitive
  # than the same corruption in an unconfined one. It is a bound, not a fix - the fix is not
  # instantiating virtio-blk at all, above.
  QEMU_SANDBOX_OPTIONS: 'on,obsolete=deny,elevateprivileges=deny,spawn=deny,resourcecontrol=deny'

  # A backstop only: the guest powers itself down when the run finishes. Hosted runners have
  # no /dev/kvm, so the guest runs under TCG emulation and is slow; this allowance is sized
  # for that and still leaves the job's own timeout room to run the teardown and the uploads.
  QEMU_TIMEOUT_SECONDS: '16200'

jobs:
  aidl-path-tests:
    name: Build both HAL back-ends and run the full A-E matrix on a binder-capable guest
    # ubuntu-24.04 RATHER THAN ubuntu-22.04, AND THE ARCHIVE IS THE WHOLE REASON.
    #
    # This job used to run on ubuntu-22.04 and install an unversioned `g++`, so the compiler that
    # produced the host-side staging - and, through CC/CXX, everything CMake picked up for the
    # i386 cross-compiles below - was whichever one that image defaulted to. Pinning the family
    # (see CEC_TOOLCHAIN_GCC_MAJOR in this file's env) is only possible on a runner whose archive
    # carries it: jammy carries NO gcc-13 family at all, while noble carries gcc-13 and g++-13 at
    # 13.3.0-6ubuntu2~24.04.1 for amd64 AND i386 - the second half mattering here specifically,
    # because this job stages an all-32-bit guest userspace and needs the multilib variants of
    # the same family. Staying on jammy and adding a PPA would introduce an unpinned third-party
    # archive into a job that pins every other input to a digest, so it is not an alternative.
    #
    # Noble's own default gcc is already the 13 family, so the versioned install below is belt
    # and braces rather than a change of compiler. That is deliberate: the selection must not
    # depend on which default an image happens to carry, and the gate step proves what was
    # selected either way.
    runs-on: ubuntu-24.04

    # LEAST PRIVILEGE, DECLARED AT THE JOB RATHER THAN LEFT TO INHERITANCE.
    #
    # This file already declares `permissions: contents: read` at the workflow level, and that
    # is inherited - but only for as long as nothing above overrides it. Declaring it HERE fixes
    # the scope of the token THIS job's steps receive, which matters because of what those steps
    # do rather than as a formality: ten actions/checkout invocations and three
    # actions/upload-artifact invocations run with it, each executing a pre-bundled dependency
    # tree that the PIN AUDIT RECORD below records a residual against, on the same filesystem as
    # the guest root image this job publishes as an artifact. A token that can only read
    # repository contents bounds what a defect in any of that code can reach.
    #
    # `contents: read` IS SUFFICIENT AND NOTHING MORE IS. This job checks out seven repositories,
    # builds, boots a guest and uploads artifacts. It opens no issue, writes no check, publishes
    # no package, requests no id-token and pushes nothing, and artifact upload is served by the
    # Actions artifact service rather than by a `permissions:` scope. Anything added here would
    # be privilege this job has no use for.
    permissions:
      contents: read

    # A hosted runner's ceiling is 360 minutes. This is set just below it, and it is an honest
    # allowance rather than a promise: under TCG emulation the in-guest build plus five
    # invocations plus the lcov capture may genuinely not finish. When it does not, the QEMU
    # step reports a timeout, the artifacts already written into the image are still extracted
    # and uploaded by the always() steps below, and the job fails. It does not silently pass.
    timeout-minutes: 350

    # THE FOUR NAMES BELOW ARE THE ONES configure.ac DECLARES WITH AC_ARG_VAR, spelled
    # identically here, on the ./configure line further down, and in tests/L1Tests/run_coverage.sh.
    # configure derives from them the four AIDL/Binder include roots, the two library
    # directories, the four -l edges and the C++17 flag, and substitutes those into
    # ccec/src/Makefile.am, tests/L1Tests/Makefile.am and tests/L2Tests/Makefile.am. Renaming
    # one here silently drops a back-end out of the library, so they are not paraphrased.
    #
    # HALIF_LIB_DIR and BINDER_SDK_INCLUDE_DIR are configure.ac's split-staging overrides and
    # are genuinely needed, not decoration: build_modules.sh installs the stub libraries under
    # out/target/lib/halif rather than under HALIF_PREFIX/lib/halif, and the Binder SDK's
    # headers land under out/build while its runtime lands under out/target. Those two values
    # are also exactly build_binder.sh's own defaults.
    env:
      HALIF_PREFIX: ${{ github.workspace }}/rdk-halif-aidl
      HALIF_LIB_DIR: ${{ github.workspace }}/rdk-halif-aidl/out/target/lib/halif
      BINDER_SDK_DIR: ${{ github.workspace }}/rdk-halif-aidl/out/target
      BINDER_SDK_INCLUDE_DIR: ${{ github.workspace }}/rdk-halif-aidl/out/build
      LD_LIBRARY_PATH: ${{ github.workspace }}/install/usr/lib:${{ github.workspace }}/rdk-halif-aidl/out/target/lib/halif:${{ github.workspace }}/rdk-halif-aidl/out/target/lib/binder

      # GTEST_PREFIX is run_coverage.sh's own name for the prefix holding libgtest/libgmock and
      # their headers, and this value is the same one L1-tests.yml installs GoogleTest into.
      # It is used here only by the HOST-SIDE build verification; the guest gets its own.
      GTEST_PREFIX: ${{ github.workspace }}/install/usr

      # THE SECOND STAGING. Everything below with an _I386 suffix is a WORKFLOW-LOCAL name and
      # is NOT a configure variable - only the four unsuffixed names above are. Two separate
      # rdk-halif-aidl checkouts at the same pinned SHA are used rather than one checkout with
      # redirected output directories, because build_modules.sh installs into
      # <checkout>/out/target/lib/halif and the image builder treats the whole --sdk-dir tree
      # as HALIF_PREFIX, so each staging needs a complete tree of its own.
      #
      #   the unsuffixed staging  x86_64, built exactly as L1-tests.yml builds it, and used
      #                           ONLY to verify the host-side build contract: that libRCEC
      #                           compiles with both back-ends, links the four edges, and
      #                           resolves its whole loader closure.
      #   the _I386 staging       i386 and protocol 7, and the one that goes into the guest
      #                           image, because the image builder refuses 64-bit artefacts.
      HALIF_PREFIX_I386: ${{ github.workspace }}/rdk-halif-aidl-i386
      GTEST_PREFIX_I386: ${{ github.workspace }}/install-i386/usr

      # WHERE THE TWO VERIFIED BINDER SDK SOURCE TREES LIVE, AND WHY EXACTLY THERE.
      #
      # These are build_binder.sh's OWN DEFAULT location for the tree, once per staging: the
      # script resolves BINDER_REPO_DIR to
      # ${BINDER_INSTALL_DIR:-<rdk-halif-aidl>/build-tools}/linux_binder_idl, and
      # build_modules.sh independently defaults its toolchain root to
      # <rdk-halif-aidl>/build-tools/linux_binder_idl. Putting each verified checkout at the path
      # both scripts already expect enforces the pin without moving anything either script looks
      # for, and it keeps "Reclaim build scratch space" below correct unchanged - that step
      # already deletes both build-tools directories, which is where these now sit, so the
      # cloned upstream sources still do not travel into the published image.
      #
      # TWO TREES RATHER THAN ONE SHARED TREE, for the same reason there are two rdk-halif-aidl
      # checkouts: the x86_64 and i386 builds are separate builds of separate stagings, and the
      # upstream Android sources the script clones under the tree are build inputs of each.
      #
      # BINDER_SOURCE_DIR is still passed explicitly at each call site rather than left to the
      # default, so the tree being used is stated where it is used.
      BINDER_SDK_SOURCE_DIR: ${{ github.workspace }}/rdk-halif-aidl/build-tools/linux_binder_idl
      BINDER_SDK_SOURCE_DIR_I386: ${{ github.workspace }}/rdk-halif-aidl-i386/build-tools/linux_binder_idl

      WORK_DIR: ${{ github.workspace }}/qemu-work
      # THE ANCESTRY OF THE PUBLISHED IMAGE, AND WHY EVERY LEVEL OF IT IS SPELLED OUT HERE.
      #
      # aidl-path-tests-rootfs.sh publishes as root and REFUSES a publication directory that is
      # not owned by uid 0 with no group or other write bit. The reason is that a directory's
      # OWNER may rename or unlink a root-owned entry inside it whatever the entry's own mode is,
      # so an unprivileged owner can substitute the staged image, the destination or the lock
      # between the builder's check and its next privileged operation.
      #
      # THAT ARGUMENT DOES NOT STOP AT THE PUBLICATION DIRECTORY, WHICH IS WHAT AN EARLIER
      # REVISION MISSED. `publish` was created root-owned inside a qemu-work that the RUNNER
      # owned, so the runner's own uid could rename the root-owned `publish` out of the way and
      # put its own directory at that name. The builder itself survives that -- it pins the
      # directory on a descriptor before it writes anything -- but every LATER step resolves
      # $GUEST_IMAGE afresh by pathname, so the substitution redirects the boot, the artifact
      # extraction and the uploads.
      #
      # SO qemu-work IS NOW ROOT-OWNED TOO, created by the "Create the work directory tree"
      # step below, and the runner's own writes live in a runner-owned qemu-work/host subtree.
      # A runner-owned directory INSIDE a root-owned parent cannot be renamed by the runner, so
      # the console log and the kernel artefacts stay where the non-root steps can write them
      # without giving the runner authority over the publication directory's name.
      #
      # WHAT IS NOT COVERED, STATED RATHER THAN IMPLIED: $GITHUB_WORKSPACE and every directory
      # above it are created and owned by the RUNNER, by GitHub's own design -- the workspace is
      # where actions/checkout writes as the runner account, and no step may take it away from
      # that account without breaking every checkout and upload in the job. So the chain
      # /home/runner/work/<repo>/<repo> is runner-owned and this workflow cannot change that.
      # What the root-owned qemu-work buys is that no OTHER process running as the runner uid --
      # a leftover from a previous job on a self-hosted runner, a parallel step, an action's own
      # helper -- can substitute the publication directory or the published pair. A process that
      # is already able to rewrite the workspace root can defeat this, and that process can
      # equally rewrite this workflow file; it is outside the boundary rather than inside it.
      GUEST_IMAGE: ${{ github.workspace }}/qemu-work/publish/cec-l2-rootfs.ext4
      GUEST_CONSOLE_LOG: ${{ github.workspace }}/qemu-work/host/guest-console.log
      GUEST_KERNEL_IMAGE: ${{ github.workspace }}/qemu-work/host/kernel/bzImage
      GUEST_KERNEL_CONFIG: ${{ github.workspace }}/qemu-work/host/kernel/config
      EXTRACTED_ARTIFACTS: ${{ github.workspace }}/coverage-artifacts

    # EVERY ACTION IN THIS JOB IS PINNED TO A FULL-LENGTH COMMIT SHA, AND THE TAG SURVIVES
    # ONLY AS A COMMENT.
    #
    # A tag is a MUTABLE reference: `actions/checkout@v4` resolves through a moving major-
    # version tag its publisher repoints at every new v4.x, so the code this job runs could
    # change with no byte changing in this file. That matters more here than in an ordinary
    # job, because this one runs an action's code in the same job that STAGES A GUEST ROOT
    # IMAGE AND UPLOADS IT: an action step shares the filesystem with the payload, the staged
    # SDK and the published image, and it runs before the credential-absence assertion and the
    # payload staging can vouch for what is in them. A 40-character commit SHA is the one
    # reference GitHub's own hardening guidance calls immutable.
    #
    # THE TWO PINS USED IN THIS FILE, each read from the publisher's own tag with
    # `git ls-remote`. Both are LIGHTWEIGHT tags, so the value the tag resolves to IS a
    # commit SHA rather than a tag object:
    #
    #   actions/checkout            3d3c42e5aac5ba805825da76410c181273ba90b1   = v7 = v7.0.1
    #   actions/upload-artifact     043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   = v7 = v7.0.1
    #
    # ---------------------------------------------------------------------------------------
    # PIN AUDIT RECORD. READ THIS BEFORE TREATING EITHER PIN AS CLEAN.
    #
    # A COMMIT PIN BUYS IMMUTABILITY, NOT SAFETY. It fixes WHICH bytes run; it says nothing
    # about whether those bytes contain known-vulnerable dependencies. Both of these actions
    # ship their dependencies pre-bundled in a committed dist/ directory, so the vulnerable
    # code travels inside the pin rather than being resolved at run time - and it executes with
    # this job's token and repository context, on the same filesystem as the guest root image
    # this job publishes. That is why the residual is RECORDED AND DATED here rather than left
    # implicit: a residual a reviewer can see and re-date is reviewable, and an unrecorded one
    # is indistinguishable from a clean pin.
    #
    # METHOD. For each pinned commit, the action's OWN package.json and package-lock.json were
    # fetched at that commit and audited with `npm audit --omit=dev --package-lock-only`
    # (production dependencies only - dev dependencies are not bundled into dist/).
    #
    #   audit tooling  : npm 11.18.0 on Node v22.23.2
    #   audit date     : 2026-09-01 (UTC)
    #
    #   actions/checkout @ 3d3c42e5aac5ba805825da76410c181273ba90b1  (release v7.0.1)
    #     action runtime : node24   (read from action.yml at that commit)
    #     audit exit     : 1
    #     RESIDUAL       : 1 vulnerable node - 0 critical, 0 high, 1 MODERATE, 0 low
    #                      undici (<=6.27.0): GHSA-8xcm-r25x-g524, GHSA-m8rv-5g2x-5cg5,
    #                      GHSA-v3r7-h72x-cjcm
    #
    #   actions/upload-artifact @ 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  (release v7.0.1)
    #     action runtime : node24   (read from action.yml at that commit)
    #     audit exit     : 1
    #     RESIDUAL       : 5 vulnerable nodes - 0 critical, 5 HIGH, 0 moderate, 0 low
    #                      brace-expansion, fast-xml-builder, fast-xml-parser, lodash, undici
    #
    # WHY THESE PINS ANYWAY, given neither audits clean. v7.0.1 is the NEWEST release either
    # publisher has issued, so no clean release exists to move to - the residual is upstream's
    # to close, not this file's. What the move DID close is measured rather than asserted, by
    # running the same audit against the pins this file used to carry:
    #
    #   checkout        v4.2.2 -> v7.0.1 : 8 vulnerable nodes (1 high + 7 moderate) -> 1 (1 moderate)
    #   upload-artifact v4.6.2 -> v7.0.1 : 17 vulnerable nodes (1 CRITICAL form-data
    #                                      + 6 high + 10 moderate) -> 5 (5 high)
    #
    # and the retired action runtime. Both old pins declared `runs.using: node20`, which GitHub
    # retired on 30 April 2026, so every step using them ran on an end-of-life runtime that
    # receives no security fixes at all. Both new pins declare node24.
    #
    # WHO OWNS THE RESIDUAL AND WHAT CLOSES IT. The bundled-dependency advisories above belong
    # to actions/checkout and actions/upload-artifact upstream; nothing in this repository can
    # patch a committed dist/ bundle without forking the action, which would replace a reviewed
    # publisher pin with an unreviewed local one. The action to take is to RE-RUN THE AUDIT
    # ABOVE at each pin review, move to the first release whose audit is clean or whose residual
    # is smaller, and re-date this block in the same edit. A block whose audit date is old is
    # itself the finding.
    # ---------------------------------------------------------------------------------------
    #
    # There used to be a third, jwlawson/actions-setup-cmake, and it is gone rather than
    # re-pinned: a digest can only be checked by whoever holds the file, and that action
    # downloaded the CMake archive out of band, so no pin on the action could establish that the
    # CMake this job then ran was bytes Kitware published. "Set up CMake" below fetches and
    # digest-verifies the exact pinned release itself. That matters more here than in an
    # ordinary job, because this CMake configures the SDK that is staged into an uploaded guest
    # image. Do not re-introduce the action to "simplify" that step.
    #
    # PINNING CHANGED NO STEP'S INPUTS, and one of those inputs must survive every future
    # edit: `persist-credentials: false` appears on ALL TEN checkouts below - hdmicec, the
    # hdmicec payload, googletest, the two rdk-halif-aidl stagings, the Sink caller source, the
    # two Binder SDK source trees and the telemetry and legacy HAL header sources - and the step
    # "Verify no Actions credential is persisted in any checkout" fails the job if any of them
    # loses it, over that same list of ten. A
    # re-pin that rewrote a checkout step wholesale and dropped that line would reintroduce a
    # token into a tree this job copies towards an uploaded image. The v4 -> v7 re-pin above
    # deliberately rewrote ONLY the `uses:` line of each step, leaving every `with:` input
    # byte-identical, for exactly that reason.
    #
    # THE JOB ALSO DECLARES ITS OWN `permissions:`, and that is not a duplicate of the
    # workflow-level block. A workflow-level `permissions: contents: read` is inherited only
    # while nothing overrides it; a job-level declaration is what makes THIS job's token
    # least-privilege regardless of what a later edit does to the file's top. Every action
    # invoked below runs with that token, so its scope is part of each pin's blast radius
    # rather than a separate concern.
    #
    # UPDATE POLICY. The trailing comment on each `uses:` names the release the SHA belongs
    # to. To move one: read the new tag's SHA from the publisher (`git ls-remote --tags
    # https://github.com/<owner>/<repo> '<tag>'`), review what changed between the two, then
    # replace BOTH the SHA and the tag comment in the same edit - a SHA whose comment names a
    # different release is worse than no comment. L1-tests.yml pins the same two actions to
    # the same two SHAs deliberately; move them together, or the two jobs stop being
    # comparable and the shared build contract between them stops meaning anything.
    #
    # RUNTIME LINEAGE IS PART OF THE PIN, AND IT IS WHY BOTH SHAs ABOVE ARE ON THE v7 LINEAGE.
    # An action's `runs.using` names the Node runtime GitHub executes its bundle under, and a
    # retired runtime receives no security fixes however current the pin's digest looks. This
    # file has now been through that once in each direction: it carried actions/checkout 3.7.0
    # on the Node 16 runtime, moved to v4.2.2 on Node 20, and Node 20 itself reached end of
    # life on 30 April 2026 - so v4.2.2 and v4.6.2 were BOTH on a retired runtime by the time
    # the pins above were reviewed. v7.0.1 declares node24 for both actions, read from each
    # action.yml at the pinned commit rather than inferred from the release number.
    #
    # It is worth being explicit about why that matters HERE and not only as hygiene: ten of
    # the seventeen checkout steps across the two files are in this one, every one of them runs
    # before the step that asserts no credential was persisted, and every one of them runs on
    # the same filesystem as the payload tree and the guest image this job publishes - so the
    # runtime an action's own code executes under is not an incidental detail of this job. Every
    # retired release is named above in prose and nowhere as a pin, which is the state a pin
    # audit expects: grepping this file for either old digest, or for either old release as the
    # `# vN (vN.N.N)` comment spelled it, comes back empty.
    #
    # THAT MAKES A RE-PIN THREE CHECKS RATHER THAN ONE, and the third is the one this file used
    # to omit:
    #
    #   1. THE DIGEST. A committed SHA is valid for exactly one release, which is why the SHA
    #      and its trailing version comment always move together - that part is the update
    #      policy above.
    #   2. THE RUNTIME. Read `runs.using` out of the new release's own action.yml. It does not
    #      follow from the digest: a pin can be perfectly current as a digest and stale as a
    #      runtime while reading identically either way. When GitHub retires Node 24, this same
    #      move is needed again and nothing in this file will say so on its own.
    #   3. THE PRODUCTION AUDIT. Run `npm audit --omit=dev --package-lock-only` against the new
    #      release's own package-lock.json at the pinned commit and update the PIN AUDIT RECORD
    #      above with the date and the exact residual counts. This is the check that
    #      distinguishes "immutable" from "safe", and it is the reason that record exists: both
    #      pins above still carry a residual, and a residual that is written down and dated can
    #      be reviewed while an assumed-clean pin cannot.
    #
    # Re-pin both files in the same edit for the reason the update policy gives.
    steps:
      # THE JOB-WIDE CMAKE, FETCHED HERE AND VERIFIED BEFORE IT IS UNPACKED.
      #
      # This step replaces a `jwlawson/actions-setup-cmake` step that was given the RANGE
      # '3.16.x'. The reasoning is in the CMAKE_PINNED_VERSION and CMAKE_PINNED_SHA256 blocks in
      # this file's env above; the short form is that the version is now exact and the bytes are
      # now checkable, because this job is the one that holds the file.
      #
      # ORDER OF THE GUARDS IS THE SAME ONE "Resolve the CMake installations" USES FOR THE SDK
      # FLOOR, on purpose - version coupling first, so a version bumped without its digest stops
      # at a guard that says exactly that instead of failing later as a digest mismatch that
      # reads like tampering; then the non-empty check, so a removed value cannot pass as a
      # satisfied comparison; then measured versus committed; and only then extract.
      #
      # PREPENDED TO GITHUB_PATH, WHICH IS WHAT MAKES IT JOB-WIDE, exactly as the action it
      # replaces did. "Install packages" below apt-installs cmake as a dependency of other
      # things and the distribution's cmake is not the one this chain may use; the prepend puts
      # this prefix ahead of /usr/bin for every later step. GITHUB_PATH takes effect from the
      # NEXT step onwards, so the assertion belongs downstream - "Resolve the CMake
      # installations" reads CMAKE_PINNED_VERSION back and fails if the job-wide cmake is
      # anything else.
      - name: Set up CMake
        run: |
          set -euo pipefail
          prefix="$GITHUB_WORKSPACE/tools/cmake-$CMAKE_PINNED_VERSION"
          mkdir -p "$prefix"

          if [ "$CMAKE_PINNED_VERSION" != "${CMAKE_PINNED_SHA256_FOR_VERSION:-}" ]; then
            echo "::error::CMAKE_PINNED_VERSION is '$CMAKE_PINNED_VERSION' but the committed CMAKE_PINNED_SHA256 was published by Kitware for '${CMAKE_PINNED_SHA256_FOR_VERSION:-<unset>}'. A committed digest is valid for one version only. Read the new release's own cmake-<version>-SHA-256.txt manifest, update CMAKE_PINNED_SHA256 and CMAKE_PINNED_SHA256_FOR_VERSION together with the version, and do not verify one version's tarball against another's digest."
            exit 1
          fi
          [ -n "${CMAKE_PINNED_SHA256:-}" ] || { echo "::error::CMAKE_PINNED_SHA256 is empty, so this tarball cannot be authenticated. This job does not extract an unverified CMake: commit the digest from Kitware's cmake-$CMAKE_PINNED_VERSION-SHA-256.txt release manifest."; exit 1; }

          # CAPITAL L: this pin predates the 3.20 rename of the release asset, as the env block
          # above sets out. The version appears once, here.
          asset="cmake-$CMAKE_PINNED_VERSION-Linux-x86_64.tar.gz"
          tarball="$GITHUB_WORKSPACE/tools/$asset"
          curl -fsSL --output "$tarball" \
            "https://github.com/Kitware/CMake/releases/download/v$CMAKE_PINNED_VERSION/$asset"

          measured="$(sha256sum "$tarball" | awk '{ print $1 }')"
          echo "cmake tarball  : $tarball"
          echo "measured sha256: $measured"
          echo "committed      : $CMAKE_PINNED_SHA256  (Kitware cmake-$CMAKE_PINNED_SHA256_FOR_VERSION-SHA-256.txt)"
          if [ "$measured" != "$CMAKE_PINNED_SHA256" ]; then
            echo "::error::CMake tarball digest mismatch. measured $measured, committed $CMAKE_PINNED_SHA256 (published by Kitware for $CMAKE_PINNED_SHA256_FOR_VERSION). Either the download was tampered with or the release asset was replaced; this job will not extract an unverified CMake, and it will not be made to by relaxing this check."
            exit 1
          fi
          echo "verified against the committed publisher digest"

          tar -xz --strip-components=1 -C "$prefix" -f "$tarball"
          got="$("$prefix/bin/cmake" --version | head -n 1 | awk '{ print $3 }')"
          if [ "$got" != "$CMAKE_PINNED_VERSION" ]; then
            echo "::error::the extracted cmake reports '$got', not the pinned $CMAKE_PINNED_VERSION. The archive that matched the committed digest does not contain the release it is named for; do not proceed on it."
            exit 1
          fi
          echo "job-wide cmake : $prefix/bin/cmake ($got)"
          echo "$prefix/bin" >> "$GITHUB_PATH"

      # flex and bison are BUILD-SDK prerequisites, not extras: build_binder.sh configures the
      # Binder SDK with -DBUILD_HOST_AIDL=ON, which builds the host AIDL compiler, and that
      # target calls FLEX_TARGET/BISON_TARGET. Without them CMake fails outright.
      #
      # gcc-multilib and g++-multilib USED TO BE what made the i386 staging possible at all, when
      # the Binder SDK, the AIDL stub snapshots and GoogleTest were compiled here with -m32. They
      # are not any more: those three now build inside the guest-matched i386 build chroot, whose
      # compiler is natively 32-bit and whose libraries come from the guest's own pinned Debian
      # archive. They are RETAINED because the toolchain gate's -m32 probe still uses them, and
      # that probe is retained in turn because it is what proves the pinned family is installed
      # COMPLETE on this runner rather than half-installed - see "Select and prove the acceptance
      # toolchain", which says so at the point of the check. Dropping them would silently remove
      # a completeness assertion in exchange for nothing measurable.
      #
      # debootstrap IS NOW A DOUBLE PREREQUISITE, and its second use is easy to miss: it builds
      # the guest's base root filesystem, and it also builds the i386 build chroot that compiles
      # everything the guest loads. Both come from the one resolved snapshot.
      #
      # gcc-13, g++-13 AND THEIR MULTILIB VARIANTS ARE NAMED EXPLICITLY, AND THE BARE `g++` IS
      # GONE. The list used to carry `build-essential g++`, which installs whichever family the
      # image defaults to and states nothing about which one this job then uses. The versioned
      # four put the acceptance family on the runner by name - gcc-13 is also what supplies
      # /usr/bin/gcov-13 - and the multilib pair is the same requirement one architecture down:
      # -m32 needs the 32-bit libgcc and libstdc++ OF THE SELECTED FAMILY, not of the default
      # one, and the unversioned gcc-multilib/g++-multilib metapackages track the archive
      # default rather than this pin. Both spellings are kept: the metapackages because they are
      # what the i386 staging has always been provisioned with, and the versioned pair because
      # they are what the pinned compiler actually needs. The toolchain gate below does not take
      # any of that on trust - it compiles and links a -m32 translation unit with the selected
      # g++, which is the only check that distinguishes "the package installed" from "-m32
      # works".
      # build-essential STAYS: it provides make, libc6-dev and the rest of the base build
      # environment, which no compiler package carries. Every other package here is unchanged,
      # clang included.
      #
      # debootstrap, e2fsprogs, util-linux and qemu-system-x86 provision and boot the guest.
      # bc, bison, flex, libelf-dev, libssl-dev and cpio are the guest kernel's build
      # prerequisites. The perl modules are lcov 2.x's.
      #
      # rsync IS DELIBERATELY NOT IN THIS LIST, AND ITS ABSENCE IS A SUPPLY-CHAIN DECISION.
      # It used to be here, described as a guest-kernel build prerequisite, and it was not one:
      # the ONLY rsync reference anywhere in the 5.15 kernel build system is in
      # scripts/Makefile.headersinst via the headers_install target, and this job builds
      # i386_defconfig, olddefconfig and bzImage - none of which reaches it. Its real use was the
      # payload staging copy below, which now uses tar for the reasons stated there. Since the
      # distribution's rsync carries published defects that upstream fixed in 3.5.0 and the
      # packaged revision does not, the honest response to "it is not needed" is to stop
      # installing it rather than to leave it on the runner unused. Verified before removal:
      # rsync appears nowhere in aidl-path-tests-rootfs.sh, nowhere in L1-tests.yml and nowhere
      # in tests/L1Tests/run_coverage.sh, so nothing else in this job's chain invokes it.
      #
      # THE FULL RESOLVED PACKAGE SET IS RECORDED, not just this request line. The step below
      # writes tools/apt-packages.txt from dpkg-query, which is what makes the toolchain a run
      # actually used auditable afterwards: this line names what was ASKED for, and dpkg names
      # what arrived, including every dependency apt pulled in that is not written here.
      #
      # The distribution's own lcov package is deliberately NOT installed on the runner: this
      # job needs 2.x, the archive ships 1.x, and a 1.x binary on PATH beside the one built
      # below is a confusion this job does not need. run_coverage.sh never runs on the runner.
      #
      # The four versioned package names are DERIVED from CEC_TOOLCHAIN_GCC_MAJOR rather than
      # spelled, so the pinned major has exactly one definition point in this file and what is
      # installed cannot drift from what the gate below demands. The unversioned gcc-multilib
      # and g++-multilib stay beside them: they track the archive default and carry the 32-bit
      # libc pieces, which is a different thing from the versioned compiler's own 32-bit
      # runtime, and the -m32 probe in the gate is what proves the pair actually works. That
      # probe no longer guards the guest's libraries - the i386 build chroot does - so what it
      # now establishes is completeness of the installed family, which is why it is described
      # that way at the gate rather than as a staging prerequisite.
      - name: Install packages
        run: >
          sudo apt-get update
          &&
          sudo apt-get install -y --no-install-recommends autoconf automake libtool pkg-config libdbus-1-dev libglib2.0-dev build-essential "gcc-$CEC_TOOLCHAIN_GCC_MAJOR" "g++-$CEC_TOOLCHAIN_GCC_MAJOR" gcc-multilib g++-multilib "gcc-$CEC_TOOLCHAIN_GCC_MAJOR-multilib" "g++-$CEC_TOOLCHAIN_GCC_MAJOR-multilib" cmake ninja-build flex bison valgrind clang file binutils curl ca-certificates xz-utils debootstrap e2fsprogs util-linux qemu-system-x86 bc libelf-dev libssl-dev cpio perl libcapture-tiny-perl libdatetime-perl libjson-xs-perl libperlio-gzip-perl libtimedate-perl

      # THE RUNNER'S PACKAGE SET IS RECORDED IN FULL AND FLOOR-GATED WHERE A FIX EXISTS.
      #
      # WHAT WAS WRONG. The install line above is unpinned - it names packages and takes
      # whatever the archive serves - and the job then emitted no record of what arrived. Both
      # halves matter. Unpinned means a run can silently use a revision older than the last
      # security update, because a pre-baked runner image or a lagging mirror serves the release
      # pocket rather than the updates pocket. No record means that after the fact nobody can
      # say which toolchain produced a given coverage number or a given green matrix, so a
      # vulnerability disclosed later cannot be matched against the runs it affected.
      #
      # WHY A FLOOR AND NOT AN EXACT PIN. Pinning `pkg=version` on a hosted runner is brittle in
      # a way that costs more than it buys: the archive removes superseded revisions, so an exact
      # pin turns every security update into a broken job, and the usual response to a broken job
      # is to relax the pin - which is worse than never having had one. A floor accepts anything
      # at or above the newest published revision and REFUSES anything below it, so a stale image
      # is a named failure while a fresh security update is simply accepted.
      #
      # WHERE THE FLOORS COME FROM. Each is the newest revision Launchpad publishes for this
      # runner's series in any pocket, read from the Launchpad API rather than from a
      # vulnerability report's suggestion. They are the packages a dependency scan flagged with a
      # fix available: binutils, GLib, Perl, elfutils (libelf) and cpio, plus the fetch, image and
      # archive tools this job's guest provisioning depends on. Comparison is dpkg's own, so
      # epochs and the "ubuntu1.18 is newer than ubuntu1.2" ordering are correct.
      #
      # THE FLOORS ARE SERIES-SPECIFIC, so the series is asserted rather than assumed. A change of
      # runs-on invalidates every value below, and the failure that would produce - a floor from
      # one series compared against a version from another - is exactly the kind that reads as a
      # mysterious refusal. The check names it instead.
      #
      # WHAT IS RECORDED RATHER THAN GATED, and why that is the honest answer. bison, flex, cmake,
      # ninja-build, valgrind and clang were each flagged too, and for each one this series
      # publishes NO revision newer than the one in the release pocket - there is nothing to
      # require. Inventing a floor for a version that does not exist would produce a job that can
      # never pass, and silently dropping them would lose the finding. So the observed version is
      # written into the record with the residual stated beside it, which is reviewable: a reader
      # can compare the recorded version against the archive on any later date and see whether a
      # fix has appeared. qemu-system-x86 is gated in the step after this one, with its own floor
      # and its own named error, because the emulator is the guest's trust boundary rather than a
      # build tool and belongs with the rest of that boundary's record.
      - name: Record and gate the runner package set
        run: |
          set -euo pipefail
          record="$GITHUB_WORKSPACE/tools/apt-packages.txt"
          mkdir -p -- "$(dirname -- "$record")"
          rc=0

          # The series these floors were derived against. Read from the runner rather than
          # restated, so a runs-on change cannot pass this silently. The file is PARSED and not
          # sourced: it is a system file this step has no reason to execute, and the one field
          # wanted is a plain assignment.
          floor_series='noble'
          codename=''
          if [ -r /etc/os-release ]; then
            codename="$(sed -n 's/^VERSION_CODENAME=//p' /etc/os-release | tr -d '\42\47' | head -n 1)"
          fi
          if [ "$codename" != "$floor_series" ]; then
            echo "::error::the minimum-version floors in this step were derived from the '$floor_series' archive, but this runner reports VERSION_CODENAME='${codename:-<unreadable>}'. Comparing a floor from one series against a version from another is meaningless in both directions, so the comparison is refused rather than performed. If runs-on changed deliberately, re-derive every floor below from the new series' published revisions and record the date; do not delete the check."
            exit 1
          fi

          # THE FULL MANIFEST FIRST, because it is evidence and must exist even if a floor fails.
          # source:Version is empty when it equals the binary version, which is dpkg's own
          # convention and not a gap in the record.
          {
            echo "# The resolved package set for this run of .github/workflows/aidl-path-tests.yml"
            echo "# series: $codename    recorded by: dpkg-query -W"
            echo "# columns: binary-package<TAB>binary-version<TAB>source-package<TAB>source-version"
            echo "# (an empty source-version means it is identical to the binary version)"
            dpkg-query -W -f='${binary:Package}\t${Version}\t${source:Package}\t${source:Version}\n' \
              | LC_ALL=C sort
          } > "$record"
          package_count="$(dpkg-query -W -f='.\n' | wc -l | tr -d ' ')"
          echo "recorded $package_count installed packages in $record"

          # THE FLOORS. One package per line, "name  minimum-version", derived from Launchpad's
          # published revisions for this series. Comparison is dpkg --compare-versions ge.
          echo "" >> "$record"
          echo "# MINIMUM-VERSION GATE (floor = newest revision published for $codename)" >> "$record"
          echo "================ RUNNER PACKAGE FLOORS ================"
          while read -r pkg floor; do
            case "$pkg" in ''|'#'*) continue ;; esac
            installed="$(dpkg-query -W -f='${Version}' "$pkg" 2>/dev/null || true)"
            if [ -z "$installed" ]; then
              echo "::error::$pkg is not installed, but it is named in the install list above and carries a minimum-version requirement. A missing package cannot be gated, and the job would fail later in a place that says nothing about why."
              printf '%s\tMISSING\tfloor %s\tFAIL\n' "$pkg" "$floor" >> "$record"
              rc=1
            elif dpkg --compare-versions "$installed" ge "$floor"; then
              printf '  %-18s %-34s >= %s  OK\n' "$pkg" "$installed" "$floor"
              printf '%s\t%s\tfloor %s\tOK\n' "$pkg" "$installed" "$floor" >> "$record"
            else
              echo "::error::$pkg is installed at $installed but this job requires at least $floor, which is the newest revision the $codename archive publishes. A lower revision means this runner is serving the release pocket or a stale mirror, so the run would be built with a package that has a published fix available and not applied. Re-run apt-get update, or establish why this archive is behind - do not lower the floor."
              printf '%s\t%s\tfloor %s\tFAIL\n' "$pkg" "$installed" "$floor" >> "$record"
              rc=1
            fi
          done <<'FLOORS'
          binutils        2.42-4ubuntu2.10
          libglib2.0-dev  2.80.0-6ubuntu3.8
          libglib2.0-0t64 2.80.0-6ubuntu3.8
          perl            5.38.2-3.2ubuntu0.4
          libelf-dev      0.190-1.1ubuntu0.1
          libelf1t64      0.190-1.1ubuntu0.1
          cpio            2.15+dfsg-1ubuntu2.1
          libssl-dev      3.0.13-0ubuntu3.15
          util-linux      2.39.3-9ubuntu6.6
          xz-utils        5.6.1+really5.4.5-1ubuntu0.3
          curl            8.5.0-2ubuntu10.13
          e2fsprogs       1.47.0-2.4~exp1ubuntu4.1
          debootstrap     1.0.134ubuntu2
          FLOORS

          # THE RESIDUALS. Flagged by a dependency scan, no newer revision published for this
          # series, therefore recorded with the version observed rather than gated. This is not a
          # pass and it is not a failure: it is a dated measurement a reviewer can act on.
          echo "" >> "$record"
          echo "# RECORDED RESIDUALS (flagged, no revision newer than the release pocket in $codename)" >> "$record"
          echo "================ RUNNER PACKAGE RESIDUALS ================"
          while read -r pkg; do
            case "$pkg" in ''|'#'*) continue ;; esac
            installed="$(dpkg-query -W -f='${Version}' "$pkg" 2>/dev/null || true)"
            printf '  %-14s %s  RESIDUAL - no fixed revision published for %s\n' \
              "$pkg" "${installed:-<not installed>}" "$codename"
            printf '%s\t%s\tno fixed revision published for %s\tRESIDUAL\n' \
              "$pkg" "${installed:-<not installed>}" "$codename" >> "$record"
          done <<'RESIDUALS'
          bison
          flex
          cmake
          ninja-build
          valgrind
          clang
          RESIDUALS
          echo "  ^ these are RECORDED, not accepted as clean. Each was flagged by a dependency"
          echo "    scan and this series publishes nothing newer, so there is no floor to require."
          echo "    The remedy is upstream's or the distribution's; what this job owes is a dated"
          echo "    record of exactly which revision a run used, which is in $record."
          echo "================ END RUNNER PACKAGE SET ================"
          [ "$rc" -eq 0 ] || exit 1

      # THE VIRTUALIZATION BOUNDARY, RECORDED AND GATED BEFORE ANYTHING RELIES ON IT.
      #
      # WHAT WAS WRONG. qemu was apt-installed and then used, and nothing in between recorded
      # which qemu it was or refused an older one. That is a real gap rather than an untidiness:
      # this job boots a guest running repository-controlled code as root, and the qemu process
      # IS the boundary between that guest and the runner's own memory. A run on a qemu missing
      # published security revisions would produce evidence indistinguishable from a run on a
      # current one, because nothing said which was which.
      #
      # WHAT THIS STEP ESTABLISHES, in order, and each on its own account:
      #
      #   1. THE PROGRAM VERSION, measured from the binary this job will actually invoke and
      #      held to QEMU_MIN_PROGRAM_VERSION. Catches a runner label or a self-hosted host
      #      offering an older QEMU codebase.
      #   2. THE PACKAGE REVISION, read from dpkg and held to QEMU_MIN_PACKAGE_VERSION with
      #      `dpkg --compare-versions`, which is Debian's own comparison rather than a string
      #      sort that would order 1.18 before 1.2. Catches a stale mirror serving an 8.2.2
      #      that is missing Canonical's security patches while reporting the same program
      #      version. Both floors are documented in this file's env with their provenance.
      #   3. THAT THIS BUILD SUPPORTS SECCOMP CONFINEMENT AT ALL, by probe rather than by
      #      assumption - the boot step below passes -sandbox unconditionally, and a build
      #      without CONFIG_SECCOMP would fail there, forty minutes of provisioning later,
      #      with a message about an unknown option.
      #   4. THAT THE PROBE IN 3 DISCRIMINATES, by a NEGATIVE CONTROL. A deliberately invalid
      #      sandbox key must be REFUSED. Without this, a future QEMU that ignored unknown
      #      keys would let check 3 pass while proving nothing, which is the failure mode a
      #      capability probe is most prone to.
      #   5. THAT THE FILTER IS ACTUALLY INSTALLABLE, not merely parseable. `-version` exits
      #      inside the option loop, before the filter is applied, so check 3 alone proves only
      #      that the keys are recognised. `-machine none` with QMP over stdio takes QEMU all
      #      the way through initialisation - installing the seccomp filter - and then quits
      #      cleanly, without emulating a guest or touching the image.
      #
      # IT RUNS HERE, immediately after the install and before the two GoogleTest builds, the
      # four Binder/AIDL builds, the kernel build, debootstrap and the image build, so a
      # boundary that cannot be established costs seconds instead of an hour.
      #
      # THE MEASUREMENTS ARE RECORDED, not just checked, into tools/qemu-boundary.txt, which
      # "Upload the provisioning records" attaches and the artifact-completeness gate requires.
      # A reader disputing this job's evidence needs to know which qemu produced it.
      - name: Record and gate the QEMU virtualization boundary
        run: |
          set -euo pipefail
          record="$GITHUB_WORKSPACE/tools/qemu-boundary.txt"
          mkdir -p -- "$(dirname -- "$record")"
          rc=0

          # The binary this job invokes, resolved by the same name the boot step uses rather
          # than assumed to be at a path.
          qemu_bin="$(command -v qemu-system-i386 || true)"
          if [ -z "$qemu_bin" ]; then
            echo "::error::qemu-system-i386 is not on PATH, so this job cannot boot the binder-capable guest and cannot produce the A-E matrix. The 'Install packages' step installs qemu-system-x86, which provides it; check that it ran."
            exit 1
          fi

          # 1. THE PROGRAM VERSION. Parsed from the first line's 'version <n.n.n>' rather than
          #    by field position, because the parenthesised distribution suffix that follows it
          #    differs between builds.
          program_version="$("$qemu_bin" --version | sed -n '1s/.*version \([0-9][0-9.]*\).*/\1/p')"
          if [ -z "$program_version" ]; then
            echo "::error::could not read a version out of '$qemu_bin --version'. This job will not boot a guest on an emulator whose version it cannot state; the boundary between that guest and this runner is the emulator."
            exit 1
          fi
          at_least() { [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -n 1)" = "$2" ]; }
          if ! at_least "$program_version" "$QEMU_MIN_PROGRAM_VERSION"; then
            echo "::error::qemu-system-i386 reports version $program_version but this job requires at least $QEMU_MIN_PROGRAM_VERSION. An older emulator is REFUSED rather than accepted with a warning: it is the trust boundary around a guest that runs repository-controlled code as root. Do not lower QEMU_MIN_PROGRAM_VERSION to make this pass - establish why this runner offers an older QEMU than the archive publishes."
            rc=1
          fi

          # 2. THE PACKAGE REVISION, which is where the security patches live. dpkg's own
          #    comparison, so epochs and the .18-after-.2 ordering are handled correctly.
          package_version="$(dpkg-query -W -f='${Version}' qemu-system-x86 2>/dev/null || true)"
          if [ -z "$package_version" ]; then
            echo "::error::dpkg-query reports no installed version for qemu-system-x86, so the security revision of the emulator cannot be established even though a binary was found. A qemu from outside the archive is not what this pin was reviewed against."
            rc=1
          elif ! dpkg --compare-versions "$package_version" ge "$QEMU_MIN_PACKAGE_VERSION"; then
            echo "::error::qemu-system-x86 is installed at $package_version but this job requires at least $QEMU_MIN_PACKAGE_VERSION. That floor is the newest revision Launchpad publishes for this runner's series, so a lower one means a stale mirror or a pre-baked image older than the last security update - the program version alone would not have shown it. Re-run apt-get update, or establish why this archive is behind."
            rc=1
          fi

          # 3. SECCOMP SUPPORT, BY PROBE. -sandbox is only a recognised option when the build
          #    has CONFIG_SECCOMP, so acceptance of the exact key set this job uses is the
          #    capability check. -version exits inside the option loop, so nothing is emulated.
          sandbox_parse_log="$(mktemp)"
          if "$qemu_bin" -sandbox "$QEMU_SANDBOX_OPTIONS" -version > /dev/null 2> "$sandbox_parse_log"; then
            sandbox_supported=yes
          else
            sandbox_supported=no
            echo "::error::this qemu build does not accept '-sandbox $QEMU_SANDBOX_OPTIONS'. Either it was built without seccomp support or one of the key names has changed, and in both cases the boot step below - which passes the same option - would fail after the whole guest had been provisioned. What it reported:"
            sed 's/^/  /' -- "$sandbox_parse_log"
            echo "::error::do NOT respond by dropping -sandbox from the boot step. It is what bounds the host-side impact of CVE-2026-48914, for which no fixed QEMU exists; install a qemu built with seccomp support instead."
            rc=1
          fi

          # 4. THE NEGATIVE CONTROL for check 3. An invalid key must be refused, or check 3
          #    proves nothing about a build that ignores what it does not recognise.
          if "$qemu_bin" -sandbox 'on,cec-not-a-real-sandbox-key=deny' -version > /dev/null 2>&1; then
            echo "::error::this qemu ACCEPTED a deliberately invalid sandbox key ('cec-not-a-real-sandbox-key'), so it does not validate the -sandbox key set and the capability probe above cannot be trusted. Establish that the four denials this job relies on are really applied before booting a guest that runs repository-controlled code as root."
            rc=1
            sandbox_discriminates=no
          else
            sandbox_discriminates=yes
          fi

          # 5. THE FILTER IS INSTALLED, NOT MERELY PARSED. -machine none has no guest at all;
          #    the QMP handshake and quit take QEMU through the initialisation that applies the
          #    seccomp filter and then out again. A bounded timeout, because a probe that hangs
          #    is a probe that costs the job its whole allowance.
          sandbox_install_log="$(mktemp)"
          if printf '{"execute":"qmp_capabilities"}\n{"execute":"quit"}\n' \
               | timeout 120 "$qemu_bin" \
                   -sandbox "$QEMU_SANDBOX_OPTIONS" \
                   -machine none -display none -nodefaults -no-user-config -qmp stdio \
                   > "$sandbox_install_log" 2>&1; then
            sandbox_installed=yes
          else
            sandbox_installed=no
            echo "::error::qemu could not complete initialisation with the seccomp filter applied, so the boot step below would fail the same way after the guest had been provisioned. This is the runtime half of the sandbox check and it is separate from the parse-time half above: the keys are recognised but the filter itself did not install. What it reported:"
            sed 's/^/  /' -- "$sandbox_install_log"
            rc=1
          fi

          {
            echo "# The QEMU virtualization boundary for this run of .github/workflows/aidl-path-tests.yml"
            echo "# The guest boots repository-controlled code as root; this process is the boundary."
            printf 'binary                     %s\n' "$qemu_bin"
            printf 'program version            %s   (floor %s)\n' "$program_version" "$QEMU_MIN_PROGRAM_VERSION"
            printf 'qemu-system-x86 package    %s   (floor %s)\n' "${package_version:-<not installed via dpkg>}" "$QEMU_MIN_PACKAGE_VERSION"
            printf 'seccomp option accepted    %s\n' "$sandbox_supported"
            printf 'seccomp probe discriminates %s\n' "$sandbox_discriminates"
            printf 'seccomp filter installs    %s\n' "$sandbox_installed"
            printf 'sandbox options at boot    -sandbox %s\n' "$QEMU_SANDBOX_OPTIONS"
            printf 'root block device model    emulated AHCI (-device ahci + -device ide-hd); virtio-blk deliberately NOT instantiated\n'
            echo "# Unfixed upstream, bounded rather than closed by the sandbox above:"
            echo "#   CVE-2026-48914  virtio-blk OOB write in the QEMU host heap, affects through 11.0.1"
            echo "#   CVE-2024-8612   virtio-blk/scsi/crypto bounce-buffer host memory disclosure"
            echo "# Neither device model is instantiated by this job's boot line, which is the actual answer;"
            echo "# the guest kernel additionally asserts CONFIG_VIRTIO_BLK absent so the two sides must agree."
          } > "$record"

          echo "================ QEMU VIRTUALIZATION BOUNDARY ================"
          cat -- "$record"
          echo "================ END QEMU VIRTUALIZATION BOUNDARY ================"
          rm -f -- "$sandbox_parse_log" "$sandbox_install_log"
          [ "$rc" -eq 0 ] || exit 1
          echo "the emulator this job will boot is recorded above, meets both committed floors, and applies the seccomp filter"

      # THE TOOLCHAIN GATE. IT RUNS BEFORE ANYTHING IS BUILT, AND IT FAILS THE JOB RATHER THAN
      # WARNING.
      #
      # WHAT WAS WRONG, in three parts, none of which a green tick distinguished from a correct
      # run. The apt list installed an unversioned compiler; no step exported CC or CXX, so the
      # four host-side CMake builds, the two i386 GoogleTest/SDK stagings and the hand-written
      # RDK build each took whatever the image defaulted to; and the hand build spelled
      # CXX="${CXX:-g++}", whose fallback IS that default. There was no gcov selection and no
      # version assertion anywhere - so the trace this job exists to produce, and the BRDA
      # coordinates the branch gate compares against a checked-in manifest, could not be shown
      # comparable to the recorded ones. The evidence read as though they were.
      #
      # WHAT THIS STEP ESTABLISHES, in order:
      #
      #   1. gcc-<major>, g++-<major> and gcov-<major> EXIST, by absolute path, with the package
      #      that provides each named in the failure.
      #   2. Each REPORTS the pinned major. -dumpfullversion is what is read: since GCC 7
      #      -dumpversion prints the major alone, so comparing it against gcov's full version
      #      fails on every correct toolchain.
      #   3. The three AGREE ON THE WHOLE VERSION. gcov demands a notes-file version stamp
      #      derived from the GCC major AND minor that wrote the file, so three tools that each
      #      satisfy the pin separately can still be three installations that cannot read each
      #      other's counters. All three come from one package pair, so equality is achievable.
      #   4. -m32 ACTUALLY WORKS with the selected compiler - compiled and linked, not inferred
      #      from a package name. This assertion is RETAINED although the three i386 staging
      #      builds no longer use this compiler: they moved into the guest-matched i386 build
      #      chroot, whose gcc is natively 32-bit, so the host's multilib is no longer on the
      #      path that produces the guest's libraries. What it still establishes is that the
      #      pinned family is installed COMPLETE on this runner rather than half-installed, and
      #      it is what would catch a future edit that moved a 32-bit build back onto the host
      #      without noticing. It is cheap and it is not weakened.
      #   5. gcov GOES FIRST ON PATH UNDER THE NAME `gcov`, through a one-entry shim directory.
      #      Not decoration: tests/L1Tests/run_coverage.sh resolves `gcov` from PATH and has no
      #      override knob. The guest runs its own copy of that script against its own toolchain,
      #      which is why the image builder is given the pin separately - this shim is the
      #      runner's half only.
      #   6. THE EXACT PATCH LEVELS ARE RECORDED, in this step's log and in the job summary, so
      #      the figures this job publishes carry the toolchain that produced them.
      #
      # WHICH BUILD THIS PIN GOVERNS, because this job now has three compiler pins and they are
      # easy to conflate:
      #
      #   CEC_TOOLCHAIN_GCC_MAJOR - proved here - governs THE HOST BUILD: the shipping libRCEC,
      #     the L1 and L2 binaries, and the coverage instrumentation. It is the one pin that
      #     cannot be relaxed, because the .gcno notes, the accumulated trace, the line gate and
      #     the (file,line,block,branch) manifest the branch gate compares against are all
      #     properties of the compiler that produced them.
      #   The i386 build chroot's own gcc governs ONLY the three i386 staging builds, whose
      #     output is copied into the guest image and loaded there. It is a gcc-12 family because
      #     the guest's suite cannot serve 13, and that deviation is measured, printed and
      #     recorded into the image's provenance by "Create the guest-matched i386 build chroot".
      #     Nothing about it touches CC, CXX or the gcov shim this step establishes.
      #   THE SAME value, handed to the image builder as --toolchain-gcc-major, governs the
      #     compiler installed INSIDE the guest, which is what the guest's own copy of
      #     run_coverage.sh uses. The builder gates-and-records it against the guest's own
      #     archive rather than failing, because that archive is not this runner's.
      #
      # CC and CXX GO INTO GITHUB_ENV, which is what makes them reach the CMake steps (CMake
      # honours both), ./configure, the three makes and the hand build - rather than only this
      # step. GITHUB_ENV and GITHUB_PATH take effect from the NEXT step onwards, which is why the
      # assertions here use absolute paths and why the step after this one re-checks the
      # resolution later steps will actually see.
      #
      # THE CHROOT DELIBERATELY DOES NOT INHERIT THEM. Its runner script enters with env -i, so
      # a CC pointing at the host's gcc-13 cannot leak into a staging build and reintroduce the
      # symbol-version mismatch the chroot exists to remove.
      - name: Select and prove the acceptance toolchain
        run: |
          set -euo pipefail

          # NO APOSTROPHE IN THIS MESSAGE, AND THAT IS A SHELL CONSTRAINT RATHER THAN A STYLE
          # CHOICE: bash treats a single quote inside ${var:?word} as opening a quoted string
          # even within double quotes, which swallows the rest of the script and surfaces as an
          # unrelated "unbound variable" line further down. Measured while writing this step.
          major="${CEC_TOOLCHAIN_GCC_MAJOR:?CEC_TOOLCHAIN_GCC_MAJOR is unset. It is the single place this workflow pins the acceptance compiler family; restore it in the env block of this workflow rather than spelling a version into a step.}"
          cc="/usr/bin/gcc-$major"
          cxx="/usr/bin/g++-$major"
          gcov="/usr/bin/gcov-$major"

          for tool in "$cc" "$cxx" "$gcov"; do
            if [ ! -x "$tool" ]; then
              echo "::error::$tool is not present on this runner, so the pinned GCC $major acceptance toolchain cannot be selected and this job would silently build - and measure - with the image default instead. gcc-$major provides gcc-$major and gcov-$major, g++-$major provides g++-$major, and the -m32 completeness probe below additionally needs gcc-$major-multilib and g++-$major-multilib; all are in ubuntu-24.04's archive. If this runner label was changed, check that the new image's archive carries the gcc-$major family at all - jammy does not."
              exit 1
            fi
          done

          cc_version="$("$cc" -dumpfullversion 2>/dev/null || "$cc" -dumpversion)"
          cxx_version="$("$cxx" -dumpfullversion 2>/dev/null || "$cxx" -dumpversion)"
          gcov_line="$("$gcov" --version | head -n 1)"
          gcov_version="$(printf '%s\n' "$gcov_line" | awk '{ print $NF }')"

          printf 'CC        : %s  -dumpfullversion -> %s\n' "$cc" "$cc_version"
          printf 'CXX       : %s  -dumpfullversion -> %s\n' "$cxx" "$cxx_version"
          printf 'gcov      : %s  first line       -> %s\n' "$gcov" "$gcov_line"
          printf 'gcov      : parsed version       -> %s\n' "$gcov_version"
          printf 'pinned    : GCC major %s (patch level recorded, not gated - see CEC_TOOLCHAIN_GCC_MAJOR in the env block)\n' "$major"

          rc=0
          for pair in "CC:$cc_version" "CXX:$cxx_version" "gcov:$gcov_version"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            case "$value" in
              "$major"|"$major".*) : ;;
              *)
                echo "::error::$name reports version '$value', which is not the pinned GCC major $major. The accumulated trace, the line gate and the (file,line,block,branch) manifest the per-arm branch gate compares against are all properties of the compiler that produced them: a different major renumbers the coordinates and the gate reports arms ABSENT that the code still has."
                rc=1
                ;;
            esac
          done

          if [ "$cc_version" != "$cxx_version" ] || [ "$cc_version" != "$gcov_version" ]; then
            echo "::error::the three tools do not agree: gcc $cc_version, g++ $cxx_version, gcov $gcov_version. gcov demands a notes-file version stamp derived from the GCC major and minor that wrote it, so a mismatch here yields either no counters or counters attributed to the wrong lines. Install gcc-$major and g++-$major from one archive and re-run."
            rc=1
          fi
          [ "$rc" -eq 0 ] || exit "$rc"

          # -m32, COMPILED AND LINKED RATHER THAN ASSUMED FROM A PACKAGE NAME.
          #
          # WHAT THIS NOW ESTABLISHES, stated precisely because the reason changed. The three
          # i386 staging builds no longer use this compiler at all: they run inside the
          # guest-matched i386 build chroot, because artefacts built by THIS family against the
          # RUNNER's glibc require symbol versions the guest cannot resolve. So this probe is no
          # longer the thing that stands between the job and a broken guest library. It is
          # retained as a COMPLETENESS assertion on the pinned family - a half-installed gcc-13
          # that compiles 64-bit and cannot link 32-bit is a runner defect worth naming, and it
          # is what would catch a future edit that moved a 32-bit build back onto the host
          # without noticing the consequence. It costs one compile and it is not weakened.
          #
          # <string> is included deliberately: a C++ link is what needs the 32-bit libstdc++,
          # which is the half a bare C probe would pass without.
          probe_dir="$(mktemp -d)"
          printf '%s\n' '#include <string>' 'int main() { return std::string("m32").size() == 3 ? 0 : 1; }' \
            > "$probe_dir/m32-probe.cpp"
          if ! "$cxx" -m32 -o "$probe_dir/m32-probe" "$probe_dir/m32-probe.cpp" 2> "$probe_dir/m32-probe.log"; then
            echo "::error::$cxx cannot compile and link a -m32 C++ translation unit, so the pinned GCC $major family is installed incompletely on this runner. Install gcc-$major-multilib and g++-$major-multilib: the unversioned gcc-multilib/g++-multilib metapackages track the archive default and do not necessarily carry the 32-bit runtime for THIS family. The guest's own libraries are built in the i386 build chroot rather than by this compiler, so this is a runner-completeness fault and not a staging fault. Compiler output follows."
            cat "$probe_dir/m32-probe.log"
            rm -rf -- "$probe_dir"
            exit 1
          fi
          m32_class="$(file -b -- "$probe_dir/m32-probe" | cut -d, -f1)"
          printf '%s\n' "-m32 probe : linked, and file reports: $m32_class"
          case "$m32_class" in
            *ELF\ 32-bit*) : ;;
            *)
              echo "::error::the -m32 probe linked but produced '$m32_class' rather than an ELF 32-bit object, so -m32 is being ignored by this compiler. The guest's own libraries are unaffected - they are built in the i386 build chroot - but a compiler that silently discards -m32 is a runner defect that would mislead every later reading of this step, so it is named here."
              rm -rf -- "$probe_dir"
              exit 1
              ;;
          esac
          rm -rf -- "$probe_dir"

          # THE SHIM. One directory, one entry, prepended to PATH, in RUNNER_TEMP rather than in
          # the checkout so nothing lands in the tree the close-out diff check inspects.
          shim="${RUNNER_TEMP:-/tmp}/cec-toolchain-shim"
          rm -rf -- "$shim"
          mkdir -p -- "$shim"
          ln -s -- "$gcov" "$shim/gcov"
          printf 'gcov shim : %s -> %s\n' "$shim/gcov" "$("$shim/gcov" --version | head -n 1)"

          {
            echo "CC=$cc"
            echo "CXX=$cxx"
            echo "CEC_TOOLCHAIN_GCOV=$gcov"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$shim" >> "$GITHUB_PATH"

          {
            echo "### Runner acceptance toolchain (pinned to GCC major $major; exact patch recorded, not gated)"
            echo
            echo "| Tool | Path | Version |"
            echo "| --- | --- | --- |"
            echo "| CC | \`$cc\` | $cc_version |"
            echo "| CXX | \`$cxx\` | $cxx_version |"
            echo "| gcov | \`$gcov\` (first on PATH as \`gcov\` via \`$shim\`) | $gcov_version |"
            echo
            echo "\`-m32\` probe: linked with \`$cxx\`, $m32_class."
            echo
            echo "The documented acceptance patch level is 13.4.0; ubuntu-24.04's archive supplies 13.3.0-6ubuntu2~24.04.1, and no archive this job is permitted to use carries 13.4.0. The pin is therefore the major and the patch above is the measured value for this run. **The guest is a different archive**: the image builder is passed this same major as \`--toolchain-gcc-major\` and records the guest's own compiler and gcov versions, plus a named limitation where its archive cannot supply the pinned family."
          } >> "$GITHUB_STEP_SUMMARY"

      # THE SECOND HALF OF THE GATE, AND IT IS NOT REDUNDANT WITH THE FIRST.
      #
      # GITHUB_ENV and GITHUB_PATH take effect from the step AFTER the one that writes them, so
      # the step above could only assert absolute paths. What every later step actually sees is a
      # RESOLVED name: `gcov` off PATH, `$CC`/`$CXX` out of the environment. This step is the one
      # place those resolutions are checked, which is what catches a later PATH prepend shadowing
      # the shim - and this job does prepend to PATH again, for CMake - or an env entry that did
      # not survive.
      - name: Verify the pinned toolchain reaches every later step
        run: |
          set -euo pipefail
          major="${CEC_TOOLCHAIN_GCC_MAJOR:?}"
          rc=0

          if [ "${CC:-}" != "/usr/bin/gcc-$major" ]; then
            echo "::error::CC is '${CC:-<unset>}' in this step's environment, not the pinned /usr/bin/gcc-$major selected by 'Select and prove the acceptance toolchain'. The GITHUB_ENV export did not reach here, so every build below - including the four CMake ones, which read CC and CXX - would use the image default."
            rc=1
          fi
          if [ "${CXX:-}" != "/usr/bin/g++-$major" ]; then
            echo "::error::CXX is '${CXX:-<unset>}' in this step's environment, not the pinned /usr/bin/g++-$major selected by 'Select and prove the acceptance toolchain'. The GITHUB_ENV export did not reach here, so every build below - including the four CMake ones, which read CC and CXX - would use the image default."
            rc=1
          fi
          if [ "$rc" -eq 0 ]; then
            printf 'CC  : %s -> %s\n' "$CC" "$("$CC" -dumpfullversion)"
            printf 'CXX : %s -> %s\n' "$CXX" "$("$CXX" -dumpfullversion)"
          fi

          resolved_gcov="$(command -v gcov || true)"
          if [ -z "$resolved_gcov" ]; then
            echo "::error::no gcov resolves on PATH at all. Nothing on the runner reads counters - the guest measures - but this is the earliest sign the shim step did not take effect."
            rc=1
          else
            resolved_version="$(gcov --version | head -n 1 | awk '{ print $NF }')"
            printf 'gcov on PATH : %s -> %s\n' "$resolved_gcov" "$resolved_version"
            case "$resolved_version" in
              "$major"|"$major".*) : ;;
              *)
                echo "::error::the gcov that resolves on PATH is version $resolved_version, not the pinned major $major. Something prepended to PATH after the toolchain step and shadowed the shim."
                rc=1
                ;;
            esac
          fi

          [ "$rc" -eq 0 ] || exit "$rc"
          echo "the pinned toolchain reaches this step by resolved name as well as by absolute path"

      - name: Checkout hdmicec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
        with:
          path: hdmicec
          # NO ACTIONS CREDENTIAL IS LEFT IN ANY CHECKOUT IN THIS JOB.
          #
          # actions/checkout defaults persist-credentials to true, which writes an
          # http.<host>/.extraheader entry holding a base64 "x-access-token:<GITHUB_TOKEN>"
          # Authorization header into .git/config. That is convenient for a job that pushes;
          # this job only reads, and it copies a checkout INTO A GUEST IMAGE that is then
          # uploaded as an artifact. A token in .git/config would travel into both.
          #
          # Turning it off costs this job nothing: every checkout here is read-only and every
          # later step works on the files, never on the remote. The assertion step below
          # verifies the absence rather than trusting this input, and the guest payload is
          # additionally staged WITHOUT .git at all - see "Stage the guest payload".
          persist-credentials: false

      # THE IMAGE BUILDER'S OWN REGRESSION GATE, AND IT IS DELIBERATELY THE FIRST THING THAT
      # RUNS AGAINST THAT SCRIPT.
      #
      # aidl-path-tests-rootfs.sh --self-test exercises the two dpkg package-status parsers
      # that decide whether the toolchain is actually inside the published image, plus the
      # confined I/O primitive every privileged in-image operation goes through. Both are pure
      # and both are checked against literal records, so the whole run takes about a second.
      #
      # IT RUNS HERE, immediately after the checkout that contains the script and BEFORE every
      # expensive step -- the two GoogleTest builds, the four Binder/AIDL builds, the kernel
      # build, debootstrap and the image build. A parser regression that would silently report
      # a toolchain that is not in the image therefore fails this job in seconds instead of
      # after forty minutes of provisioning, and the failure names the parser and the case.
      #
      # IT NEEDS NO ROOT AND CANNOT BUILD ANYTHING. main() dispatches --self-test as its first
      # statement, ahead of parse_args and every mount, loop device and chroot, and the mode
      # refuses any other argument.
      #
      # ITS FAILURE FAILS THE JOB, which is the point of a gate: the step runs under `set -e`
      # with no `|| true`, no `continue-on-error` and no `if: always()`, so a non-zero exit
      # from the self-test is this job's exit.
      - name: Self-test the image builder's parsers and confined I/O
        working-directory: hdmicec
        run: |
          set -euo pipefail
          script='.github/workflows/aidl-path-tests-rootfs.sh'
          [ -f "$script" ] || { echo "::error::$script is missing from the hdmicec checkout, so the image builder cannot be self-tested and cannot be run."; exit 1; }
          echo "running $script --self-test (no root, no mounts, no network)"
          bash "$script" --self-test

      # A SECOND, PRISTINE checkout of the same tree, and it is not redundant. The checkout
      # above is configured and built on this x86_64 runner, which leaves 64-bit objects and
      # libraries all through it - and the image builder's verify_payload_tree walks the
      # payload and REFUSES any 64-bit ELF it finds. The guest gets clean source and does its
      # own instrumented build inside the guest, which is the only place the counters that
      # matter are produced. This checkout is never built here.
      #
      # It is also not handed to the image builder directly: the step "Stage the guest payload
      # without its Git metadata" copies it without .git and the builder is pointed at that
      # copy, because the image is uploaded as an artifact and .git has no business inside it.
      - name: Checkout hdmicec again as the guest payload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
        with:
          path: hdmicec-payload
          # THE MOST IMPORTANT ONE: this tree is the source of the payload that is copied into
          # the guest root image, and that image is uploaded as a workflow artifact. A
          # persisted Authorization header here would be readable by anyone who can download
          # the artifact. See the staging step below, which additionally strips .git.
          persist-credentials: false

      - name: Checkout googletest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
        with:
          repository: google/googletest
          path: googletest
          # GOOGLETEST_REF rather than the literal, so this pin also has one spelling in this
          # file. It is the same GoogleTest COMMIT L1-tests.yml checks out - see the env block
          # for why it is a commit and not the v1.15.0 tag - and both GoogleTest builds below,
          # the x86_64 one and the guest's i386 one, come from this tree.
          ref: ${{ env.GOOGLETEST_REF }}
          persist-credentials: false

      - name: Checkout rdk-halif-aidl
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
        with:
          repository: ${{ env.AIDL_REPOSITORY }}
          path: rdk-halif-aidl
          ref: ${{ env.AIDL_REF }}
          persist-credentials: false

      - name: Checkout rdk-halif-aidl again for the i386 staging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
        with:
          repository: ${{ env.AIDL_REPOSITORY }}
          path: rdk-halif-aidl-i386
          ref: ${{ env.AIDL_REF }}
          persist-credentials: false

      # THE SINK CALLER SOURCE, FOR THE L1 DRIFT GUARD AND FOR NOTHING ELSE. A REQUIRED
      # ACCEPTANCE INPUT ON EVERY INVOCATION, INCLUDING THE ONES THAT RUN IN THE GUEST.
      #
      # Only one file in it is read - plugin/HdmiCecSinkImplementation.cpp - and only by the
      # guard; nothing in this job compiles or links against this tree. The path is the
      # superproject layout, so the guard's own relative candidate resolves even if the exported
      # variable is ever lost.
      #
      # DriverAidlLocalInstanceTest.TheModelledSinkCallPathsStillMatchTheRealSinkSource reads
      # entservices-hdmicecsink/plugin/HdmiCecSinkImplementation.cpp and asserts the structural
      # facts that DriverAidlSessionTest.AddLogicalAddressFailuresReachBothRealSinkCallPathsAs
      # Expected models. Without the file the guard FAILS by design - it will not skip, because a
      # skip is indistinguishable from a pass in an aggregate count - and the modelled call paths
      # become an unchecked model rather than evidence about a caller.
      #
      # THIS JOB NEEDS IT IN TWO PLACES, WHICH IS WHY THE CHECKOUT ALONE IS NOT ENOUGH HERE. The
      # host side runs the L1 binary directly and reads it from this checkout through
      # CEC_SINK_CALLER_SOURCE, exactly as the hosted job does. The GUEST side runs invocations
      # inside a VM that cannot see this workspace at all, so the file is passed to
      # aidl-path-tests-rootfs.sh with --sink-caller-source, staged into the image, and exported
      # to the guest's own CEC_SINK_CALLER_SOURCE by the init script. Both routes resolve the same
      # pinned bytes; neither is optional.
      #
      # The ref is the superproject gitlink and the commit the guard names as reviewed. L1-tests
      # .yml pins the same commit under the same names - move them together, and the verification
      # step below fails the job if SINK_REF and SINK_CALLER_COMMIT ever disagree.
      #
      # persist-credentials: false for the same reason as every other checkout in this job, and
      # with the same force as the payload tree: this tree's content is copied into the guest
      # image, which is uploaded as an artifact.
      - name: Checkout the Sink caller source for the L1 drift guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
        with:
          repository: ${{ env.SINK_REPOSITORY }}
          path: entservices-hdmicecsink
          ref: ${{ env.SINK_REF }}
          persist-credentials: false

      # THE BINDER SDK SOURCE, OBTAINED BY THIS JOB AT AN IMMUTABLE COMMIT, ONCE PER STAGING.
      #
      # It used to be cloned by build_binder.sh, which resolves it from mutable ref text and
      # fails open three ways - see the BINDER_SDK_* block in this file's env for the three, for
      # why none of them can be fixed in the script, and for why it matters more here than in
      # the hosted job. Checking each tree out at a commit is what makes the resolution
      # immutable; the assertions in the next step and at each call site are what make it
      # provable.
      #
      # EACH LANDS INSIDE ITS OWN rdk-halif-aidl CHECKOUT, at exactly the path both build
      # scripts already default to, so these two steps must come AFTER both rdk-halif-aidl
      # checkouts - a checkout cleans its destination, and the reverse order would delete them.
      #
      # persist-credentials: false for the same reason as every other checkout in this job, and
      # with the same force as the payload tree: build-tools is deleted before the image is
      # built, but nothing should rely on a deletion to keep a token out of a published image.
      - name: Checkout the Binder SDK source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
        with:
          repository: ${{ env.BINDER_SDK_REPOSITORY }}
          path: rdk-halif-aidl/build-tools/linux_binder_idl
          ref: ${{ env.BINDER_SDK_COMMIT }}
          persist-credentials: false

      - name: Checkout the Binder SDK source again for the i386 staging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
        with:
          repository: ${{ env.BINDER_SDK_REPOSITORY }}
          path: rdk-halif-aidl-i386/build-tools/linux_binder_idl
          ref: ${{ env.BINDER_SDK_COMMIT }}
          persist-credentials: false

      # THE TWO PRODUCTION HEADER SOURCES FOR THE SHIPPING HAND BUILD, AT IMMUTABLE COMMITS.
      #
      # ccec/src/Makefile refuses mocks/ and stubs/ as its telemetry and legacy HAL header
      # roots, so "Build and verify the shipping hand-written RDK library" stages both roots
      # from these trees - see the TELEMETRY_* and LEGACY_HAL_* block in this file's env for the
      # pins. Nothing here is executed and nothing here is staged into the guest image; three
      # headers are copied out of them as text. persist-credentials: false for the same reason
      # as every other checkout in this job.
      - name: Checkout the telemetry headers for the hand-written build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
        with:
          repository: ${{ env.TELEMETRY_REPOSITORY }}
          path: telemetry
          ref: ${{ env.TELEMETRY_COMMIT }}
          persist-credentials: false

      - name: Checkout the legacy HDMI CEC HAL header for the hand-written build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (v7.0.1)
        with:
          repository: ${{ env.LEGACY_HAL_REPOSITORY }}
          path: rdk-halif-hdmi_cec
          ref: ${{ env.LEGACY_HAL_COMMIT }}
          persist-credentials: false

      # CREDENTIAL ABSENCE IS ASSERTED, NOT ASSUMED FROM AN INPUT.
      #
      # persist-credentials: false is set on every checkout above, and this step proves the
      # result rather than trusting the input. It matters here more than in an ordinary job
      # for one specific reason: one of these checkouts is copied INTO A GUEST ROOT IMAGE that
      # this job uploads as an artifact, so a credential left in .git/config would leave the
      # runner inside a downloadable file.
      #
      # WHAT IS CHECKED, AND WHY EACH.
      #   http.<host>/.extraheader   the exact mechanism persist-credentials uses: a base64
      #                              "x-access-token:<GITHUB_TOKEN>" Authorization header.
      #   credential.helper          a helper configured in the checkout would fetch a token
      #                              on demand later, which is the same exposure deferred.
      #   url.*.insteadof            a rewrite can carry userinfo (https://user:token@host)
      #                              in the URL itself.
      #   .git-credentials, .netrc   file-based credential stores, wherever they landed.
      #
      # The check reads git's own configuration rather than grepping the file, so an entry
      # written in any of git's spellings is still found; the two credential FILES are checked
      # by existence. No value is ever printed - only the KEY that carries it - because a
      # message that quoted the value would put the token in the log it is reporting.
      - name: Verify no Actions credential is persisted in any checkout
        run: |
          set -euo pipefail
          rc=0
          for tree in hdmicec hdmicec-payload googletest rdk-halif-aidl rdk-halif-aidl-i386 \
                      entservices-hdmicecsink \
                      rdk-halif-aidl/build-tools/linux_binder_idl \
                      rdk-halif-aidl-i386/build-tools/linux_binder_idl \
                      telemetry rdk-halif-hdmi_cec; do
            dir="$GITHUB_WORKSPACE/$tree"
            [ -d "$dir/.git" ] || { echo "::error::$tree is not a git checkout at $dir, so this job's later steps cannot rely on it."; rc=1; continue; }
            keys="$(git -C "$dir" config --local --name-only --list 2>/dev/null || true)"
            offenders="$(printf '%s\n' "$keys" | grep -Ei 'extraheader|credential\.|insteadof' || true)"
            if [ -n "$offenders" ]; then
              # KEYS ONLY - and even the key is redacted where it can carry a credential
              # ITSELF: a url.<base>.insteadOf entry embeds its base in the key name, and that
              # base may carry userinfo (https://user:token@host). Printing the raw key would
              # then print the token in the very message that reports it, so any //userinfo@ is
              # replaced before anything reaches the log. Which entry it is stays legible.
              echo "::error::$tree retains credential-bearing git configuration. Offending KEYS (values deliberately not printed):"
              printf '%s\n' "$offenders" | sed -E 's#//[^/@[:space:]]*@#//<redacted>@#g' | sed 's/^/  /'
              echo "  Set persist-credentials: false on that checkout. This tree may be copied into the guest image, which is uploaded as an artifact."
              rc=1
            fi
            for store in .git-credentials .netrc; do
              if [ -e "$dir/$store" ]; then
                echo "::error::$tree contains $store, a file-based credential store. It must not exist in a checkout this job copies or uploads."
                rc=1
              fi
            done
          done
          [ "$rc" -eq 0 ] || exit 1
          echo "no persisted Actions credential, credential helper, URL rewrite or credential store in any of the checkouts"

      # THE PINS ARE ASSERTED AGAINST WHAT WAS ACTUALLY CHECKED OUT, NOT TRUSTED FROM AN INPUT.
      #
      # A `ref:` input states an intention. This step establishes the result, and the two are
      # not the same thing: a ref can resolve to something other than what the pin names -
      # through a repointed tag, a cached tree on a self-hosted runner, or an edit that put a
      # mutable ref back - and every one of those changes code this job COMPILES AND EXECUTES,
      # some of it inside a guest image this job then UPLOADS. So the commit is read back out of
      # each tree with `git rev-parse HEAD` and compared against the value committed in this
      # file, before anything is built from it.
      #
      # A PIN THAT IS NOT A FULL COMMIT IS REFUSED BEFORE ANY COMPARISON. A tag or a short SHA
      # could never equal rev-parse output, so comparing it would fail with a message about the
      # TREE when the defect is in the PIN; naming it directly is also what stops a future edit
      # from quietly reintroducing a mutable ref.
      #
      # THE RESOLVED COMMITS ARE RECORDED, not just checked, into the provisioning record this
      # job already uploads - so what was built and what went into the published image are
      # answerable after the fact from the run itself.
      #
      # The two rdk-halif-aidl checkouts are pinned to a commit as well, and the content they
      # must supply is asserted by "Verify rdk-halif-aidl source include roots" below. What this
      # step exists for is the pins that used to be MUTABLE, which is where the exposure was.
      #
      # L1-tests.yml carries this step in the same shape over its own tree list; move them
      # together.
      - name: Verify the pinned dependency checkouts
        run: |
          set -euo pipefail
          rc=0
          record="$GITHUB_WORKSPACE/tools/supply-chain-pins.txt"
          mkdir -p "$(dirname "$record")"
          {
            echo "# Resolved supply-chain pins for this run of .github/workflows/aidl-path-tests.yml"
            echo "# what                     resolved commit or declared value          where"
          } > "$record"

          is_commit() { printf '%s' "$1" | grep -Eq '^[0-9a-f]{40}$'; }

          assert_pinned_head() {
            local tree="$1" expected="$2" what="$3"
            local dir="$GITHUB_WORKSPACE/$tree" head=''
            if ! is_commit "$expected"; then
              echo "::error::the pin for $what is '$expected', which is not a 40-character commit SHA. $what is compiled and executed by this job, so it is pinned to an immutable commit and never to a tag or a branch: a tag is a pointer its publisher can move. Read the intended tag's commit with 'git ls-remote --tags <url> <tag>' and commit that value, keeping the tag as the comment beside it."
              rc=1
              return 0
            fi
            if [ ! -d "$dir/.git" ]; then
              echo "::error::$tree is not a git checkout at $dir, so the commit $what was taken from cannot be established. Nothing may be built from a tree whose provenance cannot be read, least of all something staged into the published image."
              rc=1
              return 0
            fi
            head="$(git -C "$dir" rev-parse HEAD 2>/dev/null || true)"
            if [ "$head" != "$expected" ]; then
              echo "::error::$what at $dir is checked out at '${head:-<unreadable>}' but this job pins $expected. Do not adjust the pin to match the tree - establish which commit is intended, from the publisher, and correct whichever of the two is wrong."
              rc=1
              return 0
            fi
            printf '%-24s %s  %s\n' "$what" "$head" "$tree" | tee -a "$record"
          }

          assert_pinned_head googletest "${GOOGLETEST_REF:-}" "GoogleTest"
          assert_pinned_head rdk-halif-aidl/build-tools/linux_binder_idl "${BINDER_SDK_COMMIT:-}" "Binder SDK source"
          assert_pinned_head rdk-halif-aidl-i386/build-tools/linux_binder_idl "${BINDER_SDK_COMMIT:-}" "Binder SDK source i386"
          assert_pinned_head entservices-hdmicecsink "${SINK_REF:-}" "Sink caller source (read by the L1 drift guard)"
          assert_pinned_head telemetry "${TELEMETRY_COMMIT:-}" "Telemetry header source"
          assert_pinned_head rdk-halif-hdmi_cec "${LEGACY_HAL_COMMIT:-}" "Legacy HAL header source"

          # THE TWO NAMES FOR THE SAME PIN MUST AGREE. SINK_REPOSITORY/SINK_REF are what the
          # checkout resolves and what the assertion above reads; SINK_CALLER_REPOSITORY/
          # SINK_CALLER_COMMIT are the same repository and commit recorded beside the guard's
          # rationale, and are what aidl-path-tests-rootfs.sh's manifest records. Asserting the
          # tree twice would say nothing new, but letting the names drift would leave a reviewer
          # reading a pin the job does not use.
          if [ "${SINK_CALLER_COMMIT:-}" != "${SINK_REF:-}" ] || [ "${SINK_CALLER_REPOSITORY:-}" != "${SINK_REPOSITORY:-}" ]; then
            echo "::error::the Sink caller pin is recorded under two names that disagree - SINK_REPOSITORY='${SINK_REPOSITORY:-<unset>}' SINK_REF='${SINK_REF:-<unset>}' versus SINK_CALLER_REPOSITORY='${SINK_CALLER_REPOSITORY:-<unset>}' SINK_CALLER_COMMIT='${SINK_CALLER_COMMIT:-<unset>}'. They name the same reviewed revision of entservices-hdmicecsink and must be moved together; L1-tests.yml carries the same names."
            rc=1
          fi

          # THE SINK CALLER SOURCE, ASSERTED BEFORE ANY TEST RUNS ON EITHER SIDE OF THE BOUNDARY.
          #
          # Two distinct checks, and both are needed: this one establishes the ENVIRONMENT is
          # wired, the drift guard establishes the plugin has not DRIFTED. Failing here names the
          # wiring; failing there names the drift, which is the outcome a pin bump is meant to
          # produce. The guest's copy is checked separately, after the image is built, because a
          # readable file here says nothing about what was staged into the image.
          if [ ! -r "${CEC_SINK_CALLER_SOURCE:-}" ]; then
            echo "::error::CEC_SINK_CALLER_SOURCE is '${CEC_SINK_CALLER_SOURCE:-<unset>}', which is not a readable file. It is a REQUIRED acceptance input on every invocation, not an optional diagnostic: without it DriverAidlLocalInstanceTest.TheModelledSinkCallPathsStillMatchTheRealSinkSource fails and the modelled Sink call paths become a model nothing has checked against its subject. The 'Checkout the Sink caller source for the L1 drift guard' step produces it; restore that step rather than relaxing this check."
            rc=1
          else
            printf '%-24s %s  %s\n' "Sink caller source" "$(git -C "$GITHUB_WORKSPACE/entservices-hdmicecsink" rev-parse HEAD 2>/dev/null || echo '<unreadable>')" "entservices-hdmicecsink/plugin/HdmiCecSinkImplementation.cpp" | tee -a "$record"
          fi

          # binder_sdk.version IS A GATE HERE, NOT A FALLBACK, AND IT IS CHECKED IN BOTH
          # STAGINGS because each Binder SDK build reads the copy in its own tree.
          # build_binder.sh reads the same file and degrades to a hardcoded 2.0.0 when it cannot;
          # this job refuses to build at all unless the file exists, is readable, carries a
          # non-comment value, and that value is the tag whose commit is pinned in this file's
          # env. So a pin bumped in rdk-halif-aidl without the commit here moving with it stops
          # as a named failure, instead of building one revision while this file claims another -
          # and instead of staging that revision into the published guest image.
          for staging in rdk-halif-aidl rdk-halif-aidl-i386; do
            pin_file="$GITHUB_WORKSPACE/$staging/binder_sdk.version"
            if [ ! -r "$pin_file" ]; then
              echo "::error::$pin_file is missing or unreadable, so the Binder SDK revision this rdk-halif-aidl snapshot declares cannot be read. build_binder.sh would fall back to its hardcoded 2.0.0 default at this point; this job will not build an SDK whose declared revision it cannot establish."
              rc=1
              continue
            fi
            # The same expression the script uses to read this file - first non-comment,
            # non-blank line, whitespace stripped - so the value compared here is the value the
            # script would have resolved.
            declared="$(grep -vE '^[[:space:]]*(#|$)' "$pin_file" | head -n 1 | tr -d '[:space:]' || true)"
            if [ -z "$declared" ]; then
              echo "::error::$pin_file carries no non-comment value, so it declares no Binder SDK revision at all. This is precisely the case build_binder.sh turns into a silent 2.0.0; commit the intended tag on its own line."
              rc=1
            elif [ "$declared" != "${BINDER_SDK_TAG:-}" ]; then
              echo "::error::$pin_file declares '$declared' but this job pins the Binder SDK at tag '${BINDER_SDK_TAG:-<unset>}', whose commit ${BINDER_SDK_COMMIT:-<unset>} is committed in this file. The two must agree or the job would build one revision while claiming another. To move the pin: read the new tag's commit with 'git rev-parse refs/tags/<tag>^{}' against the publisher (2.6.0 is an ANNOTATED tag, so the ^{} matters), then move BINDER_SDK_TAG and BINDER_SDK_COMMIT together in one edit."
              rc=1
            else
              printf '%-24s %s  %s\n' "Binder SDK tag" "$declared" "$staging/binder_sdk.version" | tee -a "$record"
            fi
          done

          [ "$rc" -eq 0 ] || exit 1
          echo "every pinned dependency checkout is at its committed commit and both declared Binder SDK tags agree with it; the record above is at $record and is uploaded by 'Upload the provisioning records'"

      # THE SPARSE-CHECKOUT TRAP, ASSERTED RATHER THAN ASSUMED.
      #
      # rdk-halif-aidl is documented elsewhere as sparse to hdmicec/ only, while TWO of the
      # four include roots this build needs - common/0.2.0.0/include and, decisively,
      # common/current, the ONLY root that supplies halcompat.h - live under common/.
      # actions/checkout is full by default and the sparse-checkout input is deliberately NOT
      # used above, so this assertion exists to turn a future sparse pattern into a named
      # failure here instead of a mysterious "halcompat.h: No such file" hundreds of lines
      # later. Both checkouts are asserted, because a partial second tree would fail equally.
      # THE SINK CALLER SOURCE IS RESOLVED, PROVEN READABLE AND EXPORTED HERE, BEFORE ANYTHING
      # CONSUMES IT.
      #
      # Two consumers, and they take it two different ways. The image builder takes the host
      # path as --sink-caller-source and copies the file into the guest, where the init exports
      # it to the suite; and any host-side use of the L1 runner takes CEC_SINK_CALLER_SOURCE
      # directly. Both are set from the one resolution below, so they cannot disagree.
      #
      # WHICH NAME GOES WHERE, and it is one each. SINK_CALLER_SOURCE is the BUILDER-FACING name
      # and is what the --sink-caller-source argument is spelled from; CEC_SINK_CALLER_SOURCE is
      # the SUITE-FACING name, read by the L1 drift guard on a host-side run and by the digest
      # cross-check after the image build. Both are set from the single resolution below, so the
      # split is about which consumer a reader should follow rather than about two values. The
      # builder invocation used to pass --sink-caller-source twice, once from each name; the
      # duplicate was harmless last-wins redundancy and is gone. Do not reintroduce it - if a
      # second consumer needs the path, read the variable rather than adding an argument.
      #
      # THE READABILITY CHECK IS NOT REDUNDANT WITH THE CHECKOUT. The drift guard distinguishes
      # "the variable is set and the file is not there" -- which it reports as a WIRING FAULT --
      # from "nothing pointed at the source at all". Exporting a path this job has not opened
      # would manufacture the first of those out of a checkout that silently produced a
      # different layout, and point a human at the wrong fault. So the file is opened here and
      # the variable is exported only afterwards.
      - name: Verify the Sink caller source and export it
        run: |
          set -euo pipefail
          sink_source="$GITHUB_WORKSPACE/entservices-hdmicecsink/plugin/HdmiCecSinkImplementation.cpp"
          if [ -L "$sink_source" ]; then
            echo "::error::$sink_source is a symbolic link rather than the checked-out source. Refused rather than followed."
            exit 1
          fi
          if [ ! -f "$sink_source" ] || [ ! -r "$sink_source" ]; then
            echo "::error::the Sink plugin source is not readable at $sink_source, so tests/L1Tests' drift guard for the modelled Sink call paths cannot run and invocation A cannot pass. The 'Checkout the Sink caller source for the L1 drift guard' step above is what puts it there; check that it ran and that SINK_REPOSITORY and SINK_REF name a reachable revision."
            exit 1
          fi
          bytes="$(wc -c < "$sink_source")"
          if [ "$bytes" -le 0 ]; then
            echo "::error::$sink_source is empty, so the drift guard would read nothing out of it."
            exit 1
          fi
          echo "Sink caller source : $sink_source ($bytes bytes)"
          echo "  read by tests/L1Tests/ccec/test_DriverAidl.cpp's drift guard, at SINK_REF=$SINK_REF"
          {
            echo "SINK_CALLER_SOURCE=$sink_source"
            echo "CEC_SINK_CALLER_SOURCE=$sink_source"
          } >> "$GITHUB_ENV"


      - name: Verify rdk-halif-aidl source include roots
        run: |
          set -euo pipefail
          rc=0
          for aidl in "$HALIF_PREFIX" "$HALIF_PREFIX_I386"; do
            if [ ! -f "$aidl/common/current/halcompat.h" ]; then
              echo "::error::halcompat.h is missing at $aidl/common/current/halcompat.h. This is the ONLY include root that supplies it - the two frozen snapshot roots do not - and both Driver.cpp's selection helper and DriverAidlImpl depend on getService<I>()/isCompatible<I>() from it. The usual cause is a sparse checkout limited to hdmicec/; this job must check the tree out in full."
              rc=1
            fi
            if [ ! -d "$aidl/common/0.2.0.0/include" ]; then
              echo "::error::the frozen common@0.2.0.0 include root is missing at $aidl/common/0.2.0.0/include. It supplies com/rdk/hal/PropertyValue.h, the ABI the hdmicec 0.1.0.0 snapshot was generated and pinned against."
              rc=1
            fi
            if [ ! -d "$aidl/hdmicec/0.1.0.0/include" ]; then
              echo "::error::the hdmicec@0.1.0.0 include root is missing at $aidl/hdmicec/0.1.0.0/include. It supplies the generated client proxies and the Bn* server bases."
              rc=1
            fi
          done
          [ "$rc" -eq 0 ] || exit 1
          echo "rdk-halif-aidl source include roots present in both checkouts"

      # Verified in the two build scripts: build_binder.sh calls bare "cmake" at :259, :266,
      # :279 and :289, build_modules.sh at :651, :660, :663, :700 and :723, and a grep across
      # both for CMAKE_BIN / CMAKE_COMMAND / "command -v cmake" / CMAKE= returns nothing. There
      # is no override hook, so an absolute path is not implementable for those scripts and a
      # step-scoped PATH prepend is the only mechanism.
      #
      # THE SDK'S CMAKE IS ALWAYS THE PINNED RELEASE, FETCHED HERE, AND NEVER AN INSTALLED ONE.
      # This step used to take the first of /usr/bin/cmake and /usr/local/bin/cmake that was at
      # least 3.22.1 and fetch 3.22.1 only when neither qualified, so the SDK was built by
      # whatever the runner image and its archive carried - apt's 3.28.3 on ubuntu-24.04 - and
      # that changed with them. It now fetches CMAKE_SDK_VERSION unconditionally, by the same
      # digest-verified path "Set up CMake" uses, asserts the extracted binary reports exactly
      # that version, and asserts that a bare `cmake` under the very prepend the SDK steps apply
      # resolves to it. The two installed cmakes stay where the image and apt put them and are
      # never consulted.
      - name: Resolve the CMake installations
        run: |
          set -euo pipefail
          cmake_version_of() { "$1" --version | head -n 1 | awk '{ print $3 }'; }

          job_wide="$(command -v cmake)"
          job_wide_version="$(cmake_version_of "$job_wide")"
          echo "job-wide cmake : $job_wide ($job_wide_version)"
          # EXACT EQUALITY against CMAKE_PINNED_VERSION - the same value "Set up CMake"
          # downloaded and digest-verified - so the pin has one spelling in this file and this
          # step measures the toolchain against it rather than against a derivative of it. It
          # used to derive a SERIES prefix ('3.16.x' -> '3.16.') and accept any patch release
          # in it, which was the right assertion for a range and is the wrong one for a pin: the
          # patch level is now part of what was verified, so a different patch level here means
          # the verified prefix is not what PATH resolves to.
          if [ "$job_wide_version" != "$CMAKE_PINNED_VERSION" ]; then
            echo "::error::the job-wide cmake is $job_wide_version, expected exactly $CMAKE_PINNED_VERSION. The rest of this chain depends on the project pin, so the newer CMake must never become the job-wide one - it is reached only by a step-scoped PATH prepend - and the pinned one must be the prefix 'Set up CMake' verified."
            exit 1
          fi

          # THE VERSION GUARD COMES FIRST. CMAKE_SDK_SHA256 was published for exactly one
          # release, and checking it against a different tarball is worse than not checking:
          # it would fail with a digest mismatch and read as tampering rather than as a stale
          # pin. So the divergence is named here, before anything is downloaded. Both values
          # are read through ":-" so a removed env entry fails at the guard that names it.
          if [ "$CMAKE_SDK_VERSION" != "${CMAKE_SDK_SHA256_FOR_VERSION:-}" ]; then
            echo "::error::CMAKE_SDK_VERSION is '$CMAKE_SDK_VERSION' but the committed CMAKE_SDK_SHA256 was published by Kitware for '${CMAKE_SDK_SHA256_FOR_VERSION:-<unset>}'. A committed digest is valid for one version only. Read the new release's own cmake-<version>-SHA-256.txt manifest, update CMAKE_SDK_SHA256 and CMAKE_SDK_SHA256_FOR_VERSION together with the version, and do not verify one version's tarball against another's digest."
            exit 1
          fi
          [ -n "${CMAKE_SDK_SHA256:-}" ] || { echo "::error::CMAKE_SDK_SHA256 is empty, so this tarball cannot be authenticated. This job does not extract an unverified CMake: commit the digest from Kitware's cmake-$CMAKE_SDK_VERSION-SHA-256.txt release manifest."; exit 1; }

          tools="$GITHUB_WORKSPACE/tools/cmake-$CMAKE_SDK_VERSION"
          mkdir -p "$tools"

          # DOWNLOADED TO A FILE AND VERIFIED BEFORE IT IS EXTRACTED. A download piped straight
          # into tar cannot be verified at all: by the time the last byte has been hashed the
          # archive has already been unpacked, so there is nothing left to refuse. The file
          # lands beside the private prefix, is compared against the committed publisher
          # digest, and only then is unpacked into it.
          tarball="$GITHUB_WORKSPACE/tools/cmake-$CMAKE_SDK_VERSION-linux-x86_64.tar.gz"
          curl -fsSL --output "$tarball" \
            "https://github.com/Kitware/CMake/releases/download/v$CMAKE_SDK_VERSION/cmake-$CMAKE_SDK_VERSION-linux-x86_64.tar.gz"

          measured="$(sha256sum "$tarball" | awk '{ print $1 }')"
          echo "cmake tarball  : $tarball"
          echo "measured sha256: $measured"
          echo "committed      : $CMAKE_SDK_SHA256  (Kitware cmake-$CMAKE_SDK_SHA256_FOR_VERSION-SHA-256.txt)"
          if [ "$measured" != "$CMAKE_SDK_SHA256" ]; then
            echo "::error::CMake tarball digest mismatch. measured $measured, committed $CMAKE_SDK_SHA256 (published by Kitware for $CMAKE_SDK_SHA256_FOR_VERSION). Either the download was tampered with or the release asset was replaced; this job will not extract an unverified CMake, and it will not be made to by relaxing this check."
            exit 1
          fi
          echo "verified against the committed publisher digest"

          tar -xz --strip-components=1 -C "$tools" -f "$tarball"
          sdk_cmake="$tools/bin/cmake"
          got="$(cmake_version_of "$sdk_cmake" 2>/dev/null || true)"
          if [ "$got" != "$CMAKE_SDK_VERSION" ]; then
            echo "::error::the extracted cmake reports '$got', not the pinned $CMAKE_SDK_VERSION. The archive that matched the committed digest does not contain the release it is named for; do not proceed on it."
            exit 1
          fi

          # WHAT THE SDK STEPS WILL ACTUALLY RUN, resolved the way they resolve it: a bare
          # `cmake` under PATH="$AIDL_CMAKE_BIN_DIR:$PATH". Asserting the binary alone would not
          # catch a prefix that does not shadow the installed cmakes.
          resolved="$(PATH="$tools/bin:$PATH"; command -v cmake || true)"
          resolved_version="$(cmake_version_of "$resolved" 2>/dev/null || true)"
          if [ "$resolved" != "$sdk_cmake" ] || [ "$resolved_version" != "$CMAKE_SDK_VERSION" ]; then
            echo "::error::with $tools/bin prepended, a bare cmake resolves to '$resolved' ($resolved_version), not the verified $sdk_cmake ($CMAKE_SDK_VERSION). build_binder.sh and build_modules.sh would then build the SDK with an unpinned CMake."
            exit 1
          fi

          echo "SDK cmake      : $sdk_cmake ($got, digest-verified), reached only through a step-scoped PATH prepend"
          echo "AIDL_CMAKE_BIN_DIR=$tools/bin" >> "$GITHUB_ENV"

      # THE PREREQUISITE BOTH JOBS PIN, AND THIS ONE CANNOT RUN WITHOUT.
      #
      # L1-tests.yml installs this same release asset, digest-verified, because 2.0-1 is the
      # lcov the acceptance runs are recorded with. This job runs run_coverage.sh, which CANNOT
      # work on 1.x: it uses --fail-under-lines and --rc branch_coverage=1, and it parses record
      # spellings that are 2.x behaviour.
      #
      # It is built here as well as in the guest for a reason worth stating: it proves the
      # pinned tarball is sane and installable BEFORE the lengthy kernel and image builds, so a
      # bad download surfaces in two minutes rather than in two hours. The guest's own copy is
      # installed and asserted by aidl-path-tests-rootfs.sh from this same tarball.
      #
      # THE DIGEST IS CHECKED AGAINST A PUBLISHER-ISSUED VALUE COMMITTED IN THIS FILE, ALWAYS,
      # BEFORE `sudo make install` RUNS. Comparing only when the workflow_dispatch input carries
      # something would leave an ordinary run unchecked, and the objection that a hard-coded
      # constant "would be a fabricated measurement" holds for a value THIS JOB measures and not
      # for one the PUBLISHER issues: LCOV_SHA256 in the env block above is the lcov v2.0 release
      # asset's own digest, corroborated by Gentoo's independently maintained Manifest for the
      # same bytes, and it is reviewed with this file rather than produced by the download it
      # authenticates. Both the mismatch arm and the empty-value arm are hard failures, so there
      # is no path from an unauthenticated tarball to a root install.
      #
      # The sidecar file is written in sha256sum's own "digest  filename" form, which is one of
      # the two forms the image builder accepts, so the verified digest travels with the tarball
      # into the image build rather than through a shell variable.
      - name: Build and assert lcov 2.x
        env:
          LCOV_EXPECTED_SHA256: ${{ github.event.inputs.lcov_expected_sha256 }}
        run: |
          set -euo pipefail
          lcov_dir="$GITHUB_WORKSPACE/lcov-src"
          mkdir -p "$lcov_dir"
          cd "$lcov_dir"

          # THE VERSION GUARD, BEFORE THE DOWNLOAD. LCOV_SHA256 was published for exactly one
          # release; comparing it against a different tarball would fail as a digest mismatch
          # and read as tampering rather than as a stale pin.
          if [ "$LCOV_VERSION" != "$LCOV_SHA256_FOR_VERSION" ]; then
            echo "::error::LCOV_VERSION is '$LCOV_VERSION' but the committed LCOV_SHA256 belongs to lcov '$LCOV_SHA256_FOR_VERSION'. A committed digest is valid for one version only. Take the new release asset's published digest, update LCOV_SHA256 and LCOV_SHA256_FOR_VERSION together with the version, and do not verify one version's tarball against another's digest."
            exit 1
          fi
          [ -n "$LCOV_SHA256" ] || { echo "::error::LCOV_SHA256 is empty, so the lcov tarball cannot be authenticated - and this step root-installs it on the runner and hands the same tarball to the image builder for a second root install inside the guest. Commit the digest published with the lcov v$LCOV_VERSION release."; exit 1; }

          tarball="lcov-$LCOV_VERSION.tar.gz"
          curl -fsSL --output "$tarball" \
            "https://github.com/linux-test-project/lcov/releases/download/v$LCOV_VERSION/$tarball"

          sha256sum "$tarball" > "$tarball.sha256"
          measured="$(awk '{ print $1 }' "$tarball.sha256")"
          echo "lcov tarball    : $tarball"
          echo "measured sha256 : $measured"
          echo "committed       : $LCOV_SHA256  (lcov v$LCOV_SHA256_FOR_VERSION release asset; corroborated by Gentoo's dev-build/lcov Manifest for the same bytes)"

          # UNCONDITIONAL, AND FAIL-CLOSED. There is no arm that records the measurement instead
          # of checking it: an unverified tarball never reaches `sudo make install` below.
          if [ "$measured" != "$LCOV_SHA256" ]; then
            echo "::error::lcov tarball digest mismatch against the committed publisher digest. measured $measured, committed $LCOV_SHA256. Either the release asset was replaced or the fetch was tampered with; this job will not root-install an unverified coverage tool. Do not resolve this by editing the committed digest to match the download - confirm the publisher's value first."
            exit 1
          fi
          echo "verified against the committed publisher digest"

          # THE DISPATCH INPUT IS A THIRD PARTY TO THAT COMPARISON, NEVER AN OVERRIDE. When it
          # is supplied it must agree with BOTH the committed value and the measurement;
          # disagreement is an error rather than a value that silently wins.
          if [ -n "${LCOV_EXPECTED_SHA256:-}" ]; then
            if [ "$LCOV_EXPECTED_SHA256" != "$LCOV_SHA256" ]; then
              echo "::error::the lcov_expected_sha256 input ($LCOV_EXPECTED_SHA256) disagrees with the digest committed in this workflow ($LCOV_SHA256). The input cannot override a committed pin: if the committed value is wrong, correct it in the workflow with the publisher's own value and say where it came from; if the input is wrong, correct the dispatch."
              exit 1
            fi
            if [ "$measured" != "$LCOV_EXPECTED_SHA256" ]; then
              echo "::error::lcov tarball digest mismatch against the supplied expected value. measured $measured, expected $LCOV_EXPECTED_SHA256."
              exit 1
            fi
            echo "third-party cross-check : the supplied input agrees with the committed digest and the measurement"
          fi

          # A single top-level directory is what the image builder's --strip-components=1
          # extraction requires, so it is asserted here where the remedy is obvious.
          top_level_count="$(tar -tzf "$tarball" | awk -F/ '{ print $1 }' | sort -u | wc -l)"
          if [ "$top_level_count" -ne 1 ]; then
            echo "::error::$tarball has $top_level_count top-level entries; exactly one is required, because the image builder extracts it with --strip-components=1. Repack it before passing it on."
            exit 1
          fi

          tar -xzf "$tarball"
          sudo make -C "lcov-$LCOV_VERSION" install

          version_line="$(lcov --version 2>&1 | head -n 1)"
          echo "lcov on PATH    : $version_line"
          major="$(printf '%s\n' "$version_line" | sed -n 's/.*[^0-9]\([0-9]\+\)\.[0-9].*/\1/p' | head -n 1)"
          case "$major" in
            ''|*[!0-9]*)
              echo "::error::could not read a major version out of '$version_line'. run_coverage.sh requires lcov 2.x and this job will not guess."
              exit 1
              ;;
          esac
          if [ "$major" -lt 2 ]; then
            echo "::error::lcov reports major version $major. run_coverage.sh requires 2.x for --fail-under-lines and --rc branch_coverage=1, and tests/L1Tests/.lcovrc_l1 is written in 2.x spellings."
            exit 1
          fi
          echo "lcov 2.x assertion passed on the runner"
          echo "LCOV_TARBALL=$lcov_dir/$tarball" >> "$GITHUB_ENV"

      # Byte-for-byte the command L1-tests.yml uses, because this prefix feeds the SAME
      # host-side build verification and divergence here would make the two jobs incomparable.
      - name: Build googletest
        run: |
          cmake -G Ninja -S "$GITHUB_WORKSPACE/googletest" -B build/googletest \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr" \
            -DBUILD_TYPE=Debug -DBUILD_GMOCK=ON -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build build/googletest -j8
          cmake --install build/googletest

      # THE PINNED PACKAGE SOURCE IS RESOLVED ONCE, HERE, BECAUSE TWO STEPS NOW CONSUME IT.
      #
      # It used to be resolved inside "Build the base root filesystem", which was then its only
      # consumer. It no longer is: the guest-matched i386 build chroot created immediately below
      # is debootstrapped from the SAME archive state, and it runs long before any base root
      # filesystem exists. Two independent resolutions could disagree - a dispatch input
      # honoured by one and not the other, a snapshot pruned between them, or simply an edit
      # that changed one copy of the validation - and a build chroot whose glibc came from a
      # different archive state than the guest's is precisely the defect the chroot exists to
      # prevent. So the timestamp is validated and proved ONCE and both consumers read the
      # exported result; there is no second place that can form an opinion about it.
      #
      # NOTHING ABOUT THE VALIDATION IS RELAXED BY THE MOVE. The YYYYMMDDTHHMMSSZ form is still
      # refused rather than passed through, and the archive is still proved to serve this suite
      # by fetching its Release file with --fail before an hour of work is committed to it. Only
      # two things changed: the Release file lands under tools/ rather than under $WORK_DIR/host,
      # because $WORK_DIR is created by a later step and this one now runs before it, and the
      # metadata banner is printed here instead of there.
      #
      # This is host-side acquisition at IMAGE-BUILD time and is legitimate. What must not
      # happen - and does not - is the GUEST reaching the network at test time; it is booted
      # with -nic none and its init refuses to run if it finds an interface, a route or a
      # resolver.
      - name: Resolve and prove the pinned Debian snapshot
        # The dispatch input reaches the script through the ENVIRONMENT, never through ${{ }}
        # interpolation into the script body, which is the same pattern the lcov and kernel
        # digest steps use. An interpolated expression is substituted before bash parses the
        # line, so a value carrying shell metacharacters would be executed rather than
        # compared; as an environment variable it is data.
        env:
          DEBIAN_SNAPSHOT_INPUT: ${{ github.event.inputs.debian_snapshot }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/tools"

          # The dispatch input wins over the env default; an empty input means "use the pin".
          snapshot="${DEBIAN_SNAPSHOT_INPUT:-}"
          [ -n "$snapshot" ] || snapshot="$GUEST_DEBIAN_SNAPSHOT"
          case "$snapshot" in
            [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]T[0-9][0-9][0-9][0-9][0-9][0-9]Z) : ;;
            *) echo "::error::the Debian snapshot timestamp '$snapshot' is not in snapshot.debian.org's YYYYMMDDTHHMMSSZ form. It is refused rather than passed through, because a malformed timestamp yields a URL that 404s deep inside debootstrap's output."; exit 1 ;;
          esac
          mirror="$GUEST_DEBIAN_SNAPSHOT_ARCHIVE/$snapshot"

          # Does the pin exist, and does it serve this suite? Asked before an hour of work is
          # committed to it. --fail makes an HTTP error an exit status; the Release file is the
          # cheapest object that proves both the snapshot and the suite are there.
          release_file="$GITHUB_WORKSPACE/tools/snapshot-Release"
          release_url="$mirror/dists/$GUEST_DEBIAN_SUITE/Release"
          if ! curl --fail --silent --show-error --location --max-time 120 \
                    --output "$release_file" -- "$release_url"; then
            echo "::error::the pinned Debian snapshot does not serve $GUEST_DEBIAN_SUITE: $release_url could not be fetched. Either the timestamp names no snapshot, or snapshot.debian.org is unavailable. Pick a timestamp that exists (the archive lists them) and pass it as the debian_snapshot input, or fix GUEST_DEBIAN_SNAPSHOT."
            exit 1
          fi
          echo "================ PINNED PACKAGE SOURCE ================"
          echo "snapshot timestamp   : $snapshot"
          echo "archive              : $mirror"
          echo "suite                : $GUEST_DEBIAN_SUITE"
          echo "architecture         : $GUEST_ARCH"
          # Evidence that the archive state is the one the pin names, read from the archive's
          # own signed metadata rather than asserted here.
          grep -E '^(Origin|Suite|Codename|Version|Date|Valid-Until|Architectures):' \
            -- "$release_file" | sed 's/^/  /' || true
          echo "================ END PINNED PACKAGE SOURCE ================"

          # Exported so every later consumer - the i386 build chroot below, the base root
          # filesystem, and the image build's --apt-mirror - uses the same composed URL, and so
          # the timestamp exists in exactly one place for the whole job.
          {
            echo "GUEST_DEBIAN_SNAPSHOT_RESOLVED=$snapshot"
            echo "GUEST_DEBIAN_MIRROR=$mirror"
          } >> "$GITHUB_ENV"
          # The Release file itself is kept rather than discarded: it is uploaded with the
          # provisioning records, so the archive state this run built against is inspectable
          # after the fact instead of only quoted in a log line.
          echo "archive metadata kept at $release_file for the provisioning artefact"

      # THE GUEST-MATCHED i386 BUILD CHROOT, AND WHY THE THREE STAGING BUILDS BELOW MOVED INTO IT.
      #
      # THE DEFECT THIS REPLACES, MEASURED RATHER THAN REASONED. The three i386 staging builds
      # used to run on the runner itself with this job's pinned gcc/g++-13 and the RUNNER's
      # glibc. The artefacts they produced are copied into the guest root image and linked
      # against INSIDE the guest, by aidl-path-tests-rootfs.sh's servicemanager readiness probe.
      # The runner is ubuntu-24.04 (glibc 2.39, libstdc++ with GLIBCXX_3.4.32) and the guest is
      # Debian bookworm i386 (glibc 2.36, libstdc++.so.6.0.30 topping out at GLIBCXX_3.4.30), so
      # the staged libraries required symbol versions the guest does not define and the in-guest
      # link died with exactly:
      #
      #   /usr/bin/ld: libbinder.so: undefined reference to `std::ios_base_library_init()@GLIBCXX_3.4.32'
      #   /usr/bin/ld: libcutils.so: undefined reference to `__isoc23_sscanf@GLIBC_2.38'
      #   /usr/bin/ld: libcutils.so: undefined reference to `__isoc23_strtol@GLIBC_2.38'
      #
      # Two independent causes, and both are properties of the COMPILER'S OWN RUNTIME rather
      # than of anything this workflow passes:
      #
      #   * g++ 13 emits a reference to std::ios_base_library_init()@GLIBCXX_3.4.32 for any C++
      #     translation unit that includes <iostream>. The guest's libstdc++ predates that
      #     version node, so the reference can never resolve there.
      #   * glibc from 2.38 onwards redirects strtol, sscanf and their family to __isoc23_*
      #     aliases whenever __GLIBC_USE(ISOC23) is on, which _GNU_SOURCE turns on and which
      #     g++ always defines. The guest's glibc 2.36 carries no __isoc23_* symbol at all.
      #
      # THREE THINGS THAT LOOK LIKE REMEDIES AND ARE NOT. Each was measured on this host/guest
      # pair before the chroot was written, and each is recorded so a future edit does not spend
      # the day rediscovering it:
      #
      #   * -D__GLIBC_USE_C2X_STRTOL=0 / -D__GLIBC_USE_C23_STRTOL=0 CANNOT WORK. glibc's own
      #     /usr/include/features.h #undefs that macro and re-derives it from __GLIBC_USE(ISOC23),
      #     so the -D is discarded before any header can read it.
      #   * -static-libstdc++ -static-libgcc IS INSUFFICIENT. It does remove the GLIBCXX_3.4.32
      #     requirement, but the host's PREBUILT 32-bit libstdc++.a itself carries undefined
      #     references to __isoc23_strtoul (in eh_alloc.o and debug.o), so the artefact still
      #     requires GLIBC_2.38. Measured, not assumed.
      #   * --sysroot=<guest rootfs> plus -static-libstdc++ fails for the same reason: the
      #     archive is prebuilt against the host's glibc, not recompiled against the sysroot's.
      #
      # THE REMEDY THAT DOES WORK is to build the staged artefacts with a toolchain whose glibc
      # and libstdc++ are NO NEWER than the guest's - which means building them in the guest's
      # own userspace. This step creates exactly that: a bookworm i386 chroot from the SAME
      # pinned snapshot the guest image is debootstrapped from, so its ceiling IS the guest's
      # ceiling by construction rather than by a constant transcribed into this file. Rebuilding
      # the same sources there produces libraries whose highest requirements are GLIBCXX_3.4.21,
      # GLIBC_2.1 and __isoc99_sscanf@GLIBC_2.7, all of which the guest defines.
      #
      # THE TOOLCHAIN DEVIATION IS RECORDED, NOT HIDDEN. bookworm cannot serve gcc-13, so the
      # staged i386 artefacts are compiled by the chroot's gcc/g++ 12 family rather than by this
      # job's pinned major 13. That is the same trade the image builder already makes for the
      # guest's own compiler - install_image_pinned_compiler gates and RECORDS rather than
      # failing, for this identical reason - so the deviation is measured here, printed here, and
      # carried into the image's SDK build-flags record so the guest's provenance says which
      # compiler family built what it is running. It is also a deviation from THIS JOB's pin and
      # not from the SDK's own requirement: linux_binder_idl's BUILD.md documents "GCC 11.2.0 or
      # later (GCC 9.4.0 minimum)", which 12.2.0 clears.
      #
      #   WHICH PIN GOVERNS WHICH BUILD, because there are now three and conflating them is the
      #   easy mistake:
      #     CEC_TOOLCHAIN_GCC_MAJOR (13), proved by "Select and prove the acceptance toolchain",
      #       governs THE HOST BUILD - the shipping libRCEC, the L1/L2 binaries and the coverage
      #       instrumentation whose .gcno notes only a matching gcov can read. It is unchanged
      #       and unweakened by this step, and nothing here touches CC, CXX or the gcov shim.
      #     The chroot's gcc-12 family governs ONLY the three i386 staging builds below, whose
      #       output is never instrumented, never measured and never linked into a host binary -
      #       it is copied into the guest image and loaded there.
      #     THE SAME CEC_TOOLCHAIN_GCC_MAJOR, handed to the image builder as
      #       --toolchain-gcc-major, governs the compiler installed INSIDE the guest, which is
      #       what the guest's own run_coverage.sh uses. The builder gates-and-records that one
      #       against the guest's archive, and this step does not affect it: the staging
      #       toolchain measured here is passed separately, as --staging-gcc-version and
      #       --staging-toolchain-state, precisely so the two cannot be confused in the image's
      #       provenance.
      #
      # WHY THE AMD64 RUNTIME IS INSTALLED INTO A 32-BIT CHROOT, which looks wrong and is not.
      # linux_binder_idl's CMakeLists.txt UNCONDITIONALLY overrides FLEX_EXECUTABLE and
      # BISON_EXECUTABLE (:859, :867) to the AOSP prebuilts at android/build-tools/linux-x86/bin,
      # and those two are ELF 64-bit x86-64 dynamic executables needing
      # /lib64/ld-linux-x86-64.so.2 plus libc, libm, libdl, libpthread, librt and libgcc_s. A
      # pure i386 root has no /lib64 at all, so code generation for the host AIDL compiler would
      # fail to exec them. libc6-amd64, lib64gcc-s1 and lib64stdc++6 supply exactly that loader
      # and those libraries, they come from the SAME pinned snapshot (so their ceiling is the
      # guest's 2.36 and they cannot reintroduce GLIBC_2.38), and they live under /lib64 and
      # /usr/lib/x86_64-linux-gnu, which an i386 gcc and ld never search. Measured inside the
      # chroot: flex 2.6.4, bison 3.8.2 and m4 1.4.19 all run.
      #
      # THE SAME RUNTIME RUNS THE TWO PINNED CMAKES, SO THE CHROOT INSTALLS NO CMAKE OF ITS OWN.
      # The Kitware x86_64 releases "Set up CMake" and "Resolve the CMake installations" fetched
      # and digest-verified need only that loader plus libc, libm, libdl, libpthread and librt,
      # and the workspace that holds them is bind-mounted at its own path. So the staging builds
      # put CMAKE_SDK_VERSION (the SDK and both snapshots) or CMAKE_PINNED_VERSION (GoogleTest)
      # first on the chroot's PATH with --env, exactly as the x86_64 builds prepend theirs, and
      # this step proves each executes in here at exactly its version. With no distribution
      # cmake in the root, a lost --env PATH fails at the first cmake call, which finds none,
      # instead of building with an unpinned one.
      #
      # NO 32-BIT PERSONALITY IS SET, DELIBERATELY. uname -m inside this chroot reports x86_64,
      # so CMAKE_HOST_SYSTEM_PROCESSOR does too, and linux_binder_idl's CMakeLists.txt:82-87
      # therefore stages the AOSP kernel-UAPI headers from build-tools/sysroots/x86_64-linux-musl
      # - byte for byte the set the previously-proven host build used. Wrapping the chroot in
      # linux32 would silently switch that to i686-linux-musl and change an input nobody asked to
      # change.
      #
      # THE CHROOT LIVES UNDER $RUNNER_TEMP, NOT UNDER $GITHUB_WORKSPACE, so it is outside the
      # tree "Verify no Actions credential is persisted in any checkout" walks, outside the
      # payload tar, and outside anything git reports.
      - name: Create the guest-matched i386 build chroot
        run: |
          set -euo pipefail
          chroot_root="$RUNNER_TEMP/cec-i386-build-chroot"
          helper="$GITHUB_WORKSPACE/tools/i386-build-chroot-run.sh"
          collector="$GITHUB_WORKSPACE/tools/collect-guest-symbol-versions.sh"
          symbol_map="$GITHUB_WORKSPACE/tools/guest-defined-symbol-versions.txt"
          mkdir -p "$GITHUB_WORKSPACE/tools"

          # The two paths are written into the generated helper as single-quoted literals, so a
          # quote in either would end the literal and change what the script does. Runner paths
          # never contain one; this refuses rather than relies on that.
          case "$chroot_root$GITHUB_WORKSPACE" in
            *\'*) echo "::error::the chroot root or the workspace path contains a single quote, which cannot be embedded safely in the generated helper script. Neither RUNNER_TEMP nor GITHUB_WORKSPACE should ever contain one."; exit 1 ;;
          esac

          # A SURVIVING ROOT IS REFUSED RATHER THAN REMOVED, and the reason is not tidiness. The
          # helper below bind-mounts /dev into the chroot; if a previous run died between the
          # mount and its trap, an `rm -rf` of this directory would delete the HOST's device
          # nodes. Refusing costs a re-run on a self-hosted runner and never costs that.
          if [ -e "$chroot_root" ]; then
            echo "::error::$chroot_root already exists. This job builds the i386 build chroot from the pinned snapshot on every run and never reuses one, because a surviving root is an unknown archive state wearing the expected name. It is NOT removed automatically: /dev is bind-mounted into it while builds run, so an rm -rf of a root with a live /dev mount would delete the host's device nodes. Check with 'mount | grep $chroot_root', unmount anything listed, then remove it."
            exit 1
          fi

          # ---------------------------------------------------------------------------------
          # The chroot itself, from the resolved snapshot rather than from a second opinion
          # about which snapshot that is. GUEST_ARCH and GUEST_DEBIAN_SUITE are the same
          # variables the base root filesystem uses, so the build environment tracks the guest
          # by construction: a suite or architecture bump moves both together or neither.
          # ---------------------------------------------------------------------------------
          # Asserted rather than assumed, and for the same reason the base root filesystem
          # asserts it: an empty mirror would make debootstrap fail on something that looks like
          # a network fault, when the real fault is that the resolution step did not run first.
          if [ -z "${GUEST_DEBIAN_MIRROR:-}" ] || [ -z "${GUEST_DEBIAN_SNAPSHOT_RESOLVED:-}" ]; then
            echo "::error::GUEST_DEBIAN_MIRROR and GUEST_DEBIAN_SNAPSHOT_RESOLVED are not both set, so this chroot cannot be built from the same archive state as the guest - which is the ONLY property that makes it a guest-matched chroot. They are exported by 'Resolve and prove the pinned Debian snapshot', which must run before this step."
            exit 1
          fi
          echo "debootstrapping $GUEST_DEBIAN_SUITE/$GUEST_ARCH from $GUEST_DEBIAN_MIRROR"
          echo "  (snapshot $GUEST_DEBIAN_SNAPSHOT_RESOLVED - the same one the guest image is built from)"
          sudo debootstrap --arch="$GUEST_ARCH" --variant=minbase --components=main \
            "$GUEST_DEBIAN_SUITE" "$chroot_root" "$GUEST_DEBIAN_MIRROR"

          # apt inside the chroot must reach the same archive, and the AOSP clone the SDK build
          # performs needs a resolver. Both are host-side acquisition at image-build time, which
          # is legitimate here and is what the guest is forbidden from doing at test time.
          printf 'deb %s %s main\n' "$GUEST_DEBIAN_MIRROR" "$GUEST_DEBIAN_SUITE" \
            | sudo tee "$chroot_root/etc/apt/sources.list" > /dev/null
          sudo cp -- /etc/resolv.conf "$chroot_root/etc/resolv.conf"

          # git refuses to operate on a repository owned by another user, and every checkout the
          # chroot builds from is owned by the runner account while the chroot runs as root. The
          # authoritative HEAD assertions still run OUTSIDE the chroot as the runner, so this
          # relaxes nothing that guards which commit is built - it only lets build_binder.sh's
          # own rev-parse and the AOSP clone work.
          printf '%s\n' '[safe]' '  directory = *' \
            | sudo tee "$chroot_root/etc/gitconfig" > /dev/null

          # ---------------------------------------------------------------------------------
          # The helper every later step uses to enter the chroot. It is generated rather than
          # committed because the two absolute paths it needs are runner-scoped, and it is a
          # script rather than an inline `sudo chroot` because the mounts need a teardown trap
          # that an inline command cannot carry across a failing build.
          # ---------------------------------------------------------------------------------
          {
            printf '%s\n' '#!/usr/bin/env bash'
            printf '%s\n' '# Generated by .github/workflows/aidl-path-tests.yml. Do not edit in place.'
            printf '%s\n' '#'
            printf '%s\n' '# Runs ONE command inside the guest-matched i386 build chroot, with the runner workspace'
            printf '%s\n' '# bind-mounted at the SAME absolute path it has outside. That is what lets the three'
            printf '%s\n' '# staging builds keep using the paths they already know - the checkouts, GTEST_PREFIX_I386,'
            printf '%s\n' '# HALIF_PREFIX_I386, the generated CMake toolchain file - with no path rewriting and no'
            printf '%s\n' '# copying, and it is why the artefacts land directly in the directories the later'
            printf '%s\n' '# verification and image-build steps read.'
            printf '%s\n' '#'
            printf '%s\n' '#   usage: sudo <this script> [--chdir DIR] [--env NAME=VALUE]... -- command [args...]'
            printf '%s\n' '#'
            printf '%s\n' '# The two paths below are baked in at generation time rather than read from the'
            printf '%s\n' '# environment: this script is invoked through sudo, and sudo env_reset would drop them.'
            printf '%s\n' '#'
            printf '%s\n' '# The mounts are made here and torn down by an EXIT/INT/TERM trap. That matters more than'
            printf '%s\n' '# tidiness: /dev is bind-mounted, so a root left mounted after a failed build would turn'
            printf '%s\n' "# a later 'rm -rf' of the chroot into a deletion of the host's device nodes."
            printf '%s\n' 'set -euo pipefail'
            printf '%s\n' ''
            printf 'CHROOT_ROOT=%s\n' "'$chroot_root'"
            printf 'WORKSPACE=%s\n' "'$GITHUB_WORKSPACE'"
            cat <<'CHROOT_HELPER_EOF'
          SELF_NAME='i386-build-chroot-run'

          die() { printf '::error::%s: %s\n' "$SELF_NAME" "$*" >&2; exit 1; }

          [ "$(id -u)" = '0' ] || die "must run as root; it mounts the workspace and the pseudo-filesystems into the chroot. Invoke it through sudo."

          chdir=''
          declare -a passthrough=()
          while [ $# -gt 0 ]; do
            case "$1" in
              --chdir)
                [ $# -ge 2 ] || die "--chdir needs a directory."
                chdir="$2"; shift 2 ;;
              --env)
                [ $# -ge 2 ] || die "--env needs a NAME=VALUE pair."
                case "$2" in
                  [A-Za-z_]*=*) : ;;
                  *) die "--env expects NAME=VALUE, got '$2'." ;;
                esac
                passthrough+=("$2"); shift 2 ;;
              --) shift; break ;;
              *)  die "unknown argument '$1'; the form is [--chdir DIR] [--env NAME=VALUE]... -- command [args...]" ;;
            esac
          done
          [ $# -ge 1 ] || die "no command was given after --."

          [ -d "$CHROOT_ROOT" ] || die "the build chroot is not present at $CHROOT_ROOT."
          [ -x "$CHROOT_ROOT/usr/bin/env" ] || die "$CHROOT_ROOT does not look like a populated root filesystem: no executable /usr/bin/env."
          [ -d "$WORKSPACE" ] || die "the workspace is not present at $WORKSPACE."

          declare -a MOUNTED=()

          unmount_all() {
            local i target attempt
            for (( i = ${#MOUNTED[@]} - 1; i >= 0; i-- )); do
              target="${MOUNTED[i]}"
              for attempt in 1 2 3 4 5; do
                mountpoint -q -- "$target" || break
                umount -- "$target" 2>/dev/null && break
                # A lazy unmount is the fallback rather than the first move: it detaches the
                # mount from the namespace immediately even if a descendant is still busy,
                # which is what keeps a failed build from leaving /dev bound under the chroot.
                umount -l -- "$target" 2>/dev/null && break
                sleep 1
              done
              if mountpoint -q -- "$target"; then
                printf '::error::%s: %s is still mounted after five attempts. Do NOT remove %s until it is unmounted.\n' \
                  "$SELF_NAME" "$target" "$CHROOT_ROOT" >&2
              fi
            done
            MOUNTED=()
          }
          trap unmount_all EXIT INT TERM

          # $1 = filesystem type, or the literal 'bind'
          # $2 = source
          # $3 = target
          # $4 = optional comma-separated mount options
          mount_one() {
            mkdir -p -- "$3"
            if [ "$1" = 'bind' ]; then
              mount --bind ${4:+-o "$4"} -- "$2" "$3"
            else
              mount -t "$1" ${4:+-o "$4"} "$2" "$3"
            fi
            MOUNTED+=("$3")
          }

          # /proc so nproc, the compilers and cmake can read the machine; /sys read-only because
          # nothing in these builds writes it; /dev for the loader, /dev/null and /dev/urandom;
          # /dev/pts because git and apt want a terminal device when they have one.
          mount_one proc  proc     "$CHROOT_ROOT/proc"
          mount_one sysfs sysfs    "$CHROOT_ROOT/sys" ro
          mount_one bind  /dev     "$CHROOT_ROOT/dev"
          mount_one bind  /dev/pts "$CHROOT_ROOT/dev/pts"
          mount_one bind  "$WORKSPACE" "$CHROOT_ROOT$WORKSPACE"

          # env -i, so nothing of the runner's environment leaks in and changes a build: no
          # CC/CXX pointing at the host's gcc-13, no CPPFLAGS naming host include roots, no
          # PATH that could reach a host binary. What the builds need is passed explicitly with
          # --env by the caller. --chdir must precede the NAME=VALUE assignments: env treats the
          # first non-option argument as the command name, so an option after an assignment
          # would be passed to the command instead of acted on.
          status=0
          chroot -- "$CHROOT_ROOT" /usr/bin/env -i \
            ${chdir:+"--chdir=$chdir"} \
            PATH='/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin' \
            HOME='/root' \
            LC_ALL='C' \
            TMPDIR='/tmp' \
            CC='/usr/bin/gcc' \
            CXX='/usr/bin/g++' \
            "${passthrough[@]}" \
            "$@" || status=$?
          exit "$status"
          CHROOT_HELPER_EOF
          } > "$helper"
          chmod 0755 "$helper"

          # ---------------------------------------------------------------------------------
          # The build dependencies, resolved by apt inside the chroot rather than by
          # debootstrap's --include, so real dependency resolution applies. Every one is
          # required by something in the three staging builds; none is speculative:
          #
          #   build-essential   gcc, g++, make, libc6-dev and dpkg-dev
          #   ninja-build       the generator the googletest staging asks for with -G Ninja
          #   flex, bison       find_package(FLEX)/(BISON) in linux_binder_idl (:856-857)
          #   pkg-config        find_package(PkgConfig) in linux_binder_idl (:103)
          #   git               build_binder.sh's rev-parse, and the AOSP clone plus git apply
          #   python3           build_modules.sh's manifest pass
          #   ca-certificates   the AOSP clone is https
          #   libc6-amd64,      the loader and 64-bit runtime the AOSP prebuilt flex and bison
          #   lib64gcc-s1,        need in order to exec at all - see the comment block above;
          #   lib64stdc++6        libc6-amd64 is also all the two pinned x86_64 cmakes need
          #
          # cmake is deliberately ABSENT: the builds use the two pinned releases, never one of
          # this archive's.
          # ---------------------------------------------------------------------------------
          chroot_packages='build-essential ninja-build flex bison pkg-config git python3 ca-certificates libc6-amd64 lib64gcc-s1 lib64stdc++6'
          sudo "$helper" --env DEBIAN_FRONTEND=noninteractive --env CHROOT_PACKAGES="$chroot_packages" -- \
            /bin/sh -c 'apt-get -qq update && apt-get -qq -y --no-install-recommends install $CHROOT_PACKAGES'

          # ---------------------------------------------------------------------------------
          # The measurements. Every value below is read out of the chroot rather than
          # transcribed into this file, so a suite bump changes them instead of invalidating
          # them silently.
          # ---------------------------------------------------------------------------------
          echo "================ i386 BUILD CHROOT ================"
          echo "root                 : $chroot_root"
          sudo "$helper" -- /bin/sh -c 'gcc --version | head -n 1; g++ --version | head -n 1; ldd --version | head -n 1; ninja --version; git --version; python3 --version'
          echo "================ END i386 BUILD CHROOT ================"

          staging_gcc="$(sudo "$helper" -- /bin/sh -c 'gcc -dumpfullversion 2>/dev/null || gcc -dumpversion' | tr -d '[:space:]')"
          staging_gxx="$(sudo "$helper" -- /bin/sh -c 'g++ -dumpfullversion 2>/dev/null || g++ -dumpversion' | tr -d '[:space:]')"
          case "$staging_gcc" in
            [0-9]*.[0-9]*) : ;;
            *) echo "::error::could not read a dotted version out of the build chroot's gcc ('$staging_gcc'). The staging toolchain must be measurable, because its identity is recorded into the guest image's provenance."; exit 1 ;;
          esac
          if [ "$staging_gcc" != "$staging_gxx" ]; then
            echo "::error::the build chroot's gcc ($staging_gcc) and g++ ($staging_gxx) are different versions. The C and C++ halves of the staged libraries would then carry two different runtimes, which is the class of defect this chroot exists to remove."
            exit 1
          fi
          staging_major="${staging_gcc%%.*}"

          # GATE-AND-RECORD, in the same shape and for the same reason as the image builder's
          # install_image_pinned_compiler: bookworm cannot serve gcc-13, so a mismatch against
          # this job's host pin is EXPECTED and is recorded as a deviation rather than failing
          # the build. What would be a real failure is a compiler older than the SDK's own
          # documented floor, and that is checked.
          if [ "$staging_major" = "$CEC_TOOLCHAIN_GCC_MAJOR" ]; then
            staging_state='matches-pin'
          else
            staging_state='deviates-from-pin'
          fi
          if [ "$staging_major" -lt 11 ]; then
            echo "::error::the build chroot's gcc is $staging_gcc, older than the GCC 11.2.0 linux_binder_idl's BUILD.md documents as its requirement (9.4.0 absolute minimum). A deviation from this job's pinned major $CEC_TOOLCHAIN_GCC_MAJOR is accepted and recorded; a compiler below the SDK's own floor is not."
            exit 1
          fi
          echo "staging toolchain    : gcc/g++ $staging_gcc  (host pin: major $CEC_TOOLCHAIN_GCC_MAJOR, state: $staging_state)"
          if [ "$staging_state" = 'deviates-from-pin' ]; then
            echo "  RECORDED DEVIATION. The three i386 staging builds below are compiled by this gcc-$staging_major"
            echo "  family, not by the pinned major $CEC_TOOLCHAIN_GCC_MAJOR, because $GUEST_DEBIAN_SUITE cannot serve the pin and"
            echo "  because a newer compiler's runtime is exactly what made the staged libraries unloadable"
            echo "  in the guest. It is passed to the image builder as --staging-gcc-version and"
            echo "  --staging-toolchain-state, so the guest's own SDK build-flags record says which"
            echo "  compiler family built what it is running. The host build and the coverage"
            echo "  instrumentation remain on the pinned major $CEC_TOOLCHAIN_GCC_MAJOR, unchanged."
          fi

          # THE TWO PINNED CMAKES, EXECUTED IN HERE AT EXACTLY THEIR VERSIONS. The staging steps
          # reach them as "$bin:$CEC_I386_CHROOT_PATH" with --env PATH, so that is the form run
          # here; CEC_I386_CHROOT_PATH is the helper's own PATH, read out of the chroot rather
          # than restated. Each must resolve to its verified binary and report its pin, and a
          # bare cmake on the helper's own PATH must resolve to nothing at all.
          chroot_path="$(sudo "$helper" -- /usr/bin/printenv PATH)"
          [ -n "$chroot_path" ] || { echo "::error::could not read the build chroot helper's PATH, so the pinned cmakes cannot be put first on it."; exit 1; }
          sdk_cmake_bin="${AIDL_CMAKE_BIN_DIR:?AIDL_CMAKE_BIN_DIR is unset. It is exported by the Resolve the CMake installations step, which must run before this one.}"
          pinned_cmake_bin="$GITHUB_WORKSPACE/tools/cmake-$CMAKE_PINNED_VERSION/bin"
          chroot_cmake_sdk=''
          chroot_cmake_pinned=''
          for pair in "sdk:$CMAKE_SDK_VERSION:$sdk_cmake_bin" "pinned:$CMAKE_PINNED_VERSION:$pinned_cmake_bin"; do
            role="${pair%%:*}"; rest="${pair#*:}"; want="${rest%%:*}"; bin="${rest#*:}"
            if ! out="$(sudo "$helper" --env PATH="$bin:$chroot_path" -- /bin/sh -c 'command -v cmake && cmake --version' 2>&1)"; then
              echo "::error::the pinned cmake $want at $bin/cmake does not execute inside the i386 build chroot, so the staging builds below cannot run it. Its output:"
              printf '%s\n' "$out"
              exit 1
            fi
            where="$(printf '%s\n' "$out" | head -n 1)"
            got="$(printf '%s\n' "$out" | awk '/^cmake version / { print $3; exit }')"
            if [ "$where" != "$bin/cmake" ] || [ "$got" != "$want" ]; then
              echo "::error::inside the i386 build chroot a bare cmake under PATH=$bin:... resolves to '$where' reporting '${got:-<no version>}', not the verified $bin/cmake at exactly $want."
              exit 1
            fi
            echo "chroot cmake         : $where ($got, pinned, executes in the chroot)"
            if [ "$role" = 'sdk' ]; then chroot_cmake_sdk="$got"; else chroot_cmake_pinned="$got"; fi
          done
          if stray="$(sudo "$helper" -- /bin/sh -c 'command -v cmake')"; then
            echo "::error::the build chroot carries a cmake of its own at '$stray'. The staging builds must only ever run the two pinned releases; remove the package that installed it from chroot_packages."
            exit 1
          fi

          # ---------------------------------------------------------------------------------
          # The guest's symbol-version ceiling, MEASURED. This map is what the fail-fast check
          # after the staging builds compares every staged artefact against, and it is read out
          # of the chroot for one reason: the chroot and the guest are debootstrapped from the
          # same suite and the same snapshot, so the chroot's defined versions ARE the guest's.
          # A hardcoded pair of ceilings would go stale the moment GUEST_DEBIAN_SUITE moved.
          # ---------------------------------------------------------------------------------
          {
            printf '%s\n' '#!/bin/sh'
            printf '%s\n' '# Generated by .github/workflows/aidl-path-tests.yml. Do not edit in place.'
            printf '%s\n' '#'
            printf '%s\n' '# Prints "<soname><TAB><version>" for every symbol version DEFINED by every shared'
            printf '%s\n' "# library in this root's own multiarch library directories. readelf's section names are"
            printf '%s\n' '# used verbatim: "Version definition section" (.gnu.version_d) is what a library'
            printf '%s\n' '# DEFINES, and "Version needs section" (.gnu.version_r) is what it REQUIRES. The awk'
            printf '%s\n' '# stops at the next .gnu. section header so the two can never be mixed.'
            printf '%s\n' '#'
            printf '%s\n' '# The multiarch directory is asked of dpkg rather than assumed, so this is correct for'
            printf '%s\n' '# i386 and for armhf without an edit.'
            cat <<'SYMBOL_COLLECTOR_EOF'
          set -eu
          multiarch="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
          for so in "/lib/$multiarch"/*.so* "/usr/lib/$multiarch"/*.so*; do
            [ -f "$so" ] || continue
            soname="$(readelf -d -- "$so" 2>/dev/null | sed -n 's/.*Library soname: \[\(.*\)\].*/\1/p' | head -n 1)"
            [ -n "$soname" ] || soname="${so##*/}"
            readelf -V -- "$so" 2>/dev/null | awk -v soname="$soname" '
              /Version definition section/ { inside = 1; next }
              /section .\.gnu\./           { inside = 0 }
              inside && /Name: /           { sub(/.*Name: /, ""); sub(/[ \t].*/, ""); print soname "\t" $0 }
            '
          done
          SYMBOL_COLLECTOR_EOF
          } > "$collector"
          chmod 0755 "$collector"

          sudo "$helper" -- /bin/sh "$collector" | sort -u > "$symbol_map"

          # AN EMPTY OR TRUNCATED MAP WOULD MAKE THE LATER CHECK VACUOUSLY GREEN, which is worse
          # than not having the check: it would pass the exact artefacts that broke the guest.
          # So the map is proved to carry both of the ceilings that matter and a plausible
          # number of rows before anything is allowed to consult it.
          map_rows="$(wc -l < "$symbol_map" | tr -d '[:space:]')"
          glibcxx_ceiling="$(awk -F'\t' '$2 ~ /^GLIBCXX_/ { print $2 }' "$symbol_map" | sort -V | tail -n 1)"
          glibc_ceiling="$(awk -F'\t' '$2 ~ /^GLIBC_2\./ { print $2 }' "$symbol_map" | sort -V | tail -n 1)"
          if [ "$map_rows" -lt 50 ] || [ -z "$glibcxx_ceiling" ] || [ -z "$glibc_ceiling" ]; then
            echo "::error::the guest symbol-version map at $symbol_map is not usable: $map_rows row(s), highest GLIBCXX '${glibcxx_ceiling:-<none>}', highest GLIBC '${glibc_ceiling:-<none>}'. It must carry both ceilings, because the staged-artefact check consults it and an empty map would pass every artefact. Check that libstdc++6 and libc6 are installed in the chroot and that readelf is present."
            exit 1
          fi
          echo "guest symbol ceiling : $glibcxx_ceiling / $glibc_ceiling  ($map_rows soname/version pairs measured)"

          {
            echo "CEC_I386_CHROOT=$chroot_root"
            echo "CEC_I386_CHROOT_RUN=$helper"
            echo "CEC_I386_CHROOT_PATH=$chroot_path"
            echo "CEC_GUEST_SYMBOL_VERSIONS=$symbol_map"
            echo "CEC_GUEST_GLIBCXX_CEILING=$glibcxx_ceiling"
            echo "CEC_GUEST_GLIBC_CEILING=$glibc_ceiling"
            echo "CEC_STAGING_GCC_VERSION=$staging_gcc"
            echo "CEC_STAGING_TOOLCHAIN_STATE=$staging_state"
          } >> "$GITHUB_ENV"

          # THE DEVIATION IS PUT WHERE A READER LOOKS FIRST, in the same shape as the runner
          # toolchain's own section: a pin, a measured value and a state. A deviation recorded
          # only in a step log is a deviation most readers will not find, and the whole point of
          # gate-and-record rather than gate-and-fail is that the record has to be as visible as
          # the failure would have been.
          {
            echo "### Guest-matched i386 staging toolchain (deviation from the runner pin: $staging_state)"
            echo
            echo "| What | Pin | Measured | State |"
            echo "| --- | --- | --- | --- |"
            echo "| staging gcc/g++ (i386 build chroot) | major $CEC_TOOLCHAIN_GCC_MAJOR | $staging_gcc | $staging_state |"
            echo "| chroot cmake, Binder SDK and snapshots | exactly $CMAKE_SDK_VERSION (digest-verified x86_64 release) | $chroot_cmake_sdk | gated |"
            echo "| chroot cmake, GoogleTest | exactly $CMAKE_PINNED_VERSION (digest-verified x86_64 release) | $chroot_cmake_pinned | gated |"
            echo "| guest symbol-version ceiling | measured, not pinned | $glibcxx_ceiling / $glibc_ceiling | recorded |"
            echo
            echo "The three i386 staging builds - GoogleTest, the Binder SDK and the AIDL client stub snapshots - are compiled inside a \`$GUEST_DEBIAN_SUITE\`/\`$GUEST_ARCH\` chroot debootstrapped from the same pinned snapshot as the guest image, because artefacts built by the runner's newer compiler require symbol versions (\`GLIBCXX_3.4.32\`, \`__isoc23_*@GLIBC_2.38\`) that the guest's runtime does not define. \`$GUEST_DEBIAN_SUITE\` cannot serve the pinned GCC $CEC_TOOLCHAIN_GCC_MAJOR family, so this deviation is unavoidable and is recorded rather than gated - the same trade the image builder makes for the guest's own compiler. **The host build and the coverage instrumentation remain on the pinned major $CEC_TOOLCHAIN_GCC_MAJOR and are unaffected.** These two values are passed to the image builder as \`--staging-gcc-version\` and \`--staging-toolchain-state\`, so the guest's own SDK build-flags record names the compiler family that built what it is running."
          } >> "$GITHUB_STEP_SUMMARY"
          df -h "$GITHUB_WORKSPACE" | tail -n 1

      # THE GUEST'S GoogleTest, AND WHY --gtest-prefix IS NOT OPTIONAL.
      #
      # The image builder requires it twice over. Its input validation requires the LITERAL
      # file <prefix>/lib/pkgconfig/gtest.pc to exist before the build starts, and its in-image
      # assertions then run "pkg-config --atleast-version=1.10.0 gtest" inside the chroot with
      # PKG_CONFIG_PATH pointing at that copied prefix - populated only when --gtest-prefix was
      # given. configure.ac's PKG_CHECK_MODULES([GTEST], [gtest >= 1.10.0]) consults pkg-config
      # ONLY and ignores -I/-L, so headers and libraries on their own cannot satisfy it.
      #
      # -DCMAKE_INSTALL_LIBDIR=lib is load-bearing rather than tidy: on a Debian-family host
      # GNUInstallDirs can multiarch the library directory, which would put gtest.pc under
      # lib/<triple>/pkgconfig and fail the literal-path check above.
      #
      # THIS BUILD RUNS INSIDE THE GUEST-MATCHED i386 CHROOT, for the reason the chroot step
      # sets out at length: these archives are copied into the guest image and linked there, and
      # a libgtest.a compiled by the runner's g++-13 carries references to GLIBCXX_3.4.32 that
      # the guest's libstdc++ cannot resolve. The cmake that runs is the job-wide pin,
      # CMAKE_PINNED_VERSION - the same digest-verified x86_64 release the runner's GoogleTest
      # build uses - put first on the chroot's PATH with --env; "Create the guest-matched i386
      # build chroot" has proved it executes there at exactly that version, and the chroot has
      # no cmake of its own to fall back on.
      #
      # --chdir keeps the working directory at the workspace so `-B build/googletest-i386` still
      # resolves to the same relative path it did before, and the workspace is bind-mounted at
      # its own absolute path so -S and -DCMAKE_INSTALL_PREFIX need no rewriting.
      #
      # -m32 IS KEPT, and it is now a no-op rather than a lever. Measured in the chroot: the
      # compiler's own target is i686-linux-gnu, and a translation unit compiled with and
      # without -m32 both produce Class ELF32 / Machine Intel 80386. It stays for three reasons:
      # it states what the artefact must be instead of leaving that to an inherited default; it
      # keeps this step's flags identical in intent to the CMake toolchain file the SDK build
      # needs, where the flag is not optional; and it means the ELF32 assertions below are
      # checking a stated requirement rather than an accident. Removing it would change nothing
      # measurable and would make the two staging paths disagree on their own terms.
      - name: Build googletest for the guest (i386)
        run: |
          set -euo pipefail
          in_chroot() {
            sudo "$CEC_I386_CHROOT_RUN" --chdir "$GITHUB_WORKSPACE" \
              --env PATH="$GITHUB_WORKSPACE/tools/cmake-$CMAKE_PINNED_VERSION/bin:$CEC_I386_CHROOT_PATH" \
              "$@"
          }

          in_chroot -- cmake -G Ninja -S "$GITHUB_WORKSPACE/googletest" -B build/googletest-i386 \
            -DCMAKE_INSTALL_PREFIX="$GTEST_PREFIX_I386" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_TYPE=Debug -DBUILD_GMOCK=ON -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 \
            -DCMAKE_EXE_LINKER_FLAGS=-m32 -DCMAKE_SHARED_LINKER_FLAGS=-m32
          in_chroot -- cmake --build build/googletest-i386 -j8
          in_chroot -- cmake --install build/googletest-i386

          # THE ARTEFACTS ARE HANDED BACK TO THE RUNNER ACCOUNT. The chroot builds as root, so
          # everything it wrote into the workspace is root-owned; later steps read, tar and
          # `rm -rf` these trees as the unprivileged runner and would fail on a root-owned
          # subtree. This is ownership only - no content is touched.
          sudo chown -R "$(id -u):$(id -g)" -- \
            "$GITHUB_WORKSPACE/install-i386" "$GITHUB_WORKSPACE/build/googletest-i386"

          for required in \
            "$GTEST_PREFIX_I386/lib/pkgconfig/gtest.pc" \
            "$GTEST_PREFIX_I386/lib/pkgconfig/gmock.pc" \
            "$GTEST_PREFIX_I386/lib/libgtest.a" \
            "$GTEST_PREFIX_I386/lib/libgmock.a"; do
            if [ ! -f "$required" ]; then
              echo "::error::the i386 GoogleTest prefix is missing $required. The image builder validates <prefix>/lib/pkgconfig/gtest.pc by literal path and its in-image assertion queries gtest through pkg-config, so both the .pc files and the archives must land exactly here."
              exit 1
            fi
            echo "  ok  $required"
          done

          # readelf rather than file, because file describes a static library as an "ar
          # archive" and says nothing about the ELF class of the objects inside it. readelf
          # walks the members and reports each header, so the first Class/Machine pair it
          # prints is a real measurement of what was compiled.
          elf_class="$(readelf -h "$GTEST_PREFIX_I386/lib/libgtest.a" 2>/dev/null | awk '/Class:/ { print $2; exit }')"
          elf_machine="$(readelf -h "$GTEST_PREFIX_I386/lib/libgtest.a" 2>/dev/null | sed -n 's/^[[:space:]]*Machine:[[:space:]]*//p' | head -n 1)"
          echo "libgtest.a: class=$elf_class machine=$elf_machine"
          if [ "$elf_class" != "ELF32" ]; then
            echo "::error::the guest's GoogleTest was built as $elf_class (machine '$elf_machine'), not ELF32. The guest userspace is all-32-bit, and this build runs inside the i386 build chroot whose compiler is natively 32-bit, so an ELF64 result means the compile did not happen in the chroot at all - check that the cmake invocations above still go through \$CEC_I386_CHROOT_RUN rather than reaching the runner's compiler directly."
            exit 1
          fi

      # BINDER_VERSION AND BINDER_SOURCE_DIR ARE BOTH SET, DELIBERATELY, AND THIS COMMENT USED
      # TO SAY THE OPPOSITE.
      #
      # The earlier revision left BINDER_VERSION unset and argued that the script's own reading
      # of rdk-halif-aidl/binder_sdk.version was the safer pin. That was wrong in the direction
      # that matters: the script reads the pin and then fails OPEN three ways - a hardcoded
      # 2.0.0 when the pin file cannot be read, success-with-a-warning when the source directory
      # already exists at another ref, and "using default branch" when the checkout of the
      # requested ref fails. The BINDER_SDK_* block in this file's env sets out all three. The
      # concern that motivated the old comment is still honoured: the version is not taken from
      # the script's stale help text, it is the commit of the tag binder_sdk.version declares,
      # and "Verify the pinned dependency checkouts" has already refused to let those two
      # disagree.
      #
      # So the tree is the one "Checkout the Binder SDK source" produced and that step asserted,
      # named here through the script's own BINDER_SOURCE_DIR hook, and BINDER_VERSION is the
      # immutable COMMIT rather than a tag - which also makes the script's clone path correct if
      # the tree were ever absent, instead of leaving it on a branch. The script prints an
      # advisory line comparing BINDER_VERSION against the tree's ABBREVIATED sha and will say
      # they differ; that comparison is its own, it is not a failure, and the assertions here are
      # what govern.
      #
      # THE HEAD IS ASSERTED TWICE, AND THE SECOND TIME IS THE POINT: before the build, so
      # nothing is compiled from an unexpected tree, and AGAIN after the script returns and
      # BEFORE the marker check and everything staged out of it, because the script's
      # existing-tree arm only warns.
      #
      # The step is idempotent - a present .sdk_ready short-circuits the build - and that marker
      # is still asserted. IT IS NECESSARY AND NOT SUFFICIENT: it says a build finished and says
      # nothing about WHICH SOURCE it was built from, which is what the two HEAD assertions are
      # for. Neither replaces the other.
      - name: Build the Binder SDK
        run: |
          set -euo pipefail
          src="$BINDER_SDK_SOURCE_DIR"

          assert_source_head() {
            local when="$1" head=''
            head="$(git -C "$src" rev-parse HEAD 2>/dev/null || true)"
            if [ "$head" != "$BINDER_SDK_COMMIT" ]; then
              echo "::error::the Binder SDK source at $src is at '${head:-<not a readable git checkout>}' $when, but this job pins $BINDER_SDK_COMMIT (tag $BINDER_SDK_TAG). Nothing may be built from or staged out of a Binder source tree that is not the pinned commit."
              exit 1
            fi
            echo "  ok  Binder SDK source at $src is $head $when"
          }

          assert_source_head "before the build"

          cd "$HALIF_PREFIX"
          BINDER_SOURCE_DIR="$src" BINDER_VERSION="$BINDER_SDK_COMMIT" \
            PATH="$AIDL_CMAKE_BIN_DIR:$PATH" ./build_binder.sh

          assert_source_head "after build_binder.sh returned"

          if [ ! -f "$BINDER_SDK_DIR/.sdk_ready" ]; then
            echo "::error::the Binder SDK build did not leave its readiness marker at $BINDER_SDK_DIR/.sdk_ready, so the staged tree cannot be trusted even if the script exited zero."
            exit 1
          fi
          echo "Binder SDK staged: declared tag $(grep -vE '^[[:space:]]*(#|$)' "$HALIF_PREFIX/binder_sdk.version" | head -n 1), built from $src at $BINDER_SDK_COMMIT"

      # common is built and linked at 0.2.0.0 and NOT at the component's newer release, because
      # 0.2.0.0 is the ABI the released hdmicec snapshot was generated and pinned against: that
      # snapshot's CMakeLists links common-v0.2.0.0-cpp at :83 and includes
      # ${HALIF_INCLUDE_DIR}/common/0.2.0.0/include at :71-73. Linking the newer library would
      # put a different ABI underneath pre-generated code compiled against older headers.
      # common goes first because build_modules.sh pre-checks each dependency's shared object.
      - name: Build the AIDL client stub snapshots
        run: |
          set -euo pipefail
          cd "$HALIF_PREFIX"
          PATH="$AIDL_CMAKE_BIN_DIR:$PATH" ./build_modules.sh common --version 0.2.0.0
          PATH="$AIDL_CMAKE_BIN_DIR:$PATH" ./build_modules.sh hdmicec --version 0.1.0.0
          ls -l "$HALIF_LIB_DIR"

      # Each of the four include roots and two library directories is asserted before anything
      # consumes it, so a staging path that resolved to the wrong place is a named failure here
      # rather than a library that silently carries only one back-end.
      - name: Verify the staged AIDL and Binder roots
        run: |
          set -euo pipefail
          rc=0
          require() {
            if [ "$1" = "-I" ] || [ "$1" = "-L" ]; then
              [ -d "$2" ] && { printf '  %-2s %s\n' "$1" "$2"; return 0; }
            else
              [ -f "$2" ] && { printf '  %-2s %s\n' "$1" "$2"; return 0; }
            fi
            echo "::error::$1 target missing: $2 ($3)"
            rc=1
          }
          require -I "$HALIF_PREFIX/hdmicec/0.1.0.0/include" "the generated hdmicec client stubs and Bn* server bases"
          require -I "$HALIF_PREFIX/common/0.2.0.0/include"  "com/rdk/hal/PropertyValue.h, the frozen import the snapshot was generated against"
          require -I "$HALIF_PREFIX/common/current"          "halcompat.h - the ONLY root that supplies it"
          require -I "$BINDER_SDK_INCLUDE_DIR/include/binder_sdk" "the Binder SDK headers the generated stubs include"
          require -L "$HALIF_LIB_DIR"                        "libhdmicec-v0.1.0.0-cpp and libcommon-v0.2.0.0-cpp"
          require -L "$BINDER_SDK_DIR/lib/binder"            "libbinder, libutils and libbinder's own runtime closure"
          require -l "$HALIF_LIB_DIR/libcommon-v0.2.0.0-cpp.so"  "the frozen common ABI, at 0.2.0.0 and not a newer release"
          require -l "$HALIF_LIB_DIR/libhdmicec-v0.1.0.0-cpp.so" "the hdmicec client stub library"
          [ "$rc" -eq 0 ] || exit 1

      # THE i386 TOOLCHAIN FILE, AND WHY IT IS THE ONLY AVAILABLE LEVER.
      #
      # build_binder.sh configures with a fixed argument list and offers no way to pass -D, and
      # it removes a stale CMakeCache.txt before configuring, so pre-seeding the cache does not
      # survive either. CMake reads CMAKE_TOOLCHAIN_FILE FROM THE ENVIRONMENT from 3.21
      # onwards, and the CMake that runs these two staging builds is the pinned CMAKE_SDK_VERSION
      # in AIDL_CMAKE_BIN_DIR, put first on the i386 build chroot's PATH per step - "Create the
      # guest-matched i386 build chroot" proves it executes there at exactly that version, which
      # is past 3.21 - so a toolchain file is reachable where a -D is not.
      #
      # It sets exactly two things and nothing more:
      #
      #   the -m32 flags, through the documented *_INIT variables, so they also apply to the
      #   compiler-identification and try_compile runs rather than only to the real targets.
      #
      #   BINDER_IPC_32BIT=ON as a cache entry. This job is the protocol-7 all-32-bit job the
      #   plan requires (AAP 0.6.6.4 and 0.9.5.1), and ON is the value that compiles
      #   -DBINDER_IPC_32BIT=1 into libbinder (CMakeLists.txt:733-739) and so produces a
      #   protocol-7 library. It is ALSO the project's own default for a 32-bit build:
      #   TARGET_LIB32_VERSION defaults ON (CMakeLists.txt:201-203) and BINDER_IPC_32BIT follows
      #   the compile bitness when it is not already defined (:218-224). So this line agrees
      #   with the project rather than overriding it, and the assertion in the next step is
      #   what proves the value actually reached the build.
      #
      #   WHY IT IS WRITTEN EXPLICITLY RATHER THAN LEFT TO THAT DEFAULT, which is a measured
      #   distinction and not a preference: when BINDER_IPC_32BIT is not already defined the
      #   project sets it with a PLAIN set() (:218-224), which leaves NO ENTRY IN THE CACHE. The
      #   cache is the only place the value can be read back - the next step asserts it, the
      #   image builder derives the expected protocol from it, and the guest cross-checks the
      #   driver's own BINDER_VERSION against it. Relying on the default would therefore build
      #   the right library and simultaneously destroy the evidence that it did, turning one of
      #   the derivation's two sources into "cannot answer". aidl-path-tests-rootfs.sh says the
      #   same thing where it reads the cache, and deliberately does NOT read an absent entry as
      #   OFF for this reason.
      #
      #   TARGET_LIB32_VERSION IS LEFT AT ITS ON DEFAULT, AND THE PAIRING IS THE ONE THE PROJECT
      #   REQUIRES. Read from the pinned tree rather than assumed: the only guard is
      #   CMakeLists.txt:225-229,
      #       if (BINDER_IPC_32BIT AND NOT TARGET_LIB32_VERSION) -> FATAL_ERROR
      #   so what the project refuses is protocol 7 on a 64-bit build. ON with
      #   TARGET_LIB32_VERSION=ON and -m32 above is a 32-bit build, which is the arm that
      #   passes, and BUILD.md:432-435 describes exactly it: the toolchain "currently produces
      #   the all-32-bit (protocol 7) build".
      #
      # CMAKE_SYSTEM_NAME is deliberately NOT set, and that is even more clearly right now than
      # it was. Setting it would put CMake into cross-compiling mode and break the host AIDL
      # compiler that -DBUILD_HOST_AIDL=ON builds. This build runs inside the guest-matched i386
      # chroot, so it is not a cross-compilation in any sense: the compiler is natively i386, the
      # i386 host tools it produces run natively there, and the loader they need is the chroot's
      # own rather than a multilib one borrowed from the runner. It used to be a native x86_64
      # build emitting 32-bit objects, which reached the same place by a longer route.
      #
      # NO 32-BIT PERSONALITY IS SET EITHER, and that is load-bearing here specifically:
      # linux_binder_idl's CMakeLists.txt branches on CMAKE_HOST_SYSTEM_PROCESSOR to choose which
      # staged AOSP kernel-UAPI sysroot to put ahead of /usr/include. uname -m inside the chroot
      # reports x86_64, as it does outside, so that choice is byte for byte the one the
      # previously-proven build made. Wrapping the chroot in linux32 would silently switch it.
      - name: Write the i386 CMake toolchain file
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/tools"
          toolchain="$GITHUB_WORKSPACE/tools/i386-protocol7-toolchain.cmake"
          {
            printf '%s\n' '# Generated by .github/workflows/aidl-path-tests.yml. Do not edit in place.'
            printf '%s\n' '# 32-bit userspace, binder wire protocol 7 (AAP 0.6.6.4, 0.9.5.1).'
            printf '%s\n' 'set(CMAKE_C_FLAGS_INIT "-m32")'
            printf '%s\n' 'set(CMAKE_CXX_FLAGS_INIT "-m32")'
            printf '%s\n' 'set(CMAKE_EXE_LINKER_FLAGS_INIT "-m32")'
            printf '%s\n' 'set(CMAKE_SHARED_LINKER_FLAGS_INIT "-m32")'
            printf '%s\n' 'set(CMAKE_MODULE_LINKER_FLAGS_INIT "-m32")'
            printf '%s\n' 'set(BINDER_IPC_32BIT ON CACHE BOOL "binder wire protocol 7: the guest kernel is patched to restore CONFIG_ANDROID_BINDER_IPC_32BIT=y" FORCE)'
          } > "$toolchain"
          cat "$toolchain"
          echo "AIDL_I386_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

      # BINDER_BUILD_DIR is redirected under out/build on purpose. The image builder harvests
      # the SDK's build flags by looking for a CMakeCache.txt under the staged tree's out/build
      # and out/target, and the script's default build directory sits outside both - so with
      # the default the guest's platform record would have to say the flags were not recorded.
      # Putting the cache where it is looked for means the guest reports the ACTUAL
      # BINDER_IPC_32BIT value it was built with, which is one of the three halves of the
      # protocol-equality record and the one that cannot be read from the running kernel.
      #
      # THE SOURCE TREE IS THE i386 STAGING'S OWN VERIFIED CHECKOUT, AND ITS HEAD IS ASSERTED ON
      # BOTH SIDES OF THE BUILD - the same contract as the x86_64 step above, for the same three
      # fail-open arms in build_binder.sh, and it carries more weight here: THIS is the SDK that
      # is staged into the guest root image this job uploads, and libbinder is what every
      # AIDL-path invocation in the matrix runs against. BINDER_SOURCE_DIR names the i386 tree
      # explicitly so the two stagings cannot be crossed, and BINDER_VERSION is the immutable
      # commit rather than a tag.
      - name: Build the Binder SDK for the guest (i386, protocol 7)
        env:
          HALIF_PREFIX: ${{ github.workspace }}/rdk-halif-aidl-i386
          HALIF_LIB_DIR: ${{ github.workspace }}/rdk-halif-aidl-i386/out/target/lib/halif
          BINDER_SDK_DIR: ${{ github.workspace }}/rdk-halif-aidl-i386/out/target
          BINDER_SDK_INCLUDE_DIR: ${{ github.workspace }}/rdk-halif-aidl-i386/out/build
          BINDER_BUILD_DIR: ${{ github.workspace }}/rdk-halif-aidl-i386/out/build/binder-cmake
        run: |
          set -euo pipefail
          src="$BINDER_SDK_SOURCE_DIR_I386"

          assert_source_head() {
            local when="$1" head=''
            head="$(git -C "$src" rev-parse HEAD 2>/dev/null || true)"
            if [ "$head" != "$BINDER_SDK_COMMIT" ]; then
              echo "::error::the i386 Binder SDK source at $src is at '${head:-<not a readable git checkout>}' $when, but this job pins $BINDER_SDK_COMMIT (tag $BINDER_SDK_TAG). Nothing may be built from or staged out of a Binder source tree that is not the pinned commit, and this staging is the one that goes into the published guest image."
              exit 1
            fi
            echo "  ok  i386 Binder SDK source at $src is $head $when"
          }

          assert_source_head "before the build"

          # THE BUILD ITSELF RUNS INSIDE THE GUEST-MATCHED i386 CHROOT. This is the staging
          # whose output the guest actually loads - libbinder, libutils, libcutils and the
          # servicemanager the in-guest readiness probe links against - so it is the staging the
          # symbol-version mismatch broke, and it is compiled by the chroot's gcc-12 family
          # against the chroot's glibc 2.36, both of which are the guest's own.
          #
          # env -i inside the helper means nothing of the runner's environment reaches
          # build_binder.sh by accident, so every variable it needs is named explicitly below -
          # the five this step's `env:` block overrides, the three the script's own hooks read,
          # and the PATH that selects its cmake. The HEAD assertions stay OUTSIDE the chroot and
          # run as the runner account, so what governs which commit is built has not moved.
          #
          # AIDL_CMAKE_BIN_DIR IS PREPENDED HERE TOO, as the chroot's PATH, because
          # build_binder.sh calls a bare cmake: it holds the digest-verified x86_64
          # CMAKE_SDK_VERSION, reachable through the bind-mounted workspace, and "Create the
          # guest-matched i386 build chroot" proves it executes in the chroot at exactly that
          # version. CMAKE_TOOLCHAIN_FILE still reaches cmake from the environment, which is
          # supported from 3.21.
          sudo "$CEC_I386_CHROOT_RUN" --chdir "$HALIF_PREFIX_I386" \
            --env PATH="$AIDL_CMAKE_BIN_DIR:$CEC_I386_CHROOT_PATH" \
            --env HALIF_PREFIX="$HALIF_PREFIX" \
            --env HALIF_LIB_DIR="$HALIF_LIB_DIR" \
            --env BINDER_SDK_DIR="$BINDER_SDK_DIR" \
            --env BINDER_SDK_INCLUDE_DIR="$BINDER_SDK_INCLUDE_DIR" \
            --env BINDER_BUILD_DIR="$BINDER_BUILD_DIR" \
            --env BINDER_SOURCE_DIR="$src" \
            --env BINDER_VERSION="$BINDER_SDK_COMMIT" \
            --env CMAKE_TOOLCHAIN_FILE="$AIDL_I386_TOOLCHAIN" \
            -- ./build_binder.sh

          # Ownership only, no content: the chroot builds as root and later steps read, copy,
          # tar and `rm -rf` this tree as the unprivileged runner account.
          sudo chown -R "$(id -u):$(id -g)" -- "$HALIF_PREFIX_I386"

          assert_source_head "after build_binder.sh returned"

          if [ ! -f "$HALIF_PREFIX_I386/out/target/.sdk_ready" ]; then
            echo "::error::the i386 Binder SDK build did not leave its readiness marker at $HALIF_PREFIX_I386/out/target/.sdk_ready. If the failure above is a compile or link error, read it as evidence about the 32-bit build specifically: the guest userspace is all-32-bit because the image builder accepts only i386 or armhf and its verify_sdk_tree refuses a 64-bit staged library, so the remedy is to make the SDK build for the target architecture and never to relax that gate."
            exit 1
          fi
          # THE ASSERTION THAT MATTERS MOST IN THIS JOB. If the toolchain file did not take,
          # BINDER_IPC_32BIT is either absent from the cache (the project's plain set() path,
          # which builds protocol 7 but records nothing) or OFF (protocol 8), and in the OFF
          # case every /dev/binder open in the patched protocol-7 guest fails libbinder's
          # equality check - which would surface much later as three inexplicably broken
          # invocations rather than as a build fault. The cache is the one place that value can
          # be read back, so it is read back here, and ABSENT is a failure as surely as OFF is:
          # an unrecorded value cannot be cross-checked in the guest.
          cache="$BINDER_BUILD_DIR/CMakeCache.txt"
          if [ ! -f "$cache" ]; then
            echo "::error::no CMakeCache.txt at $cache, so the wire protocol the SDK was built with cannot be verified. BINDER_BUILD_DIR was redirected under out/build precisely so this file would exist and be harvestable."
            exit 1
          fi
          echo "--- the i386 SDK cache, as it records itself ---"
          grep -E '^(BINDER_IPC_32BIT|TARGET_LIB32_VERSION|CMAKE_C_FLAGS|CMAKE_CXX_FLAGS|CMAKE_BUILD_TYPE):' "$cache" || true
          protocol_setting="$(awk -F= '/^BINDER_IPC_32BIT:/ { print toupper($2); exit }' "$cache")"
          case "$protocol_setting" in
            ON|1|TRUE|YES|Y)
              echo "verified: BINDER_IPC_32BIT=$protocol_setting, so this SDK speaks wire protocol 7 and matches the guest kernel this job patches to restore CONFIG_ANDROID_BINDER_IPC_32BIT=y"
              ;;
            '')
              echo "::error::BINDER_IPC_32BIT is absent from $cache. It must be present as a CACHE entry - that is what the generated toolchain file sets - and an absent entry is NOT read as a value anywhere downstream: the project sets the variable with a plain set() when it was not passed as a cache entry (CMakeLists.txt:218-224), so an absent entry means the value the library was built with cannot be read back, asserted here, harvested into the image, or cross-checked against the driver in the guest. Check that CMAKE_TOOLCHAIN_FILE reached this cmake and that the cmake in use is at least 3.21, which is when reading that variable from the environment became supported."
              exit 1
              ;;
            *)
              echo "::error::BINDER_IPC_32BIT is '$protocol_setting' in $cache, not ON. That is wire protocol 8, and this job is the protocol-7 all-32-bit job the plan requires (AAP 0.6.6.4, 0.9.5.1): the guest kernel is patched to restore CONFIG_ANDROID_BINDER_IPC_32BIT=y and its driver therefore speaks 7. A protocol-8 library against a protocol-7 driver fails EVERY open. Do not 'fix' this by building the kernel without the option - that is the divergence this configuration exists to correct."
              exit 1
              ;;
          esac
          mkdir -p "$GITHUB_WORKSPACE/tools"
          cp -- "$cache" "$GITHUB_WORKSPACE/tools/i386-binder-CMakeCache.txt"

      # Built inside the guest-matched i386 chroot for the same reason as the SDK above: these
      # two stub libraries are staged into the guest image and loaded there, and the common pin
      # stays at 0.2.0.0 because that is the ABI the released hdmicec snapshot was generated
      # against. common goes first because build_modules.sh pre-checks each dependency's shared
      # object. The pinned CMAKE_SDK_VERSION in AIDL_CMAKE_BIN_DIR is put first on the chroot's
      # PATH, as for the SDK above; the toolchain file still reaches cmake through the
      # environment.
      - name: Build the AIDL client stub snapshots for the guest (i386)
        env:
          HALIF_PREFIX: ${{ github.workspace }}/rdk-halif-aidl-i386
          HALIF_LIB_DIR: ${{ github.workspace }}/rdk-halif-aidl-i386/out/target/lib/halif
          BINDER_SDK_DIR: ${{ github.workspace }}/rdk-halif-aidl-i386/out/target
          BINDER_SDK_INCLUDE_DIR: ${{ github.workspace }}/rdk-halif-aidl-i386/out/build
        run: |
          set -euo pipefail
          in_chroot() {
            sudo "$CEC_I386_CHROOT_RUN" --chdir "$HALIF_PREFIX_I386" \
              --env PATH="$AIDL_CMAKE_BIN_DIR:$CEC_I386_CHROOT_PATH" \
              --env HALIF_PREFIX="$HALIF_PREFIX" \
              --env HALIF_LIB_DIR="$HALIF_LIB_DIR" \
              --env BINDER_SDK_DIR="$BINDER_SDK_DIR" \
              --env BINDER_SDK_INCLUDE_DIR="$BINDER_SDK_INCLUDE_DIR" \
              --env CMAKE_TOOLCHAIN_FILE="$AIDL_I386_TOOLCHAIN" \
              "$@"
          }

          in_chroot -- ./build_modules.sh common --version 0.2.0.0
          in_chroot -- ./build_modules.sh hdmicec --version 0.1.0.0

          # Ownership only, no content: the chroot builds as root and later steps read, copy,
          # tar and `rm -rf` this tree as the unprivileged runner account.
          sudo chown -R "$(id -u):$(id -g)" -- "$HALIF_PREFIX_I386"

          ls -l "$HALIF_PREFIX_I386/out/target/lib/halif"

      # The same gate the image builder applies, run here where the remedy is at hand rather
      # than after a base root filesystem has been debootstrapped and an image formatted. Every
      # library the guest loads and the servicemanager it runs must be i386; one 64-bit
      # artefact among them is refused outright.
      - name: Verify the guest's staged SDK is 32-bit
        run: |
          set -euo pipefail
          rc=0
          binder_lib="$HALIF_PREFIX_I386/out/target/lib/binder"
          halif_lib="$HALIF_PREFIX_I386/out/target/lib/halif"

          check_i386() {
            local path="$1" description
            if [ ! -f "$path" ]; then
              echo "::error::missing from the i386 staging: $path"
              rc=1
              return
            fi
            description="$(file -b "$path")"
            case "$description" in
              *x86-64*|*x86_64*|*aarch64*)
                echo "::error::$path is built for a 64-bit machine ($description). This job is all-32-bit; rebuild the Binder SDK and the AIDL stub snapshots for i386."
                rc=1
                return
                ;;
            esac
            case "$description" in
              *ELF\ 32-bit*) : ;;
              *)
                echo "::error::$path is not a 32-bit ELF object ($description)."
                rc=1
                return
                ;;
            esac
            printf '  ok  %-34s %s\n' "$(basename "$path")" "$description"
          }

          for soname in libbinder.so libutils.so liblog.so libbase.so libcutils.so libcutils_sockets.so; do
            check_i386 "$binder_lib/$soname"
          done
          for soname in libhdmicec-v0.1.0.0-cpp.so libcommon-v0.2.0.0-cpp.so; do
            check_i386 "$halif_lib/$soname"
          done
          check_i386 "$HALIF_PREFIX_I386/out/target/bin/servicemanager"

          if [ ! -f "$HALIF_PREFIX_I386/out/build/include/binder_sdk/binder/IServiceManager.h" ]; then
            echo "::error::the i386 staging has no Binder headers at out/build/include/binder_sdk/binder/IServiceManager.h, which the image builder requires and which its in-image link test compiles against."
            rc=1
          fi
          [ "$rc" -eq 0 ] || exit 1

      # THE FAIL-FAST GATE FOR THE DEFECT THE BUILD CHROOT EXISTS TO PREVENT.
      #
      # The 32-bit check above answers "is this artefact the right machine". This one answers
      # the question that actually broke the job: "can the guest's runtime satisfy what this
      # artefact requires". They are independent - an i386 library built against a newer glibc
      # is perfectly 32-bit and perfectly unloadable - and only the second one catches a staging
      # step that somehow compiled outside the chroot.
      #
      # WHY IT IS HERE AND NOT LEFT TO THE IMAGE BUILDER. aidl-path-tests-rootfs.sh does check
      # loadability, but it checks it INSIDE the guest, which is roughly forty minutes of kernel
      # build, debootstrap and image assembly later, and the diagnostic there arrives as an ld
      # error against a library nobody has looked at since. Here the remedy is at hand and the
      # artefact is named. The builder's check is not weakened or removed - --sdk-dir is
      # caller-controlled and it must still defend itself against a staging it did not produce -
      # it should simply no longer be reachable by this route.
      #
      # WHAT IS COMPARED, AND WHERE THE CEILING COMES FROM. Every artefact the image stages is
      # scanned: the six-library binder closure, the two HALIF stub libraries and
      # servicemanager. readelf -V reports, per artefact, the symbol versions it NEEDS and the
      # soname it needs each from; the guest's DEFINED set was measured out of the build chroot,
      # which is debootstrapped from the same suite and the same snapshot as the guest, so it is
      # the guest's own ceiling rather than a pair of constants that would go stale on a suite
      # bump. A needed (soname, version) pair absent from that set is refused.
      #
      # THE SECOND ARM IS A SYMBOL SCAN, NOT A VERSION COMPARISON, and it is separate on
      # purpose. glibc from 2.38 redirects strtol, sscanf and their family to __isoc23_* aliases
      # whenever __GLIBC_USE(ISOC23) is on, which _GNU_SOURCE forces on and which g++ always
      # defines; the guest's glibc carries no such symbol at ANY version. Any reference to one
      # is therefore fatal on its own terms, regardless of which version node it was tagged
      # with, so it is looked for by name.
      - name: Verify the guest's staged artefacts need no symbol version the guest lacks
        run: |
          set -euo pipefail
          defined="$CEC_GUEST_SYMBOL_VERSIONS"
          if [ ! -s "$defined" ]; then
            echo "::error::the measured guest symbol-version map is missing or empty at '$defined'. It is written by 'Create the guest-matched i386 build chroot'; without it this check would pass every artefact, which is worse than not running it."
            exit 1
          fi
          glibcxx_ceiling="$CEC_GUEST_GLIBCXX_CEILING"
          glibc_ceiling="$CEC_GUEST_GLIBC_CEILING"
          tab="$(printf '\t')"
          rc=0

          # $1 = absolute path to a staged shared library or executable
          check_artefact() {
            local artefact="$1" needs='' isoc23='' soname='' version='' name=''
            name="$(basename -- "$artefact")"
            if [ ! -f "$artefact" ]; then
              echo "::error::the staged artefact $artefact is missing, so the symbol versions it needs cannot be read. Every library the guest loads must exist here before the image is assembled."
              rc=1
              return
            fi

            # readelf's own section names, verbatim: "Version needs section" (.gnu.version_r) is
            # what the artefact REQUIRES. The awk stops at the next .gnu. section header so the
            # needs section can never bleed into the definitions section that follows it, and it
            # carries the File: line forward because the version names beneath it belong to that
            # soname.
            needs="$(readelf -V -- "$artefact" 2>/dev/null | awk '
              /Version needs section/ { inside = 1; next }
              /section .\.gnu\./      { inside = 0 }
              inside && /File: /      { file = $0; sub(/.*File: /, "", file); sub(/[ \t].*/, "", file) }
              inside && /Name: /      { name = $0; sub(/.*Name: /, "", name); sub(/[ \t].*/, "", name); print file "\t" name }
            ' | sort -u)"

            while IFS="$tab" read -r soname version; do
              [ -n "${version:-}" ] || continue
              if grep -Fqx "$soname$tab$version" -- "$defined"; then
                continue
              fi
              if ! grep -Fq "$soname$tab" -- "$defined"; then
                # The chroot has no version definitions for that soname at all - the dynamic
                # loader itself is the usual case. Nothing can be concluded either way, so it
                # is reported and left to the in-image loader check rather than guessed at.
                printf '  note  %-34s needs %s from %s, a soname the build chroot defines no versions for; the in-image loader check covers that one.\n' \
                  "$name" "$version" "$soname"
                continue
              fi
              echo "::error::$artefact requires the symbol version $version from $soname, which the guest userspace does not define. The guest's measured ceilings are $glibcxx_ceiling and $glibc_ceiling. This is the defect that used to kill the image build forty minutes later, at the in-guest link of the servicemanager readiness probe. REMEDY: build this artefact inside the guest-matched i386 build chroot, which is what the three i386 staging steps do - check that the step producing it still routes its compiler through \$CEC_I386_CHROOT_RUN. Linking it with -static-libstdc++ -static-libgcc does NOT close this: measured on this host/guest pair, the prebuilt 32-bit libstdc++.a itself references __isoc23_strtoul@GLIBC_2.38 from eh_alloc.o and debug.o, so the artefact still requires a glibc the guest does not have."
              rc=1
            done <<< "$needs"

            isoc23="$(readelf --dyn-syms -W -- "$artefact" 2>/dev/null | grep -oE '__isoc23_[A-Za-z0-9_]+' | sort -u || true)"
            if [ -n "$isoc23" ]; then
              echo "::error::$artefact references the glibc C23 aliases below, which glibc introduced at 2.38 and which the guest's glibc ($glibc_ceiling) does not carry at any version:"
              printf '%s\n' "$isoc23" | sed 's/^/    /'
              echo "  No -D can suppress them: glibc's own /usr/include/features.h #undefs __GLIBC_USE_C23_STRTOL and re-derives it from __GLIBC_USE(ISOC23), which _GNU_SOURCE - always defined by g++, and set explicitly by libcutils - forces on. REMEDY: build this artefact inside the guest-matched i386 build chroot, whose glibc IS the guest's."
              rc=1
            fi

            if [ "$rc" -eq 0 ]; then
              printf '  ok    %-34s within the guest ceiling\n' "$name"
            fi
          }

          binder_lib="$HALIF_PREFIX_I386/out/target/lib/binder"
          halif_lib="$HALIF_PREFIX_I386/out/target/lib/halif"
          echo "guest ceiling measured from the build chroot: $glibcxx_ceiling / $glibc_ceiling"
          for soname in libbinder.so libutils.so liblog.so libbase.so libcutils.so libcutils_sockets.so; do
            check_artefact "$binder_lib/$soname"
          done
          for soname in libhdmicec-v0.1.0.0-cpp.so libcommon-v0.2.0.0-cpp.so; do
            check_artefact "$halif_lib/$soname"
          done
          check_artefact "$HALIF_PREFIX_I386/out/target/bin/servicemanager"

          [ "$rc" -eq 0 ] || exit 1
          echo "every staged artefact stays within the guest's defined symbol versions and references no __isoc23_* alias"

      # The cloned upstream Binder sources and the CMake object trees are build scratch, not
      # part of a staged SDK: nothing at runtime reads them, the readiness markers stop
      # build_binder.sh from wanting them again, and the i386 tree is copied wholesale into the
      # guest image, where they would cost gigabytes for nothing. The i386 Binder cache file
      # itself is kept, because the guest reports its contents.
      - name: Reclaim build scratch space
        run: |
          set -euo pipefail
          df -h "$GITHUB_WORKSPACE" | tail -n 1

          # The Binder cache file is kept where the image builder harvests it, and the object
          # tree around it is not. The copy under tools/ was taken while the cache was still
          # beside its objects, so it is restored from there rather than re-derived.
          i386_cache_dir="$HALIF_PREFIX_I386/out/build/binder-cmake"
          rm -rf -- "$i386_cache_dir"
          mkdir -p -- "$i386_cache_dir"
          cp -- "$GITHUB_WORKSPACE/tools/i386-binder-CMakeCache.txt" "$i386_cache_dir/CMakeCache.txt"

          rm -rf -- "$HALIF_PREFIX/build-tools" "$HALIF_PREFIX/build" \
                    "$HALIF_PREFIX_I386/build-tools" "$HALIF_PREFIX_I386/build" \
                    "$HALIF_PREFIX_I386/.git" \
                    "$GITHUB_WORKSPACE/build/googletest" "$GITHUB_WORKSPACE/build/googletest-i386"

          # THE i386 BUILD CHROOT IS RELEASED HERE, AND ONLY AFTER PROVING IT IS UNMOUNTED. It
          # lives under $RUNNER_TEMP rather than the workspace, but on a hosted runner that is
          # the same filesystem, and a bookworm i386 root with a toolchain in it is over a
          # gigabyte. Everything that needed it has run: the three staging builds, the 32-bit
          # check and the symbol-version gate, all of which are above.
          #
          # THE MOUNT CHECK IS NOT DEFENSIVE PADDING. The chroot-run helper bind-mounts /dev
          # into the root and unmounts it from an EXIT/INT/TERM trap; if that trap were ever
          # defeated - a SIGKILL, a cancelled job resumed, a lazy unmount still settling - then
          # `rm -rf` here would recurse through the bind and delete the HOST's device nodes. So
          # the mount table is read and a surviving mount is a named failure that leaves the
          # directory alone, which costs a gigabyte of scratch and never costs /dev.
          if [ -n "${CEC_I386_CHROOT:-}" ] && [ -d "$CEC_I386_CHROOT" ]; then
            still_mounted="$(awk -v root="$CEC_I386_CHROOT" \
              '$2 == root || index($2, root "/") == 1 { print $2 }' /proc/self/mounts || true)"
            if [ -n "$still_mounted" ]; then
              echo "::error::the i386 build chroot at $CEC_I386_CHROOT still has mounted filesystems, so it is NOT being removed - an rm -rf through a live /dev bind mount would delete the host's device nodes. Still mounted:"
              printf '%s\n' "$still_mounted" | sed 's/^/    /'
              exit 1
            fi
            sudo rm -rf -- "$CEC_I386_CHROOT"
            echo "released the i386 build chroot at $CEC_I386_CHROOT"
          fi

          df -h "$GITHUB_WORKSPACE" | tail -n 1

      # A BUILD PREREQUISITE, not a committed artefact: the suite compiles against the mock HAL
      # header through this symlink, and the touched IARM headers stand in for a staged SOC
      # sysroot. The tree is excluded from coverage by run_coverage.sh's own glob set.
      - name: Generate stub headers
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/hdmicec"
          mkdir -p stubs/rdk/iarmbus stubs/ccec/drivers/iarmbus
          cd stubs
          touch rdk/iarmbus/libIARM.h rdk/iarmbus/libIBus.h \
                rdk/iarmbus/libIBusDaemon.h ccec/drivers/iarmbus/CecIARMBusMgr.h
          ln -sf ../../../mocks/hdmicec/hdmi_cec_driver.h ccec/drivers/hdmi_cec_driver.h

      # THE SHIPPING BUILD, AND IT IS BUILT FIRST BECAUSE CONFIGURE DESTROYS IT.
      #
      # ccec/src/Makefile is NOT Autotools output. It is hand-written RDK build source with its
      # own Apache-2.0 header, its own explicit OBJS list, its own compile and link rules, and
      # rdk_build.sh drives it with a bare `make` for every SOC vendor. It is ALSO listed in
      # configure.ac's AC_CONFIG_FILES, so the `autoreconf -if` and `./configure` in the step
      # below OVERWRITE it with generated output. That single fact fixes the ordering: after the
      # Autotools step there is no hand-written makefile left on this runner to build, so this
      # stage runs before it or not at all. Stating that ordering in a comment is not enough on
      # its own - without this step the build that actually ships on a device goes untested by
      # the one job that has both back-ends staged.
      #
      # AN AUTOTOOLS-ONLY CHECK CANNOT STAND IN FOR IT. The two systems carry the AIDL back-end
      # by completely different mechanisms - libRCEC_la_SOURCES plus libRCEC_la_LIBADD,
      # substituted by configure, versus a literal DriverAidlImpl.o in OBJS and a link command
      # written out inside the file - and the hand build's link command had to be REWRITTEN for
      # this migration because it expanded neither $(LDFLAGS) nor any library list. A library
      # list added to LDFLAGS alone would have linked nothing, compiled cleanly, and left the
      # Autotools closure check below perfectly green.
      #
      # FOUR PROPERTIES OF THE HAND-WRITTEN FILE THAT SHAPE THE COMMANDS BELOW. None is chosen
      # here; each was measured against the file as committed:
      #
      #   * NO CPPFLAGS HOOK. Its recipe is `$(CXX) -c $< $(CFLAGS) -o $@`, and CFLAGS is where
      #     both -std=c++17 and the whole INCLUDE list live. A command-line CFLAGS= would
      #     REPLACE it, dropping -fPIC, the dialect and every -I root, and the resulting failure
      #     would read as a source defect. So extra roots arrive as the file's own make
      #     variables or through CPATH, which gcc treats as additional -I directories searched
      #     after every -I and which leaves every variable the file sets exactly as written.
      #   * IT REFUSES TEST-SCOPE HEADERS. The telemetry_busmessage_sender.h that
      #     MessageDecoder.cpp, Bus.cpp and LibCCEC.cpp include, and the
      #     ccec/drivers/hdmi_cec_driver.h that DriverImpl.cpp includes, must come from
      #     TELEMETRY_PREFIX and LEGACY_HAL_PREFIX; the file stops with a named error when either
      #     is unset or resolves into mocks/ or stubs/. So this step stages both roots under
      #     $RUNNER_TEMP from the pinned telemetry and rdk-halif-hdmi_cec checkouts and passes
      #     them as make variables. CPATH still names mocks/ and stubs/, but the staged -I roots
      #     win: g++ -H on these flags resolves all four includes to the staged copies, and the
      #     build's own root report is asserted in step 4.
      #   * ITS DEFAULT GOAL IS `all: clean library`, so it is invoked WITHOUT -j: under -j the
      #     clean and the library goal may run concurrently and the clean would be deleting the
      #     objects the library goal just compiled.
      #   * IT RESOLVES TELEMETRY AND OSAL IN ITS CONSUMERS. Its link command names neither
      #     -ltelemetry_msgsender nor -lRCECOSHal, where the Autotools build names both, so the
      #     .so it produces carries undefined symbols for them BY DESIGN. That is long-standing
      #     RDK behaviour, it is not this migration's to change, and it does not weaken anything
      #     below: readelf and ldd are being asked about LIBRARY resolution, which is what the
      #     AIDL and Binder edges are.
      #
      # THE MAKEFILE IS SNAPSHOTTED, NEVER `git checkout`-ed. configure is about to overwrite a
      # tracked, hand-edited source file, and on a self-hosted runner that reuses its workspace
      # leaving Automake output in its place is damage that outlives the job. `git checkout`
      # would restore what the INDEX holds, which is a different file whenever anything is
      # staged or uncommitted, so the WORKING-TREE content is copied out with cp -p and put back
      # by the paired step later in this job.
      #
      # No coverage flags are passed, deliberately. The counters that matter come from the
      # guest's own instrumented Autotools build; instrumenting this one would scatter .gcno
      # files through ccec/src for objects nothing runs.
      - name: Build and verify the shipping hand-written RDK library
        timeout-minutes: 20
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/hdmicec"

          hand_makefile="ccec/src/Makefile"
          snap_dir="${RUNNER_TEMP:-/tmp}/hdmicec-hand-build-snapshot"
          snap="$snap_dir/ccec-src-Makefile"

          # 1. PREREQUISITES, ASSERTED RATHER THAN ASSUMED.
          for prereq in \
            "mocks/telemetry_busmessage_sender.h" \
            "mocks/safec_lib.h" \
            "stubs/ccec/drivers/hdmi_cec_driver.h"; do
            if [ ! -e "$prereq" ]; then
              echo "::error::$GITHUB_WORKSPACE/hdmicec/$prereq is missing, so the hand-written build cannot compile. It is staged by the 'Generate stub headers' step, which must run before this one."
              exit 1
            fi
            printf '  ok  %s\n' "$prereq"
          done
          if [ ! -f "$hand_makefile" ]; then
            echo "::error::$hand_makefile is absent. This job builds the shipping RDK build system from that file and cannot proceed without it."
            exit 1
          fi

          # 2. PROVE THIS STEP IS IN THE RIGHT PLACE. Two markers, both measured against the
          #    two versions of this path rather than guessed: config.status writes a
          #    "generated by automake" header line, and only the hand-written source defines
          #    LIBNAMEFULL, which is what names the libRCEC.so it links.
          if grep -q 'generated by automake' "$hand_makefile" || ! grep -q '^LIBNAMEFULL' "$hand_makefile"; then
            echo "::error::$hand_makefile is not the hand-written RDK build source - it looks like Automake output - so ./configure has already overwritten it and the shipping build can no longer be built in this job. This step must run BEFORE 'Build hdmicec'."
            exit 1
          fi

          # 3. SNAPSHOT, OUTSIDE THE CHECKOUT so it survives whatever happens in the tree, and
          #    into a plain private directory so a pre-existing path cannot redirect the copy.
          mkdir -p "$snap_dir"
          if [ -L "$snap_dir" ] || [ ! -d "$snap_dir" ]; then
            echo "::error::$snap_dir is not a plain directory, so the pre-configure snapshot of $hand_makefile cannot be taken safely."
            exit 1
          fi
          chmod 700 "$snap_dir"
          cp -p -- "$hand_makefile" "$snap"
          if ! cmp -s -- "$hand_makefile" "$snap"; then
            echo "::error::the snapshot at $snap is not byte-identical to $hand_makefile, so it could not be relied on to restore it later."
            exit 1
          fi
          echo "HAND_MAKEFILE_SNAPSHOT=$snap" >> "$GITHUB_ENV"
          echo "snapshotted $hand_makefile -> $snap ($(sha256sum -- "$snap" | cut -d' ' -f1))"

          # 4. THE BUILD. CPATH carries the two test-only roots; the six prefixes are passed as
          #    make variables so they win over anything ambient (the file declares
          #    HALIF_LIB_DIR and BINDER_SDK_INCLUDE_DIR with ?=, so an exported value wins and
          #    the derived default is not used); no -j,
          #    for the reason in the comment above. The output is captured as well as shown,
          #    because the link command make echoes is itself evidence and step 6b asserts on
          #    it.
          #    THE COMPILER IS THE PINNED ONE, NAMED, AND ASSERTED RATHER THAN DEFAULTED. This
          #    line used to read CXX="${CXX:-g++}", whose fallback handed the shipping-library
          #    build to whatever the runner image defaulted to - the one thing the toolchain gate
          #    exists to prevent. There is no fallback now, and a CXX that is unset or is not the
          #    pinned family stops the step here rather than producing a library and a set of
          #    notes files from an unrecorded compiler.
          expected_cxx="/usr/bin/g++-${CEC_TOOLCHAIN_GCC_MAJOR:?}"
          if [ "${CXX:-}" != "$expected_cxx" ]; then
            echo "::error::CXX is '${CXX:-<unset>}', not the pinned $expected_cxx. The hand-written RDK build compiles the library a SOC vendor ships; check that 'Select and prove the acceptance toolchain' ran before this step."
            exit 1
          fi
          printf '  hand build CXX: %s (%s)\n' "$CXX" "$("$CXX" -dumpfullversion)"

          #    THE TWO PRODUCTION HEADER ROOTS, STAGED OUTSIDE THE hdmicec TREE from the pinned
          #    checkouts. Each source must be a non-empty regular file - a symlink could carry a
          #    mock's bytes past the makefile's refusal as a plain copy - and each copy is
          #    compared back against it. The legacy HAL publishes its header flat, at
          #    include/hdmi_cec_driver.h, so it is staged into the ccec/drivers/ subpath
          #    DriverImpl.cpp includes it by.
          prod_root="${RUNNER_TEMP:?}/hdmicec-production-headers"
          telemetry_prefix="$prod_root/telemetry"
          legacy_hal_prefix="$prod_root/legacy-hal"
          rm -rf -- "$prod_root"
          mkdir -p -- "$telemetry_prefix/include" "$legacy_hal_prefix/include/ccec/drivers"
          for pair in \
            "telemetry/include/telemetry_busmessage_sender.h=$telemetry_prefix/include/telemetry_busmessage_sender.h" \
            "telemetry/include/telemetry2_0.h=$telemetry_prefix/include/telemetry2_0.h" \
            "rdk-halif-hdmi_cec/include/hdmi_cec_driver.h=$legacy_hal_prefix/include/ccec/drivers/hdmi_cec_driver.h"; do
            src="$GITHUB_WORKSPACE/${pair%%=*}"
            dst="${pair#*=}"
            if [ -L "$src" ] || [ ! -f "$src" ] || [ ! -s "$src" ]; then
              echo "::error::$src is not a non-empty regular file, so the production header the shipping hand build compiles against cannot be staged from it. It comes from the pinned 'Checkout the telemetry headers for the hand-written build' or 'Checkout the legacy HDMI CEC HAL header for the hand-written build' step; restore that step rather than pointing the build at mocks/ or stubs/."
              exit 1
            fi
            install -m 0644 -- "$src" "$dst"
            if [ -L "$dst" ] || [ ! -f "$dst" ] || [ ! -s "$dst" ] || ! cmp -s -- "$src" "$dst"; then
              echo "::error::the staged copy $dst is not a non-empty regular file identical to $src, so the hand build would not compile against the pinned header."
              exit 1
            fi
            printf '  ok  %s (%s bytes, from %s)\n' "$dst" "$(stat -c '%s' -- "$dst")" "${pair%%=*}"
          done

          build_log="$(mktemp)"
          CPATH="$GITHUB_WORKSPACE/hdmicec/mocks:$GITHUB_WORKSPACE/hdmicec/stubs${CPATH:+:$CPATH}" \
            make -C ccec/src \
              CXX="$CXX" \
              HALIF_PREFIX="$HALIF_PREFIX" \
              HALIF_LIB_DIR="$HALIF_LIB_DIR" \
              BINDER_SDK_DIR="$BINDER_SDK_DIR" \
              BINDER_SDK_INCLUDE_DIR="$BINDER_SDK_INCLUDE_DIR" \
              TELEMETRY_PREFIX="$telemetry_prefix" \
              LEGACY_HAL_PREFIX="$legacy_hal_prefix" \
              all 2>&1 | tee "$build_log"

          #    The roots the makefile resolved, read back from its own report, so a build that
          #    compiled against anything but the staged headers fails here by name.
          for root in "telemetry header root: [$telemetry_prefix/include]" \
                      "legacy HDMI CEC HAL header root: [$legacy_hal_prefix/include]"; do
            if ! grep -q -F -x -- "libRCEC $root" "$build_log"; then
              echo "::error::the hand-written build did not report 'libRCEC $root', so it did not resolve the production header root this step staged."
              exit 1
            fi
            printf '  ok  libRCEC %s\n' "$root"
          done

          lib="ccec/src/install/lib/libRCEC.so"
          if [ ! -f "$lib" ] || [ ! -s "$lib" ]; then
            echo "::error::the hand-written build reported success but produced no usable $lib, so the shipping library cannot be inspected."
            exit 1
          fi
          printf '  ok  %s (%s bytes)\n' "$lib" "$(stat -c '%s' -- "$lib")"

          # 5. THE MAKEFILE MUST BE UNCHANGED BY ITS OWN BUILD.
          if ! cmp -s -- "$snap" "$hand_makefile"; then
            echo "::error::building through $hand_makefile modified it. A build must not rewrite its own build source; $snap holds the pre-build content."
            diff -u -- "$snap" "$hand_makefile" || true
            exit 1
          fi
          echo "  ok  $hand_makefile is byte-identical to the pre-build snapshot"

          echo "--- readelf -d: the direct edges the shipping libRCEC.so declares"
          readelf -d "$lib" | grep NEEDED || echo "(no DT_NEEDED entries at all - every assertion below will fail, which is the correct outcome)"

          # 6. THE DIRECT EDGES. ALL FOUR, because AAP 0.4.2 specifies four unconditional
          #    direct edges and AAP 0.9.4 verifies the produced ELF against the expected
          #    NEEDED set.
          #
          #    Four rather than three, and the fourth is the one worth explaining:
          #    libcommon-v0.2.0.0-cpp is the one library no middleware symbol references -
          #    PropertyValue is reached only through the hdmicec stub library's own interface -
          #    so with --as-needed, on by default in these toolchains, the linker drops the edge
          #    and DT_NEEDED comes back as libhdmicec-v0.1.0.0-cpp.so, libbinder.so,
          #    libutils.so, libstdc++.so.6, libgcc_s.so.1, libc.so.6. Asserting only the three
          #    that survive that default would make deleting -lcommon-v0.2.0.0-cpp from
          #    AIDL_LIBS a change every check in this job passes. ccec/src/Makefile scopes
          #    -Wl,--no-as-needed to exactly these four and restores --as-needed after them, so
          #    the fourth edge is in the ELF and is required here like the other three.
          rc=0
          needed="$(readelf -d "$lib" | awk -F'[][]' '/NEEDED/ { print $2 }')"
          for soname in libhdmicec-v0.1.0.0-cpp.so libcommon-v0.2.0.0-cpp.so libbinder.so libutils.so; do
            if printf '%s\n' "$needed" | grep -qx -- "$soname"; then
              printf '  ok  %-34s is a direct edge\n' "$soname"
            else
              echo "::error::$soname is not among the shipping libRCEC.so's DT_NEEDED entries. The hand-written link command must name -lhdmicec-v0.1.0.0-cpp -lcommon-v0.2.0.0-cpp -lbinder -lutils, expand them, AND keep them inside the -Wl,--no-as-needed ... -Wl,--as-needed wrapping - which for libcommon-v0.2.0.0-cpp, referenced by no middleware symbol, is the only thing that puts the edge in the ELF."
              rc=1
            fi
          done

          # 6b. THE LINK COMMAND THAT WAS ACTUALLY EXECUTED. Belt and braces over step 6: a
          #     toolchain whose default went back to --no-as-needed would put a deleted edge
          #     back into DT_NEEDED through its own defaults and leave step 6 green. This
          #     asserts on the text make echoed, so a token removed from the makefile fails
          #     whatever the linker's disposition is.
          link_line="$(grep -F -- '-shared -o install/lib/libRCEC.so' "$build_log" | tail -n 1)"
          if [ -z "$link_line" ]; then
            echo "::error::no link command for install/lib/libRCEC.so appears in the captured build output, so the four -l edges cannot be checked against what was executed. The recipe in ccec/src/Makefile must not be silenced with a leading @."
            rc=1
          else
            echo "--- the executed link command"
            printf '%s\n' "$link_line"
            for token in -lhdmicec-v0.1.0.0-cpp -lcommon-v0.2.0.0-cpp -lbinder -lutils -Wl,--no-as-needed -Wl,--as-needed; do
              case "$link_line" in
                *"$token"*)
                  printf '  ok  %-34s present and expanded in the executed link command\n' "$token"
                  ;;
                *)
                  echo "::error::the executed link command for the shipping libRCEC.so does not contain '$token'. AAP 0.4.2 requires all four AIDL/Binder edges unconditionally, and the -Wl wrapping is what makes the unreferenced one survive --as-needed."
                  rc=1
                  ;;
              esac
            done
          fi
          rm -f "$build_log"

          # 7. THE LOADER CLOSURE. This library carries NO RUNPATH - the hand-written link
          #    command sets none, and adding one would be a build change this migration did not
          #    make - so unlike the libtool-built copy checked later, its staged directories
          #    have to be put on LD_LIBRARY_PATH for the check. What that makes this is an
          #    assertion that the staged copies exist, are ABI-loadable, and are what every
          #    name resolves to rather than a system copy shadowing them.
          export LD_LIBRARY_PATH="$HALIF_LIB_DIR:$BINDER_SDK_DIR/lib/binder${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          echo "--- ldd: the whole closure the loader has to resolve for it"
          ldd "$lib"
          if ldd "$lib" | grep -q 'not found'; then
            echo "::error::the shipping libRCEC.so has unresolved dependencies. liblog, libbase and libcutils are libbinder's own dependencies rather than edges the middleware names, so they must be STAGED AND LOADABLE even though nothing in ccec references them."
            ldd "$lib" | grep 'not found'
            exit 1
          fi

          closure="$(ldd "$lib" | awk '$2 == "=>" { print $1, $3 }')"
          expect_in() {
            local soname="$1" directory="$2" resolved
            resolved="$(printf '%s\n' "$closure" | awk -v s="$soname" '$1 == s { print $2 }' | head -n 1)"
            if [ -z "$resolved" ]; then
              echo "::error::$soname does not appear in the shipping libRCEC.so's loader closure at all."
              rc=1
              return
            fi
            case "$resolved" in
              "$directory"/*) printf '  ok  %-34s %s\n' "$soname" "$resolved" ;;
              *)
                echo "::error::$soname resolved to $resolved, outside the staged tree $directory. A system copy shadowing the staged SDK makes the whole measurement meaningless."
                rc=1
                ;;
            esac
          }
          # This exact list was measured, not assembled from the link command: with the two
          # staged directories on the search path the closure came back as libhdmicec and
          # libcommon out of the HALIF staging, and libbinder, libutils, libcutils, libbase and
          # liblog out of the Binder staging. libcutils_sockets is deliberately NOT here: it is
          # not reachable from libRCEC at all - it sits below libcutils - and the Autotools
          # check later in this job is where it is verified as a staged, self-resolving library.
          expect_in libhdmicec-v0.1.0.0-cpp.so "$HALIF_LIB_DIR"
          expect_in libcommon-v0.2.0.0-cpp.so  "$HALIF_LIB_DIR"
          for soname in libbinder.so libutils.so libcutils.so libbase.so liblog.so; do
            expect_in "$soname" "$BINDER_SDK_DIR/lib/binder"
          done
          [ "$rc" -eq 0 ] || exit 1

          # 8. LEAVE NOTHING FOR THE AUTOTOOLS BUILD TO TRIP ON. make decides by timestamp, so
          #    an object newer than its source is an object the next build could reuse with
          #    THESE flags. The file's own clean target removes its objects and its install
          #    tree, which is the right tool for it.
          make -C ccec/src clean
          if ! cmp -s -- "$snap" "$hand_makefile"; then
            echo "::error::the clean target modified $hand_makefile."
            exit 1
          fi
          echo "shipping hand-written RDK build validated; its objects and install tree removed"

      # THE HOST-SIDE BUILD CONTRACT. This is not the build the matrix measures - the guest
      # builds its own instrumented tree, because gcov counters cannot cross machines. What
      # this proves is that libRCEC compiles with BOTH back-ends in it, links the four AIDL and
      # Binder edges, and produces all three test binaries, on the same runner and with the
      # same commands L1-tests.yml uses.
      #
      # No -std= is passed on this command line. configure probes for the dialect and
      # substitutes the flag it accepted for the @AIDL_CXXFLAGS@ placeholder that
      # ccec/src/Makefile.am, tests/L1Tests/Makefile.am and tests/L2Tests/Makefile.am each carry
      # in AM_CXXFLAGS beside a literal -std=c++17, so the library and both suites compile at a
      # named dialect rather than at whatever the compiler happens to default to. It is a hard
      # requirement rather than a tidy-up: halcompat.h, in rdk-halif-aidl's common/current, opens
      # a nested-namespace definition, which does not compile at c++14 at all.
      #
      # There are THREE make passes because the top-level Makefile.am sets SUBDIRS to osal and
      # ccec only, so a root "make all" builds no test binary. The third pass is the L2 tier and
      # is not optional: it builds run_L2Tests AND fake_hdmi_cec_aidl_host, the two
      # noinst_PROGRAMS of tests/L2Tests/Makefile.am, and without it invocations D and E have no
      # binary at all.
      #
      # The PKG_CONFIG_PATH entry is needed because configure.ac's
      # PKG_CHECK_MODULES([GTEST], [gtest >= 1.10.0]) consults pkg-config only and ignores
      # -I/-L.
      #
      # The gcov flags L1-tests.yml carries are DELIBERATELY ABSENT here, and their absence is
      # not an oversight. This build is never measured: the counters that matter are produced
      # by the guest's own instrumented build, because gcov counters cannot accumulate across
      # machines. Instrumenting this one as well would only produce a second, unrelated set
      # that nothing reads.
      - name: Build hdmicec
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/hdmicec"
          autoreconf -if
          PKG_CONFIG_PATH="$GTEST_PREFIX/lib/pkgconfig:${PKG_CONFIG_PATH:-}" \
          CPPFLAGS="-I$GITHUB_WORKSPACE/hdmicec/mocks -I$GITHUB_WORKSPACE/hdmicec/stubs -I$GITHUB_WORKSPACE/install/usr/include -I$HALIF_PREFIX/hdmicec/0.1.0.0/include -I$HALIF_PREFIX/common/0.2.0.0/include -I$HALIF_PREFIX/common/current -I$BINDER_SDK_INCLUDE_DIR/include/binder_sdk" \
          LDFLAGS="-L$GITHUB_WORKSPACE/install/usr/lib -L$HALIF_LIB_DIR -L$BINDER_SDK_DIR/lib/binder" \
          ./configure --enable-l1tests \
            HALIF_PREFIX="$HALIF_PREFIX" \
            HALIF_LIB_DIR="$HALIF_LIB_DIR" \
            BINDER_SDK_DIR="$BINDER_SDK_DIR" \
            BINDER_SDK_INCLUDE_DIR="$BINDER_SDK_INCLUDE_DIR"
          make -j"$(nproc)" all
          make -C tests/L1Tests all
          make -C tests/L2Tests all

          for binary in tests/L1Tests/run_L1Tests tests/L2Tests/run_L2Tests tests/L2Tests/fake_hdmi_cec_aidl_host; do
            if [ ! -x "$binary" ]; then
              echo "::error::$binary was not built. run_L1Tests carries invocations A, B and C; run_L2Tests carries D and E; fake_hdmi_cec_aidl_host is the out-of-process service E needs, and without it E cannot exercise real binder IPC."
              exit 1
            fi
            printf '  ok  %s\n' "$binary"
          done

          # THE DIALECT, ASSERTED FOR THE LIBRARY AS WELL AS FOR THE TESTS. All three
          # Makefile.am files - ccec/src/Makefile.am for the library and the two test ones -
          # carry a LITERAL -std=c++17 in AM_CXXFLAGS, so its absence from any generated
          # Makefile means the substitution or the regeneration went wrong, and that IS a
          # failure. ccec/src/Makefile is the AUTOMAKE-GENERATED file at this point in the job:
          # configure overwrote the hand-written one, which was built and inspected in its own
          # step before autoreconf, so what is being read here is genuinely the Autotools
          # library build. Asserting it for the library matters most, because the library is the
          # consumer whose SOC toolchain the requirement exists to protect.
          #
          # What is checked here is a property of those files' own text, not a claim about which
          # dialect configure picked, and the two are worth keeping apart. The grep below asks
          # one question: did the literal -std=c++17 that each AM_CXXFLAGS spells survive
          # regeneration into the generated Makefile. That is answerable by reading the file,
          # which is why it is checkable here at all.
          #
          # What configure ACCEPTS is wider than that one spelling. Its probe compiles the two
          # constructs the dependencies use - a std::optional parameter and a nested-namespace
          # definition - and decides on the result rather than on the name of a dialect. A -std=
          # already present in CXXFLAGS is probed as given and adopted verbatim when it compiles
          # them, so C++17 and anything newer is accepted, while C++14 or older fails the probe
          # and stops configuration by name; with none given, -std=c++17, -std=gnu++17 and
          # -std=c++1z are tried in that order, the first that compiles is adopted, and
          # configuration fails if none does. So @AIDL_CXXFLAGS@ carries the accepted
          # C++17-or-newer flag, which can be a different spelling from the literal above, and
          # each AM_CXXFLAGS places it AFTER that literal, where a later -std= is the one in
          # force. A generated Makefile legitimately carries both, and neither this check nor
          # anything else in this job requires the two strings to be equal.
          for generated in ccec/src/Makefile tests/L1Tests/Makefile tests/L2Tests/Makefile; do
            if ! grep -q -- '-std=c++17' "$generated"; then
              echo "::error::$generated does not carry -std=c++17. All three Makefile.am files set it literally, so this means the Makefile was not regenerated from them. The generated AIDL headers declare a std::optional parameter and halcompat.h opens a nested namespace definition, neither of which compiles at c++14."
              exit 1
            fi
            printf '  ok  %-24s carries -std=c++17\n' "$generated"
          done
          echo "library dialect, as configure resolved it:"
          grep -E 'C\+\+17|AIDL_CXXFLAGS' config.log | tail -n 3 || true

      # SCOPE: the AUTOTOOLS-built library. The RDK1 path - the hand-written ccec/src/Makefile,
      # which configure has overwritten by the time this step runs - was built and inspected in
      # its own step BEFORE autoreconf, for exactly that reason. The two checks are separate
      # because the two build systems carry the link edges in different places and a green
      # result from one says nothing about the other; both are needed and both run.
      #
      # Two measured facts keep this check honest. libcommon-v0.2.0.0-cpp IS among libRCEC's
      # own DT_NEEDED entries, and only because Makefile.am wraps the four AIDL and Binder
      # libraries in a comma-joined -Wl,--no-as-needed group: no middleware symbol references
      # that library, so with --as-needed in force the linker drops the edge. Requiring only the
      # three that survive that default would make deleting the token invisible, so all four are
      # required as direct edges and in the closure. And libcutils_sockets is not reachable from
      # libRCEC at all, so it is checked as a staged, self-resolving library rather than as an
      # entry in this closure.
      #
      # This library, unlike the hand-built one, resolves its closure with NO LD_LIBRARY_PATH:
      # libtool bakes a RUNPATH in from the -L flags configure was given. That difference is
      # why the hand-built check has to set the search path explicitly and says so.
      - name: Verify the AIDL and Binder loader closure
        run: |
          set -euo pipefail
          lib="$GITHUB_WORKSPACE/hdmicec/ccec/src/.libs/libRCEC.so"
          [ -f "$lib" ] || { echo "::error::$lib was not built."; exit 1; }

          echo "--- direct edges (DT_NEEDED) ---"
          readelf -d "$lib" | grep NEEDED
          echo "--- loader resolution ---"
          ldd "$lib"

          # ALL FOUR DIRECT EDGES (AAP 0.4.2, 0.9.4), on the libtool-built library as well as
          # on the hand-built one. Checking a single build system is how the two drift apart,
          # and libcommon-v0.2.0.0-cpp is present here only because of the comma-joined -Wl
          # group in libRCEC_la_LDFLAGS: libtool relocates a bare -Wl,--no-as-needed to after
          # its whole deplibs list, where it cannot affect them, and Automake refuses the flag
          # in LIBADD, so LDFLAGS with one comma-joined group is the spelling that works.
          needed="$(readelf -d "$lib" | awk -F'[][]' '/NEEDED/ { print $2 }')"
          edge_rc=0
          for soname in libhdmicec-v0.1.0.0-cpp.so libcommon-v0.2.0.0-cpp.so libbinder.so libutils.so; do
            if printf '%s\n' "$needed" | grep -qx -- "$soname"; then
              printf '  ok  %-34s is a direct edge\n' "$soname"
            else
              echo "::error::$soname is not a direct DT_NEEDED entry of the Autotools-built $lib. Check ccec/src/Makefile.am: the comma-joined -Wl,--no-as-needed,<the four>,--as-needed group belongs in libRCEC_la_LDFLAGS (Automake rejects linker flags in LIBADD, which is why it is not there), and libRCEC_la_LIBADD must still carry @AIDL_LDFLAGS@ and @AIDL_LIBS@. For libcommon-v0.2.0.0-cpp that group is the only thing keeping the edge in the ELF."
              edge_rc=1
            fi
          done
          [ "$edge_rc" -eq 0 ] || exit 1

          if ldd "$lib" | grep -q 'not found'; then
            echo "::error::libRCEC.so has unresolved dependencies. liblog, libbase, libcutils and libcutils_sockets are libbinder's own dependencies rather than edges the middleware names, so they must be STAGED AND LOADABLE even though nothing in ccec references them."
            ldd "$lib" | grep 'not found'
            exit 1
          fi

          closure="$(ldd "$lib" | awk '$2 == "=>" { print $1, $3 }')"
          rc=0
          expect_in() {
            local soname="$1" directory="$2" resolved
            resolved="$(printf '%s\n' "$closure" | awk -v s="$soname" '$1 == s { print $2 }' | head -n 1)"
            if [ -z "$resolved" ]; then
              echo "::error::$soname does not appear in libRCEC.so's loader closure at all."
              rc=1
              return
            fi
            case "$resolved" in
              "$directory"/*) printf '  ok  %-34s %s\n' "$soname" "$resolved" ;;
              *)
                echo "::error::$soname resolved to $resolved, outside the staged tree $directory. A system copy shadowing the staged SDK makes the whole measurement meaningless."
                rc=1
                ;;
            esac
          }
          expect_in libhdmicec-v0.1.0.0-cpp.so "$HALIF_LIB_DIR"
          expect_in libcommon-v0.2.0.0-cpp.so "$HALIF_LIB_DIR"
          for soname in libbinder.so libutils.so libcutils.so libbase.so liblog.so; do
            expect_in "$soname" "$BINDER_SDK_DIR/lib/binder"
          done

          sockets="$BINDER_SDK_DIR/lib/binder/libcutils_sockets.so"
          if [ ! -f "$sockets" ]; then
            echo "::error::libcutils_sockets.so is not staged at $sockets. It sits below libcutils in libbinder's closure and must be present on the loader path even though it is not reachable from libRCEC."
            rc=1
          elif ldd "$sockets" | grep -q 'not found'; then
            echo "::error::libcutils_sockets.so is staged but does not itself resolve:"
            ldd "$sockets" | grep 'not found'
            rc=1
          else
            printf '  ok  %-34s %s\n' "libcutils_sockets.so" "$sockets"
          fi
          [ "$rc" -eq 0 ] || exit 1

      # RESTORE THE HAND-WRITTEN MAKEFILE THAT CONFIGURE OVERWROTE.
      #
      # configure lists ccec/src/Makefile in AC_CONFIG_FILES, so the Autotools step replaced
      # hand-written RDK build source with generated output. That content is not recoverable
      # from the index in general - `git checkout` restores what the INDEX holds, which on a
      # dirty tree, a rebase or a local checkout is not what was there - so it is restored from
      # the copy the hand-build step took of the WORKING TREE, and the restore is verified.
      #
      # It runs on every path, including a failed one, so the guarantee is unconditional rather
      # than a property of the happy case. Nothing later in this job rebuilds through Autotools,
      # and the guest payload is a SEPARATE checkout that this build never touched, so this is
      # about leaving the runner honest rather than about the guest.
      - name: Restore the hand-written ccec/src/Makefile
        if: always()
        run: |
          set -euo pipefail
          snapshot="${HAND_MAKEFILE_SNAPSHOT:-}"
          target="$GITHUB_WORKSPACE/hdmicec/ccec/src/Makefile"
          if [ -z "$snapshot" ] || [ ! -f "$snapshot" ]; then
            echo "no snapshot of the hand-written makefile was taken, so there is nothing to restore; the hand-build step did not run."
            exit 0
          fi
          if [ ! -f "$target" ]; then
            echo "::warning::$target does not exist; restoring it from the snapshot anyway."
          fi
          cp -p -- "$snapshot" "$target"
          if ! cmp -s -- "$snapshot" "$target"; then
            echo "::error::the hand-written ccec/src/Makefile could not be restored from $snapshot. The working tree is left carrying Autotools output in place of hand-written RDK build source."
            exit 1
          fi
          echo "restored ccec/src/Makefile from the pre-autoreconf snapshot ($(sha256sum -- "$target" | cut -d' ' -f1))"

      # THE GUEST KERNEL. Docker cannot substitute for a VM here: a container shares the host
      # kernel, and the binder driver IS the thing that has to vary, so the runner boots a
      # kernel of its own.
      #
      # The version is pinned in this workflow's env block, with its justification, and so is
      # its digest: GUEST_KERNEL_SHA256 is the value kernel.org publishes for this release in
      # its PGP-SIGNED sha256sums.asc, committed here and reviewed with this file. The tarball
      # is verified against that committed value UNCONDITIONALLY, and then against the
      # sha256sums.asc fetched beside it - two checks that catch different things, because a
      # digest list served by the same origin as the tarball can be substituted along with it,
      # while a committed value cannot. The optional workflow_dispatch input adds a third party
      # to the comparison and can only add a requirement, never relax one.
      #
      # ARCH=i386 because the guest userspace is all-32-bit and a 32-bit userspace needs a
      # kernel that can run it. i386_defconfig is the base and the options below are layered
      # on: the binder set the SDK requires, ashmem, the two IKCONFIG options so the guest can
      # READ its own configuration back out of /proc/config.gz rather than being told what it
      # is, devtmpfs so /dev is populated before init runs, and ext4 plus the libata/AHCI
      # block stack because the payload arrives as a copied disk image rather than an
      # initramfs. THE ROOT DISK IS DELIBERATELY NOT ON virtio-blk - CONFIG_VIRTIO_BLK is
      # asserted ABSENT and the boot step attaches the image to an emulated AHCI controller
      # instead. The reasoning is in the boot step's own comment block; the short form is that
      # the host's QEMU virtio-blk device model carries an unfixed host-memory disclosure and
      # an unfixed host-heap out-of-bounds write, and the surest answer to a vulnerable device
      # model is not to instantiate it.
      #
      # THE PIN STAYS ON THE 5.15 SERIES AND THE PROTOCOL-7 OPTION IS RESTORED BY PATCH. 5.15
      # is binderfs-capable, which the plan requires as an always-required option and which the
      # in-guest init needs; it is also new enough that mainline no longer carries
      # CONFIG_ANDROID_BINDER_IPC_32BIT, which the plan ALSO requires. The step between the
      # fetch and the build closes that gap; its own comment block is the reasoning.
      #
      # THE POINT RELEASE WITHIN THAT SERIES IS THE CURRENT LONGTERM ONE, AND IT IS A SECURITY
      # PIN RATHER THAN A FIXTURE DETAIL. It moved from 5.15.148 to 5.15.219 because the older
      # release carried 561 OSV advisories - two of them, CVE-2024-26926 and CVE-2024-46740,
      # in the binder driver this job exists to validate - while 5.15.219 carries none. The
      # full reasoning, the verification performed and the digest's provenance are in the
      # GUEST_KERNEL_VERSION and GUEST_KERNEL_SHA256 blocks in this file's env.
      # THE WORK DIRECTORY'S OWNERSHIP, FIXED BEFORE ANYTHING IS WRITTEN INTO IT.
      #
      # Two directories, two owners, and the split is the whole point:
      #
      #   qemu-work        ROOT-owned 0755. Its children include the root-owned `publish`
      #                    directory the image is published into and the root-owned `mnt` the
      #                    image is mounted on. A runner-owned parent would let the runner uid
      #                    rename either of those away and put its own directory at the name,
      #                    which every later step -- the boot, the extraction, the uploads --
      #                    would then resolve to. See the GUEST_IMAGE comment in this job's env
      #                    block for the full reasoning and for what it does NOT cover.
      #   qemu-work/host   RUNNER-owned 0755, and everything the unprivileged steps write goes
      #                    in it: the kernel image and configuration, the Debian snapshot
      #                    Release file, the base tarball and its digest, and the guest console
      #                    log. A runner-owned directory inside a root-owned parent cannot be
      #                    renamed or unlinked by the runner, so this gives the non-root steps a
      #                    place to write without giving them authority over `publish`.
      #
      # It runs BEFORE the kernel fetch, which is the first step that writes anything under
      # qemu-work, and it is idempotent: `install -d` on an existing directory sets the owner
      # and mode and succeeds.
      - name: Create the work directory tree with its ownership fixed
        run: |
          set -euo pipefail
          sudo install -d -o root -g root -m 0755 -- "$WORK_DIR"
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0755 -- "$WORK_DIR/host"
          echo "work directory   : $WORK_DIR ($(stat -c '%U:%G %a' -- "$WORK_DIR"))"
          echo "runner subtree   : $WORK_DIR/host ($(stat -c '%U:%G %a' -- "$WORK_DIR/host"))"
          echo "workspace root   : $GITHUB_WORKSPACE ($(stat -c '%U:%G %a' -- "$GITHUB_WORKSPACE"))"
          echo "  ^ runner-owned by GitHub's design and deliberately not changed; see the"
          echo "    GUEST_IMAGE comment in this job's env block for what that does and does not"
          echo "    leave exposed."
          # Asserted rather than assumed: the two ownerships above are what every later custody
          # argument in this job rests on, and `install -d` on a pre-existing directory owned by
          # somebody else on a self-hosted runner is exactly the case worth catching here.
          work_owner="$(stat -c '%u' -- "$WORK_DIR")"
          host_owner="$(stat -c '%u' -- "$WORK_DIR/host")"
          [ "$work_owner" = '0' ] || { echo "::error::$WORK_DIR is owned by uid $work_owner rather than root after install -d. Every custody argument in this job depends on it: with a non-root owner the publication directory inside it can be renamed away and the boot, extraction and upload steps would resolve the substitution."; exit 1; }
          [ "$host_owner" = "$(id -u)" ] || { echo "::error::$WORK_DIR/host is owned by uid $host_owner rather than this job's own uid $(id -u), so the unprivileged steps cannot write the kernel artefacts, the base tarball or the console log into it."; exit 1; }

      - name: Fetch and verify the guest kernel source
        env:
          KERNEL_EXPECTED_SHA256: ${{ github.event.inputs.kernel_expected_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$WORK_DIR/host/kernel"
          src_root="$GITHUB_WORKSPACE/kernel-src"
          mkdir -p "$src_root"
          cd "$src_root"

          # THE VERSION GUARD, BEFORE THE DOWNLOAD. GUEST_KERNEL_SHA256 was taken from
          # kernel.org's signed sha256sums.asc for exactly one release, so a pin that has moved
          # without its digest stops here by name instead of failing later as a mismatch that
          # reads like tampering.
          if [ "$GUEST_KERNEL_VERSION" != "$GUEST_KERNEL_SHA256_FOR_VERSION" ]; then
            echo "::error::GUEST_KERNEL_VERSION is '$GUEST_KERNEL_VERSION' but the committed GUEST_KERNEL_SHA256 was published for '$GUEST_KERNEL_SHA256_FOR_VERSION'. A committed digest is valid for one version only. Read the new version's entry out of kernel.org's signed sha256sums.asc, update GUEST_KERNEL_SHA256 and GUEST_KERNEL_SHA256_FOR_VERSION together with the pin - and note that the protocol-7 restoration hunks are written against this version's drivers/android sources as well."
            exit 1
          fi
          [ -n "$GUEST_KERNEL_SHA256" ] || { echo "::error::GUEST_KERNEL_SHA256 is empty, so the kernel tarball cannot be verified against a value reviewed with this workflow. Commit the digest for linux-$GUEST_KERNEL_VERSION.tar.xz from kernel.org's signed sha256sums.asc."; exit 1; }

          series="v${GUEST_KERNEL_VERSION%%.*}.x"
          tarball="linux-$GUEST_KERNEL_VERSION.tar.xz"
          base="https://cdn.kernel.org/pub/linux/kernel/$series"

          curl -fsSL --output "$tarball" "$base/$tarball"
          curl -fsSL --output sha256sums.asc "$base/sha256sums.asc"

          measured="$(sha256sum "$tarball" | awk '{ print $1 }')"
          published="$(awk -v f="$tarball" '$2 == f { print $1 }' sha256sums.asc | head -n 1)"
          echo "kernel tarball   : $tarball"
          echo "measured sha256  : $measured"
          echo "committed sha256 : $GUEST_KERNEL_SHA256  (kernel.org's PGP-signed pub/linux/kernel/$series/sha256sums.asc, for $GUEST_KERNEL_SHA256_FOR_VERSION)"
          echo "published sha256 : ${published:-<not listed>}"

          # THE COMMITTED VALUE IS CHECKED FIRST AND UNCONDITIONALLY. It is what closes the gap
          # that verifying against a list fetched from the SAME ORIGIN leaves open - one origin
          # can serve a matching tarball-and-list pair - because this value was reviewed with
          # the workflow rather than fetched beside the artefact.
          if [ "$measured" != "$GUEST_KERNEL_SHA256" ]; then
            echo "::error::kernel tarball digest mismatch against the committed publisher digest. measured $measured, committed $GUEST_KERNEL_SHA256. This job does not build an unverified kernel; confirm kernel.org's signed sha256sums.asc before touching the committed value."
            exit 1
          fi
          echo "verified against the committed publisher digest"

          # AND THE LIST PUBLISHED BESIDE THE TARBALL IS STILL CHECKED, because the two catch
          # different things: the committed value catches a substituted origin, this one catches
          # a pin whose committed digest was transcribed wrongly - the tarball would then have to
          # disagree with kernel.org itself for both to pass.
          if [ -z "$published" ]; then
            echo "::error::$tarball is not listed in kernel.org's sha256sums.asc for $series, so the download cannot be cross-checked against the list published beside it. This job does not proceed on a kernel whose upstream listing is missing."
            exit 1
          fi
          if [ "$measured" != "$published" ]; then
            echo "::error::kernel tarball digest mismatch against kernel.org's published value. measured $measured, published $published."
            exit 1
          fi
          echo "cross-checked against the sha256sums.asc published beside the tarball"

          # THE DISPATCH INPUT IS A THIRD PARTY TO THOSE TWO, NEVER AN OVERRIDE. Supplying it
          # adds the requirement that it agree with the committed digest and the measurement;
          # disagreement is an error, not a value that wins.
          if [ -n "${KERNEL_EXPECTED_SHA256:-}" ]; then
            if [ "$KERNEL_EXPECTED_SHA256" != "$GUEST_KERNEL_SHA256" ]; then
              echo "::error::the kernel_expected_sha256 input ($KERNEL_EXPECTED_SHA256) disagrees with the digest committed in this workflow ($GUEST_KERNEL_SHA256). The input cannot override a committed pin: if the committed value is wrong, correct it in the workflow from kernel.org's signed list; if the input is wrong, correct the dispatch."
              exit 1
            fi
            if [ "$measured" != "$KERNEL_EXPECTED_SHA256" ]; then
              echo "::error::kernel tarball digest mismatch against the supplied expected value. measured $measured, expected $KERNEL_EXPECTED_SHA256."
              exit 1
            fi
            echo "third-party cross-check : the supplied input agrees with the committed digest and the measurement"
          fi

          rm -rf "linux-$GUEST_KERNEL_VERSION"
          tar -xJf "$tarball"
          test -f "linux-$GUEST_KERNEL_VERSION/drivers/android/Kconfig"
          echo "extracted $src_root/linux-$GUEST_KERNEL_VERSION"

      # RESTORING THE PROTOCOL-7 KERNEL OPTION. READ THIS BEFORE CHANGING IT.
      #
      # WHY IT IS NEEDED. The plan requires a deliberately protocol-7 all-32-bit job with
      # CONFIG_ANDROID_BINDER_IPC_32BIT=y (AAP 0.6.6.4 and 0.9.5.1). MAINLINE HAS NO SUCH
      # OPTION AFTER 4.17: "ANDROID: binder: remove 32-bit binder interface" deleted the
      # Kconfig entry and the matching "#define BINDER_IPC_32BIT 1" from
      # drivers/android/binder.c. CONFIG_ANDROID_BINDERFS, which the in-guest init requires,
      # starts at 5.0. So on a stock kernel the two requirements are mutually exclusive, and
      # asking scripts/config or olddefconfig for a symbol that does not exist silently
      # produces nothing at all - which is how a job settles for protocol 8 and calls it a
      # technical necessity. It is not one: the option is restorable, as the next paragraph
      # shows, so protocol 8 here would be a plan violation rather than a constraint.
      #
      # WHY IT IS CONSTRUCTIBLE. The removal was 13 lines of Kconfig plus 4 lines of binder.c
      # and NOTHING ELSE. include/uapi/linux/android/binder.h still carries both branches in
      # 5.15 - "#ifdef BINDER_IPC_32BIT" still selects __u32 binder_size_t/binder_uintptr_t and
      # BINDER_CURRENT_PROTOCOL_VERSION 7 - and so does the copy vendored inside the Binder
      # SDK, which is what makes kernel and userspace able to agree on 7 at all. The patch
      # below restores the two deleted pieces verbatim in spirit: the Kconfig entry with its
      # original "bool / depends on !64BIT && ANDROID_BINDER_IPC / default y" shape and help
      # text, and the #ifdef guard ahead of the uapi include. The guest is i386, so
      # "depends on !64BIT" is satisfied.
      #
      # AND ONE ADDITION THAT IS NOT PART OF THE HISTORICAL REVERT, because 5.15 is not 4.17.
      # In 5.15 the uapi header is included by THREE files in drivers/android - binder.c,
      # binderfs.c and binder_alloc.h - and binder_alloc.h declares
      # binder_alloc_copy_user_to_buffer/copy_to_buffer/copy_from_buffer with binder_size_t
      # parameters that binder_alloc.c implements. That use of binder_size_t in a shared header
      # POST-DATES the 4.18 removal, which is why the upstream four-line change was sufficient
      # then and is not now: a define placed only in binder.c would compile binder.o with
      # binder_size_t = __u32 and binder_alloc.o with binder_size_t = __u64, giving a silent
      # i386 ABI mismatch across that call boundary rather than a compile error. So the patch
      # also adds
      #     ccflags-$(CONFIG_ANDROID_BINDER_IPC_32BIT) += -DBINDER_IPC_32BIT=1
      # to drivers/android/Makefile, which puts every translation unit in the directory on the
      # same definition. The binder.c guard is kept as well, as the faithful restoration; an
      # identical object-like macro definition from -D and from #define is not a diagnostic, so
      # the two coexist. The assertion below refuses any kernel in which some OTHER directory
      # includes that uapi header, because a per-directory -D would not reach it.
      #
      # THIS IS UNPROVEN UNTIL THIS JOB FIRST RUNS. The option was removed six years before
      # the kernel it is being re-added to and nobody upstream exercises the pairing. That is
      # why the protocol is ASSERTED at every layer rather than assumed - in the built .config
      # here, in the SDK cache entry above, in aidl-path-tests-rootfs.sh's derivation, and in
      # the in-guest four-source agreement check that ends at the driver's own BINDER_VERSION
      # ioctl. A failure in any of them names the artefact to correct. None may be relaxed.
      #
      # The patch is carried inline rather than as a checked-in .patch file because this
      # migration's diff allowlist is a fixed set of paths and a patch file would be one more.
      - name: Restore CONFIG_ANDROID_BINDER_IPC_32BIT on the pinned kernel (protocol 7)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel-src/linux-$GUEST_KERNEL_VERSION"

          # PRECONDITION 1: the option really is absent. If a future pin already carries it,
          # this patch would not apply and the right response is to delete the patch, not to
          # force it.
          if grep -q 'config ANDROID_BINDER_IPC_32BIT' drivers/android/Kconfig; then
            echo "::error::drivers/android/Kconfig in linux-$GUEST_KERNEL_VERSION ALREADY defines ANDROID_BINDER_IPC_32BIT. This restoration patch exists because mainline dropped the option after 4.17; a tree that has it does not need the patch. Remove this step and enable the option directly."
            exit 1
          fi

          # PRECONDITION 2: the uapi header still has both branches. Without them the option
          # would be a Kconfig symbol that changes nothing, and the guest would speak 8 while
          # every record said 7.
          if ! grep -q '^#ifdef BINDER_IPC_32BIT' include/uapi/linux/android/binder.h; then
            echo "::error::include/uapi/linux/android/binder.h in linux-$GUEST_KERNEL_VERSION no longer selects the 32-bit binder types on BINDER_IPC_32BIT, so restoring the Kconfig option cannot produce a protocol-7 driver. Protocol 7 is not reachable on this kernel pin; do not paper over it - raise it, because the plan's protocol-7 requirement and this pin have become incompatible."
            exit 1
          fi
          grep -n 'BINDER_CURRENT_PROTOCOL_VERSION' include/uapi/linux/android/binder.h

          # PRECONDITION 3: nothing outside drivers/android includes that header, because the
          # -DBINDER_IPC_32BIT=1 the patch adds is scoped to that directory's ccflags. tools/,
          # samples/ and Documentation/ are excluded by name: they are not compiled into the
          # bzImage this job builds.
          outside="$(grep -rl --include='*.c' --include='*.h' -F 'uapi/linux/android/binder.h' . \
                     | sed 's|^\./||' \
                     | grep -v '^drivers/android/' \
                     | grep -v '^include/uapi/linux/android/' \
                     | grep -v '^tools/' | grep -v '^samples/' | grep -v '^Documentation/' || true)"
          if [ -n "$outside" ]; then
            echo "::error::these files outside drivers/android include the binder uapi header, so a per-directory -DBINDER_IPC_32BIT=1 would compile them with the OTHER binder_size_t width - a silent ABI mismatch rather than a build error:"
            printf '  %s\n' $outside
            echo "::error::extend the define to cover them (or move it into the uapi header's own logic) before enabling protocol 7 on this kernel."
            exit 1
          fi
          echo "verified: only drivers/android includes the binder uapi header, so the directory-scoped define is sufficient"

          patch_file="$GITHUB_WORKSPACE/kernel-src/binder-ipc32-restore.patch"
          # THE PATCH ITSELF. Every line below is prefixed with '|', and the sed strips that
          # prefix off before the file is written: the patch's context lines for the Kconfig
          # help text begin with a TAB, and a tab directly after this block's indentation is a
          # 'space before tab in indent' error that `git diff --check` rejects on this file. The
          # sentinel keeps the tabs (patch needs them to match context byte for byte) while
          # keeping them out of the line's indentation. The file that is written is the patch
          # verbatim, it is cat'd below, and it is uploaded as a provisioning artefact, so the
          # prefix is a property of this YAML block and of nothing that is applied or archived.
          sed 's/^|//' > "$patch_file" <<'BINDER_IPC32_PATCH_EOF'
          |--- a/drivers/android/Kconfig
          |+++ b/drivers/android/Kconfig
          |@@ -54,6 +54,16 @@
          | 	  exhaustively with combinations of various buffer sizes and
          | 	  alignments.
          |
          |+config ANDROID_BINDER_IPC_32BIT
          |+	bool
          |+	depends on !64BIT && ANDROID_BINDER_IPC
          |+	default y
          |+	help
          |+	  Enable to support an old 32-bit Android user-space (v4.4 and
          |+	  earlier).
          |+
          |+	  Note that enabling this will break newer Android user-space.
          |+
          | endif # if ANDROID
          |
          | endmenu
          |--- a/drivers/android/binder.c
          |+++ b/drivers/android/binder.c
          |@@ -67,6 +67,10 @@
          | #include <linux/task_work.h>
          | #include <linux/sizes.h>
          |
          |+#ifdef CONFIG_ANDROID_BINDER_IPC_32BIT
          |+#define BINDER_IPC_32BIT 1
          |+#endif
          |+
          | #include <uapi/linux/android/binder.h>
          |
          | #include <asm/cacheflush.h>
          |--- a/drivers/android/Makefile
          |+++ b/drivers/android/Makefile
          |@@ -1,5 +1,6 @@
          | # SPDX-License-Identifier: GPL-2.0-only
          | ccflags-y += -I$(src)			# needed for trace events
          |+ccflags-$(CONFIG_ANDROID_BINDER_IPC_32BIT) += -DBINDER_IPC_32BIT=1
          |
          | obj-$(CONFIG_ANDROID_BINDERFS)		+= binderfs.o
          | obj-$(CONFIG_ANDROID_BINDER_IPC)	+= binder.o binder_alloc.o
          BINDER_IPC32_PATCH_EOF
          echo "--- the patch, as written ---"
          cat -- "$patch_file"

          # DRY RUN FIRST, AND A FAILURE IS FATAL. A patch that does not apply cleanly means
          # the pinned tree is not the tree these hunks were written against, and a fuzzed or
          # partial application would produce a kernel whose protocol nobody can predict.
          if ! patch -p1 --dry-run --forward < "$patch_file"; then
            echo "::error::the CONFIG_ANDROID_BINDER_IPC_32BIT restoration patch does not apply cleanly to linux-$GUEST_KERNEL_VERSION. The hunks are last verified against linux-5.15.219's drivers/android/{Kconfig,binder.c,Makefile} - dry run clean, no fuzz and no offset - so if GUEST_KERNEL_VERSION has moved past that, re-derive them against the new tree rather than loosening the patch. This job does not build a kernel whose binder protocol it cannot state."
            exit 1
          fi
          patch -p1 --forward < "$patch_file"

          # POSTCONDITIONS: all three hunks are in the tree.
          rc=0
          grep -q 'config ANDROID_BINDER_IPC_32BIT' drivers/android/Kconfig || { echo "::error::the Kconfig hunk did not land."; rc=1; }
          grep -q 'define BINDER_IPC_32BIT 1' drivers/android/binder.c || { echo "::error::the binder.c hunk did not land."; rc=1; }
          grep -qF 'ccflags-$(CONFIG_ANDROID_BINDER_IPC_32BIT) += -DBINDER_IPC_32BIT=1' drivers/android/Makefile || { echo "::error::the drivers/android/Makefile hunk did not land, so binder.o and binder_alloc.o would disagree about binder_size_t."; rc=1; }
          [ "$rc" -eq 0 ] || exit 1
          echo "restored ANDROID_BINDER_IPC_32BIT on linux-$GUEST_KERNEL_VERSION (Kconfig, binder.c and the directory-wide define)"

      - name: Build the guest kernel
        run: |
          set -euo pipefail

          # EVERY PATH THIS STEP USES IS DERIVED HERE, IN THIS STEP. A shell variable set in
          # one `run:` block does not exist in the next one - each block is a separate shell
          # process, and only the workflow/job `env:` block, `$GITHUB_ENV` and Actions' own
          # variables cross that boundary. The fetch step above assigns src_root, and expanding
          # that assignment here would be unset under `set -u` and would abort the job at the
          # FINAL command - AFTER the whole kernel build had been paid for and before the rootfs,
          # the QEMU boot and the A-E matrix had run at all. ShellCheck names it SC2154. So the
          # path is re-derived from $GITHUB_WORKSPACE and $GUEST_KERNEL_VERSION - the two values
          # that DO cross, the first from Actions and the second from this workflow's env block -
          # and the two steps agree by construction rather than by an assignment neither can see.
          src_root="$GITHUB_WORKSPACE/kernel-src"
          kernel_tree="$src_root/linux-$GUEST_KERNEL_VERSION"
          [ -d "$kernel_tree" ] || { echo "::error::the extracted kernel tree is missing at $kernel_tree. The 'Fetch and verify the guest kernel source' step is what extracts it and the 'Restore CONFIG_ANDROID_BINDER_IPC_32BIT' step patches it; one of them did not run, or something removed the tree between them and here."; exit 1; }
          cd "$kernel_tree"

          make ARCH=i386 i386_defconfig
          scripts/config --file .config \
            --enable  ANDROID \
            --enable  ANDROID_BINDER_IPC \
            --enable  ANDROID_BINDERFS \
            --set-str ANDROID_BINDER_DEVICES "binder,hwbinder,vndbinder" \
            --enable  STAGING \
            --enable  ASHMEM \
            --enable  IKCONFIG \
            --enable  IKCONFIG_PROC \
            --enable  DEVTMPFS \
            --enable  DEVTMPFS_MOUNT \
            --enable  TTY \
            --enable  SERIAL_8250 \
            --enable  SERIAL_8250_CONSOLE \
            --enable  EXT4_FS \
            --enable  VIRTIO \
            --enable  VIRTIO_PCI \
            --enable  SCSI \
            --enable  BLK_DEV_SD \
            --enable  ATA \
            --enable  SATA_AHCI \
            --enable  ATA_PIIX \
            --disable VIRTIO_BLK \
            --enable  ANDROID_BINDER_IPC_32BIT
          make ARCH=i386 olddefconfig

          # THE KERNEL HALF OF THE PROTOCOL RECORD, read back out of the resolved .config
          # rather than restated from the request above. The guest prints the other two halves
          # - the SDK build flags and the protocol version the driver actually reports - in one
          # block on the console, and the three are only meaningful together.
          echo "================ GUEST KERNEL CONFIGURATION (build time) ================"
          echo "version: $GUEST_KERNEL_VERSION   arch: i386"
          rc=0
          for option in CONFIG_ANDROID CONFIG_ANDROID_BINDER_IPC CONFIG_ANDROID_BINDERFS \
                        CONFIG_ANDROID_BINDER_DEVICES CONFIG_ASHMEM CONFIG_IKCONFIG_PROC \
                        CONFIG_DEVTMPFS_MOUNT CONFIG_EXT4_FS CONFIG_SCSI CONFIG_BLK_DEV_SD \
                        CONFIG_ATA CONFIG_SATA_AHCI CONFIG_ATA_PIIX \
                        CONFIG_SERIAL_8250_CONSOLE; do
            line="$(grep -E "^($option=|# $option is not set)" .config || true)"
            if [ -z "$line" ]; then
              echo "::error::$option is absent from the resolved configuration - neither set nor explicitly unset. Every option in this list is required for the guest to boot, mount binderfs and be measurable."
              rc=1
            else
              echo "  $line"
              case "$line" in
                "# $option is not set")
                  echo "::error::$option was requested but did not survive olddefconfig. A dependency it needs is missing from i386_defconfig."
                  rc=1
                  ;;
              esac
            fi
          done
          # THE VIRTIO-BLK DRIVER, ASSERTED ABSENT RATHER THAN MERELY NOT REQUESTED.
          # The loop above can only express "this option must be present"; this one is the
          # opposite polarity and therefore needs its own check. It is the guest half of the
          # host-side decision recorded in tools/qemu-boundary.txt: the root disk is attached to
          # an emulated AHCI controller precisely so the QEMU virtio-blk device model - which
          # carries CVE-2024-8612 (host memory disclosure through the bounce buffer) and
          # CVE-2026-48914 (out-of-bounds write in the QEMU host heap, unfixed through 11.0.1) -
          # is never instantiated. Asserting the driver absent here is what makes the two sides
          # agree: a half-revert that restores `if=virtio` on the boot line without restoring
          # this option gives a guest with no driver for its root disk and fails at mount, and a
          # half-revert that restores this option without the boot line fails HERE by name. The
          # option is explicitly --disable'd above rather than left to i386_defconfig, so
          # "absent from .config" is itself a failure - it would mean the request did not reach
          # the resolved configuration at all.
          virtio_blk_state="$(grep -E '^(CONFIG_VIRTIO_BLK=|# CONFIG_VIRTIO_BLK is not set)' .config || true)"
          case "$virtio_blk_state" in
            '# CONFIG_VIRTIO_BLK is not set')
              echo "  $virtio_blk_state"
              echo "    ^ REQUIRED ABSENT. The root disk is on emulated AHCI (-device ahci +"
              echo "      -device ide-hd) so QEMU's virtio-blk device model is not instantiated."
              echo "      CVE-2024-8612 and CVE-2026-48914 are both virtio-blk-specific and"
              echo "      CVE-2026-48914 has no fixed QEMU release, so not instantiating the"
              echo "      device model is the remedy rather than a version bump."
              ;;
            '')
              echo "::error::CONFIG_VIRTIO_BLK is ABSENT from the resolved configuration - neither set nor explicitly unset - even though this build explicitly requests --disable VIRTIO_BLK. That means the request did not reach .config and the resolved state is unknown. Do not proceed: re-check the scripts/config invocation above."
              rc=1
              ;;
            *)
              echo "::error::CONFIG_VIRTIO_BLK resolved to '$virtio_blk_state' rather than being unset. This guest would carry the virtio-blk driver, and the only reason to carry it is to attach the root disk to QEMU's virtio-blk device model - which is exactly what this job avoids, because CVE-2026-48914 (OOB write in the QEMU host heap) has no fixed release through 11.0.1 and CVE-2024-8612 leaks host memory through the same code. If a future change genuinely needs virtio-blk, that is a security decision to take deliberately: change the boot line, this option, tools/qemu-boundary.txt and the console root-device assertion together, and record why."
              rc=1
              ;;
          esac
          # THE PROTOCOL-7 OPTION, ASSERTED IN THE BUILT CONFIGURATION AND NOT MERELY REQUESTED.
          # This is the check that proves the restoration patch took effect. Its shape matters:
          # the restored symbol has no prompt string, exactly as upstream's did, so it is a
          # non-visible symbol and olddefconfig recomputes it from its "default y" and its
          # "depends on !64BIT && ANDROID_BINDER_IPC" rather than from the value scripts/config
          # wrote. On an i386 build with ANDROID_BINDER_IPC=y both dependencies hold and the
          # answer is y; if the patch had not applied, the symbol would not exist and the line
          # would be ABSENT rather than "is not set" - which is why absent is a failure here
          # rather than a reported state.
          reported="$(grep -E '^(CONFIG_ANDROID_BINDER_IPC_32BIT=|# CONFIG_ANDROID_BINDER_IPC_32BIT is not set)' .config || true)"
          case "$reported" in
            'CONFIG_ANDROID_BINDER_IPC_32BIT=y')
              echo "  $reported"
              echo "    ^ REQUIRED. This is the protocol-7 switch the plan specifies (AAP 0.6.6.4,"
              echo "      0.9.5.1). Mainline has no such option after 4.17; the 'Restore"
              echo "      CONFIG_ANDROID_BINDER_IPC_32BIT' step re-added it to this pinned 5.15"
              echo "      tree, and this line is the evidence that it survived olddefconfig. The"
              echo "      staged SDK was built with BINDER_IPC_32BIT=ON to match, and the guest"
              echo "      cross-checks both against the driver's own BINDER_VERSION ioctl."
              echo "      Compile bitness is a separate axis and is 32-bit either way."
              ;;
            '')
              echo "::error::CONFIG_ANDROID_BINDER_IPC_32BIT is ABSENT from the resolved configuration - the symbol does not exist in this tree, so the restoration patch did not take effect even though its own postconditions passed. This guest would speak binder protocol 8 while the staged SDK speaks 7, and every /dev/binder open would fail libbinder's equality check. Do NOT work around this by building the SDK for protocol 8: that is the divergence from AAP 0.6.6.4 and 0.9.5.1 this configuration exists to correct."
              rc=1
              ;;
            *)
              echo "::error::CONFIG_ANDROID_BINDER_IPC_32BIT resolved to '$reported' rather than =y, so this kernel's driver speaks binder protocol 8 while the staged SDK speaks 7 and every open would fail. The symbol exists, so the patch applied; what failed is the resolution. Check that ANDROID_BINDER_IPC is enabled (the option depends on it) and that this is a 32-bit build (it also depends on !64BIT) - ARCH=i386 and i386_defconfig are what satisfy the second."
              rc=1
              ;;
          esac
          echo "================ END GUEST KERNEL CONFIGURATION ================"
          [ "$rc" -eq 0 ] || exit 1

          make ARCH=i386 -j"$(nproc)" bzImage
          cp -- arch/x86/boot/bzImage "$GUEST_KERNEL_IMAGE"
          cp -- .config "$GUEST_KERNEL_CONFIG"

          # THE EXTRACTED TREE IS SCRATCH AND IS REMOVED; THE PARENT DIRECTORY IS NOT.
          # The runner needs the ~1.5 GiB the source tree occupies for the 8 GiB image, and the
          # bzImage and .config have both been copied out above, so the tree itself has no
          # further reader. Its PARENT, $src_root, is a different matter: the restoration step
          # wrote binder-ipc32-restore.patch directly into it, and the 'Upload the provisioning
          # records' step lists kernel-src/binder-ipc32-restore.patch with
          # `if-no-files-found: error`. Removing the parent would therefore turn a green job red
          # at the upload - and would delete the one artefact a reader needs to check what was
          # actually applied to the kernel, which is the least conventional thing this job does.
          # So only the version-named subdirectory goes.
          cd "$GITHUB_WORKSPACE"
          rm -rf -- "$kernel_tree"
          [ ! -e "$kernel_tree" ] || { echo "::error::the kernel source tree at $kernel_tree could not be removed, so the runner may not have room for the ${GUEST_IMAGE_SIZE_MIB} MiB guest image. Check what still holds it."; exit 1; }
          [ -f "$src_root/binder-ipc32-restore.patch" ] || { echo "::error::$src_root/binder-ipc32-restore.patch is gone after removing the kernel source tree. That file is uploaded by the 'Upload the provisioning records' step with if-no-files-found: error, and it is the evidence of what was applied to make protocol 7 reachable; only the version-named subdirectory may be removed here."; exit 1; }
          ls -l "$GUEST_KERNEL_IMAGE"
          df -h "$GITHUB_WORKSPACE" | tail -n 1

      # THE BASE ROOT FILESYSTEM, BUILT FROM AN IMMUTABLE SNAPSHOT AND MEASURED HERE.
      #
      # WHY THE SNAPSHOT AND NOT deb.debian.org. That mirror serves the CURRENT contents of the
      # suite, so a rerun after any point release or security update would produce a different
      # base, a different toolchain inside the guest and different coverage evidence, with
      # nothing to say it had happened. This step debootstraps from snapshot.debian.org at a
      # PINNED TIMESTAMP instead, which serves the archive as it was at that instant and never
      # changes. The same URL is handed to the image builder as --apt-mirror,
      # so the packages installed inside the image come from the same archive state the base
      # was unpacked from; the builder's own snapshot handling (it writes
      # Acquire::Check-Valid-Until "false" when --apt-mirror is given) exists for exactly this.
      #
      # THIS IS THE ONE FETCHED INPUT WITH NO COMMITTED DIGEST, AND THAT IS A REASONED
      # EXCEPTION WITH A NAMED CAUSE - not an unauthenticated fetch of the kind the other four
      # steps refuse.
      #
      # The two CMake steps, the lcov step and the kernel step each verify their artefact
      # against a PUBLISHER-ISSUED digest committed in this workflow's env block,
      # unconditionally, before use. This base tarball cannot be treated the same way, for a
      # reason that is a property of the artefact rather than a gap in the checking:
      #
      #   * NOBODY PUBLISHES A DIGEST FOR IT. The tarball is not downloaded; this step CREATES
      #     it by running debootstrap. There is no publisher to take an independent value from,
      #     and a constant invented here would be exactly the fabricated measurement the other
      #     four steps' committed digests are NOT.
      #   * DEBOOTSTRAP OUTPUT IS NOT REPRODUCIBLE. Two runs over the same immutable snapshot
      #     still differ: the tarball captures mtimes, generated state (ldconfig caches, dpkg
      #     status, machine-id and the like) and directory order that debootstrap does not
      #     normalise, and it is assembled by whatever debootstrap version the runner image
      #     carries. So even a digest measured from a good run is not a value a future run is
      #     obliged to reproduce.
      #
      # WHAT PINS THIS INPUT INSTEAD. The package SOURCE is pinned immutably -
      # snapshot.debian.org serves the archive as it was at GUEST_DEBIAN_SNAPSHOT and never
      # changes - and the RESOLVED PACKAGE SET is recorded inside the image and fingerprinted in
      # its manifest, so what was installed is verifiable after the fact rather than asserted
      # before it. That is the substantive control here; the digest below is a comparison
      # BETWEEN RUNS, not an authentication of a third-party download.
      #
      # THE DIGEST MECHANISM IS BUILT ON, NOT REPLACED. The image builder hard-codes no digest,
      # deliberately, for the same reason: the base is produced here and its digest is taken
      # from the artefact that was actually produced, then written to the sidecar file the
      # builder reads and verifies before it extracts anything - which does close the gap
      # between THIS step and the image build. sha256sum's own output form is one of the two
      # forms the builder accepts, so the digest travels beside the tarball rather than through
      # a shell variable. base_expected_sha256 turns the run-to-run expectation into an enforced
      # one: give it the digest a previous run measured and a changed base becomes a named
      # failure here instead of a quietly different image.
      #
      # THE SNAPSHOT IS VERIFIED TO EXIST BEFORE IT IS USED, and that verification no longer
      # happens here: "Resolve and prove the pinned Debian snapshot" does it once, near the top
      # of the job, and exports GUEST_DEBIAN_SNAPSHOT_RESOLVED and GUEST_DEBIAN_MIRROR. It moved
      # because there is now a second consumer of the same archive state - the guest-matched
      # i386 build chroot, which runs long before this step - and two independent resolutions
      # could disagree about which snapshot they used. A mistyped or pruned timestamp is still
      # refused before an hour of work is committed to it; it is refused earlier.
      #
      # This is host-side acquisition at IMAGE-BUILD time and is legitimate. What must not
      # happen - and does not - is the GUEST reaching the network at test time; it is booted
      # with -nic none and its init refuses to run if it finds an interface, a route or a
      # resolver.
      - name: Build the base root filesystem
        # The dispatch input reaches the script through the ENVIRONMENT, never through
        # ${{ }} interpolation into the script body, and that is the same pattern the lcov and
        # kernel digest steps already use. An interpolated expression is substituted before
        # bash parses the line, so a value containing shell metacharacters would be executed
        # rather than compared; as an environment variable it is data. The debian_snapshot input
        # is consumed by the resolution step above rather than here, so only the digest
        # cross-check input remains.
        env:
          BASE_EXPECTED_SHA256: ${{ github.event.inputs.base_expected_sha256 }}
        run: |
          set -euo pipefail
          # The runner-owned subtree, not qemu-work itself: this step writes the base tarball
          # and its digest as the unprivileged account.
          mkdir -p "$WORK_DIR/host"
          cd "$WORK_DIR/host"

          # THE RESOLVED VALUES ARE CONSUMED, NOT RE-DERIVED. Both are exported by "Resolve and
          # prove the pinned Debian snapshot", which validated the timestamp's form and proved
          # the archive serves this suite. Re-validating here would create a second opinion that
          # could drift from the one the build chroot was created from, which is the specific
          # failure mode that made a guest-mismatched staging possible in the first place. They
          # are asserted non-empty so a reordering that put this step first is a named failure
          # rather than a debootstrap invocation with an empty mirror.
          snapshot="${GUEST_DEBIAN_SNAPSHOT_RESOLVED:-}"
          mirror="${GUEST_DEBIAN_MIRROR:-}"
          if [ -z "$snapshot" ] || [ -z "$mirror" ]; then
            echo "::error::GUEST_DEBIAN_SNAPSHOT_RESOLVED and GUEST_DEBIAN_MIRROR are not both set, so the snapshot this step must debootstrap from is unknown. They are exported by 'Resolve and prove the pinned Debian snapshot', which must run before this step and before 'Create the guest-matched i386 build chroot'."
            exit 1
          fi
          echo "pinned package source: $mirror  (snapshot $snapshot, suite $GUEST_DEBIAN_SUITE)"
          echo "  proved to serve this suite by the resolution step; its Release metadata is in that step's log."

          sudo debootstrap --arch="$GUEST_ARCH" --variant=minbase \
            "$GUEST_DEBIAN_SUITE" "$WORK_DIR/host/base-rootfs" "$mirror"

          sudo tar --create --numeric-owner --file base-i386.tar -C "$WORK_DIR/host/base-rootfs" .
          sudo chown "$(id -u):$(id -g)" base-i386.tar
          sudo rm -rf -- "$WORK_DIR/host/base-rootfs"

          sha256sum base-i386.tar > base-i386.tar.sha256
          measured="$(awk '{ print $1 }' base-i386.tar.sha256)"
          echo "base root filesystem : $WORK_DIR/host/base-i386.tar"
          echo "measured digest      : $measured"
          echo "suite / archive      : $GUEST_DEBIAN_SUITE  $mirror"

          # THE RUN-TO-RUN CROSS-CHECK, AND IT IS DELIBERATELY OPTIONAL - the only fetched input
          # in this job that is. Unlike CMake, lcov and the kernel, which are each verified
          # against a publisher-issued digest committed in this workflow before use, this
          # tarball is BUILT HERE by debootstrap: no publisher issues a digest for it and
          # debootstrap's output is not reproducible, so there is no value that could honestly be
          # committed in advance and inventing one would be a fabricated measurement. Empty
          # therefore means "record the measurement"; a value means "prove the base has not
          # moved since the run that produced that value". A mismatch is fatal: with an immutable
          # archive the only ways to reach one are a changed debootstrap, a changed suite or a
          # changed pin, and every one of those changes the guest's toolchain.
          expected="${BASE_EXPECTED_SHA256:-}"
          if [ -n "$expected" ]; then
            if [ "$expected" != "$measured" ]; then
              echo "::error::the base root filesystem digest changed. expected $expected, measured $measured. The package source is an immutable snapshot ($mirror), so this means debootstrap, the suite or the pin changed - not the archive. Investigate before trusting any coverage this run would produce."
              exit 1
            fi
            echo "digest cross-check   : matches the expected value supplied for this run"
          else
            echo "digest cross-check   : not requested for this run, which is ALLOWED HERE AND NOWHERE ELSE in this job."
            echo "  This tarball is built by debootstrap rather than downloaded: no publisher issues a"
            echo "  digest for it and debootstrap output is not reproducible, so a committed expected"
            echo "  value would be fabricated rather than independent. What pins this input is the"
            echo "  immutable snapshot archive above plus the resolved package set recorded inside the"
            echo "  image; the digest is a comparison between runs. CMake, lcov and the guest kernel"
            echo "  are each verified against a committed publisher digest and have no optional arm."
            echo "  Pass base_expected_sha256=$measured on later runs to make a changed base a named failure."
          fi
          df -h "$GITHUB_WORKSPACE" | tail -n 1

      # THE PAYLOAD THAT GOES INTO THE IMAGE IS STAGED SOURCE-ONLY, WITHOUT .git.
      #
      # The image is uploaded as a workflow artifact, so everything copied into it is
      # effectively published. Two things therefore do not travel:
      #
      #   * .git.  persist-credentials: false already keeps the token out of .git/config, and
      #     this removes the question entirely - there is no .git in the guest at all. It is
      #     also a large saving in an image that has to hold a toolchain and a build tree, and
      #     nothing in the guest needs history: run_coverage.sh builds and measures a working
      #     tree, and the image builder's own verify_payload_tree looks for configure.ac and
      #     tests/L1Tests/run_coverage.sh, not for a repository.
      #   * Any credential file that reached the tree by another route.
      #
      # THE SCAN LOOKS FOR TOKEN SHAPES AND CREDENTIAL FILES, NOT FOR VOCABULARY, and that is
      # deliberate rather than lax: this workflow's own comments contain the words
      # "extraheader" and "x-access-token" while explaining why they must not be present, and
      # the payload includes this file. A grep for those words would fail the job on its own
      # documentation. GitHub's token formats are prefixed and fixed-length, which is what
      # makes a shape match precise enough to be worth running.
      #
      # THE COPY IS DONE WITH tar, NOT WITH rsync, AND THAT IS A SUPPLY-CHAIN DECISION.
      #
      # This is the one copy in the whole job whose INPUT is a repository-controlled tree: every
      # file under hdmicec-payload/ arrives from a checkout, so its names, its depth, its
      # symlinks and its sizes are all chosen by whoever wrote the branch under test. That makes
      # the program performing the copy part of the attack surface rather than a utility, and
      # rsync is the wrong program to put there for a reason that has nothing to do with this
      # workflow: the distribution's rsync carries a set of published defects in its own file-
      # list and argument handling that upstream fixed in 3.5.0 and that the packaged version
      # does not have. tar performs this copy exactly, is in every base image, and is already
      # relied on by this job for the lcov and CMake tarballs.
      #
      # THE REPLACEMENT WAS MEASURED, NOT ASSUMED, and it came out strictly closer to the source
      # than the rsync it replaces. Against a tree built to exercise all seven patterns at
      # several depths - symlinks (including a dangling one), hard links, 0755 and 0644 modes,
      # dotfiles, sub-second mtimes and both a .git DIRECTORY and a .git gitlink FILE - the tar
      # pipe below reproduced the source's member list, content and metadata EXACTLY: same modes,
      # same symlink targets, same mtimes to the nanosecond, on files, on symlinks and on
      # directories. `rsync -a` did not: it re-stamped every directory mtime and the symlink's
      # mtime with the transfer time. Nothing in the payload depends on a directory mtime, so
      # that was never a defect - but it does mean the exact-copy claim belongs to tar and not to
      # what was here before.
      #
      # Two details make that true and neither is optional:
      #
      #   * --format=posix is REQUIRED. The default gnu format stores mtimes truncated to whole
      #     seconds, so without it the copy loses the sub-second component - measured, not
      #     theorised.
      #   * tar's exclusion patterns are unanchored and match at any path component, which is
      #     what makes '.netrc', 'id_rsa' and '*.pem' behave as rsync's did at every depth.
      #
      # TWO BEHAVIOURAL DIFFERENCES EXIST AND BOTH ARE SAFE IN THIS DIRECTION. tar preserves hard
      # links as hard links where rsync -a (without -H) breaks them into separate files. And
      # '.git' without a trailing slash also excludes a .git REGULAR FILE - the gitlink pointer a
      # submodule working tree carries - whereas rsync's '.git/' matched directories only. That
      # second one is not a cosmetic difference: measured on the same tree, the rsync copy left a
      # .git gitlink file in the staged payload and FAILED the leftover check below, while the tar
      # copy passes it. Stripping repository metadata is precisely what this step is for, so the
      # stronger match is the intended one and the check below still asserts the outcome
      # independently rather than trusting the exclusion list.
      - name: Stage the guest payload without its Git metadata
        run: |
          set -euo pipefail
          staged="$GITHUB_WORKSPACE/guest-payload"
          rm -rf -- "$staged"
          mkdir -p -- "$staged"
          tar --create --format=posix --file - \
              --directory "$GITHUB_WORKSPACE/hdmicec-payload" \
              --exclude='.git' --exclude='.git-credentials' --exclude='.netrc' \
              --exclude='.npmrc' --exclude='id_rsa' --exclude='id_rsa.pub' --exclude='*.pem' \
              -- . \
            | tar --extract --file - --preserve-permissions --directory "$staged"

          rc=0
          # 1. No repository metadata and no credential store anywhere in the staged tree.
          leftovers="$(find "$staged" \( -name '.git' -o -name '.git-credentials' -o -name '.netrc' -o -name '*.pem' \) -print 2>/dev/null || true)"
          if [ -n "$leftovers" ]; then
            echo "::error::the staged guest payload still contains repository metadata or credential files:"
            printf '%s\n' "$leftovers" | sed 's/^/  /'
            rc=1
          fi
          # 2. No GitHub token SHAPE anywhere in the staged tree. -I skips binary files; the
          #    patterns are GitHub's own prefixed formats, so a match is a token and not prose.
          #    Only the FILE is named, never the matching line, so the log cannot leak it.
          suspects="$(grep -rIlE 'gh[pousr]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}' "$staged" 2>/dev/null || true)"
          if [ -n "$suspects" ]; then
            echo "::error::the staged guest payload contains something shaped like a GitHub token, in these files (contents deliberately not printed):"
            printf '%s\n' "$suspects" | sed 's/^/  /'
            rc=1
          fi
          [ "$rc" -eq 0 ] || exit 1

          # The two files the image builder's own payload validation requires, asserted here so
          # a staging mistake is named at the staging step rather than inside the builder.
          for required in configure.ac tests/L1Tests/run_coverage.sh; do
            [ -f "$staged/$required" ] || { echo "::error::the staged guest payload is missing $required, which the image builder requires."; exit 1; }
          done
          echo "staged guest payload : $staged"
          echo "  .git present       : $([ -e "$staged/.git" ] && echo yes || echo 'no (stripped)')"
          echo "  size               : $(du -sh -- "$staged" | awk '{ print $1 }')"

      # THE COMMIT IDENTITIES THE GUEST CANNOT DISCOVER FOR ITSELF.
      #
      # Stripping .git out of the payload is the right call and is not being reconsidered - the
      # image is uploaded as an artifact and repository metadata has no business in it. But it
      # has a consequence that made the harvested evidence weaker than it reads: the guest's
      # run_coverage.sh writes a provenance.txt whose repository rows are produced by asking git,
      # and inside the guest git cannot answer for a tree that has no .git. Every row therefore
      # read "unavailable (not a repository)", and the file's own instruction to compare the
      # superproject revision against `git rev-parse HEAD` could not be carried out by anyone
      # holding the artefact. A coverage figure that cannot be tied to a commit is a figure, not
      # evidence.
      #
      # THE FIX IS TO CARRY THE ANSWER IN, not to put .git back. The revisions are read HERE,
      # on the runner, from the checkouts that actually produced what the guest contains, passed
      # to the image builder as --provenance-revision-<label>, written into the in-guest
      # configuration file, and exported by the init as CEC_PROVENANCE_REVISION_<LABEL> - the
      # variable run_coverage.sh consults for a path git cannot answer for. The runner is the
      # only participant that can know these values, so this is the only place they can come
      # from.
      #
      # WHICH TREE ANSWERS FOR WHICH LABEL, and the choices are not interchangeable:
      #
      #   hdmicec                  hdmicec-payload, NOT the hdmicec checkout this job builds in.
      #                            The payload tree is what was copied into the image; the build
      #                            tree has stubs, object files and a configured Makefile in it
      #                            and would report itself dirty for reasons the guest never saw.
      #   entservices-hdmicecsink  the Sink checkout, which is where the one staged file -
      #                            plugin/HdmiCecSinkImplementation.cpp, the L1 drift guard's
      #                            subject - came from. The builder creates that directory inside
      #                            the guest, which is why run_coverage.sh emits a row for it.
      #   superproject             the workspace root, IF it is a repository. On this job it is
      #                            not: every tree arrives through actions/checkout with a `path:`
      #                            and the guest's own workspace is an assembled layout rather
      #                            than a checkout of anything. So this label is normally left
      #                            unset, which leaves the row reading exactly what it reads
      #                            today. github.sha is deliberately NOT substituted for it: that
      #                            is hdmicec's commit, and labelling it "superproject" would be
      #                            a false statement in the one file a reader trusts for
      #                            identity. A caller that does have a superproject checkout is
      #                            served, because the option exists and is resolved from the
      #                            tree rather than from a constant.
      #
      # A MALFORMED VALUE IS NOT PASSED THROUGH. The builder validates the form again and refuses
      # anything that is not a 40-character lower-case sha with an optional -dirty suffix, and
      # the guest's runner refuses it a third time; passing a bad value would therefore turn a
      # provenance gap into a failed build. So it is validated here, and a value that cannot be
      # read or does not validate is reported and OMITTED - which degrades to exactly today's
      # behaviour for that row rather than failing anything.
      - name: Resolve the provenance revisions carried into the guest
        run: |
          set -euo pipefail

          # $1 = the provenance label as tests/L1Tests/run_coverage.sh spells it
          # $2 = absolute path of the checkout that answers for that label
          # $3 = the GITHUB_ENV variable this job carries the resolved value in
          resolve_revision() {
            local label="$1" tree="$2" var="$3" head='' porcelain='' value=''

            if [ ! -d "$tree/.git" ]; then
              printf '  %-24s %s\n' "$label" "no repository at $tree - omitted, so the guest row reads as it does today"
              return 0
            fi

            head="$(git -C "$tree" rev-parse HEAD 2>/dev/null || true)"
            # 40 lower-case hex, checked by length and by residue rather than by a forty-element
            # character class: tr deletes every permitted character, so anything left over is a
            # character that is not permitted.
            if [ "${#head}" -ne 40 ] || [ -n "$(printf '%s' "$head" | tr -d '0-9a-f')" ]; then
              echo "::warning::could not read a 40-character lower-case commit sha for '$label' out of $tree (got '${head:-<nothing>}'). It is OMITTED rather than passed on, because the image builder and the in-guest runner both refuse a malformed value; the guest's provenance row for $label will read as it does without this feature."
              return 0
            fi

            # UNTRACKED COUNTS AS DIRTY, deliberately. What travels into the image is a CONTENT
            # copy of the tree, so an untracked file is in the guest just as surely as a modified
            # one, and a bare sha would then describe something the guest does not contain.
            porcelain="$(git -C "$tree" status --porcelain 2>/dev/null || true)"
            if [ -n "$porcelain" ]; then
              value="$head-dirty"
              printf '  %-24s %s\n' "$label" "$value  (working tree not clean: $(printf '%s\n' "$porcelain" | wc -l | tr -d '[:space:]') entr(y/ies))"
            else
              value="$head"
              printf '  %-24s %s\n' "$label" "$value"
            fi
            echo "$var=$value" >> "$GITHUB_ENV"
          }

          echo "provenance revisions carried into the guest:"
          resolve_revision 'superproject'            "$GITHUB_WORKSPACE"                          PROVENANCE_REVISION_SUPERPROJECT
          resolve_revision 'hdmicec'                 "$GITHUB_WORKSPACE/hdmicec-payload"          PROVENANCE_REVISION_HDMICEC
          resolve_revision 'entservices-hdmicecsink' "$GITHUB_WORKSPACE/entservices-hdmicecsink"  PROVENANCE_REVISION_ENTSERVICES_HDMICECSINK

      # THE ROOT IMAGE IS BUILT BY THE CHECKED-IN SCRIPT BESIDE THIS FILE. It is not fetched
      # and it is not generated inline. The script also installs the in-guest init, which is the
      # guest's PID 1 and the only thing that invokes run_coverage.sh.
      #
      # PAYLOAD TRANSPORT: the copied disk image, which is the transport the script implements
      # and the one this job commits to. There is no shared directory, no second disk and no
      # guest network. Artifacts come back the same way - out of the image after power-down.
      #
      # Every optional flag below is optional only on the command line and mandatory in effect.
      # --gtest-prefix is required by the builder's own input validation and by its in-image
      # pkg-config assertion. --lcov-tarball is what makes the image's "lcov reports 2.x"
      # assertion pass; without it the build fails by design. Neither digest is passed as a
      # flag because both sidecar files were written next to their tarballs above.
      #
      # --apt-mirror IS THE SAME PINNED SNAPSHOT the base was debootstrapped from, composed by
      # the step above and exported through GITHUB_ENV so the timestamp lives in one place.
      # That is what makes the package set inside the image reproducible rather than merely
      # measured: the builder writes Acquire::Check-Valid-Until "false" when it is given, which
      # exists precisely because a snapshot's Release file is older than "now".
      #
      # TMPDIR IS SUPPLIED EXPLICITLY, AND ROOT-OWNED AND PRIVATE. sudo scrubs TMPDIR from the
      # environment, so the builder would fall back to /tmp; it validates whatever it gets and
      # REFUSES a world-writable directory that is not sticky, because it mounts a filesystem
      # and chroots inside its scratch directory as root. A hosted runner's /tmp is 1777 and
      # would pass, but a CI container's is not always (2777 - world-writable, NOT sticky - was
      # measured on the container this was developed in), and the failure would look like a
      # mysterious refusal. Handing it a directory this job created removes the dependency on
      # the host's /tmp mode entirely.
      #
      # EXIT STATUS 70 FROM THE BUILDER IS A FAILURE, NOT A WARNING. It means the image built
      # but the builder could not release a mount, a loop device or its scratch directory - the
      # host is left in a state that breaks the next job. This step runs under the default
      # bash -e shell and passes the status straight through, which is the intended handling:
      # there is no "|| true" here and there must never be one.
      - name: Build the guest root image
        run: |
          set -euo pipefail
          script="$GITHUB_WORKSPACE/hdmicec/.github/workflows/aidl-path-tests-rootfs.sh"
          [ -f "$script" ] || { echo "::error::the checked-in root-image builder is missing at $script."; exit 1; }

          # The pin is named HERE, beside the image it produces, and not only in the step that
          # resolved it -- a reader debugging an image reads this step's log, and a timestamp
          # that appears only three steps earlier is a timestamp nobody correlates.
          echo "package source pinned to snapshot ${GUEST_DEBIAN_SNAPSHOT_RESOLVED:-<unresolved>} (suite $GUEST_DEBIAN_SUITE, arch $GUEST_ARCH)"

          # Root-owned, 0700, on the workspace filesystem so it has room for the base archive.
          builder_tmp="$WORK_DIR/builder-tmp"
          sudo rm -rf -- "$builder_tmp"
          sudo install -d -m 0700 -o root -g root -- "$builder_tmp"
          echo "builder TMPDIR: $builder_tmp ($(sudo stat -c '%U %a' -- "$builder_tmp"))"

          # THE PUBLICATION DIRECTORY, ROOT-OWNED AND 0755, created here because the builder
          # refuses to publish into a directory whose owner is not uid 0 -- see the comment on
          # GUEST_IMAGE in this job's env block for why the directory's OWNER, not the file's
          # mode, is what decides whether the staged image can be substituted mid-build.
          #
          # 0755 rather than 0700: the finished pair is 0644 and is read by later NON-ROOT steps
          # (upload-artifact reads the manifest, and qemu reads the image), so the directory has
          # to be traversable by the runner's own account. Group and other WRITE are what the
          # builder refuses, and 0755 has neither.
          publish_dir="$(dirname -- "$GUEST_IMAGE")"
          sudo install -d -o root -g root -m 0755 -- "$publish_dir"
          echo "publication directory: $publish_dir ($(sudo stat -c '%U:%G %a' -- "$publish_dir"))"

          # --toolchain-gcc-major CARRIES THIS JOB'S PIN INTO A DIFFERENT ARCHIVE, AND IT IS A
          # RECORD-AND-REPORT INPUT RATHER THAN A DEMAND. The guest is Debian bookworm i386 at a
          # pinned snapshot, whose default GCC family is not this job's, and whether that
          # snapshot offers the pinned one at all is a property of the archive rather than of
          # this file. So the value is passed rather than restated: the builder installs the
          # versioned compiler when the archive has it, selects it for the in-guest build,
          # RECORDS the guest's own gcc/g++/gcov versions in the image and the manifest either
          # way, and prints a NAMED limitation when the guest cannot match. What it asserts hard
          # is the property the guest's own trace depends on - that the guest's gcov and its
          # compiler are the same family. Spelling a version here instead of passing this
          # variable is what would let the two drift.
          # THE THREE PROVENANCE REVISIONS ARE OPTIONAL PER REPOSITORY, so they are assembled
          # into an array rather than spelled into the fixed argument list: a label the runner
          # could not resolve must be ABSENT from the command line, because the builder refuses
          # an empty value and because absence is what degrades to today's behaviour for that
          # row. `if` blocks rather than `[ -n ... ] && arr+=(...)`, because under `set -e` a
          # false test at the head of an && list is the step's exit status.
          declare -a provenance_args=()
          if [ -n "${PROVENANCE_REVISION_SUPERPROJECT:-}" ]; then
            provenance_args+=( --provenance-revision-superproject "$PROVENANCE_REVISION_SUPERPROJECT" )
          fi
          if [ -n "${PROVENANCE_REVISION_HDMICEC:-}" ]; then
            provenance_args+=( --provenance-revision-hdmicec "$PROVENANCE_REVISION_HDMICEC" )
          fi
          if [ -n "${PROVENANCE_REVISION_ENTSERVICES_HDMICECSINK:-}" ]; then
            provenance_args+=( --provenance-revision-entservices-hdmicecsink "$PROVENANCE_REVISION_ENTSERVICES_HDMICECSINK" )
          fi
          echo "provenance arguments : ${#provenance_args[@]} value(s) passed to the builder"

          # --staging-gcc-version AND --staging-toolchain-state CARRY THE ONE TOOLCHAIN THE IMAGE
          # ITSELF CANNOT MEASURE. The libraries the guest loads were compiled in the i386 build
          # chroot, whose gcc family is not this job's pinned major and is not the guest's own
          # installed compiler either; the builder records both values in the SDK build-flags
          # record it writes into the image, so the guest's provenance answers "which compiler
          # family built what I am running" rather than leaving a reader to assume it was the
          # pinned one. They are asserted set, because a silently empty pair would publish an
          # image whose provenance says "unknown" about a fact this job measured.
          if [ -z "${CEC_STAGING_GCC_VERSION:-}" ] || [ -z "${CEC_STAGING_TOOLCHAIN_STATE:-}" ]; then
            echo "::error::CEC_STAGING_GCC_VERSION and CEC_STAGING_TOOLCHAIN_STATE are not both set, so the compiler family that built the staged i386 libraries cannot be recorded in the image. They are exported by 'Create the guest-matched i386 build chroot', which must run before this step."
            exit 1
          fi

          sudo env "TMPDIR=$builder_tmp" bash "$script" \
            --output "$GUEST_IMAGE" \
            --payload "$GITHUB_WORKSPACE/guest-payload" \
            --sdk-dir "$HALIF_PREFIX_I386" \
            --base-tarball "$WORK_DIR/host/base-i386.tar" \
            --lcov-tarball "$LCOV_TARBALL" \
            --gtest-prefix "$GTEST_PREFIX_I386" \
            --sink-caller-source "$SINK_CALLER_SOURCE" \
            --kernel-config "$GUEST_KERNEL_CONFIG" \
            --arch "$GUEST_ARCH" \
            --size "$GUEST_IMAGE_SIZE_MIB" \
            --apt-mirror "deb $GUEST_DEBIAN_MIRROR $GUEST_DEBIAN_SUITE main" \
            --readiness-timeout "$GUEST_READINESS_TIMEOUT_SECONDS" \
            --toolchain-gcc-major "$CEC_TOOLCHAIN_GCC_MAJOR" \
            --staging-gcc-version "$CEC_STAGING_GCC_VERSION" \
            --staging-toolchain-state "$CEC_STAGING_TOOLCHAIN_STATE" \
            "${provenance_args[@]}"

          # POST-BUILDER CUSTODY, AND IT IS A DESCRIPTOR RATHER THAN A PATHNAME FROM HERE ON.
          #
          # The builder pins the publication directory on a descriptor and composes every
          # privileged operation as /proc/self/fd/<n>/<leaf>, so nothing can redirect a check
          # away from the operation that follows it. THAT CUSTODY ENDS WHEN THE BUILDER EXITS
          # and closes the descriptor. Resolving $GUEST_IMAGE afresh from here on - for a
          # `sudo chown`, which dereferences its argument, for the stats or for the writability
          # gate - would reopen that window: a substitution of the publication directory or of
          # either leaf between the builder's exit and those lines would have root chown whatever
          # the new path resolves to.
          #
          # So this step opens the directory ONCE, verifies that the object behind the descriptor
          # is a root-owned directory, and names every leaf as /proc/$$/fd/8/<leaf> afterwards.
          # Three details are deliberate:
          #
          #   * /proc/$$/fd/8 and not /proc/self/fd/8. `sudo` closes descriptors at and above 3
          #     in the child, so the privileged child has no fd 8 of its own -- but it runs as
          #     root and may traverse the parent shell's /proc/<pid>/fd. $$ is the top-level
          #     script shell's pid and stays that inside a subshell or a pipeline, which
          #     $BASHPID does not.
          #   * `chown -h`. chown follows a symbolic link on its final component; -h does not.
          #     The leaf is asserted to be a regular file first, and the directory is root-owned
          #     so only root can create an entry in it, but -h costs nothing and removes the
          #     final dereference from the privileged call entirely.
          #   * THE DEVICE IS COMPARED. A leaf on a different device than the directory it is
          #     listed in is a bind mount or a substitution, not a file the builder published.
          publish_dir="$(dirname -- "$GUEST_IMAGE")"
          image_leaf="$(basename -- "$GUEST_IMAGE")"
          manifest_leaf="$image_leaf.manifest"
          if [ -L "$publish_dir" ]; then
            echo "::error::the publication directory $publish_dir is a symbolic link. It is refused rather than followed: every check below would describe the link's target while the operations landed there too, and the builder published into the directory this path named before it was replaced."
            exit 1
          fi
          exec 8< "$publish_dir" || { echo "::error::the publication directory $publish_dir could not be opened for the descriptor the operations below go through."; exit 1; }
          dir_fd="/proc/$$/fd/8"
          dir_type="$(stat -L -c '%F' -- "$dir_fd")"
          dir_owner="$(stat -L -c '%u' -- "$dir_fd")"
          dir_device="$(stat -L -c '%d' -- "$dir_fd")"
          [ "$dir_type" = 'directory' ] || { echo "::error::the descriptor opened on $publish_dir refers to a '$dir_type' rather than a directory. Nothing is read or written through it."; exit 1; }
          [ "$dir_owner" = '0' ] || { echo "::error::the descriptor opened on $publish_dir refers to a directory owned by uid $dir_owner rather than root, although the build step created it root-owned. Whoever owns that directory may rename the published pair away between any check and its use, so this job stops rather than handing the image over."; exit 1; }
          for leaf in "$image_leaf" "$manifest_leaf"; do
            if [ -L "$dir_fd/$leaf" ]; then
              echo "::error::$publish_dir/$leaf is a symbolic link rather than the file the builder published. Refused rather than followed."
              exit 1
            fi
            [ -f "$dir_fd/$leaf" ] || { echo "::error::the image builder did not leave a regular file at $publish_dir/$leaf, so the published pair is incomplete and the image cannot be trusted."; exit 1; }
            leaf_device="$(stat -c '%d' -- "$dir_fd/$leaf")"
            [ "$leaf_device" = "$dir_device" ] || { echo "::error::$publish_dir/$leaf is on device $leaf_device while its own directory is on device $dir_device. A leaf on a different filesystem than the directory listing it is a bind mount or a substitution, not a file the builder published; refused."; exit 1; }
          done
          image_fd_path="$dir_fd/$image_leaf"
          manifest_fd_path="$dir_fd/$manifest_leaf"
          manifest="$GUEST_IMAGE.manifest"

          # HAND THE FINISHED PAIR TO THE RUNNER'S ACCOUNT, and note carefully what this does and
          # does not give up.
          #
          # The builder's root-owned custody protects the image WHILE IT IS BEING BUILT: it is
          # what stops the staged image, the destination or the lock being substituted between a
          # check and the privileged truncate, mkfs, losetup or rename that follows. That window
          # closed when publish_outputs() returned. What follows needs the opposite: the boot step
          # runs `qemu-system-i386` WITHOUT sudo, with the image attached as a writable backend
          # (`-drive ...,if=none,cache=writeback` behind `-device ahci` + `-device ide-hd`, which
          # is why the guest's root argument is `root=/dev/sda rw` and not a virtio node - see THE
          # ROOT DISK IS ON EMULATED AHCI in the boot step), and the guest WRITES its coverage
          # artifacts and its status file
          # into the filesystem inside this image. A non-root process cannot open a root-owned
          # 0644 file read-write, so the boot would fail with a permission error that has nothing
          # to do with binder, the SDK or the tests.
          #
          # This was a real defect and not a consequence of the custody change: no chown of the
          # image existed anywhere in this workflow, and the image was root-owned before as well
          # (the builder has always published as root under sudo).
          #
          # The DIRECTORY stays root-owned, so nothing can substitute the published entries; only
          # the two files change hands, and only after they are complete, mode-set and flushed.
          sudo chown -h -- "$(id -u):$(id -g)" "$image_fd_path" "$manifest_fd_path"
          # The published pathname is printed from the variable rather than from stat's %n,
          # because %n through the descriptor would print /proc/<pid>/fd/8/<leaf> -- correct, and
          # useless to a reader. The ownership and mode come from the descriptor path, so what is
          # reported is the object that was actually chowned.
          echo "published pair handed to the runner:"
          echo "  $GUEST_IMAGE  $(stat -c 'owner %U:%G  mode %a' -- "$image_fd_path")"
          echo "  $manifest  $(stat -c 'owner %U:%G  mode %a' -- "$manifest_fd_path")"
          echo "publication directory left root-owned: $(stat -L -c '%U:%G %a' -- "$dir_fd")"
          [ -w "$image_fd_path" ] || { echo "::error::the published image at $GUEST_IMAGE is not writable by this job's own account, so qemu -- which runs unprivileged and boots it read-write -- cannot use it. The chown above did not take effect."; exit 1; }

          echo "================ IMAGE MANIFEST ================"
          cat -- "$manifest_fd_path"
          echo "================ END IMAGE MANIFEST ================"

          # The guest's entry point, its artifact directory and its status file are READ OUT OF
          # THE MANIFEST rather than restated here, so that the two files cannot drift apart.
          # Read through the descriptor for the same reason the chown was: the values below
          # decide what this job boots and where it looks for results.
          manifest_value() {
            awk -v key="$1" -F= '$1 == key { sub(/^[^=]*=/, ""); print; exit }' "$manifest_fd_path"
          }
          guest_init="$(manifest_value GUEST_INIT)"
          artifact_dir="$(manifest_value ARTIFACT_DIR)"
          status_file="$(manifest_value STATUS_FILE)"
          for pair in "GUEST_INIT=$guest_init" "ARTIFACT_DIR=$artifact_dir" "STATUS_FILE=$status_file"; do
            case "$pair" in
              *=) echo "::error::the manifest does not name ${pair%=}, which this job needs in order to boot the guest and find its results."; exit 1 ;;
            esac
          done

          # THE GUARD'S REQUIRED INPUT WAS STAGED, ASSERTED FROM THE MANIFEST RATHER THAN ASSUMED
          # FROM THE FLAG THIS JOB PASSED.
          #
          # --sink-caller-source was passed above, and the builder refuses to build without the
          # file by either route - so this is not a second guess at the same fact. It closes the
          # gap between "the builder was told" and "the image carries it": the builder writes this
          # key only after the staged copy is in place, so reading it back here is evidence about
          # the IMAGE. Without it, the first sign of a staging fault would be a red
          # TheModelledSinkCallPathsStillMatchTheRealSinkSource inside the guest, an hour later,
          # reported as a plugin drift when nothing had drifted.
          #
          # The digest is checked against the host-side input as well, because a staged file of
          # the wrong revision fails the guard in exactly the way a genuine drift does, and the
          # two must not be confusable.
          sink_staged="$(manifest_value GUEST_SINK_CALLER_SOURCE)"
          sink_digest="$(manifest_value SINK_CALLER_SOURCE_SHA256)"
          [ -n "$sink_staged" ] || { echo "::error::the manifest does not name GUEST_SINK_CALLER_SOURCE, so this image records no staged Sink caller source. DriverAidlLocalInstanceTest.TheModelledSinkCallPathsStillMatchTheRealSinkSource reads that file and is a REQUIRED acceptance input: without it the guard fails inside the guest and the modelled Sink call paths become a model nothing has checked. The builder stages it unconditionally, so a manifest without this key was not produced by a matching root-image script."; exit 1; }
          expected_digest="$(sha256sum -- "$CEC_SINK_CALLER_SOURCE" | cut -d' ' -f1)"
          [ "$sink_digest" = "$expected_digest" ] || { echo "::error::the image staged a Sink caller source with digest '$sink_digest', but the pinned checkout this job passed has digest '$expected_digest'. A staged copy of the wrong revision fails the drift guard in exactly the way a real plugin change does, so the two must not be allowed to differ. Establish which is wrong rather than adjusting either to match."; exit 1; }
          echo "guard input staged at $sink_staged (sha256 $sink_digest, matches the pinned checkout)"
          {
            echo "GUEST_INIT_PATH=$guest_init"
            echo "GUEST_ARTIFACT_DIR=$artifact_dir"
            echo "GUEST_STATUS_FILE=$status_file"
          } >> "$GITHUB_ENV"
          df -h "$GITHUB_WORKSPACE" | tail -n 1

      # BOOT THE GUEST AND RUN THE WHOLE MATRIX.
      #
      # Everything that happens inside belongs to the guest: its init mounts binderfs, creates
      # and verifies the binder, hwbinder and vndbinder nodes, prints the BINDER PLATFORM
      # RECORD, starts servicemanager and WAITS FOR IT TO ANSWER A REAL BINDER TRANSACTION -
      # a bounded poll on a transaction, never a sleep, because a sleep that is occasionally
      # too short yields a run where every AIDL invocation quietly falls back to legacy and
      # reports green, which is the exact failure this job exists to catch - and then runs
      # run_coverage.sh --build --run --output-dir <the artifact directory>, writes that
      # command's EXACT exit status to the status file, and powers itself down from a trap that
      # runs on every path.
      #
      # THAT --output-dir IS WHY THE UPLOADS BELOW CAN NAME A PATH AT ALL. Given no output
      # directory, run_coverage.sh MINTS one with mktemp and only prints it, so a fixed upload
      # path would find nothing and - with if-no-files-found set to error, as every upload here
      # is - the job would fail having measured everything correctly. The init passes the fixed
      # artifact directory the manifest names, and this workflow reads that same name out of the
      # manifest rather than hard-coding it, which is what keeps the two ends together.
      # Only the DIRECTORY is overridable; the file names inside it are fixed, which is why the
      # coverage upload takes the whole directory instead of enumerating names.
      #
      # The workflow does not set CEC_TEST_AIDL_MODE, CEC_FAKE_AIDL_HOST_PATH or
      # CEC_FAKE_HOST_READY_FD, and must not: the first two belong to run_coverage.sh and the
      # init, and the third names an inherited descriptor whose parent is the L2 harness. It
      # does not launch the fake service host either - that is the harness's job, and doing it
      # from outside would put a second process on the "HdmiCec" name.
      #
      # No KVM is available on a hosted runner, so this is TCG emulation and it is slow. The
      # timeout is a backstop for a guest that fails to power itself down; the console is
      # captured to a file AND streamed, because that log is the only place the platform record
      # and the branch-arm gate's own output exist.
      #
      # THE GUEST HAS NO NETWORK, AND -nic none IS WHAT MAKES THAT TRUE.
      #
      # Omitting network options does NOT produce a guest without a network: qemu-system-i386
      # creates a DEFAULT user-mode NIC when no -nic/-netdev/-nodefaults is given, which gives
      # the guest SLIRP networking with a working DNS forwarder and outbound access through the
      # runner. Every claim this job makes about the guest -- that the payload carries
      # everything, that the package set inside the image is the one the builder pinned, that
      # nothing is fetched at test time -- rests on that not being the case, and a claim that
      # rests on an omission is not enforced. -nic none removes the default NIC entirely.
      #
      # It is checked from the other side too: the in-guest init asserts that no non-loopback
      # interface, no route and no configured resolver exists before it runs anything, so a
      # future edit that adds a NIC back fails inside the guest by name rather than silently
      # restoring the ability to reach the network. Belt and braces, because the two failures
      # look identical from outside and only one of them is visible in this file.
      #
      # THE ROOT DISK IS ON EMULATED AHCI, DELIBERATELY, AND NOT ON virtio-blk.
      #
      # This guest runs repository-controlled code as root, so QEMU is the boundary between that
      # code and the runner. Two published defects live specifically in QEMU's virtio-blk device
      # model: CVE-2024-8612, a bounce-buffer HOST-memory disclosure, and CVE-2026-48914, an
      # out-of-bounds write in the QEMU host heap reachable from a privileged guest and unfixed
      # through QEMU 11.0.1. There is no version to move to for the second, so the answer is not
      # a bump - it is to not instantiate the device model at all. `-drive ...,if=none` attaches
      # the image as a backend with no front-end of its own, and the two `-device` lines put it
      # behind an emulated AHCI controller (ICH9 SATA, PCI 8086:2922) as a single ide-hd. That is
      # a different QEMU code path, exercised by every stock cloud image, and it reaches the
      # guest as an ordinary SCSI disk - hence `root=/dev/sda`, major 8, rather than /dev/vda.
      #
      # BOTH SIDES MUST AGREE, so both sides are asserted. The kernel build --disable's
      # CONFIG_VIRTIO_BLK and refuses to proceed if it resolved any other way, so a half-revert
      # that restores `if=virtio` here without restoring the driver fails at mount instead of
      # quietly re-enabling the vulnerable path, and one that restores the driver without the
      # boot line fails by name in the configuration record. The console assertion below closes
      # the loop from the third direction: it requires the kernel's own "VFS: Mounted root ... on
      # device 8:0." line, which virtio-blk can never produce because virtblk registers a
      # DYNAMIC block major. CONFIG_VIRTIO and CONFIG_VIRTIO_PCI stay enabled - they cost
      # nothing, this invocation instantiates no virtio device whatsoever, and removing them
      # would be a change to the guest's transport stack rather than to its block stack.
      #
      # THE QEMU PROCESS ITSELF IS CONFINED. -sandbox on with obsolete, elevateprivileges, spawn
      # and resourcecontrol all denied installs a seccomp filter around the emulator, which is
      # what bounds the host-side reach of anything that does escape the guest - CVE-2026-48914
      # included. All four denials are safe for THIS invocation and that was checked rather than
      # assumed: it uses no obsolete syscall-backed feature, it does not use -runas or any other
      # privilege drop (so denying setuid/setgid removes nothing it does), it spawns no helper
      # process (no -netdev with a helper, no -drive with a filter binary, no migration exec), and
      # it does not set affinity or scheduling priority. The pinned build's ability to install
      # that filter is PROVEN before this step, not hoped for: the "Record and gate the QEMU
      # virtualization boundary" step probes the exact option string against a real emulator
      # start, includes a negative control so a QEMU that ignores unknown sandbox keys cannot
      # pass, and writes the verdict into tools/qemu-boundary.txt with the version it belongs to.
      #
      # THE PIPELINE'S STATUS IS CAPTURED, NOT LOST. This step's own `set -uo pipefail` does not
      # turn errexit OFF, and GitHub's default step shell is `bash -e {0}`, so errexit is
      # INHERITED here. Combined with pipefail that meant a qemu failure aborted the step AT the
      # pipeline: the ${PIPESTATUS[0]} read on the next line, the timeout/killed distinction and
      # every message below were unreachable in exactly the case they exist for, and all the log
      # showed was a bare non-zero step. The trailing `set -e` was the tell - it restores
      # something nothing had disabled.
      #
      # So errexit is disabled around the PIPELINE ONLY, both elements of PIPESTATUS are copied
      # in the very next command (PIPESTATUS is rewritten by the next command executed, and
      # `set -e` is a command), errexit is restored, and qemu and tee are then classified
      # SEPARATELY. That separation matters: a tee failure means the console log is truncated,
      # and the console log is the only place the BINDER PLATFORM RECORD, the protocol agreement
      # verdict and the branch-arm gate's output exist - so it is reported on its own account
      # rather than attributed to the guest, which did nothing wrong.
      - name: Boot the guest and run the invocation matrix
        run: |
          set -uo pipefail
          mkdir -p -- "$(dirname -- "$GUEST_CONSOLE_LOG")"

          # THE SAME DESCRIPTOR CUSTODY AS THE BUILD STEP, because GitHub steps share no shell
          # state: the descriptor that pinned the publication directory closed when that step's
          # shell exited, and $GUEST_IMAGE is resolved afresh here. The full reasoning is in the
          # "Build the guest root image" step; this is the same block with the image alone.
          publish_dir="$(dirname -- "$GUEST_IMAGE")"
          image_leaf="$(basename -- "$GUEST_IMAGE")"
          lock_leaf="$image_leaf.lock"
          if [ -L "$publish_dir" ]; then
            echo "::error::the publication directory $publish_dir is a symbolic link. Refused rather than followed."
            exit 1
          fi
          exec 8< "$publish_dir" || { echo "::error::the publication directory $publish_dir could not be opened."; exit 1; }
          dir_fd="/proc/$$/fd/8"
          dir_type="$(stat -L -c '%F' -- "$dir_fd")"
          dir_owner="$(stat -L -c '%u' -- "$dir_fd")"
          dir_device="$(stat -L -c '%d' -- "$dir_fd")"
          [ "$dir_type" = 'directory' ] || { echo "::error::the descriptor opened on $publish_dir refers to a '$dir_type' rather than a directory."; exit 1; }
          [ "$dir_owner" = '0' ] || { echo "::error::the descriptor opened on $publish_dir refers to a directory owned by uid $dir_owner rather than root. The published pair may have been substituted since the build step; this job will not boot it."; exit 1; }
          if [ -L "$dir_fd/$image_leaf" ]; then
            echo "::error::$GUEST_IMAGE is a symbolic link rather than the published image. Refused rather than followed."
            exit 1
          fi
          [ -f "$dir_fd/$image_leaf" ] || { echo "::error::there is no regular file at $GUEST_IMAGE, so there is nothing to boot."; exit 1; }
          image_device="$(stat -c '%d' -- "$dir_fd/$image_leaf")"
          [ "$image_device" = "$dir_device" ] || { echo "::error::$GUEST_IMAGE is on device $image_device while its own directory is on device $dir_device; refused."; exit 1; }
          image_fd_path="$dir_fd/$image_leaf"

          # THE PUBLICATION LOCK, SHARED, HELD FOR THE WHOLE OF THIS READ.
          #
          # The image and its manifest are published by four independent same-directory renames.
          # Each LEAF is replaced atomically, but the PAIR is not: between the image's rename and
          # the manifest's there is a real window in which a reader that holds no lock sees the
          # new image beside the old manifest. aidl-path-tests-rootfs.sh says so in full under
          # "WHAT 'ATOMIC' MEANS HERE, EXACTLY", and the consistency of the pair is delivered by
          # this lock rather than by the renames. The builder holds it exclusively for its whole
          # run and chmods it 0644 so this unprivileged step can open it read-only; flock on Linux
          # needs no write access, so read-only is enough.
          #
          # A timeout rather than a block: a lock still held here means a builder is running
          # against the same output, which is a workflow-level mistake this step reports rather
          # than waits out.
          [ -f "$dir_fd/$lock_leaf" ] || { echo "::error::the publication lock file $publish_dir/$lock_leaf is missing, so this step cannot read the published pair under the lock that makes the pair consistent. The builder creates and leaves it deliberately; its absence means something removed it."; exit 1; }
          exec 7< "$dir_fd/$lock_leaf" || { echo "::error::the publication lock file $publish_dir/$lock_leaf could not be opened read-only."; exit 1; }
          if ! flock --shared --timeout 120 7; then
            echo "::error::the publication lock on $publish_dir/$lock_leaf is still held exclusively after 120s, which means a root-image build is publishing into this directory right now. Booting while the pair is mid-swap would read a new image beside an old manifest; this step stops instead."
            exit 1
          fi
          echo "publication lock : shared, held for this step's read of the pair"

          echo "kernel  : $GUEST_KERNEL_IMAGE"
          echo "image   : $GUEST_IMAGE"
          echo "  read through the publication directory descriptor as $image_fd_path"
          echo "init    : $GUEST_INIT_PATH"
          echo "timeout : ${QEMU_TIMEOUT_SECONDS}s (backstop only; the guest powers itself down)"

          set +e
          timeout --kill-after=120 "$QEMU_TIMEOUT_SECONDS" \
            qemu-system-i386 \
              -sandbox "$QEMU_SANDBOX_OPTIONS" \
              -machine pc,accel=tcg \
              -cpu max -smp 2 -m 2048 \
              -kernel "$GUEST_KERNEL_IMAGE" \
              -drive file="$image_fd_path",format=raw,if=none,id=root0,cache=writeback \
              -device ahci,id=ahci0 \
              -device ide-hd,drive=root0,bus=ahci0.0 \
              -append "root=/dev/sda rw init=$GUEST_INIT_PATH console=ttyS0,115200 panic=-1" \
              -nic none \
              -display none -monitor none -serial stdio -no-reboot \
              < /dev/null 2>&1 | tee "$GUEST_CONSOLE_LOG"
          pipe_status=( "${PIPESTATUS[@]}" )
          set -e

          qemu_status="${pipe_status[0]-1}"
          tee_status="${pipe_status[1]-1}"
          echo "qemu exit status: $qemu_status"
          echo "tee  exit status: $tee_status"

          rc=0
          # THE GUEST FIRST, because when both failed the guest is the interesting one.
          if [ "$qemu_status" -eq 124 ] || [ "$qemu_status" -eq 137 ]; then
            echo "::error::the guest did not power itself down within ${QEMU_TIMEOUT_SECONDS}s and was killed (timeout reported $qemu_status). Under TCG emulation the in-guest build, the five invocations and the coverage capture are slow; read the console log for how far it got. Whatever the guest managed to write is still extracted and uploaded by the steps below."
            rc=1
          elif [ "$qemu_status" -ne 0 ]; then
            echo "::error::qemu exited $qemu_status. The guest's own verdict, if it produced one, is read from $GUEST_STATUS_FILE by the step below; this failure is about the boot itself."
            rc=1
          fi

          # THE LOG SECOND, AND ON ITS OWN ACCOUNT. tee failing - a full disk, most likely -
          # means the console log this job uploads is incomplete, so the evidence is missing
          # even if the guest ran perfectly. Reporting it as a guest failure would send the
          # reader to the wrong place.
          if [ "$tee_status" -ne 0 ]; then
            echo "::error::tee exited $tee_status, so $GUEST_CONSOLE_LOG is incomplete or was not written. That log is the ONLY place the BINDER PLATFORM RECORD, the protocol agreement verdict and the branch-arm gate's output exist, so a truncated one is a failure of this job's evidence regardless of how the guest fared. Check free space on the runner: df -h."
            rc=1
          fi

          # THE ROOT DEVICE THIRD, READ OUT OF THE GUEST'S OWN CONSOLE.
          #
          # The boot line above attaches the image to an emulated AHCI controller rather than to
          # QEMU's virtio-blk device model, because that device model carries CVE-2024-8612 (host
          # memory disclosure) and CVE-2026-48914 (out-of-bounds write in the QEMU host heap,
          # with no fixed release through 11.0.1). Two of the three sides of that decision are
          # already asserted: the kernel build refuses a configuration in which CONFIG_VIRTIO_BLK
          # resolved to anything but unset, and the "Record and gate the QEMU virtualization
          # boundary" step records the device topology it expects. This is the third side, and
          # the only one that speaks for the RUN rather than for its inputs.
          #
          # THE DISCRIMINATOR IS THE BLOCK MAJOR, NOT THE DEVICE NAME. init/do_mounts.c prints
          # "VFS: Mounted root (<fs> filesystem) on device <major>:<minor>." from the numbers the
          # kernel actually mounted. sd devices are major 8 (SCSI_DISK0_MAJOR in
          # include/uapi/linux/major.h), a fixed constant; virtio_blk takes its major from
          # register_blkdev(0, "virtblk"), which is a DYNAMIC allocation and can never be 8. So a
          # log carrying "on device 8:0." proves the root filesystem came up on the libata/AHCI
          # path, and no rename or symlink inside the guest can forge it. A boot on the wrong
          # device model is therefore a named failure here rather than a silent success that
          # re-instantiates the vulnerable code.
          #
          # It is checked only when there is a log to check: when tee failed, the absence of the
          # line says nothing about the guest, and reporting it as a root-device fault would send
          # the reader to the wrong place. That case is already a failure on tee's own account.
          if [ "$tee_status" -eq 0 ] && [ -s "$GUEST_CONSOLE_LOG" ]; then
            mounted_root="$(grep -E 'VFS: Mounted root \(.*\) on device [0-9]+:[0-9]+\.' -- "$GUEST_CONSOLE_LOG" | tail -n 1 || true)"
            if [ -z "$mounted_root" ]; then
              echo "::error::the guest console log carries no 'VFS: Mounted root (...) on device <major>:<minor>.' line, so this job cannot establish which block driver the root filesystem came up on. That line is the kernel's own report and it is printed on every successful root mount, so its absence means either the guest never mounted a root filesystem - read the log for the panic - or the console capture began too late. Do not treat a green matrix without this line as evidence: the AHCI root device is a security decision (CVE-2024-8612, CVE-2026-48914) and it is only established by being measured."
              rc=1
            else
              echo "root device     : $mounted_root"
              case "$mounted_root" in
                *'on device 8:0.')
                  echo "  ^ major 8 is SCSI_DISK0_MAJOR, so the root filesystem came up on the"
                  echo "    libata/AHCI path this job boots deliberately. virtio_blk registers a"
                  echo "    DYNAMIC major (register_blkdev(0, \"virtblk\")) and can never be 8,"
                  echo "    which is what makes this line decisive rather than merely consistent."
                  ;;
                *)
                  echo "::error::the guest mounted its root filesystem on a device other than major 8 minor 0: '$mounted_root'. This job attaches the image to an emulated AHCI controller ON PURPOSE, because QEMU's virtio-blk device model carries CVE-2024-8612 (host memory disclosure through the bounce buffer) and CVE-2026-48914 (out-of-bounds write in the QEMU host heap, unfixed through 11.0.1), and a guest that booted from something else means the -drive/-device topology, the kernel's block configuration or the root= argument has been changed away from that decision. Establish which of the three moved and restore the agreement rather than relaxing this check."
                  rc=1
                  ;;
              esac
            fi

            # THE NEGATIVE HALF, kept narrow so it cannot fire on unrelated text. These three
            # tokens exist in a console log only if the virtio block path was actually restored:
            # the driver's own name as the kernel prints it when it probes, and the root=
            # argument as the kernel echoes it back on two separate lines.
            virtio_evidence="$(grep -nE 'virtio_blk|virtblk|root=/dev/vd' -- "$GUEST_CONSOLE_LOG" | head -n 5 || true)"
            if [ -n "$virtio_evidence" ]; then
              echo "::error::the guest console log contains evidence that the virtio block path was used, which this job deliberately does not instantiate (CVE-2024-8612, CVE-2026-48914 - the second has no fixed QEMU release through 11.0.1). First matches follow; correct the boot line, the kernel configuration and root= together rather than removing this check."
              printf '%s\n' "$virtio_evidence"
              rc=1
            fi

            # AND THE COMMAND LINE THE KERNEL ITSELF RECEIVED, which is the one place a wrong
            # root= shows up even on a boot that then failed before mounting anything.
            if ! grep -qE 'Kernel command line: (.* )?root=/dev/sda( |$)' -- "$GUEST_CONSOLE_LOG"; then
              echo "::error::the guest console log does not show the kernel receiving 'root=/dev/sda' on its command line. The -append above passes it, so a log without it means either the append was changed or the log is missing the kernel's early output. root=/dev/sda is the AHCI/libata node that pairs with this job's -device ahci/-device ide-hd topology; /dev/vda would mean the virtio-blk device model was re-instantiated."
              rc=1
            fi
          fi

          [ "$rc" -eq 0 ] || exit "$rc"

      # Read the results back out of the image. The guest's init forces the power-off from its
      # trap, so the filesystem can carry a journal that has not been replayed - which is
      # exactly why the image is ext4 WITH journalling rather than without. A read-only mount is
      # attempted first; when the kernel needs to recover the journal before it will show the
      # files, the fallback mounts writably so the evidence is complete rather than plausible.
      - name: Extract the coverage artifacts from the image
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f "$GUEST_IMAGE" ]; then
            echo "::error::there is no guest image at $GUEST_IMAGE, so no results can be extracted. An earlier step failed before the image was built."
            exit 1
          fi
          mkdir -p -- "$EXTRACTED_ARTIFACTS"
          # ROOT-OWNED, like every other child of the root-owned qemu-work: root mounts the guest
          # image on it, and a mount point whose owner is the runner can be renamed away between
          # this step's `install -d` and the `mount` that follows.
          sudo install -d -o root -g root -m 0755 -- "$WORK_DIR/mnt"

          # THE SAME DESCRIPTOR CUSTODY AND THE SAME SHARED LOCK AS THE BOOT STEP; the reasoning
          # is in the "Build the guest root image" and "Boot the guest" steps. It matters more
          # here than anywhere else in this job: `losetup` attaches a block device to whatever the
          # path resolves to, as root, and everything read out of the image afterwards comes from
          # that device.
          publish_dir="$(dirname -- "$GUEST_IMAGE")"
          image_leaf="$(basename -- "$GUEST_IMAGE")"
          lock_leaf="$image_leaf.lock"
          if [ -L "$publish_dir" ]; then
            echo "::error::the publication directory $publish_dir is a symbolic link. Refused rather than followed."
            exit 1
          fi
          exec 8< "$publish_dir"
          dir_fd="/proc/$$/fd/8"
          dir_type="$(stat -L -c '%F' -- "$dir_fd")"
          dir_owner="$(stat -L -c '%u' -- "$dir_fd")"
          dir_device="$(stat -L -c '%d' -- "$dir_fd")"
          [ "$dir_type" = 'directory' ] || { echo "::error::the descriptor opened on $publish_dir refers to a '$dir_type' rather than a directory."; exit 1; }
          [ "$dir_owner" = '0' ] || { echo "::error::the descriptor opened on $publish_dir refers to a directory owned by uid $dir_owner rather than root. No loop device is attached through it."; exit 1; }
          if [ -L "$dir_fd/$image_leaf" ]; then
            echo "::error::$GUEST_IMAGE is a symbolic link rather than the published image. Refused rather than attached."
            exit 1
          fi
          [ -f "$dir_fd/$image_leaf" ] || { echo "::error::there is no regular file at $GUEST_IMAGE, so no results can be extracted."; exit 1; }
          image_device="$(stat -c '%d' -- "$dir_fd/$image_leaf")"
          [ "$image_device" = "$dir_device" ] || { echo "::error::$GUEST_IMAGE is on device $image_device while its own directory is on device $dir_device; refused."; exit 1; }
          image_fd_path="$dir_fd/$image_leaf"

          [ -f "$dir_fd/$lock_leaf" ] || { echo "::error::the publication lock file $publish_dir/$lock_leaf is missing, so this step cannot read the published pair under the lock that makes it consistent."; exit 1; }
          exec 7< "$dir_fd/$lock_leaf"
          if ! flock --shared --timeout 120 7; then
            echo "::error::the publication lock on $publish_dir/$lock_leaf is still held exclusively after 120s, so a root-image build is publishing into this directory right now. Extracting from a pair that is mid-swap would read results out of the wrong generation; this step stops instead."
            exit 1
          fi
          echo "publication lock : shared, held for this step's read of the pair"

          loop="$(sudo losetup --find --show -- "$image_fd_path")"
          echo "IMAGE_LOOP_DEVICE=$loop" >> "$GITHUB_ENV"
          echo "IMAGE_MOUNT_POINT=$WORK_DIR/mnt" >> "$GITHUB_ENV"

          # THE PATH THE KERNEL ITSELF RECORDED for the attachment, exported so the teardown
          # identifies the device by what the kernel says backs it rather than by what this step
          # believes it asked for. Measured on this platform: attaching through
          # /proc/<pid>/fd/<n>/<leaf> makes the kernel record the leaf's REAL path, because the
          # magic-link walk lands on the real dentry -- so this value normally equals $GUEST_IMAGE
          # and the teardown's existing match keeps working. It is exported anyway, and the
          # teardown matches on BOTH, so a kernel that recorded the descriptor path instead would
          # not silently leave a loop device attached.
          loop_backing_file="/sys/block/$(basename -- "$loop")/loop/backing_file"
          if [ -r "$loop_backing_file" ]; then
            loop_backing="$(cat -- "$loop_backing_file")"
            loop_backing="${loop_backing% (deleted)}"
            echo "IMAGE_LOOP_BACKING=$loop_backing" >> "$GITHUB_ENV"
            echo "loop device      : $loop backing $loop_backing"
          else
            echo "::warning::$loop_backing_file is not readable, so the teardown cannot be told what the kernel recorded as this device's backing file. It will fall back to matching on $GUEST_IMAGE alone."
          fi

          if sudo mount -o ro -- "$loop" "$WORK_DIR/mnt"; then
            echo "mounted read-only"
          else
            echo "a read-only mount was refused, which means the journal needs replaying after the guest's forced power-off; mounting writably to recover it"
            sudo mount -- "$loop" "$WORK_DIR/mnt"
          fi

          source_dir="$WORK_DIR/mnt${GUEST_ARTIFACT_DIR}"
          if [ ! -d "$source_dir" ]; then
            echo "::error::the guest wrote no artifact directory at ${GUEST_ARTIFACT_DIR}. It never reached run_coverage.sh - read the console log for the reason, which is most often binderfs or servicemanager."
            exit 1
          fi
          sudo cp -a -- "$source_dir/." "$EXTRACTED_ARTIFACTS/"
          sudo chown -R -- "$(id -u):$(id -g)" "$EXTRACTED_ARTIFACTS"
          chmod -R u+rwX -- "$EXTRACTED_ARTIFACTS"

          echo "--- extracted ---"
          ls -l "$EXTRACTED_ARTIFACTS"
          status_basename="$(basename -- "$GUEST_STATUS_FILE")"
          if [ ! -f "$EXTRACTED_ARTIFACTS/$status_basename" ]; then
            echo "::error::the guest produced artifacts but no status file at ${GUEST_STATUS_FILE}. Without it there is no verdict, and an incomplete run must not be read as a passing one."
            exit 1
          fi
          echo "COVERAGE_STATUS_FILE=$EXTRACTED_ARTIFACTS/$status_basename" >> "$GITHUB_ENV"

      # THE VERDICT, AND IT IS NOT LAUNDERED.
      #
      # The number in the status file is run_coverage.sh's own exit status, written by the guest
      # without alteration. Only 0 means the suite was run by that invocation, was green, and
      # line coverage met the bar. There is no "|| true" here, no continue-on-error on this
      # step, and no special case that lets 3 through. This step runs under `set -euo pipefail`
      # and compares the status bare: the file's one `set +e` is bounded to the qemu|tee pipeline
      # in the boot step, where it CAPTURES two statuses that a pipeline would otherwise hide,
      # and it does not reach the verdict.
      - name: Evaluate the coverage run verdict
        if: always()
        run: |
          set -euo pipefail
          if [ -z "${COVERAGE_STATUS_FILE:-}" ] || [ ! -f "${COVERAGE_STATUS_FILE:-}" ]; then
            echo "::error::no status file was extracted, so this run has no verdict. An earlier step failed before the guest wrote one; a missing verdict is a failure, never a pass."
            exit 1
          fi
          status="$(head -n 1 -- "$COVERAGE_STATUS_FILE" | tr -d '[:space:]')"
          echo "run_coverage.sh exit status: ${status:-<empty>}"

          case "$status" in
            0)
              echo "ACCEPTANCE: the five-invocation matrix ran, it was green, and line coverage met the bar."
              echo "The per-invocation results, the unfiltered trace, the line gate's derivative and the"
              echo "branch-arm gate's own output are in the uploaded artifacts and in the console log."
              ;;
            3)
              echo "::error::run_coverage.sh exited 3, which is ADVISORY AND IS NOT A PASS. The figures met the bar but something reduced this run to measuring what it did not establish, and the COVERAGE ADVISORY block in the console log names every reason it recorded - read that first, because it is the diagnosis rather than a hint. The likely one for this job is a DEFERRED INVOCATION: if the guest's binder transport did not come up, invocations B, C and E do not run, which also leaves 13 of the 168 required branch arms unmeasured (11 need invocation B, one needs invocation C, and one needs a usable binder driver with no service registered on it) - the branch-arm gate lists each by name with the prerequisite it needed and prints its own census, and the other 155 required arms are enforced on this run whatever the transport did. Cross-read the BINDER PLATFORM RECORD in the console log for binderfs, the device nodes, the protocol agreement and servicemanager. The other advisory sources are a weakened gate (COVERAGE_MIN other than 80, --no-per-file-gate, COVERAGE_GATE_EXEMPT_FILES, GTEST_EXTRA_ARGS, or a capture without --run - this job sets none of them), an unclassified dependency-header record in the line gate's trace, and a BRANCH_MANIFEST entry added without its measured line, block and branch coordinates. None of them is fixed by treating this status as a pass."
              exit 1
              ;;
            1)
              echo "::error::run_coverage.sh exited 1: a prerequisite was missing, a step failed, an invocation was not green, or the coverage gate failed. The console log carries the per-invocation output and the gate's own diagnosis; the uploaded artifacts carry the per-invocation results, the per-file table and the uncovered-line list."
              exit 1
              ;;
            *)
              echo "::error::run_coverage.sh exited '${status:-<empty>}', which is neither an acceptance nor a documented advisory. Treat it as a failure and read the console log."
              exit 1
              ;;
          esac

      # THE COMPLETENESS GATE FOR THE THREE UPLOADS BELOW, AND IT IS NOT REDUNDANT WITH THEIR
      # `if-no-files-found: error`.
      #
      # WHAT THAT SETTING DOES AND DOES NOT DO, measured against the pinned
      # actions/upload-artifact commit this job uses: it fails only when the WHOLE discovered
      # set is empty, because its implementation tests `filesToUpload.length === 0`. Two of the
      # three uploads below discover a set rather than a file - one names a DIRECTORY
      # (coverage-artifacts/) and one AGGREGATES six paths into a single multiline `path:` - so
      # deleting a mandatory member of either leaves the set non-empty and the upload passes.
      # That was reproduced on this action at this pin: with the required
      # rdkTestResults_invocation_E.json removed the coverage upload still discovered 16 files
      # and succeeded, and with the mandatory kernel configuration removed the provisioning
      # upload still discovered five and succeeded. This job's ENTIRE PURPOSE is to be the
      # evidence that invocations A through E ran on a binder-capable guest, so an upload that
      # publishes fifteen of sixteen members as a green run is worse than no upload: a later
      # reader has an artifact bundle that looks authoritative and is missing the member their
      # question turns on. Hence an explicit gate over the named set, which is the only place
      # the required set is written down as a list.
      #
      # WHY IT SITS HERE, IMMEDIATELY BEFORE THE UPLOADS, AND WHY MOVING IT AFTER THEM WOULD BE
      # A REGRESSION. All three uploads below are `if: always()`, so a failure in THIS step does
      # not skip any of them: the evidence that does exist is still attached to the run, still
      # downloadable, and still the thing a reader needs in order to diagnose what is missing -
      # while the job itself correctly fails. Put this step after the uploads instead and it
      # still fails the job, but a reader loses nothing here and gains nothing either; put it
      # before them WITHOUT `if: always()` on the uploads and a missing member would suppress
      # the very artifacts that explain it. The ordering is the whole point, so it is stated
      # rather than left to be rediscovered.
      #
      # UNCONDITIONAL, AND NOT KEYED TO THE VERDICT. It does not ask whether the verdict step
      # passed, because a set that is incomplete must be impossible to publish as a success
      # whatever the verdict said - and because when an earlier step failed, the list of missing
      # members is the cheapest description of how far the run got. The five letters A through E
      # are the full matrix and every one of them is mandatory on this job: a run whose guest
      # deferred B, C or E has already failed at the verdict step above, and this gate failing
      # beside it names which artifacts are absent, which is additional information rather than
      # a duplicate complaint.
      #
      # EVERY PATH BELOW COMES FROM THE JOB-LEVEL `env:` BLOCK OR FROM THE RUNNER'S OWN
      # $GITHUB_WORKSPACE. No `${{ }}` is interpolated into this body, which is this file's rule
      # without exception. The image manifest is derived from $GUEST_IMAGE and the kernel
      # configuration is $GUEST_KERNEL_CONFIG rather than being re-spelled as literals, because
      # a second spelling of a path that is already a job-level value is a second source of
      # truth and it will drift from the first.
      - name: Assert every mandatory artifact is present before uploading
        if: always()
        run: |
          set -euo pipefail
          rc=0
          checked=0

          # ONE CHECK PER MANDATORY PATH, AND IT NEVER STOPS AT THE FIRST FAILURE. `rc` is
          # accumulated exactly as the other multi-assertion steps in this file accumulate it,
          # so a run that is missing three artifacts names all three in one go. A gate that
          # reported only the first would make a reader re-run a 350-minute job to discover the
          # second.
          #
          # THE SYMBOLIC-LINK ARM IS FIRST, in the same style and for the same reason as the
          # extract and boot steps: this step reads the very paths those steps published, under
          # a workspace whose root is owned by the runner account, and `-f`/`-s` both FOLLOW a
          # link - so a link substituted at one of these names would otherwise be reported as
          # a present, non-empty artifact while the bytes uploaded came from wherever it
          # pointed. Refused rather than followed, and named.
          require_artifact() {
            local path="$1" why="$2" empty_policy="${3:-must-not-be-empty}"
            if [ -L "$path" ]; then
              echo "::error::the mandatory artifact $path is a symbolic link rather than the artifact itself ($why). Refused rather than followed: the uploads below would publish whatever it points at under this name. Find what created the link - nothing in this job does - and remove it; the producing step must write a regular file at this exact path."
              rc=1
              return 0
            fi
            if [ ! -f "$path" ]; then
              echo "::error::the mandatory artifact $path is MISSING ($why). It is required evidence for this job and the uploads below cannot be allowed to publish a set without it."
              rc=1
              return 0
            fi
            # THE NON-EMPTY RULE, AND THE ONE ARTIFACT EXEMPT FROM IT. A zero-byte coverage.info
            # or a zero-byte per-invocation result is not evidence - it is a file whose producer
            # was interrupted - so presence alone is not enough for anything except the artifact
            # whose CONTENT is a report of absences; see uncovered_lines.txt below.
            if [ "$empty_policy" != 'may-be-empty' ] && [ ! -s "$path" ]; then
              echo "::error::the mandatory artifact $path is present but ZERO BYTES ($why). An empty file is not evidence: its producer was interrupted between creating it and writing it, so treat this as a truncated run rather than a complete one and read the console log at the point this artifact was due."
              rc=1
              return 0
            fi
            printf '  ok  %10s bytes  %s\n' "$(stat -Lc '%s' -- "$path")" "$path"
            checked=$((checked + 1))
          }

          echo "--- the coverage set, all under $EXTRACTED_ARTIFACTS ---"
          # THESE NAMES ARE FIXED BY run_coverage.sh, not by this workflow: only the directory
          # is overridable, and the guest is given --output-dir with the artifact directory the
          # image builder created. They are listed individually here precisely because the
          # upload names the directory.
          require_artifact "$EXTRACTED_ARTIFACTS/run_coverage.status" \
            "the guest's verbatim run_coverage.sh exit status, which is what the verdict step above read"
          require_artifact "$EXTRACTED_ARTIFACTS/coverage.info" \
            "the UNFILTERED trace, which is what the branch-arm gate reads and what its manifest coordinates are re-derived from"
          require_artifact "$EXTRACTED_ARTIFACTS/filtered_coverage.info" \
            "the filtered derivative of the trace"
          require_artifact "$EXTRACTED_ARTIFACTS/line_gate_coverage.info" \
            "the line gate's own input, the trace with the dependency headers removed"
          require_artifact "$EXTRACTED_ARTIFACTS/per_file_coverage.tsv" \
            "the per-file LINE/FUNCTION/BRANCH table the per-file gate is read from"
          # THE ONE EXEMPTION FROM THE NON-EMPTY RULE, and it is deliberate rather than an
          # oversight: this file enumerates the source lines that were never executed, so a run
          # that leaves nothing uncovered legitimately has nothing to enumerate. Its presence is
          # required - its absence means the report was never produced - but its emptiness is a
          # complete answer, not a truncated one.
          require_artifact "$EXTRACTED_ARTIFACTS/uncovered_lines.txt" \
            "the uncovered-line enumeration; empty is a legitimate result when nothing is uncovered" \
            may-be-empty
          require_artifact "$EXTRACTED_ARTIFACTS/coverage/index.html" \
            "the HTML report's entry point - the guest runs the coverage runner without --no-html, so the report is produced"
          # ALL FIVE INVOCATIONS, EACH AS TWO ARTIFACTS. A through E is the full matrix and none
          # of the five is optional on this job; this loop is what makes "invocation E was
          # deferred" impossible to publish as a complete evidence set.
          for label in A B C D E; do
            require_artifact "$EXTRACTED_ARTIFACTS/rdkTestResults_invocation_${label}.json" \
              "invocation $label's machine-readable result"
            require_artifact "$EXTRACTED_ARTIFACTS/run_invocation_${label}.log" \
              "invocation $label's own output, including its selected-back-end line"
          done

          echo "--- the console log ---"
          # CHECKED HERE TOO, even though its own upload names a single file and is therefore
          # already fail-closed. This step is the single place a reader can see the whole
          # required set written out; a list that silently omits a member because some other
          # mechanism happens to cover it is a list that will be read as complete when it is
          # not, and one duplicated check costs a stat.
          require_artifact "$GUEST_CONSOLE_LOG" \
            "the only place the BINDER PLATFORM RECORD, the protocol agreement verdict and the branch-arm gate's output exist"

          echo "--- the provisioning records ---"
          require_artifact "$GUEST_IMAGE.manifest" \
            "the published root image's manifest, derived from GUEST_IMAGE rather than re-spelled"
          require_artifact "$GUEST_KERNEL_CONFIG" \
            "the kernel configuration that was actually built, which is where a reader checks the binder options and the protocol"
          require_artifact "$GITHUB_WORKSPACE/tools/supply-chain-pins.txt" \
            "the resolved pins that fix WHICH source was compiled"
          require_artifact "$GITHUB_WORKSPACE/tools/apt-packages.txt" \
            "the runner's resolved package set - exact binary and source versions of everything installed, plus the minimum-version gate's verdicts and the recorded residuals - without which the toolchain a run used cannot be audited after the fact"
          require_artifact "$GITHUB_WORKSPACE/tools/qemu-boundary.txt" \
            "the virtualization boundary's own record: the emulator version that was gated, its seccomp verdict and the root device model, without which the guest's isolation is claimed rather than measured"
          require_artifact "$GITHUB_WORKSPACE/tools/i386-protocol7-toolchain.cmake" \
            "one of the two records that fix the wire protocol on the userspace side"
          require_artifact "$GITHUB_WORKSPACE/tools/i386-binder-CMakeCache.txt" \
            "the other userspace protocol record, the Binder SDK's own resolved cache"
          require_artifact "$GITHUB_WORKSPACE/kernel-src/binder-ipc32-restore.patch" \
            "the patch that makes protocol 7 reachable at all, uploaded so the applied bytes can be inspected"

          if [ "$rc" -ne 0 ]; then
            # TWO DIAGNOSES, AND A READER NEEDS TO KNOW WHICH ONE THEY ARE IN before they chase
            # any individual name above.
            echo "::error::the mandatory artifact set is INCOMPLETE and every missing, empty or substituted member is named above. Read it one of two ways. If an EARLIER step in this job already failed, THAT failure is the primary one and these absences are its consequence - the guest never got as far as producing them - so read the first ::error:: in this log and fix that, not this list. If every earlier step passed, then this run LOOKS complete and is not: the named member is what to chase, in the console log around the point it was due and in run_coverage.sh's own output for the invocation it belongs to. Either way this job does not publish a partial evidence set as a success. The three uploads below still run, because they are if: always() as well, so whatever evidence DOES exist is attached to this run and can be downloaded while this is diagnosed."
          fi
          [ "$rc" -eq 0 ] || exit 1

          echo "artifact completeness: all $checked mandatory artifacts are present, are regular files, and carry bytes - with uncovered_lines.txt exempt from the last of those for the reason recorded above."

      # THE CONSOLE LOG IS EVIDENCE, NOT A CONVENIENCE. It is the only place the BINDER PLATFORM
      # RECORD exists - the kernel binder configuration the guest read from itself, the SDK
      # build flags read from the staging tree, and the protocol version read from /dev/binder,
      # printed as one block because they are meaningful only together. It is also where
      # run_coverage.sh's per-invocation output and THE BRANCH-ARM GATE'S OWN RESULT appear,
      # because the gate writes to stdout and its manifest lives inside the script rather than
      # in a separate checked-in file. So this upload is the gate's result, alongside the trace.
      - name: Upload the guest console log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 (v7.0.1)
        with:
          name: guest-console-aidl-path-tests
          path: qemu-work/host/guest-console.log
          if-no-files-found: error

      # Uploaded WHOLESALE rather than by enumerating names. The artifact FILE NAMES inside are
      # fixed by run_coverage.sh and only the directory is overridable, so naming individual
      # files here would invent paths and risk uploading nothing. This one directory carries
      # coverage.info (the UNFILTERED trace the branch-arm gate reads, and the trace its
      # already-populated manifest coordinates are RE-derived from whenever a mapped source file
      # changes), filtered_coverage.info,
      # line_gate_coverage.info (the line gate's input), the HTML report, per_file_coverage.tsv,
      # uncovered_lines.txt, and the per-invocation rdkTestResults_invocation_<L>.json and
      # run_invocation_<L>.log for every one of A through E.
      - name: Upload the coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 (v7.0.1)
        with:
          name: coverage-aidl-path-tests
          path: coverage-artifacts/
          if-no-files-found: error

      # How the guest was provisioned, so a later reader can reproduce or dispute it: the image
      # manifest, the kernel configuration that was actually built, the resolved supply-chain
      # pins that fix WHICH SOURCE was compiled, the runner's full resolved package set with the
      # minimum-version gate's verdicts and its recorded residuals, the virtualization boundary's own record
      # (emulator version against its committed floor, the seccomp verdict and the root device
      # model), the two records that fix the wire protocol on
      # the userspace side, and the kernel patch that makes protocol 7 reachable at all. The patch is uploaded because it is the least conventional thing this
      # job does and the first thing a reader will want to inspect: it is generated from a
      # heredoc in this workflow, so the uploaded copy is exactly what was applied.
      #
      # FOUR OF THESE RECORD THE GUEST-MATCHED i386 BUILD CHROOT, which is the second least
      # conventional thing this job does and is where the staged libraries the guest loads are
      # now compiled. snapshot-Release fixes the archive state both the chroot and the guest
      # were debootstrapped from - one resolution, so one file answers for both.
      # guest-defined-symbol-versions.txt is the measured ceiling the staged-artefact gate
      # compares against, so a reader can see WHAT was enforced rather than only that something
      # was. The two generated scripts are uploaded for the same reason as the kernel patch: they
      # are written from heredocs in this workflow, so the uploaded copies are exactly what ran.
      # The compiler family that built the staged artefacts is recorded separately, in the image
      # manifest and in the guest's own SDK build-flags record.
      - name: Upload the provisioning records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7 (v7.0.1)
        with:
          name: provisioning-aidl-path-tests
          path: |
            qemu-work/publish/cec-l2-rootfs.ext4.manifest
            qemu-work/host/kernel/config
            tools/supply-chain-pins.txt
            tools/apt-packages.txt
            tools/qemu-boundary.txt
            tools/i386-protocol7-toolchain.cmake
            tools/i386-binder-CMakeCache.txt
            tools/snapshot-Release
            tools/guest-defined-symbol-versions.txt
            tools/i386-build-chroot-run.sh
            tools/collect-guest-symbol-versions.sh
            kernel-src/binder-ipc32-restore.patch
          if-no-files-found: error

      # HOST-SIDE teardown, and it runs on every path so that a failing matrix still leaves the
      # runner clean and the artifacts above still retrievable. The GUEST's own teardown -
      # stopping servicemanager, unmounting binderfs and powering down - is in the init's trap
      # and has already run inside the guest by the time anything here executes. What is left
      # out here is the loop device and the mount this job created, released in reverse order.
      #
      # A CLEANUP FAILURE IS A FAILURE, so nothing here ends in "|| true" and the step does not
      # finish with a bare "exit 0". A run that could not release its mount or its loop device
      # and reported success would leave the runner in a state that breaks the NEXT job on it -
      # a self-hosted runner keeps its loop devices, and a still-mounted image is still-attached
      # storage - and the leak would be invisible, because a step that prints "unmounted ..."
      # and "detached ..." unconditionally says nothing about whether either happened. Cleanup
      # decides nothing about the test verdict, which is exactly why its own failure has to be
      # reported on its own account - nothing else in this job is looking at it.
      #
      # POSTCONDITIONS, NOT EXIT STATUSES. `umount` failing after a successful lazy unmount and
      # `losetup -d` failing on a device the kernel has already auto-cleared are both normal;
      # what matters is the state afterwards. So each command's status is used only to decide
      # whether to try the next remedy, and the verdict comes from three measured facts: the
      # mount point is no longer a mount point, NO loop device on this host still names our
      # image as its backing file, and the mount directory is gone.
      #
      # IDENTITY BEFORE ACTION. A loop device node is a host-wide resource. Between the extract
      # step and this one the recorded node can have been released and re-used by something
      # else, and `sudo losetup -d` on it would then pull the backing file out from under that
      # process's mounted image. So the devices to detach are found BY BACKING FILE rather than
      # taken from the recorded node name, and the recorded name is checked against its backing
      # file before it is believed. That also makes this step correct when the extract step
      # attached a device and then failed before recording it.
      #
      # PRESERVING THE PRIMARY FAILURE. Annotations accumulate and a job's conclusion is already
      # `failure` once any step has failed, so failing here cannot erase or replace an earlier
      # `::error::` - the verdict step's message stays first in the log and in the annotation
      # list. `job.status` is read only so that this step's own message can say which case it is
      # in; it never changes what this step does about a leak.
      #
      # The portable spellings matter and were measured: `losetup -d` takes the device WITHOUT a
      # preceding `--` (util-linux's option parsing for -d predates the convention and older
      # builds reject it), while `umount` and `mountpoint` accept `--` and are given it.
      - name: Tear down the host-side image mount
        if: always()
        env:
          # Read only, for the message; see PRESERVING THE PRIMARY FAILURE above. Delivered
          # through env rather than interpolated into the body, which is this file's rule for
          # every ${{ }} value without exception.
          JOB_STATUS_BEFORE_TEARDOWN: ${{ job.status }}
        run: |
          set -uo pipefail

          leaks=0
          leak() { echo "::error::$*"; leaks=$((leaks + 1)); }

          image="${GUEST_IMAGE:-}"
          mount_point="${IMAGE_MOUNT_POINT:-}"
          recorded_loop="${IMAGE_LOOP_DEVICE:-}"
          recorded_backing_path="${IMAGE_LOOP_BACKING:-}"
          echo "primary job status before teardown: ${JOB_STATUS_BEFORE_TEARDOWN:-unknown}"
          echo "image: ${image:-<none recorded>}"
          echo "mount point: ${mount_point:-<none recorded>}"
          echo "recorded loop device: ${recorded_loop:-<none recorded>}"
          echo "backing path the kernel recorded: ${recorded_backing_path:-<none recorded>}"

          # BOTH PATHS ARE CANDIDATES, and that is the whole reason IMAGE_LOOP_BACKING exists.
          #
          # The extraction step attaches the image through the publication directory's descriptor,
          # as /proc/<pid>/fd/<n>/<leaf>, so that no substitution can redirect a root `losetup`
          # between the check and the attach. Measured on this platform, the kernel records the
          # leaf's REAL pathname for such an attachment -- the magic-link walk lands on the real
          # dentry -- so /sys/block/loopN/loop/backing_file normally holds exactly $GUEST_IMAGE
          # and matching on that alone would work. THAT IS AN OBSERVED PROPERTY OF THIS KERNEL,
          # NOT A GUARANTEE: a kernel that recorded the descriptor path instead would leave this
          # step matching nothing and reporting a clean teardown while a loop device stayed
          # attached to the guest image for the next job on the runner.
          #
          # So the extraction step reads back what the kernel actually recorded and exports it,
          # and every match below runs over both values. They are usually the same string, which
          # the de-duplication handles.
          backing_candidates=()
          [ -n "$image" ] && backing_candidates+=("$image")
          if [ -n "$recorded_backing_path" ] && [ "$recorded_backing_path" != "$image" ]; then
            backing_candidates+=("$recorded_backing_path")
          fi

          # Every loop device on this host whose backing file is $1, one per line. The kernel
          # appends " (deleted)" to the recorded path when the backing file has been unlinked,
          # which is stripped so the comparison still identifies the device. A host with no loop
          # devices leaves the glob unexpanded, which the readability test rejects.
          loops_backing() {
            local want="$1" sysfile dev backing
            [ -n "$want" ] || return 0
            for sysfile in /sys/block/loop*/loop/backing_file; do
              [ -r "$sysfile" ] || continue
              backing="$(cat -- "$sysfile" 2>/dev/null || true)"
              backing="${backing% (deleted)}"
              [ "$backing" = "$want" ] || continue
              dev="${sysfile#/sys/block/}"
              printf '/dev/%s\n' "${dev%%/*}"
            done
          }

          # Every loop device backed by ANY of this job's candidate paths, one per line, each
          # device named once however many candidates it matches.
          loops_backing_any() {
            local want
            if [ "${#backing_candidates[@]}" -eq 0 ]; then
              return 0
            fi
            for want in "${backing_candidates[@]}"; do
              loops_backing "$want"
            done | sort -u
          }

          backing_of() {
            local dev="$1" sysfile backing
            sysfile="/sys/block/$(basename -- "$dev")/loop/backing_file"
            [ -r "$sysfile" ] || return 1
            backing="$(cat -- "$sysfile" 2>/dev/null || true)"
            printf '%s' "${backing% (deleted)}"
          }

          # 0 when $1 is one of this job's candidate backing paths, 1 otherwise. Used so a
          # recorded loop node that has been re-used by something else on this host is reported
          # rather than detached.
          backing_is_ours() {
            local got="$1" want
            for want in "${backing_candidates[@]+"${backing_candidates[@]}"}"; do
              [ "$got" = "$want" ] && return 0
            done
            return 1
          }

          # ---- 1. THE MOUNT ----------------------------------------------------------------
          if [ -n "$mount_point" ] && mountpoint -q -- "$mount_point" 2>/dev/null; then
            if sudo umount -- "$mount_point"; then
              echo "unmounted $mount_point"
            else
              echo "a plain unmount of $mount_point was refused; trying a lazy unmount"
              # A lazy unmount detaches the tree from the namespace immediately, so the
              # postcondition below is satisfied by it even though the filesystem is released
              # only once the last user closes it.
              sudo umount -l -- "$mount_point" \
                || echo "the lazy unmount of $mount_point also reported a failure"
            fi
            if mountpoint -q -- "$mount_point" 2>/dev/null; then
              leak "$mount_point is STILL MOUNTED after teardown. The runner is left with the guest image mounted, which breaks the next job on it and holds the loop device below. Release it with: sudo umount -l -- $mount_point"
            else
              echo "postcondition met: $mount_point is no longer a mount point"
            fi
          elif [ -n "$mount_point" ]; then
            echo "$mount_point is not a mount point; nothing to unmount"
          fi

          # ---- 2. THE LOOP DEVICE(S) -------------------------------------------------------
          # The recorded node is reported against its backing file so that a re-use is visible
          # rather than silently skipped, but it is NOT what drives the detach.
          if [ -n "$recorded_loop" ] && [ -b "$recorded_loop" ]; then
            recorded_backing="$(backing_of "$recorded_loop" || true)"
            if [ -z "$recorded_backing" ]; then
              echo "$recorded_loop reports no backing file; it has already been released"
            elif [ "${#backing_candidates[@]}" -gt 0 ] && ! backing_is_ours "$recorded_backing"; then
              echo "::warning::$recorded_loop no longer backs this job's image (it backs $recorded_backing); it was released and re-used by something else on this host. It is deliberately NOT detached: doing so would pull the backing file out from under whatever holds it now."
            fi
          fi

          if [ "${#backing_candidates[@]}" -gt 0 ]; then
            attached="$(loops_backing_any)"
            if [ -n "$attached" ]; then
              printf '%s\n' "$attached" | while IFS= read -r dev; do
                [ -n "$dev" ] || continue
                echo "detaching $dev (backs $(backing_of "$dev" || printf '%s' 'this job'))"
                # No "--" before the device: see the note above this step.
                sudo losetup -d "$dev" \
                  || echo "losetup -d $dev reported a failure; the postcondition below decides"
              done
            else
              echo "no loop device on this host backs any of ${backing_candidates[*]}; nothing to detach"
            fi

            # A lazy unmount above, or a device the kernel is auto-clearing, can take a moment
            # to let go. A bounded wait is the difference between a real leak and a race
            # reported as one; it is bounded so a genuine leak still fails this step.
            waited=0
            while [ "$waited" -lt 15 ]; do
              [ -n "$(loops_backing_any)" ] || break
              sleep 1
              waited=$((waited + 1))
            done
            still="$(loops_backing_any)"
            if [ -n "$still" ]; then
              leak "these loop devices STILL back ${backing_candidates[*]} after ${waited}s of teardown: $(printf '%s ' "$still"). The runner is left holding the guest image. Release them with: sudo losetup -d <device>"
            else
              echo "postcondition met: no loop device backs any of ${backing_candidates[*]} (settled after ${waited}s)"
            fi
          else
            echo "::warning::neither a guest image path nor a kernel-recorded backing path was available, so no loop device could be identified by backing file. An earlier step failed before the image existed."
          fi

          # ---- 3. THE MOUNT DIRECTORY ------------------------------------------------------
          # Removed only when empty, and only when it is not a mount point - an rmdir that
          # succeeds on a directory that still has a filesystem under it is not possible, so
          # this is a check for our own leftovers rather than a second unmount.
          if [ -n "$mount_point" ] && [ -d "$mount_point" ]; then
            if mountpoint -q -- "$mount_point" 2>/dev/null; then
              : # already reported as a leak above
            elif sudo rmdir -- "$mount_point" 2>/dev/null; then
              echo "removed the empty mount directory $mount_point"
            else
              # Not a leak: the directory is inside the workspace, is owned by this job and is
              # discarded with it. It is reported so a reader is not left wondering.
              echo "$mount_point is not empty and was left in place; it is inside the workspace and goes with it"
            fi
          fi

          # ---- 4. THE VERDICT ON TEARDOWN --------------------------------------------------
          if [ "$leaks" -gt 0 ]; then
            echo "::error::host-side teardown left $leaks privileged resource(s) behind. This step therefore fails on its own account: a warning in a log nobody reads is not a failure, and the next job on this runner inherits the state. The test verdict above is unaffected and its annotation remains first."
            exit 1
          fi
          echo "host-side teardown complete: every mount and loop device this job created is released"
